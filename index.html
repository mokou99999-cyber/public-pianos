<style>
:root{
  --paper:#ECEBE6; --paper-2:#E2E0D9; --ink:#1A1918; --ink-2:#4F4C47; --ink-3:#6B675F;
  --line:#CFCCC4; --felt:#B23A2E; --brass:#9A742A;
  --gS:#B23A2E; --gA:#2E6B3E; --gB:#9A742A; --gC:#5A6470; --gU:#8C877F;
  --gS-bg:#F3DAD6; --gA-bg:#DCEBDF; --gB-bg:#F0E6CC; --gC-bg:#E1E4E8; --gU-bg:#E6E4DF;
}
body{background:var(--paper);color-scheme:light;color:var(--ink);font-family:"IBM Plex Sans KR","IBM Plex Sans Thai","Noto Sans SC","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:900px;margin:0 auto;padding-block:28px 64px;padding-inline:20px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow .by{font-family:Fraunces,serif;font-style:italic;font-weight:600;text-transform:none;letter-spacing:0;font-size:14px;color:var(--felt);margin-left:6px;text-decoration:none;border-bottom:1px solid transparent}
.eyebrow .by:hover{border-color:var(--felt)}
.lang{display:flex;gap:4px}
.lang button{font:inherit;font-size:13px;letter-spacing:.06em;padding:8px 13px;min-height:36px;border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer;border-radius:3px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lang button.main{font-size:16px;font-weight:600;padding:8px 18px;border-width:2px;border-color:var(--ink)}
.lang{flex-wrap:wrap}
.lang button:focus-visible,.chip:focus-visible{outline:2px solid var(--felt);outline-offset:2px}
header{display:grid;gap:10px;border-bottom:1px solid var(--line);padding-bottom:22px}
h1{font-family:Fraunces,"IBM Plex Sans KR","IBM Plex Sans Thai",Georgia,serif;font-weight:300;font-size:clamp(32px,6vw,54px);line-height:1.08;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:italic;font-weight:600;color:var(--felt)}
:root[lang="th"] h1{font-style:normal;font-weight:400;line-height:1.3}
:root[lang="th"] h1 em{font-style:normal}
:root[lang="zh"] h1,:root[lang="ja"] h1{font-weight:500;line-height:1.3}
:root[lang="zh"] h1 em,:root[lang="ja"] h1 em{font-style:normal}
:root[lang="ko"] h1{font-weight:400;line-height:1.18}
:root[lang="ko"] h1 em{font-style:normal}
:root[lang="ko"] h1,:root[lang="ko"] .lede,:root[lang="ko"] .legend,:root[lang="ko"] .verdict,:root[lang="ko"] .meta,:root[lang="ko"] footer{word-break:keep-all;overflow-wrap:anywhere}
.lede{max-width:62ch;color:var(--ink-2);margin:0}
.lede.call{color:var(--ink);font-weight:500;border-left:3px solid var(--felt);padding-left:12px;cursor:pointer}
.lede.call:hover{color:var(--felt)}
.counts{display:flex;flex-wrap:wrap;gap:8px 18px;font-variant-numeric:tabular-nums;font-size:14px;margin-top:6px}
.counts b{font-family:Fraunces,serif;font-weight:600;font-size:22px;margin-right:4px}
.counts button{font:inherit;background:none;border:0;padding:4px 0;color:var(--ink);cursor:pointer;border-bottom:1px solid transparent}
.counts button:hover{border-color:var(--ink)}
.counts button:focus-visible{outline:2px solid var(--felt);outline-offset:2px}
.legend{display:grid;gap:6px;margin:22px 0 0;padding:0;list-style:none;font-size:14px;color:var(--ink-2)}
.legend li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:baseline}
.tag{display:inline-block;font-family:Fraunces,serif;font-weight:600;font-size:13px;line-height:1;padding:5px 0;width:30px;text-align:center;border-radius:3px;border:1px solid currentColor}
.tag.S{color:var(--gS);background:var(--gS-bg);font-weight:700}.tag.A{color:var(--gA);background:var(--gA-bg)}.tag.B{color:var(--gB);background:var(--gB-bg)}
.tag.C{color:var(--gC);background:var(--gC-bg)}.tag.U{color:var(--gU);background:var(--gU-bg);border-style:dashed}
.chip.zreset{border-color:var(--ink);color:var(--ink);font-weight:500}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:26px 0 8px}
.zone{font:inherit;text-align:left;display:grid;gap:8px;padding:14px 14px 12px;border:1px solid var(--line);background:var(--paper-2);border-radius:4px;color:var(--ink);cursor:pointer;min-width:0}
.zone:hover{border-color:var(--ink-3)}
.zone[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.zone:focus-visible{outline:2px solid var(--felt);outline-offset:2px}
.zone .zn{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);line-height:1.3}
.zone .zc{font-family:Fraunces,serif;font-weight:600;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.zone .zk{display:block;width:100%;height:auto;margin-top:4px}
.zone .zk .w{fill:#F7F5EF;stroke:var(--line);stroke-width:.6}
.zone .zk .w.S{fill:var(--gS)}.zone .zk .w.A{fill:var(--gA)}.zone .zk .w.B{fill:var(--gB)}.zone .zk .w.C{fill:var(--gC)}
.zone .zk .w.U{fill:#F7F5EF;stroke:var(--gU);stroke-dasharray:1.5 1.2;stroke-width:1}
.zone .zk .b{fill:var(--ink)}
@media (max-width:640px){.zones{grid-template-columns:repeat(2,1fr);gap:8px}.zone{padding:12px 12px 10px}.zone .zc{font-size:24px}}
.plot .dot{stroke:var(--paper-2);stroke-width:1.5}
.plot .dS{fill:var(--gS)}.plot .dA{fill:var(--gA)}.plot .dB{fill:var(--gB)}.plot .dC{fill:var(--gC)}.plot .dU{fill:var(--gU)}
.plotnote{font-size:12px;color:var(--ink-3);margin:0 0 18px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:10px 0 10px;margin:14px 0 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.bar .srow{display:flex;gap:8px;align-items:center}
.bar input{flex:1;min-width:0;font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#F7F5EF;color:var(--ink)}
.bar input:focus{outline:2px solid var(--felt);outline-offset:1px}
.bar .rcount{font-size:13px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.empty{padding:28px 0;color:var(--ink-3);text-align:center}
.gw{font-weight:600}.gw.S{color:var(--gS)}.gw.A{color:var(--gA)}.gw.B{color:var(--gB)}.gw.C{color:var(--gC)}.gw.U{color:var(--gU)}
.card .map-m{display:none}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;font:inherit;font-size:14px;font-weight:600;padding:12px 18px;border-radius:999px;background:var(--felt);color:#fff;border:0;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer}
.fab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.chip{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sep{font-size:12px;color:var(--ink-3);align-self:center;padding:0 4px}
.list{display:grid;border-top:1px solid var(--line)}
.card{display:grid;grid-template-columns:38px 1fr auto;gap:6px 14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.card .side{display:grid;gap:8px;justify-items:start}
.card .ph{display:block;width:150px;aspect-ratio:4/3;overflow:hidden;border-radius:4px;border:1px solid var(--line);background:var(--paper-2);padding:0;cursor:zoom-in}
.card .ph:focus-visible{outline:2px solid var(--felt);outline-offset:2px}
.lb{position:fixed;inset:0;background:rgba(20,19,18,.92);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px;z-index:10;cursor:zoom-out}
.lb img{max-width:100%;max-height:85vh;object-fit:contain;border-radius:4px}
.lb .cap{color:#EDE9E1;font-size:13px}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .credit{font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.card .contrib{margin:6px 0 0;font-size:13px;color:var(--felt);font-weight:500}
.card .contrib a,.contribs li a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor}
.contribs{margin-top:28px;padding:16px 18px;border:1px solid var(--line);border-radius:4px;background:var(--paper-2)}
.contribs h2{font-family:Fraunces,serif;font-weight:600;font-size:18px;margin:0 0 6px}
.contribs p{margin:0;color:var(--ink-2)}
.contribs ul{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.contribs li{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-weight:500}
.card .name{font-weight:600;font-size:16px;line-height:1.3;margin:0}
.card .th{color:var(--ink-3);font-size:13px;font-weight:400;margin-left:6px}
.card .meta{font-size:13px;color:var(--ink-3);margin:2px 0 0}
.card .verdict{margin:6px 0 0;color:var(--ink-2);max-width:62ch}
.card a{color:var(--ink);font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap;line-height:1;align-self:start}
.card a:hover{border-color:var(--felt);color:var(--felt)}
.card.hide{display:none}
footer a{color:var(--ink);font-weight:500;text-decoration:none;border-bottom:1px solid var(--line)}footer a:hover{color:var(--felt);border-color:var(--felt)}
footer .line{display:flex;gap:14px;align-items:center;margin-top:8px}
footer .line img{width:120px;height:120px;border:1px solid var(--line);border-radius:4px;background:#fff;flex:none}
footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3);display:grid;gap:6px;max-width:70ch}
@media (max-width:520px){
  .card{grid-template-columns:34px 1fr}
  .card .side{grid-column:2;width:100%;margin-top:2px}
  .card .ph{width:100%;height:220px;aspect-ratio:auto}
  .card .map-d{display:none}
  .card .map-m{display:inline-block;margin:6px 0 2px}
  .counts b{font-size:19px}
}
</style>

 ko:{h1:'피아노가 있는 곳을 알려드립니다. <em>연주자들이여, 사랑과 평화를 퍼뜨리세요.</em>',
     lede:'방콕과 촌부리를 중심으로, 태국에서 누구나 앉아서 칠 수 있는 피아노를 찾았습니다. 카페·로비·도서관 1,900곳의 사진과 리뷰를 뒤져 70여 곳을 골라내고, 정말 쳐도 되는지 등급을 매겼습니다. 다녀온 분들의 제보로 계속 늘어납니다. 지도는 누구에게나 무료입니다. 피아노를 치신다면 가서 치세요. 그 자리가 곧 무료 공연이고, 음악, 사랑, 평화는 그렇게 퍼집니다.',
     grade:g=>g+'등급', U:'미확정',
     legend:{S:'공개 무대. 누구나 치고, 청중과 유동인구가 항상 있습니다.',A:'자유 연주. 앉아서 치면 됩니다.',B:'조건부. 직원에게 물어보면 대체로 됩니다.',C:'연주자용 피아노. 직원에게 물어본 적은 없지만, 물어보면 될지도 모릅니다.',U:'미확정. 피아노가 있다는 제보는 있으나 아직 확인하지 못했습니다.'},
     plotnote:'구역은 대략적인 위치 순으로 놓았습니다. 눌린 건반 하나가 피아노 한 대, 색은 등급입니다. 구역을 누르면 그 구역만 보이고, 다시 누르면 풀립니다.',
     all:'전체', allR:'전 지역 보기', bkk:'방콕', chon:'촌부리·파타야', seen:'최근 확인 ', noyear:'확인 연도 없음', map:'구글맵', photo:'사진:', contrib:'공헌자:', gword:{S:'공개 무대',A:'자유 연주',B:'물어보고 연주',C:'물어보면 될지도',U:'미확정'}, search:'장소·지역 검색', none:'조건에 맞는 곳이 없습니다. 필터를 풀어 보세요.', results:n=>n+'곳', report:'피아노 제보', call:'신규 피아노 장소 제보는 언제든 환영입니다! 제보자는 페이지 공헌자로 등재됩니다.', ch:'공헌자', cp:'이 지도에 장소를 알려 주신 분들입니다. 제보하시면 이름이 여기에 올라갑니다.',
     f1:'등급은 사진 판정과 리뷰, 연주자 제보를 합쳐 매겼고 근거 연도는 마지막으로 피아노가 확인된 해입니다. 피아노는 치워지기도 하니 가기 전에 한 번 더 확인하세요.',
     f2:'다녀오셨으면 사진 한 장 보내 주세요. 등급을 갱신해 다음 연주자에게 전합니다. 새 장소 제보도 환영합니다.', f3:'제보와 연주 영상은 인스타그램 <a href="https://instagram.com/doc_isu" target="_blank" rel="noopener">@doc_isu</a> DM으로.', f4:'인스타그램을 안 쓰시면 LINE으로 보내 주세요. QR을 스캔하면 친구 추가됩니다.'},
 en:{h1:'Here is where the pianos are. <em>Pianists, go spread love and peace.</em>',
     lede:'We went looking for pianos that anyone may sit down and play, around Bangkok and Chonburi and a few places beyond. Out of 1,900 cafés, lobbies and libraries, photos and reviews narrowed it to seventy-odd places, each graded on whether you really may play. It keeps growing with reports from people who went. The map is free for everyone. If you play, go and play. That seat is a free concert, and that is how music, love and peace spread.',

 ["S","KMUTT Library","Play Ground 1F","Bangkok · Thung Khru","lib","g",2026,13.65263,100.49395,["도서관 1층 Play Ground 존에 공식 배치된 그랜드. 외부인도 신분증 등록으로 들어가고, 학생이 늘 오가는 열린 공간입니다. 조율이 안 됐다는 리뷰가 있으니 각오하고 가세요.","A grand officially placed in the library's ground-floor Play Ground zone. Visitors get in with an ID, and students pass through all day. Reviews say it is out of tune, so be warned.","แกรนด์ที่ตั้งไว้ในโซน Play Ground ชั้น 1 ของหอสมุด บุคคลภายนอกลงทะเบียนด้วยบัตรประชาชนเข้าได้ นักศึกษาเดินผ่านตลอดวัน รีวิวบอกว่าเสียงเพี้ยน เตรียมใจไว้","图书馆一层 Play Ground 区正式摆放的三角钢琴。校外人士凭身份证登记即可进入，学生整天来往。有评论说音不准，请有心理准备。","図書館1階の Play Ground ゾーンに公式に置かれたグランド。学外の人も身分証で入れ、学生が一日中行き交います。調律が狂っているというレビューがあるので覚悟を。"]],
 ["S","King Chulalongkorn Memorial Hospital","อาคาร อปร.","Bangkok · Pathum Wan","hosp","u",2026,13.73180,100.53610,["쭐라롱껀 병원 อปร. 건물 홀의 공개 피아노. 누구나 치고, 환자와 가족, 직원이 하루 종일 오가는 곳이라 청중이 늘 있습니다. 첫 제보이자 첫 S. 병원이니 조용한 곡으로.","A public piano in the hall of the Aor Por Ror building, King Chulalongkorn Memorial Hospital. Anyone can play, and patients, families and staff pass all day, so there is always an audience. Our first report and first visitor-found S. It is a hospital, so keep it gentle.","เปียโนสาธารณะในโถงอาคาร อปร. โรงพยาบาลจุฬาลงกรณ์ ใครก็เล่นได้ มีผู้ป่วย ญาติ และเจ้าหน้าที่เดินผ่านทั้งวัน จึงมีผู้ฟังตลอด รายงานแรกและ S แรกจากผู้เยี่ยมชม เป็นโรงพยาบาล เล่นเพลงเบาๆ นะ","朱拉隆功医院 อปร. 楼大厅的公共钢琴。任何人都能弹，病人、家属和员工整天来往，听众不断。第一条读者报告，也是第一个 S。医院里，请弹轻柔的曲子。","チュラロンコン病院 อปร. 棟ホールの公共ピアノ。誰でも弾けて、患者・家族・職員が一日中行き交うので聴衆が絶えません。最初の報告にして最初のS。病院なので静かな曲を。"],["img/chula-t.jpg","img/chula.jpg","Jeremy 90's"],"Jeremy 90's"],
 ["S","Krung Thep Aphiwat Central Terminal","สถานีกลางกรุงเทพอภิวัฒน์ · Food Court","Bangkok · Chatuchak","station","d",2026,13.80460,100.53900,["끄룽텝아피왓 중앙역(방쓰) 푸드코트 쪽 홀. 붉은 카펫 무대 위 디지털 피아노에 '와서 함께 음악을 만들어요' 안내판이 서 있습니다. 칠 줄 아는 사람은 누구나, 단 돈을 받는 연주는 금지. 하루 종일 승객이 오갑니다.","The hall on the food-court side of Krung Thep Aphiwat Central Terminal (Bang Sue). A digital piano on a red-carpet stage with an official sign: Come and Make Music Together. Anyone who can play is welcome; no busking for money. Passengers pass all day.","โถงฝั่งศูนย์อาหาร สถานีกลางกรุงเทพอภิวัฒน์ (บางซื่อ) เปียโนดิจิทัลบนเวทีพรมแดง มีป้ายทางการ เชิญมาสร้างเสียงดนตรีด้วยกัน ใครเล่นเป็นก็เล่นได้ แต่ห้ามเล่นเพื่อหารายได้ มีผู้โดยสารเดินผ่านทั้งวัน","曼谷阿披瓦中央站（邦苏）美食广场一侧的大厅。红地毯舞台上的电钢琴，旁边立着“一起来创造音乐”的官方牌子。会弹的人都可以，但禁止卖艺收钱。旅客整天来往。","クルンテープ・アピワット中央駅（バンスー）フードコート側のホール。赤いカーペットの舞台に電子ピアノ、「一緒に音楽をつくろう」の公式看板付き。弾ける人なら誰でも、ただし投げ銭目的の演奏は禁止。乗客が一日中行き交います。"],["img/krungthep-aphiwat-t.jpg","img/krungthep-aphiwat.jpg","นพรุจ"],"นพรุจ @nopparuj.an"],
 ["A","Baan Biome Wellness Cafe","อารีย์","Bangkok · Phaya Thai","cafe","d",2026,13.77948,100.53176,["디지털 피아노, 자유 연주. 2026년 리뷰로 확인.","Digital piano, free to play. Confirmed by a 2026 review.","เปียโนดิจิทัล เล่นได้อิสระ ยืนยันจากรีวิวปี 2026","电钢琴，可自由弹奏。2026 年评论确认。","電子ピアノ、自由に演奏可。2026年のレビューで確認。"]],
 ["A","Baan Saen Saep","บ้านแสนแสบ","Bangkok · Pathum Wan","cafe","u",2025,13.74883,100.52969,["1층 소형 피아노, 손님 자유 연주. 프로 연주 시간에는 양보하세요.","A small piano on the ground floor, free for guests to play. Give way when the resident pianist is on.","เปียโนหลังเล็กชั้น 1 ลูกค้าเล่นได้อิสระ ช่วงนักเปียโนประจำเล่นอยู่ให้หลีกทางก่อน","一层的小型钢琴，客人可自由弹奏。专业演奏时段请让开。","1階の小型ピアノ、客が自由に弾けます。プロの演奏時間は譲ってください。"]],
 ["A","Pastella Studio","","Khon Kaen · Khon Kaen","cafe","u",2025,16.45634,102.82888,["콘깬 시내의 카페. 25년 넘게 소리 없이 서 있던 검은 피아노를 누구나 칠 수 있게 열어 뒀습니다. 배달 기사가 주문을 기다리며 연주한 영상으로 알려진 곳. 2025년 12월에도 피아노가 그대로 있습니다.","A café in central Khon Kaen. A black piano that stood silent for over 25 years is open for anyone to play. Known for the video of a delivery rider playing while waiting for an order. Still there as of December 2025.","คาเฟ่ในตัวเมืองขอนแก่น เปียโนสีดำที่ตั้งเงียบมากว่า 25 ปี เปิดให้ใครก็เล่นได้ เป็นที่รู้จักจากคลิปไรเดอร์เล่นเปียโนระหว่างรอออเดอร์ ธันวาคม 2025 เปียโนยังอยู่","孔敬市区的咖啡馆。一架沉默了 25 年以上的黑色钢琴，现在向任何人开放。因外卖骑手等单时弹琴的视频而出名。2025 年 12 月钢琴仍在。","コンケン市内のカフェ。25年以上音を出さずに置かれていた黒いピアノを、誰でも弾けるように開放。注文待ちの配達ライダーが弾いた動画で知られています。2025年12月時点でもピアノは健在。"],["img/pastella-t.jpg","img/pastella.jpg","Pastella Studio"],null,"Pastella Studio Khon Kaen"],
 ["A","Un Deux Trois","เอิงเดอทัว","Chiang Mai · Chiang Mai","cafe","u",2016,18.78766,99.00597,["치앙마이 나와랏 다리 옆 카페. 1층에 드럼 무대와 검은 업라이트, 벽에는 기타가 걸려 있고, 손님이 요청하면 칠 수 있습니다. 악기를 열어 두는 것이 이 가게의 방식입니다.","A café by Nawarat Bridge in Chiang Mai. The ground floor has a drum stage, a black upright and guitars on the wall, and guests may play on request. Keeping the instruments open is how this place works.","คาเฟ่ข้างสะพานนวรัฐ เชียงใหม่ ชั้นล่างมีเวทีกลอง อัพไรท์สีดำ และกีตาร์แขวนบนผนัง ลูกค้าขอเล่นได้ ร้านนี้เปิดเครื่องดนตรีให้ลูกค้าเป็นปกติ","清迈纳瓦拉桥旁的咖啡馆。一层有鼓台、黑色立式钢琴，墙上挂着吉他，客人提出请求就可以弹。把乐器向客人开放正是这家店的风格。","チェンマイのナワラット橋そばのカフェ。1階にドラムステージと黒いアップライト、壁にはギター。頼めば客も弾けます。楽器を開放しているのがこの店のスタイルです。"],["img/un-deux-trois-t.jpg","img/un-deux-trois.jpg","Un Deux Trois"],null,"Un Deux Trois Chiang Mai"],
 ["A","Coffee Color Cafe","Ratchaprarop Rd","Bangkok · Ratchathewi","cafe","d",2023,13.75600,100.54200,["랏차쁘라롭 거리의 카페. 디지털 피아노가 있고, 직원이 손님이 치는 것을 반깁니다. 사람들 앞에서 치는 연습을 하기 좋다는 후기가 있고, 2023년에 일본인 여행자가 가게 허락을 받아 연주한 영상도 있습니다.","A café on Ratchaprarop Road with a digital piano. Staff welcome guests who want to play; reviews call it a good place to practise playing in front of people, and a Japanese traveller filmed a performance there in 2023 with the shop's permission.","คาเฟ่บนถนนราชปรารภ มีเปียโนดิจิทัล พนักงานยินดีให้ลูกค้าเล่น มีรีวิวว่าเหมาะกับการฝึกเล่นต่อหน้าคน และปี 2023 มีนักท่องเที่ยวญี่ปุ่นถ่ายคลิปเล่นโดยร้านอนุญาต","拉差巴洛路上的咖啡馆，有一架电钢琴，店员欢迎客人弹奏。有评论说这里适合练习在人前演奏，2023 年有日本游客经店家许可拍摄了演奏视频。","ラチャプラロップ通りのカフェ。電子ピアノがあり、スタッフは客の演奏を歓迎。人前で弾く練習にいいというレビューがあり、2023年には日本人旅行者が店の許可を得て演奏した動画もあります。"],null,null,"Coffee Color Cafe Ratchaprarop Bangkok"],
 ["A","Big Guitar Suriya Land","สุริยาแลนด์","Chon Buri · Sattahip","attr","",2026,12.74880,100.93630,["입장 무료의 레트로 악기 전시장 겸 카페. 2026년 6월 리뷰에 앉아서 피아노도 칠 수 있다고 나옵니다. 판매용 피아노와 오르간이 여러 대 있고, 한 달에 한 번씩 찾는 단골도 있습니다.","A free-entry retro instrument yard and café. A June 2026 review says you can sit down and play the piano. Several pianos and organs are for sale, and some regulars come monthly.","ลานเครื่องดนตรีย้อนยุคและคาเฟ่ เข้าฟรี รีวิวเดือนมิถุนายน 2026 บอกว่านั่งเล่นเปียโนได้ มีเปียโนและออร์แกนขายหลายหลัง และมีลูกค้าประจำมาทุกเดือน","免费入场的复古乐器展示场兼咖啡馆。2026 年 6 月的评论说可以坐下来弹钢琴。有多架待售的钢琴和风琴，还有每月都来的常客。","入場無料のレトロ楽器展示場兼カフェ。2026年6月のレビューに、座ってピアノも弾けるとあります。販売用のピアノやオルガンが何台もあり、毎月通う常連もいます。"]],
 ["A","Into the wild - Watcharapol","","Bangkok · Bang Khen","caferest","u",2026,13.87189,100.64725,["와차라폰의 카페 겸 식당. 건반이 열린 업라이트와 기타가 있고, 2026년 리뷰에 피아노와 기타를 칠 수 있다고 나옵니다.","A café-restaurant in Watcharapol with an open upright and guitars. A 2026 review says the piano and guitars are there to be played.","คาเฟ่และร้านอาหารย่านวัชรพล มีอัพไรท์เปิดฝาและกีตาร์ รีวิวปี 2026 บอกว่ามีเปียโน มีกีตาร์ให้เล่น","瓦差拉蓬的咖啡餐厅，有一架开着琴盖的立式钢琴和吉他。2026 年的评论说钢琴和吉他都可以弹。","ワチャラポンのカフェレストラン。鍵盤の開いたアップライトとギターがあり、2026年のレビューに弾けるとあります。"],null,null,"Into the wild Watcharapol"],
 ["A","CWENE Cafe and Bakery","ควีน คาเฟ่","Pathum Thani · Lam Luk Ka","cafe","d",2026,13.96916,100.68819,["가게 공식 글(2026년 2월)이 손님이 직접 쳐 볼 수 있는 전자 피아노가 있다고 안내합니다. 구글 4.9점, 리뷰 788건의 인기 카페.","The shop's own post (February 2026) says there is a digital piano customers can try for themselves. A popular café, Google 4.9 from 788 reviews.","โพสต์ของร้าน (กุมภาพันธ์ 2026) บอกว่ามีเปียโนไฟฟ้าที่ลูกค้ามาลองเล่นเองได้ คาเฟ่ยอดนิยม Google 4.9 จาก 788 รีวิว","店家自己的帖子（2026 年 2 月）说有一架顾客可以自己试弹的电钢琴。人气咖啡馆，Google 4.9，788 条评论。","店の公式投稿（2026年2月）に、客が自分で試し弾きできる電子ピアノがあるとあります。Google 4.9、レビュー788件の人気カフェ。"],null,null,"CWENE Cafe and Bakery"],
 ["A","Japang Icecream","Wang Lang","Bangkok · Bangkok Noi","cafe","",2025,13.75438,100.48618,["왕랑 골목의 아이스크림 가게. 공식 글(2025년 6월)이 피아노와 기타 같은 놀거리가 가득하다고 소개합니다.","An ice-cream shop in the Wang Lang lanes. Its own post (June 2025) says it is full of things to play with, including a piano and guitars.","ร้านไอศกรีมในซอยวังหลัง โพสต์ของร้าน (มิถุนายน 2025) บอกว่ามีของเล่นเพียบ ทั้งเปียโนและกีตาร์","旺朗巷子里的冰淇淋店。店家帖子（2025 年 6 月）说店里有很多可以玩的东西，包括钢琴和吉他。","ワンラン路地のアイスクリーム店。公式投稿（2025年6月）に、ピアノやギターなど遊べるものがいっぱいとあります。"],null,null,"Japang Icecream Wang Lang"],
 ["A","Bangkok Doi Cafe","","Nonthaburi · Bang Kruai","cafe","",null,13.82173,100.42765,["가게 공식 페이지가 피아노가 있으니 손님도 치시라고 안내합니다. 글 날짜는 확인하지 못했습니다. 월요일 휴무, 18시 마감.","The shop's official page says there is a piano and customers are welcome to play. The post's date is unconfirmed. Closed Mondays, shuts at 6 pm.","เพจของร้านบอกว่าร้านมีเปียโนให้เล่น คุณลูกค้าเชิญเล่นได้ ไม่ทราบวันที่โพสต์ หยุดวันจันทร์ ปิด 18.00 น.","店家官方主页说店里有钢琴，欢迎顾客弹奏。帖子日期未确认。周一休息，18 点关门。","店の公式ページに、ピアノがあるのでお客さんもどうぞ弾いてくださいとあります。投稿日は未確認。月曜休み、18時閉店。"],null,null,"Bangkok Doi Cafe"],
 ["A","FUZEI","Thammasat Rangsit","Pathum Thani · Khlong Luang","cafe","",2024,14.07473,100.60007,["탐마삿대 랑싯 캠퍼스의 카페. 피아노 연주 코너가 있다는 가게 글이 2024년 8월에 있습니다.","A café on Thammasat's Rangsit campus. The shop posted in August 2024 about its corner for playing the piano.","คาเฟ่ในธรรมศาสตร์ รังสิต ร้านโพสต์เมื่อสิงหาคม 2024 ว่ามีมุมเล่นดนตรีเปียโน","法政大学兰实校区的咖啡馆。店家在 2024 年 8 月发帖说有弹钢琴的角落。","タマサート大学ランシット校のカフェ。2024年8月の店の投稿に、ピアノを弾けるコーナーがあるとあります。"],null,null,"FUZEI Thammasat Rangsit"],
 ["A","ARCH x CHANN Café","CHANN · Bangkok Noi","Bangkok · Bangkok Noi","cafe","",2025,13.76146,100.48688,["방콕노이의 카페. 피아노와 레트로 게임을 무료로 쓸 수 있다고 소개된 곳입니다(2025년).","A café in Bangkok Noi, written up in 2025 as having a piano and retro games free to use.","คาเฟ่ย่านบางกอกน้อย มีรีวิวปี 2025 ว่ามีเปียโนและเกมตลับให้เล่นฟรี","曼谷诺区的咖啡馆。2025 年有介绍说店里的钢琴和复古游戏可以免费玩。","バンコクノーイのカフェ。ピアノとレトロゲームが無料で使えると2025年に紹介されています。"],null,null,"ARCH x CHANN Café"],
 ["B","Entrance Coffeehouse & Studio","","Bangkok · Pathum Wan","cafe","d",2026,13.73422,100.52733,["삼얀의 카페 겸 스튜디오. 내킬 때 칠 수 있는 기타와 디지털 건반이 있다는 후기가 있고, 목요일에는 오픈마이크를 엽니다. 물어보고 치세요.","A café and studio in Sam Yan. A review says there is a guitar and a digital keyboard to play when the mood strikes, and Thursdays are open mic. Ask first.","คาเฟ่และสตูดิโอย่านสามย่าน มีรีวิวว่ามีกีตาร์และคีย์บอร์ดดิจิทัลให้เล่นเมื่ออยากเล่น วันพฤหัสมีโอเพนไมค์ ถามก่อนเล่น","三燕的咖啡馆兼工作室。有评论说店里有想弹就能弹的吉他和电钢琴，周四有开放麦。先问再弹。","サムヤーンのカフェ兼スタジオ。気が向いたら弾けるギターと電子キーボードがあるというレビューがあり、木曜はオープンマイク。聞いてから弾いて。"]],
 ["B","One Went One Cafe","","Bangkok · Watthana","cafe","u",2026,13.72687,100.59685,["카페 안 업라이트, 건반이 열려 있습니다. 주인에게 물어보면 됩니다.","An upright inside the café with the lid open. Ask the owner.","อัพไรท์ในคาเฟ่ เปิดฝาคีย์ไว้ ถามเจ้าของก่อนเล่น","店内的立式钢琴，琴盖开着。问一下店主就行。","店内のアップライト、鍵盤は開いています。店主に聞けばOK。"]],
 ["B","Little White Daily","Sukhumvit 38","Bangkok · Phra Khanong","cafe","u",2024,13.71825,100.57792,["어린이 피아노 교습소에서 나온 카페. 피아노가 한 대 있고, 치고 싶으면 주인 K.Nat이나 선생님 K.Girl에게 먼저 물어보라고 후기에 적혀 있습니다.","A café born from a children's piano studio. There is one piano, and a review says to ask the owner K.Nat or the teacher K.Girl before playing.","คาเฟ่ที่เกิดจากโรงเรียนสอนเปียโนเด็ก มีเปียโนหนึ่งหลัง รีวิวบอกว่าถ้าอยากเล่นให้ถามเจ้าของ K.Nat หรือครู K.Girl ก่อน","由儿童钢琴教室衍生出的咖啡馆。有一架钢琴，评论说想弹要先问店主 K.Nat 或老师 K.Girl。","子ども向けピアノ教室から生まれたカフェ。ピアノが1台あり、弾きたければ店主 K.Nat か先生 K.Girl に先に聞くようにとレビューにあります。"]],
 ["B","Miss Pastry & More","","Chon Buri · Pattaya","caferest","u",null,12.92775,100.95071,["파타야 쪽 업라이트. 조건부로 봅니다.","An upright on the Pattaya side. Treated as conditional.","อัพไรท์ฝั่งพัทยา จัดเป็นแบบมีเงื่อนไข","芭提雅一侧的立式钢琴。视为有条件。","パタヤ側のアップライト。条件付きとみています。"]],
 ["B","Siriraj Piyamaharajkarun Hospital","โรงพยาบาลศิริราช ปิยมหาราชการุณย์","Bangkok · Bangkok Noi","hosp","",2025,13.75940,100.48530,["자원봉사 피아노가 상설로 있는 병원. 오후 14:00~16:20 같은 시간대에 봉사 연주자들이 칩니다. 치고 싶으면 병원에 자원봉사 연주를 문의하세요. 2025년에 직접 연주한 후기가 있습니다.","A hospital with a standing volunteer piano. Volunteers play in slots such as 2:00 to 4:20 pm. To play, ask the hospital about volunteering. First-hand reports from 2025.","โรงพยาบาลที่มีเปียโนจิตอาสาประจำ จิตอาสาเล่นเป็นรอบ เช่น 14.00–16.20 น. อยากเล่นให้สอบถามโรงพยาบาลเรื่องจิตอาสา มีคนไปเล่นจริงในปี 2025","设有常驻志愿者钢琴的医院。志愿者按时段演奏，例如 14:00–16:20。想弹请向医院咨询志愿演奏事宜。有 2025 年亲自演奏的记录。","ボランティアピアノが常設されている病院。14:00〜16:20 などの枠でボランティアが演奏します。弾きたい場合は病院にボランティア演奏を問い合わせてください。2025年に実際に弾いた報告あり。"],null,null,"Siriraj Piyamaharajkarun Hospital"],
 ["B","Ramathibodi Hospital","โรงพยาบาลรามาธิบดี","Bangkok · Ratchathewi","hosp","",2026,13.76640,100.52650,["1동(อาคาร 1)에서 자원봉사 연주가 이어지는 병원 피아노. 2026년 5월 영상까지 확인했습니다. 병원에 자원봉사 연주를 문의하세요.","A hospital piano in Building 1 where volunteers keep playing. Videos confirmed up to May 2026. Ask the hospital about volunteering.","เปียโนในโรงพยาบาลที่อาคาร 1 มีจิตอาสามาเล่นต่อเนื่อง ยืนยันจากคลิปถึงเดือนพฤษภาคม 2026 สอบถามโรงพยาบาลเรื่องจิตอาสา","位于 1 号楼的医院钢琴，志愿者持续演奏。视频确认至 2026 年 5 月。请向医院咨询志愿演奏事宜。","1号棟にある病院のピアノで、ボランティアの演奏が続いています。2026年5月の動画まで確認。病院にボランティア演奏を問い合わせてください。"],null,null,"Ramathibodi Hospital Bangkok"],
 ["B","Saint Louis Hospital","โรงพยาบาลเซนต์หลุยส์","Bangkok · Sathon","hosp","",2026,13.72070,100.52370,["사톤의 비영리 병원. 자원봉사 피아노 연주 영상이 2026년 3월과 4월에도 올라왔습니다. 치고 싶으면 병원에 자원봉사 연주를 문의하세요.","A not-for-profit hospital in Sathon. Volunteer piano videos were posted in March and April 2026. To play, ask the hospital about volunteering.","โรงพยาบาลไม่แสวงกำไรย่านสาทร มีคลิปเปียโนจิตอาสาเดือนมีนาคมและเมษายน 2026 อยากเล่นให้สอบถามโรงพยาบาลเรื่องจิตอาสา","沙吞的非营利医院。2026 年 3 月和 4 月都有志愿者钢琴演奏视频。想弹请向医院咨询志愿演奏事宜。","サトーンの非営利病院。2026年3月と4月にもボランティアピアノの動画が投稿されています。弾きたい場合は病院にボランティア演奏を問い合わせてください。"],null,null,"Saint Louis Hospital Bangkok"],
 ["B","TK Park","CentralWorld 8F","Bangkok · Pathum Wan","park","d",2025,13.74660,100.53930,["센트럴월드 8층 학습공원. 방음 음악실에 건반·기타·우쿨렐레가 있어 치고 녹음할 수 있습니다. 입장(회원 또는 일일권)이 필요하고 월요일은 쉽니다.","The learning park on the 8th floor of CentralWorld. A soundproof music room has a keyboard, guitar and ukulele to play and record. Entry (membership or day pass) required; closed Mondays.","อุทยานการเรียนรู้ ชั้น 8 เซ็นทรัลเวิลด์ มีห้องดนตรีเก็บเสียง พร้อมคีย์บอร์ด กีตาร์ อูคูเลเล่ เล่นและอัดเสียงได้ ต้องเป็นสมาชิกหรือซื้อบัตรรายวัน ปิดวันจันทร์","CentralWorld 8 层的学习公园。隔音音乐室里有键盘、吉他和尤克里里，可以弹奏和录音。需要入场（会员或日票），周一闭馆。","セントラルワールド8階のラーニングパーク。防音の音楽室にキーボード・ギター・ウクレレがあり、演奏や録音ができます。入場（会員または1日券）が必要、月曜休館。"],null,null,"TK Park CentralWorld"],
 ["B","Music Square","Mahidol College of Music, Salaya","Nakhon Pathom · Salaya","rest","",2025,13.78930,100.32430,["마히돈 음대(살라야) 안의 식당. 식사 중 피아노 소리가 들리고, 2025년 공공피아노 가이드 영상에 직접 연주한 곳으로 올라 있습니다. 방콕 서쪽 외곽이니 시간 여유를 두세요.","The restaurant inside Mahidol's College of Music in Salaya. Piano accompanies meals, and a 2025 public-piano guide lists it as played in person. It is west of Bangkok, so allow time.","ร้านอาหารในวิทยาลัยดุริยางคศิลป์ มหิดล ศาลายา มีเสียงเปียโนระหว่างมื้ออาหาร และอยู่ในรายชื่อเปียโนสาธารณะปี 2025 ที่ผู้ทำคลิปไปเล่นมาเอง อยู่ชานเมืองฝั่งตะวันตก เผื่อเวลาเดินทาง","玛希隆大学音乐学院（沙拉亚）内的餐厅。用餐时有钢琴声，2025 年的公共钢琴指南将其列为作者亲自弹过的地点。位于曼谷西郊，请预留时间。","マヒドン大学音楽学部（サラヤ）内のレストラン。食事中にピアノが流れ、2025年の公共ピアノガイドで作者が実際に弾いた場所として掲載。バンコク西郊なので時間に余裕を。"],null,null,"Music Square Mahidol University Salaya"],
 ["B","Emporium","EM District","Bangkok · Khlong Toei","mall","",2025,13.72970,100.56960,["몰 중앙의 피아노. 피아노에 붙은 QR을 스캔해 시간을 등록하면 칠 수 있다는 2025년 영상이 있습니다. 현장에서 QR과 규칙을 확인하세요.","The piano in the middle of the mall. 2025 videos say you scan the QR on the piano and register a time slot to play. Check the QR and rules on site.","เปียโนกลางห้าง มีคลิปปี 2025 บอกว่าสแกน QR ที่เปียโนแล้วลงเวลาก็เล่นได้ ตรวจสอบ QR และกติกาที่หน้างาน","商场中央的钢琴。2025 年的视频说扫描钢琴上的二维码并登记时间即可弹奏。请到现场确认二维码和规则。","モール中央のピアノ。ピアノのQRを読み取って時間を登録すれば弾けるという2025年の動画があります。現地でQRとルールを確認してください。"],null,null,"Emporium Bangkok"],
 ["B","MBK Center","5F Zone B","Bangkok · Pathum Wan","mall","",2025,13.74450,100.52990,["5층 B존의 피아노. 2024년엔 자유 연주였고 2025년 공공피아노 목록에도 있지만, 2025년 4월에 제지당했다는 영상도 있습니다. 치기 전에 직원에게 확인하세요.","The piano in Zone B on the 5th floor. Free to play in 2024 and still on a 2025 public-piano list, but one April 2025 video shows a player being stopped. Check with staff before playing.","เปียโนชั้น 5 โซน B ปี 2024 เล่นได้อิสระ และยังอยู่ในรายชื่อเปียโนสาธารณะปี 2025 แต่มีคลิปเดือนเมษายน 2025 ที่ผู้เล่นถูกห้าม สอบถามพนักงานก่อนเล่น","5 层 B 区的钢琴。2024 年可自由弹奏，2025 年的公共钢琴名单里也有，但 2025 年 4 月有视频显示弹奏者被制止。弹之前请先问工作人员。","5階Bゾーンのピアノ。2024年は自由に弾け、2025年の公共ピアノリストにも載っていますが、2025年4月に制止された動画もあります。弾く前にスタッフに確認を。"],null,null,"MBK Center Bangkok"],
 ["B","Chulabhorn Hospital","โรงพยาบาลจุฬาภรณ์ · CRA Music Therapy","Bangkok · Lak Si","hosp","",2026,13.87900,100.57400,["음악 치료 프로그램으로 자원봉사 연주자들이 피아노를 치는 병원. 2026년 9월 영상까지 확인했습니다. 치고 싶으면 병원의 자원봉사 음악 프로그램에 문의하세요.","A hospital where volunteers play the piano under a music-therapy programme. Videos confirmed up to September 2026. To play, ask about the hospital's volunteer music programme.","โรงพยาบาลที่มีจิตอาสามาเล่นเปียโนในโครงการดนตรีบำบัด ยืนยันจากคลิปถึงเดือนกันยายน 2026 อยากเล่นให้สอบถามโครงการดนตรีจิตอาสาของโรงพยาบาล","通过音乐治疗项目由志愿者演奏钢琴的医院。视频确认至 2026 年 9 月。想弹请咨询医院的志愿音乐项目。","音楽療法プログラムでボランティアがピアノを弾く病院。2026年9月の動画まで確認。弾きたい場合は病院のボランティア音楽プログラムに問い合わせを。"],null,null,"Chulabhorn Hospital Bangkok"],
 ["B","Pridi Banomyong Library","หอสมุดปรีดี พนมยงค์ · Thammasat","Bangkok · Phra Nakhon","lib","",null,13.75770,100.49000,["탐마삿대 타프라찬 캠퍼스의 도서관. 도서관 공식 페이지가 '쁘리디 도서관에 들러 피아노 치세요'라고 안내했습니다. 외부인 출입 조건과 피아노 위치는 입구에서 확인하세요.","The library on Thammasat University's Tha Prachan campus. Its official page invited people to drop by and play the piano. Check visitor access and the piano's location at the entrance.","หอสมุดในมหาวิทยาลัยธรรมศาสตร์ ท่าพระจันทร์ เพจทางการเชิญชวนว่าแวะมานั่งเล่นเปียโนได้ ตรวจสอบเงื่อนไขบุคคลภายนอกและตำแหน่งเปียโนที่ทางเข้า","法政大学塔帕占校区的图书馆。图书馆官方主页曾邀请大家顺路来弹钢琴。校外人士的入馆条件和钢琴位置请在入口处确认。","タマサート大学タープラチャン校の図書館。公式ページが「立ち寄ってピアノを弾いてください」と案内。学外者の入館条件とピアノの場所は入口で確認を。"],null,null,"หอสมุดปรีดี พนมยงค์ ธรรมศาสตร์ ท่าพระจันทร์"],
 ["B","Grab and Go Gaffea cafe","Piano Service","Bangkok · Wang Thonglang","cafe","u",2023,13.79517,100.60888,["음악학원 안 카페. 손님이 칠 수 있는 피아노가 있다는 2020년 후기와, 피아노 연주가 좋았다는 2023년 리뷰가 있습니다. 지금도 영업 중입니다. 직원에게 물어보고 치세요.","A café inside a music school. A 2020 review says guests may play the piano, and a 2023 review praises the piano playing. Still open. Ask the staff, then play.","คาเฟ่ในโรงเรียนดนตรี รีวิวปี 2020 บอกว่ามีเปียโนให้ลูกค้าเล่น และรีวิวปี 2023 ชมการเล่นเปียโน ยังเปิดอยู่ ถามพนักงานก่อนเล่น","音乐培训班里的咖啡馆。2020 年的评论说有客人可以弹的钢琴，2023 年的评论称赞钢琴演奏。目前仍在营业。先问店员再弹。","音楽教室内のカフェ。2020年のレビューに客が弾けるピアノがあるとあり、2023年のレビューはピアノ演奏を褒めています。現在も営業中。スタッフに聞いてから弾いて。"]],
 ["B","Prelude Music Bookstore","C.P. Tower 2F · Silom","Bangkok · Bang Rak","book","d",2026,13.72757,100.53273,["음악 전문 서점. 타니야에서 C.P. 타워 2층으로 옮기면서 전자 피아노를 들였고, 악보를 골랐으면 가게 피아노로 쳐 보라고 안내합니다.","A music bookshop. It moved from Thaniya to the 2nd floor of C.P. Tower and added a digital piano; pick a score and you are invited to try it on the shop's piano.","ร้านหนังสือดนตรี ย้ายจากธนิยะมาอยู่ชั้น 2 ซี.พี.ทาวเวอร์ และมีเปียโนไฟฟ้า ใครเลือกหนังสือเพลงแล้วอยากลองเล่นก็ใช้เปียโนของร้านได้","音乐专业书店。从塔尼亚搬到 C.P. Tower 2 层后添了一架电钢琴，选好乐谱后可以用店里的钢琴试弹。","音楽専門の書店。タニヤからC.P.タワー2階に移転し、電子ピアノを設置。楽譜を選んだら店のピアノで試し弾きできます。"],null,null,"Prelude Music Bookstore C.P. Tower"],
 ["B","Balzac","3F piano corner","Bangkok · Bang Rak","culture","",2025,13.72780,100.51644,["짜런끄룽의 문화 공간. 3층에 피아노 코너가 있고 손님이 치는 사진이 2025년 7월에 올라왔습니다. 월요일 휴무.","A cultural space on Charoen Krung. There is a piano corner on the 3rd floor, and a July 2025 post shows a guest playing. Closed Mondays.","พื้นที่วัฒนธรรมย่านเจริญกรุง ชั้น 3 มีมุมเปียโน มีรูปลูกค้าเล่นเมื่อกรกฎาคม 2025 หยุดวันจันทร์","石龙军路的文化空间。3 层有钢琴角，2025 年 7 月有客人弹奏的照片。周一休息。","チャルンクルンのカルチャースペース。3階にピアノコーナーがあり、2025年7月に客が弾く写真が投稿されています。月曜休み。"],null,null,"Balzac Bangkok Charoen Krung"],

 ["C","Cafe Phuket Viewpoint","","Phuket · Phuket","cafe","u",2025,7.92019,98.28051,["바다를 내려다보는 절벽 테라스에 검은 업라이트가 놓여 있습니다. 칠 수 있다는 2025년 리뷰가 있지만, 야외 피아노라 조율이 안 된 장식용일 가능성이 높습니다. 소리보다 풍경을 기대하고 가세요.","A black upright on a cliffside terrace over the sea. A 2025 review says it can be played, but an outdoor piano is likely out of tune and mostly decoration. Go for the view rather than the sound.","อัพไรท์สีดำตั้งบนระเบียงริมผาเหนือทะเล มีรีวิวปี 2025 ว่าเล่นได้ แต่เปียโนกลางแจ้งมักเสียงเพี้ยนและเป็นของตกแต่งมากกว่า ไปเพื่อวิวมากกว่าเสียง","俯瞰大海的悬崖露台上放着一架黑色立式钢琴。2025 年有评论说可以弹，但户外钢琴多半没调音，更像装饰。去看风景，别指望音色。","海を見下ろす崖のテラスに黒いアップライト。弾けるという2025年のレビューはありますが、屋外のピアノは調律されていない飾りである可能性が高いです。音より景色を楽しみに。"],["img/phuket-viewpoint-t.jpg","img/phuket-viewpoint.jpg","Cafe Phuket Viewpoint"],null,"Cafe Phuket Viewpoint"],
 ["C","The Marshal Social Cafe","Heritage Ville · Pradiphat 13","Bangkok · Phaya Thai","caferest","u",2022,13.79050,100.54400,["70년 된 저택을 고친 카페 겸 재즈 바. 그랜드처럼 울린다는 업라이트가 있고 라이브 음악을 합니다. 직원에게 물어본 적은 없지만, 공연 없는 시간에 물어보면 될지도?","A café and jazz bar in a restored 70-year-old mansion. It has an upright said to sound like a grand, and hosts live music. Nobody has asked the staff yet; outside performance hours, asking might work.","คาเฟ่และแจ๊สบาร์ในคฤหาสน์เก่า 70 ปีที่บูรณะใหม่ มีอัพไรท์ที่ว่ากันว่าเสียงดีเหมือนแกรนด์ และมีดนตรีสด ยังไม่มีใครถามพนักงาน ช่วงที่ไม่มีการแสดง ลองถามดูอาจได้","由 70 年老宅改建的咖啡馆兼爵士酒吧。有一架据说音色像三角钢琴的立式钢琴，并有现场音乐。还没人问过工作人员，没有演出的时段问问也许可以？","築70年の邸宅を改装したカフェ兼ジャズバー。グランドのように鳴るというアップライトがあり、ライブ演奏もあります。まだ誰もスタッフに聞いていませんが、演奏のない時間に聞けばいけるかも？"],null,null,"The Marshal Social Cafe Bangkok"],

 ["C","Invitation Only","Empire Tower 55F","Bangkok · Sathon","restbar","g",2026,13.72055,100.53023,["엠파이어 타워 55층의 붉은 라운지. 창가의 그랜드는 연주자용이라 보통은 야경과 함께 듣습니다. 직원에게 물어본 적은 없지만, 될지도? 같은 건물 로비의 공개 피아노(S)와는 다른 곳입니다.","The red lounge on the 55th floor of Empire Tower. The grand by the window is for performers, so most just listen with the skyline. Nobody has asked the staff yet; it might work. Not the same as the public piano in the lobby (S).","เลานจ์สีแดงชั้น 55 ตึกเอ็มไพร์ แกรนด์ริมหน้าต่างเป็นของนักดนตรี ส่วนใหญ่ฟังพร้อมวิวเมือง ยังไม่มีใครถามพนักงาน ลองถามดู คนละที่กับเปียโนสาธารณะที่ล็อบบี้ (S)","帝国大厦 55 层的红色酒廊。窗边的三角钢琴是演奏者用的，通常是伴着夜景聆听。还没人问过工作人员，但也许可以？与同楼大堂的公共钢琴（S）不是同一处。","エンパイアタワー55階の赤いラウンジ。窓際のグランドは演奏者用で、普段は夜景とともに聴くもの。まだ誰もスタッフに聞いていませんが、いけるかも？同じビルのロビーの公共ピアノ（S）とは別の場所です。"],["img/invitation-only-t.jpg","img/invitation-only.jpg","Chin"]],
 ["C","Baan Khong Rao","ห้องอาหารบ้านของเรา","Bangkok · Bang Kapi","thai","g",2026,13.76572,100.63162,["식당 라이브용 그랜드입니다. 직원에게 물어본 적은 없지만, 한가한 시간엔 될지도 모릅니다.","A grand for the restaurant\'s live music. Nobody has asked the staff yet; at a quiet hour it might work.","แกรนด์สำหรับดนตรีสดของร้าน ยังไม่มีใครถามพนักงาน ช่วงเงียบๆ ลองถามดูอาจได้","餐厅现场演奏用的三角钢琴。还没人问过工作人员，清闲时段也许可以。","レストランのライブ用グランド。まだ誰もスタッフに聞いていませんが、空いている時間ならいけるかも。"]],

<script>
const LI = {ko:0,en:1,th:2,zh:3,ja:4};
const ZONES = [ // [키, 이름 3개국어, 구역에 속하는 구(區)]
 ["siam",["시암·빠툼완","Siam · Pathum Wan","สยาม · ปทุมวัน","暹罗 · 巴吞旺","サイアム · パトゥムワン"],["Pathum Wan","Ratchathewi","Phaya Thai"]],
 ["sukhumvit",["수쿰빗","Sukhumvit","สุขุมวิท","素坤逸","スクンビット"],["Watthana","Khlong Toei","Phra Khanong","Bang Na","Mueang Samut Prakan"]],
 ["east",["동북부 · 짜뚜짝·랏프라오·방까삐","North-east · Chatuchak · Lat Phrao · Bang Kapi","ตะวันออกเฉียงเหนือ · จตุจักร · ลาดพร้าว · บางกะปิ","东北 · 乍都乍 · 叻抛 · 邦甲必","北東 · チャトゥチャック · ラートプラオ · バンカピ"],["Chatuchak","Bang Sue","Bang Phli","Lat Phrao","Wang Thonglang","Bang Kapi","Khan Na Yao","Saphan Sung","Suan Luang","Prawet","Min Buri"]],
 ["sathon",["사톤·실롬·강변","Sathon · Silom · Riverside","สาทร · สีลม · ริมน้ำ","沙吞 · 是隆 · 河畔","サトーン · シーロム · リバーサイド"],["Sathon","Bang Rak","Bang Kho Laem","Phra Nakhon"]],
 ["south",["톤부리·서남부","Thonburi · West & South","ธนบุรี · ตะวันตกและใต้","吞武里 · 西南部","トンブリー · 西・南部"],["Khlong San","Thung Khru","Bangkok Noi","Phasi Charoen","Taling Chan","Thawi Watthana","Salaya"]],
 ["north",["북부 · 논타부리·빠툼타니","North · Nonthaburi · Pathum Thani","เหนือ · นนทบุรี · ปทุมธานี","北部 · 暖武里 · 巴吞他尼","北部 · ノンタブリー · パトゥムターニー"],["Bang Khen","Lak Si","Lam Luk Ka","Khlong Luang","Thanyaburi","Pak Kret","Bang Bua Thong","Bang Kruai"]],
 ["chon",["촌부리·파타야","Chonburi · Pattaya","ชลบุรี · พัทยา","春武里 · 芭提雅","チョンブリー · パタヤ"],["Bang Saen","Pattaya","Sattahip"]],
 ["prov",["지방 · 치앙마이·푸껫·콘깬","Provinces · Chiang Mai · Phuket · Khon Kaen","ต่างจังหวัด · เชียงใหม่ · ภูเก็ต · ขอนแก่น","外府 · 清迈 · 普吉 · 孔敬","地方 · チェンマイ · プーケット · コンケン"],["Chiang Mai","Phuket","Khon Kaen"]],
];
const zoneOf = p => { const d=p[3].split("· ")[1]; const z=ZONES.find(z=>z[2].includes(d)); return z?z[0]:"east"; };
const GL = {S:"S",A:"A",B:"B",C:"C",U:"?"};
const q = s => document.querySelector(s);
const state = {grade:"all", zone:"all", lang:"th", q:""};  // 언제 열어도 태국어로 시작

const linkify = t => t.replace(/@([A-Za-z0-9._]+)/g, (m,h)=>`<a href="https://www.instagram.com/${h}" target="_blank" rel="noopener">@${h}</a>`);
const gmaps = p => "https://www.google.com/maps/search/?api=1&query="+(p[12]?encodeURIComponent(p[12]):p[7]+","+p[8]);
const u = () => UI[state.lang];
const li = () => LI[state.lang];

function renderText(){
  const t=u();
  document.documentElement.lang = state.lang;
  q("#h1").innerHTML=t.h1; q("#lede").textContent=t.lede; q("#call").textContent=t.call;
  q("#ch").textContent=t.ch; q("#cp").textContent=t.cp; q("#cl").innerHTML=[...new Set(P.map(p=>p[11]).filter(Boolean))].map(n=>`<li>${linkify(n)}</li>`).join(""); q("#plotnote").textContent=t.plotnote;
  q("#f1").textContent=t.f1; q("#f2").textContent=t.f2; q("#f3").innerHTML=t.f3; q("#f4").textContent=t.f4;
  q("#legend").innerHTML=["S","A","B","C","U"].map(g=>`<li><span class="tag ${g}">${GL[g]}</span><span>${t.legend[g]}</span></li>`).join("");
  const c={S:0,A:0,B:0,C:0,U:0}; P.forEach(p=>c[p[0]]++);
  q("#counts").innerHTML=["S","A","B","C","U"].map(g=>`<button type="button" data-g="${g}"><b>${c[g]}</b>${g==="U"?t.U:t.grade(g)}</button>`).join("");
  q("#q").placeholder=t.search; q("#empty").textContent=t.none; q("#fab").textContent=t.report;
  document.querySelectorAll("#lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.l===state.lang));
}

function renderFilters(){
  const t=u(), f=q("#filters");
  const mk=(k,v,label)=>`<button class="chip" type="button" data-k="${k}" data-v="${v}" aria-pressed="${state[k]===v}">${label}</button>`;
  f.innerHTML = mk("grade","all",t.all)+mk("grade","S","S")+mk("grade","A","A")+mk("grade","B","B")+mk("grade","C","C")+mk("grade","U",t.U)
    +`<button class="chip zreset" type="button" data-k="zone" data-v="all" ${state.zone==="all"?"hidden":""}>← ${t.allR}</button>`;
}

function renderList(){
  const t=u(), i=li();
  q("#list").innerHTML = P.map(p=>`
  <article class="card" data-g="${p[0]}" data-z="${zoneOf(p)}" data-s="${[p[1],p[2],p[3],ZONES.find(z=>z[0]===zoneOf(p))[1].join(" "),T[p[4]].join(" "),p[9].join(" ")].join(" ").toLowerCase().replace(/"/g,"")}">
    <span class="tag ${p[0]}">${GL[p[0]]}</span>
    <div>
      <h2 class="name">${p[1]}${p[2]?`<span class="th">${p[2]}</span>`:""}</h2>
      <p class="meta"><span class="gw ${p[0]}">${t.gword[p[0]]}</span> · ${p[3]} · ${T[p[4]][i]}${p[5]?" · "+K[p[5]][i]:""} · ${p[6]?t.seen+p[6]:t.noyear}</p>
      <a class="map-m" href="${gmaps(p)}" target="_blank" rel="noopener">${t.map}</a>
      <p class="verdict">${p[9][i]}</p>
      ${p[11]?`<p class="contrib">${t.contrib} ${linkify(p[11])}</p>`:""}
    </div>
    <div class="side">${p[10]?`<button class="ph" type="button" data-full="${p[10][1]}" data-cap="${p[1]}"><img src="${p[10][0]}" alt="${p[1]}" loading="lazy"></button><span class="credit">${t.photo} ${p[10][2]}</span>`:""}<a class="map-d" href="${gmaps(p)}" target="_blank" rel="noopener">${t.map}</a></div>
  </article>`).join("");
}

function applyFilter(){
  const needle=state.q.trim().toLowerCase();
  const ok=el=>(state.grade==="all"||el.dataset.g===state.grade)&&(state.zone==="all"||el.dataset.z===state.zone)&&(!needle||el.dataset.s.includes(needle));
  let shown=0; document.querySelectorAll(".card").forEach(el=>{ const v=ok(el); el.classList.toggle("hide",!v); if(v) shown++; });
  q("#empty").hidden = shown>0; q("#rcount").textContent=u().results(shown);
  const zr=q(".zreset"); if(zr){ zr.hidden = state.zone==="all"; }
  document.querySelectorAll(".zone").forEach(el=>{
    el.setAttribute("aria-pressed", state.zone===el.dataset.z);
    el.querySelectorAll(".zk .w[data-g]").forEach(d=>d.style.opacity=(state.grade==="all"||d.dataset.g===state.grade)?1:.25);
  });
}

function renderZones(){
  const i=li(), order={S:0,A:1,B:2,C:3,U:4};
  const KW=10, H=40;
  const blackAfter=[0,1,3,4,5];               // 옥타브 안에서 검은건반이 붙는 흰건반 자리 (C D F G A)
  q("#zones").innerHTML = ZONES.map(z=>{
    const pts=P.filter(p=>zoneOf(p)===z[0]).sort((a,b)=>order[a[0]]-order[b[0]]);
    const WHITES=Math.max(14, Math.ceil(pts.length/7)*7);   // 기본 2옥타브, 장소가 넘치면 옥타브 단위로 늘림
    let k="";
    for(let w=0; w<WHITES; w++){
      const p=pts[w];
      k+=`<rect class="w ${p?p[0]:""}" ${p?`data-g="${p[0]}"`:""} x="${w*KW}" y="0" width="${KW}" height="${H}" rx="1.2">${p?`<title>${p[1]}</title>`:""}</rect>`;
    }
    for(let w=0; w<WHITES-1; w++){ if(blackAfter.includes(w%7)) k+=`<rect class="b" x="${(w+1)*KW-3}" y="0" width="6" height="${H*0.6}" rx="1"/>`; }
    return `<button class="zone" type="button" data-z="${z[0]}" aria-pressed="${state.zone===z[0]}">
      <span class="zn">${z[1][i]}</span>
      <span class="zc">${pts.length}</span>
      <svg class="zk" viewBox="0 0 ${WHITES*KW} ${H}" aria-hidden="true">${k}</svg>
    </button>`; }).join("");
}

function renderAll(){ renderText(); renderFilters(); renderZones(); renderList(); applyFilter(); }
q("#lang").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; state.lang=b.dataset.l; renderAll(); };
q("#filters").onclick=e=>{ const b=e.target.closest(".chip"); if(!b) return; state[b.dataset.k]=b.dataset.v; if(b.dataset.k==="grade"&&b.dataset.v==="all") state.zone="all"; renderFilters(); applyFilter(); };
q("#q").oninput=e=>{ state.q=e.target.value; applyFilter(); };
q("#counts").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; state.grade=b.dataset.g; renderFilters(); applyFilter(); q("#bar").scrollIntoView({behavior:"smooth",block:"start"}); };
const toContact=()=>q("#contribs").scrollIntoView({behavior:"smooth",block:"start"});
q("#fab").onclick=toContact; q("#call").onclick=toContact;
q("#zones").onclick=e=>{ const b=e.target.closest(".zone"); if(!b) return; state.zone = state.zone===b.dataset.z ? "all" : b.dataset.z; applyFilter(); };
q("#list").onclick=e=>{ const b=e.target.closest(".ph"); if(!b) return; q("#lbimg").src=b.dataset.full; q("#lbimg").alt=b.dataset.cap; q("#lbcap").textContent=b.dataset.cap; q("#lb").hidden=false; };
q("#lb").onclick=()=>{ q("#lb").hidden=true; q("#lbimg").src=""; };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ q("#lb").hidden=true; } });
renderAll();
</script>
