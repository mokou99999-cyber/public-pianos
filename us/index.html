 ["B","San Francisco Botanical Garden","Flower Piano · 12 pianos","San Francisco · CA","park","g",2026,37.76771,-122.46931,["【PAID】 Twelve pianos are placed around the San Francisco Botanical Garden in Golden Gate Park for Flower Piano. Anyone can play between scheduled performances, roughly 10 am–6 pm, with regular Garden admission (charged to non-residents, amount not stated; free for San Francisco residents). Held for about 11 days each September (Sept 10–20 in 2026).","【DE PAGO】 Durante Flower Piano se colocan doce pianos en el San Francisco Botanical Garden, en Golden Gate Park. Cualquiera puede tocar entre las presentaciones programadas, aproximadamente de 10:00 a 18:00, con la entrada general al jardín (se cobra a los no residentes, sin monto indicado; gratis para residentes de San Francisco). Se realiza unos 11 días cada septiembre (10–20 de septiembre en 2026).","【유료】 Flower Piano 기간에 Golden Gate Park 안 San Francisco Botanical Garden 곳곳에 피아노 12대가 놓입니다. 예정된 공연 사이 시간(대략 10:00~18:00)에 누구나 연주할 수 있으며, 일반 입장료만 내면 됩니다(비거주자는 유료이나 금액은 나와 있지 않고, 샌프란시스코 거주자는 무료). 매년 9월 약 11일간 열리며 2026년에는 9월 10~20일이었습니다."],["../img/us-flower-piano-t.jpg","../img/us-flower-piano.jpg","<a href=\"https://commons.wikimedia.org/wiki/File:Flower_Piano_2018-2078.jpg\" target=\"_blank\" rel=\"noopener\">Frank Schulenburg</a> · <a href=\"https://creativecommons.org/licenses/by-sa/4.0/\" target=\"_blank\" rel=\"noopener\">CC BY-SA 4.0</a> · Wikimedia Commons, 2018"],"","San Francisco Botanical Garden, San Francisco, CA","ca","mid-Sep"],
 ["C","Guilderland Public Library","Piano · performances only","Guilderland · NY","library","",2023,42.700098,-73.904823,["A March 2023 draft room policy of Guilderland Public Library says its piano is for performances only, not for rehearsal or practice. It is used for performances and events, so there is no evidence that visitors may play it.","Un borrador de política de salas de marzo de 2023 de la Guilderland Public Library indica que su piano es solo para actuaciones, no para ensayos ni práctica. Se usa para conciertos y actos, así que no hay constancia de que el público pueda tocarlo.","Guilderland 공공도서관의 2023년 3월 공간 규정 초안에 따르면 피아노는 공연에만 쓰고 리허설이나 연습에는 쓰지 않습니다. 공연·행사용이라 이용자가 쳐도 된다는 근거는 없습니다."],null,"","Guilderland Public Library, Guilderland, NY","ny",""],
 ["C","Port Authority Bus Terminal","Performing Arts Stage","New York · NY","station","g",2017,40.75676,-73.99044,["Volunteer and scheduled performers only. A hand-painted baby grand sits on the PABT Performing Arts Stage, a platform that was once the operations control center. Volunteers reportedly play it on Wednesdays and Fridays at commute times. The evidence dates from 2017, and current status is unknown.","Solo para voluntarios y artistas programados. Hay un piano de media cola pintado a mano en el PABT Performing Arts Stage, una plataforma que antes fue el centro de control de operaciones. Según se informa, los voluntarios lo tocan los miércoles y viernes en las horas pico. La referencia es de 2017 y se desconoce la situación actual.","자원봉사자와 일정이 잡힌 연주자 전용입니다. 예전 운영 통제실이었던 단상인 PABT Performing Arts Stage에 손그림 베이비 그랜드 피아노가 있습니다. 자원봉사자들이 수요일과 금요일 출퇴근 시간대에 연주한다고 합니다. 2017년 자료이며 현재 상태는 알 수 없습니다."],null,"","Port Authority Bus Terminal, New York, NY","ny",""],
 ["C","Bradley International Airport","Terminal (exact spot not given)","Windsor Locks · CT","airport","",2026,41.93887,-72.68603,["A traveler review from June 2026 mentions enjoying a woman playing the piano at the airport, but it does not say where the piano is or whether travelers may play it. The security checkpoint has been expanded, which may have changed the layout. It has not been confirmed whether the piano is still there or open to the public; ask staff before playing.","Una reseña de un viajero de junio de 2026 menciona que disfrutó escuchando a una mujer tocar el piano en el aeropuerto, pero no dice dónde está el piano ni si los viajeros pueden tocarlo. El control de seguridad se ha ampliado, lo que podría haber cambiado la distribución. No se ha confirmado si el piano sigue allí ni si está abierto al público; conviene preguntar al personal antes de tocar.","2026년 6월 한 여행객 후기에 공항에서 피아노를 치던 여성의 연주가 좋았다는 글이 있지만, 피아노 위치나 여행객이 쳐도 되는지는 나오지 않습니다. 보안검색대 확장 공사로 배치가 바뀌었을 수 있습니다. 지금도 피아노가 있는지, 일반에 열려 있는지는 확인되지 않았으니 치기 전에 직원에게 물어보십시오."],null,"","Bradley International Airport, Windsor Locks, CT","ne",""],
 ["C","Burlington International Airport","Terminal (exact spot not given)","Burlington · VT","airport","",2025,44.47281,-73.1515,["Several visitor reviews from around 2025–2026 mention a piano in the terminal but do not say where it is. The airport's official site mentions a Game Zone but no piano. It has not been confirmed whether the piano is still there or who may play it.","Varias reseñas de visitantes de alrededor de 2025–2026 mencionan un piano en la terminal, pero no dicen dónde está. El sitio oficial del aeropuerto menciona una Game Zone, pero no un piano. No se ha confirmado si el piano sigue allí ni quién puede tocarlo.","2025~2026년 무렵 방문 후기 여러 건이 터미널에 피아노가 있다고 적었지만 위치는 밝히지 않았습니다. 공항 공식 사이트에는 Game Zone만 나오고 피아노 언급은 없습니다. 지금도 피아노가 있는지, 누가 칠 수 있는지는 확인되지 않았습니다."],null,"","Burlington International Airport, Burlington, VT","ne",""],
 ["C","Children's Hospital of Philadelphia","","Philadelphia · PA","hospital","",2026,39.94873,-75.19392,["Volunteers only. A donated Steinway in a public area of the hospital (spot not stated) is played by volunteer pianists on weekday mornings to entertain patients. Open play is not indicated. Based on a single article seen in 2026 whose date is unknown.","Solo para voluntarios. Un Steinway donado, ubicado en un área pública del hospital (no se indica dónde), es tocado por pianistas voluntarios las mañanas de los días hábiles para entretener a los pacientes. No se indica que el público pueda tocar. Se basa en un solo artículo consultado en 2026, de fecha desconocida.","자원봉사자 전용입니다. 병원 공용 공간(정확한 위치는 나와 있지 않음)에 있는 기증받은 Steinway 피아노를 자원봉사 피아니스트들이 평일 오전에 환자들을 위해 연주합니다. 일반인이 자유롭게 칠 수 있다는 내용은 없습니다. 2026년에 확인한, 작성일을 알 수 없는 기사 한 건에 근거한 정보입니다."],null,"","Children's Hospital of Philadelphia, Philadelphia, PA","ne",""],
 ["C","Greenwich Hospital","Lobby","Greenwich · CT","hospital","",2025,41.03452,-73.62986,["Volunteer pianist only. A volunteer pianist is reported to play in the lobby most weekdays; nothing indicates that visitors may play. Based on a single source from around 2025.","Solo para el pianista voluntario. Se informa que un pianista voluntario toca en el vestíbulo la mayoría de los días hábiles; nada indica que los visitantes puedan tocar. Se basa en una sola fuente de alrededor de 2025.","자원봉사 피아니스트 전용입니다. 자원봉사 피아니스트가 평일 대부분 로비에서 연주한다고 하며, 방문객이 칠 수 있다는 내용은 없습니다. 2025년 무렵의 자료 한 건에 근거한 정보입니다."],null,"","Greenwich Hospital, Greenwich, CT","ne",""],
 ["C","Rhode Island T.F. Green Int'l Airport","Terminal · resident pianist","Warwick · RI","airport","",2026,41.72351,-71.42699,["Performer piano. An April 2026 news article profiles Ron Trotta, a pianist who has played early-morning music for travelers at the airport since 2010. The article does not say where in the terminal the piano stands or whether travelers may play it, and neither has been confirmed.","Piano para un intérprete. Un artículo de abril de 2026 presenta a Ron Trotta, un pianista que toca para los viajeros a primera hora de la mañana en el aeropuerto desde 2010. El artículo no dice en qué parte de la terminal está el piano ni si los viajeros pueden tocarlo, y ninguna de las dos cosas se ha confirmado.","연주자용 피아노입니다. 2026년 4월 기사는 2010년부터 공항에서 이른 아침 여행객을 위해 연주해 온 피아니스트 Ron Trotta를 소개합니다. 기사에는 피아노가 터미널 어디에 있는지, 여행객이 칠 수 있는지가 나오지 않으며 둘 다 확인되지 않았습니다."],null,"","Rhode Island T.F. Green Int'l Airport, Warwick, RI","ne",""],
 ["C","Charlotte Douglas International Airport","Main atrium · volunteer musicians","Charlotte · NC","airport","g",2019,35.2163,-80.95394,["This piano appears to be for volunteer performers. In October 2019 the airport's official blog described a black baby grand in the atrium played by auditioned volunteer musicians, with no mention of travelers playing, and a traveler on an online forum was told after playing that it was not a public piano. It has not been confirmed whether it is still there; ask staff before playing.","Este piano parece estar reservado a músicos voluntarios. En octubre de 2019, el blog oficial del aeropuerto describió un piano de media cola negro en el atrio tocado por músicos voluntarios seleccionados por audición, sin mencionar que los viajeros pudieran tocarlo, y a un viajero de un foro en línea le dijeron después de tocar que no era un piano público. No se ha confirmado si sigue allí; conviene preguntar al personal antes de tocar.","자원봉사 연주자용 피아노로 보입니다. 2019년 10월 공항 공식 블로그는 아트리움의 검은 베이비그랜드 피아노를 오디션을 거친 자원봉사 연주자가 연주한다고 소개했고, 여행객이 칠 수 있다는 말은 없었습니다. 온라인 게시판에는 연주한 뒤 공공 피아노가 아니라는 말을 들었다는 여행객 글도 있습니다. 지금도 있는지는 확인되지 않았으니 치기 전에 직원에게 물어보십시오."],null,"","Charlotte Douglas International Airport, Charlotte, NC","se",""],
 ["C","Clearwater Marine Aquarium","Tampa Tunes · host named on the program's About page","Clearwater · FL","museum","",2025,27.976888,-82.819293,["【PAID】 Clearwater Marine Aquarium charges admission, and the piano may be inside the paid area; the price is not given. The aquarium, in Clearwater, is named on the Tampa Tunes 'About' page as a place where one of the program's pianos has been placed. The page gives no address or current status; access is expected to be for aquarium visitors during opening hours. Not confirmed as still in place.","【DE PAGO】 Clearwater Marine Aquarium cobra entrada y el piano puede estar dentro de la zona de pago; no se indica el precio. El acuario, en Clearwater, figura en la página 'About' de Tampa Tunes como uno de los lugares donde se ha colocado un piano del programa. La página no indica la dirección ni el estado actual; se espera que puedan tocarlo los visitantes del acuario en su horario de apertura. No se ha confirmado que siga en su lugar.","【유료】 Clearwater Marine Aquarium은 입장료를 받으며 피아노가 유료 구역 안에 있을 수 있습니다(금액은 나와 있지 않습니다). Clearwater에 있는 이 아쿠아리움은 Tampa Tunes의 'About' 페이지에 프로그램 피아노가 놓인 곳으로 이름이 올라 있습니다. 페이지에는 주소와 현재 상태가 나와 있지 않고, 운영 시간에 아쿠아리움 관람객이 칠 수 있을 것으로 보입니다. 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","Clearwater Marine Aquarium, Clearwater, FL","se",""],
 ["C","Gazebo outside City Hall","Clarksville Street Piano · Gateway Chamber Orchestra / Downtown Artist Co-op","Clarksville · TN","street","u",null,36.527742,-87.36082,["A street piano painted by local artists with Clarksville imagery was reported at the gazebo outside City Hall in downtown Clarksville, a project of the Gateway Chamber Orchestra and the Downtown Artist Co-op. Anybody can walk up and play. There were plans to move it around town, and the reports are undated. Not confirmed as still in place.","Se informó de un piano callejero, pintado por artistas locales con motivos de Clarksville, en el quiosco (gazebo) frente al ayuntamiento, en el centro de Clarksville; es un proyecto de Gateway Chamber Orchestra y Downtown Artist Co-op. Cualquiera puede acercarse y tocar. Había planes de moverlo por la ciudad y las notas no tienen fecha. No se ha confirmado que siga en el lugar.","Clarksville 시내 City Hall 앞 가제보에 지역 예술가들이 Clarksville의 모습을 그려 넣은 거리 피아노가 있다고 소개되었습니다. Gateway Chamber Orchestra와 Downtown Artist Co-op의 프로젝트로, 누구나 다가가 칠 수 있습니다. 시내 여러 곳으로 옮겨 놓을 계획이 있었고, 자료의 날짜는 확인되지 않았습니다. 지금도 있는지는 확인되지 않았습니다."],null,"","Gazebo outside City Hall, Clarksville, TN","se",""],
 ["C","Hartsfield-Jackson Atlanta Airport","Concourse E food court","Atlanta · GA","airport","g",2026,33.63242,-84.43331,["Program performers only. An online travel guide, in its current 2026 edition, describes live piano music in the Concourse E food court played by performers from the airport's music program. Nothing indicates that travelers may play, and the piano's current status has not been separately confirmed.","Solo para intérpretes del programa. Una guía de viajes en línea, en su edición vigente de 2026, describe música de piano en vivo en el patio de comidas del Concourse E, a cargo de intérpretes del programa musical del aeropuerto. Nada indica que los viajeros puedan tocar, y no se ha confirmado por otra vía la situación actual del piano.","공항 음악 프로그램 연주자 전용입니다. 온라인 여행 안내서(2026년 현행판)는 Concourse E 푸드코트에서 공항 음악 프로그램 연주자가 라이브 피아노를 연주한다고 소개합니다. 여행객이 칠 수 있다는 근거는 없으며, 지금 상태는 따로 확인되지 않았습니다."],null,"","Hartsfield-Jackson Atlanta Airport, Atlanta, GA","se",""],
 ["C","Hartsfield-Jackson Atlanta Airport","Concourse A, Piano Bar restaurant","Atlanta · GA","airport","g",2026,33.63242,-84.43331,["Not a public piano. An online travel guide, in its current 2026 edition, describes the Piano Bar in Concourse A, linked to Varasano's, as a restaurant with live piano music. The piano is part of the restaurant's entertainment rather than one for travelers to play, and its current status has not been separately confirmed.","No es un piano público. Una guía de viajes en línea, en su edición vigente de 2026, describe el Piano Bar del Concourse A, vinculado a Varasano's, como un restaurante con música de piano en vivo. El piano forma parte del entretenimiento del restaurante y no está pensado para que lo toquen los viajeros; su situación actual no se ha confirmado por otra vía.","공공 피아노가 아닙니다. 온라인 여행 안내서(2026년 현행판)는 Concourse A의 Piano Bar(Varasano's와 연결)를 라이브 피아노 연주가 있는 식당으로 소개합니다. 여행객이 치는 피아노가 아니라 식당 공연용이며, 지금 상태는 따로 확인되지 않았습니다."],null,"","Hartsfield-Jackson Atlanta Airport, Atlanta, GA","se",""],
 ["C","Imagine Museum","Tampa Tunes · 1901 Central Ave","St. Petersburg · FL","culture","g",2024,27.77127,-82.65938,["【PAID】 A painted baby grand from Tampa Tunes is hosted permanently inside the Imagine Museum (1901 Central Ave), a ticketed museum; the admission price is not given. Walk-up public play is not confirmed, so treat it as a piano for booked or invited performers and ask the museum. Unveiled December 21, 2024; based on a single brief listing.","【DE PAGO】 Un piano de cola pequeño (baby grand) pintado de Tampa Tunes se aloja de forma permanente dentro del Imagine Museum (1901 Central Ave), un museo con entrada de pago; no se indica el precio. No está confirmado que el público pueda tocarlo libremente, así que considérelo un piano para intérpretes invitados o programados y consulte al museo. Se presentó el 21 de diciembre de 2024; el dato se basa en un único listado breve.","【유료】 Tampa Tunes의 색칠된 베이비 그랜드 피아노가 입장권이 필요한 Imagine Museum(1901 Central Ave) 안에 상설로 놓여 있으며, 입장료는 나와 있지 않습니다. 일반 관람객이 자유롭게 연주할 수 있는지는 확인되지 않았으므로, 사전에 섭외된 연주자용으로 보시고 Imagine Museum 측에 문의하시기 바랍니다. 2024년 12월 21일에 공개되었으며, 간략한 목록 한 건에 근거한 정보입니다."],null,"","Imagine Museum, St. Petersburg, FL","se",""],
 ["C","Jackson County Public Library","Community room piano · performances by reservation","Sylva · NC","library","",2018,35.373804,-83.228286,["A Spring 2018 Fontana Regional Library newsletter announced a new piano in the community room of Jackson County Public Library in Sylva, available for public performances, recitals and fundraisers by first-come reservation. It is used for performances and events, so there is no evidence that visitors may play it.","Un boletín de primavera de 2018 de Fontana Regional Library anunció un nuevo piano en la sala comunitaria de la Jackson County Public Library, en Sylva, disponible para actuaciones públicas, recitales y actos benéficos mediante reserva por orden de llegada. Se usa para conciertos y actos, así que no hay constancia de que el público pueda tocarlo.","2018년 봄 Fontana Regional Library 소식지는 Sylva의 Jackson County Public Library 커뮤니티룸에 새 피아노가 들어왔고, 선착순 예약으로 공개 공연·발표회·모금 행사에 쓸 수 있다고 알렸습니다. 공연·행사용이라 이용자가 쳐도 된다는 근거는 없습니다."],null,"","Jackson County Public Library, Sylva, NC","se",""],
 ["C","Jacksonville International Airport","","Jacksonville · FL","airport","",2026,30.49433,-81.68715,["Volunteer performers only. A piano is in the terminal (exact spot not given), but it is kept locked. To play it you have to audition and sign up to volunteer for a scheduled shift. Based on a personal blog from around August 2026.","Solo para músicos voluntarios. Hay un piano en la terminal (no se indica el punto exacto), pero permanece cerrado con llave. Para tocarlo hay que pasar una audición e inscribirse como voluntario en un turno programado. Se basa en un blog personal de alrededor de agosto de 2026.","자원봉사 연주자 전용입니다. 터미널 안에 피아노가 있으나(정확한 위치는 나와 있지 않음) 잠겨 있습니다. 치려면 오디션을 보고 정해진 시간대의 자원봉사 연주자로 등록해야 합니다. 2026년 8월 무렵의 개인 블로그에 근거한 정보입니다."],null,"","Jacksonville International Airport, Jacksonville, FL","se",""],
 ["C","Mayo Clinic Florida lobby","Humanities in Medicine · volunteer pianists","Jacksonville · FL","hospital","g",2026,30.264702,-81.441007,["Mayo Clinic Humanities in Medicine has volunteer pianists play a grand piano for patients and guests on most weekdays, with live music from 1 to 2:30 pm in the Mayo Lobby near Bundy Cafe, according to a Mayo Clinic page seen only as a search excerpt in 2026. This is a performance program, and there is no evidence that visitors may play. The address shown (4500 San Pablo Rd S) is the campus address, and the exact building is not confirmed.","Mayo Clinic Humanities in Medicine cuenta con pianistas voluntarios que tocan un piano de cola para pacientes y visitantes la mayoría de los días laborables, con música en vivo de 13:00 a 14:30 en el Mayo Lobby, cerca del Bundy Cafe, según una página de Mayo Clinic vista solo como extracto de búsqueda en 2026. Es un programa de actuaciones y no hay pruebas de que los visitantes puedan tocarlo. La dirección indicada (4500 San Pablo Rd S) es la del campus, y el edificio exacto no está confirmado.","2026년 검색 결과 발췌로만 확인한 Mayo Clinic 페이지에 따르면, Mayo Clinic Humanities in Medicine 프로그램의 자원봉사 피아니스트들이 평일 대부분 환자와 손님을 위해 그랜드 피아노를 연주하며, Bundy Cafe 근처 Mayo Lobby에서 오후 1시~2시 30분에 라이브 음악이 있습니다. 연주자용 프로그램이며 방문객이 쳐도 된다는 근거는 없습니다. 주소(4500 San Pablo Rd S)는 캠퍼스 주소이고, 정확한 건물은 확인되지 않았습니다."],null,"","Mayo Clinic Florida lobby, Jacksonville, FL","se",""],
 ["C","Novant Health Presbyterian Medical Center","Main lobby grand · volunteer musicians","Charlotte · NC","hospital","g",null,35.21253,-80.82431,["Novant Health Presbyterian Medical Center in Charlotte has a grand piano in its main lobby, according to an online volunteer listing of unknown date that seeks volunteer musicians to play it. It is a program for registered volunteer performers; there is no source saying visitors may walk up and play. It is not confirmed that the piano or the program is still in place.","El Novant Health Presbyterian Medical Center de Charlotte tiene un piano de cola en su vestíbulo principal, según un anuncio de voluntariado en línea de fecha desconocida que busca músicos voluntarios para tocarlo. Es un programa para intérpretes voluntarios inscritos; no hay ninguna fuente que diga que los visitantes puedan sentarse a tocar. No se ha confirmado que el piano o el programa sigan.","Charlotte의 Novant Health Presbyterian Medical Center 본관 로비에 그랜드 피아노가 있다고, 날짜를 알 수 없는 온라인 자원봉사 모집 글이 전합니다. 이 글은 피아노를 연주할 자원봉사 연주자를 모집하는 내용으로, 등록한 연주자용 프로그램입니다. 방문객이 그냥 쳐도 된다는 근거는 없고, 피아노와 프로그램이 지금도 있는지는 확인되지 않았습니다."],null,"","Novant Health Presbyterian Medical Center, Charlotte, NC","se",""],
 ["C","Orlando Public Library – Melrose Center","Rehearsal space piano · booking required","Orlando · FL","library","u",2022,28.542539,-81.376682,["An upright piano is reported in the rehearsal space of the Melrose Center at Orlando Public Library (101 E. Central Blvd.). This is a bookable studio, not a walk-up piano: it is for library cardholders who have completed the Melrose General Orientation, free with regular, property-owner or fee cards and $25 per session with a Melrose-only card. The piano is known only from a 2022 library staff comment and is not mentioned on the page itself; not confirmed as still in place.","Se informa de un piano vertical en la sala de ensayo del Melrose Center de Orlando Public Library (101 E. Central Blvd.). Es un estudio que se reserva, no un piano de libre acceso: lo usan titulares de carné de la biblioteca que hayan completado la Melrose General Orientation, gratis con carné regular, de propietario o de cuota, y a 25 dólares por sesión con carné solo para Melrose. El piano solo se conoce por un comentario del personal de la biblioteca de 2022 y la página no lo menciona; no se ha confirmado que siga en su lugar.","Orlando Public Library(101 E. Central Blvd.) Melrose Center의 리허설 공간에 업라이트 피아노가 있다고 알려져 있습니다. 지나가다 치는 피아노가 아니라 예약해서 쓰는 스튜디오로, Melrose General Orientation을 마친 도서관 카드 소지자가 이용하며 일반·부동산 소유자·유료 카드는 무료, Melrose 전용 카드는 회당 25달러입니다. 피아노는 2022년 도서관 직원 댓글로만 알려져 있고 페이지 본문에는 언급이 없으며, 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","Orlando Public Library – Melrose Center, Orlando, FL","se",""],
 ["C","Richmond Public Library, Main","Gellman Room Concerts · concert piano","Richmond · VA","library","",2026,37.542803,-77.44241,["Richmond Public Library's Main Library has hosted free public Gellman Room Concerts since 1973, and a piano is used for them, according to the library's page and a VPM story on a 'Joy of Music' concert there (only snippets could be read). It is a concert piano; there is no source saying patrons may play it. It is not confirmed how the piano is set up today.","La biblioteca principal de la Richmond Public Library organiza desde 1973 los Gellman Room Concerts, gratuitos y abiertos al público, y en ellos se usa un piano, según la página de la biblioteca y un reportaje de VPM sobre un concierto 'Joy of Music' allí (solo se pudieron leer fragmentos). Es un piano para conciertos; no hay ninguna fuente que diga que los usuarios puedan tocarlo. No se ha confirmado cómo está el piano hoy.","Richmond 공공도서관 본관은 1973년부터 누구나 무료로 들을 수 있는 Gellman Room Concerts를 열어 왔고, 이 공연에 피아노가 쓰인다고 도서관 페이지와 그곳의 'Joy of Music' 공연을 다룬 VPM 보도(요약만 읽음)가 전합니다. 공연용 피아노이며 이용자가 쳐도 된다는 근거는 없습니다. 지금 피아노가 어떤 상태로 있는지는 확인되지 않았습니다."],null,"","Richmond Public Library, Main, Richmond, VA","se",""],
 ["C","Savannah/Hilton Head Int'l Airport","Terminal atrium","Savannah · GA","airport","",null,32.12424,-81.19771,["A grand piano stands in the terminal atrium. The city's visitor guide says local professional musicians play it at certain times and does not mention travelers playing. A May 2025 video shows someone playing it during an evacuation, but it has not been confirmed whether it is still there or whether passengers may play freely.","Hay un piano de cola en el atrio de la terminal. La guía turística de la ciudad dice que músicos profesionales locales lo tocan en determinados momentos y no menciona que los viajeros puedan tocarlo. Un video de mayo de 2025 muestra a alguien tocándolo durante una evacuación, pero no se ha confirmado si sigue allí ni si los pasajeros pueden tocarlo libremente.","터미널 아트리움에 그랜드 피아노가 있습니다. 도시 관광 안내 글은 정해진 때에 지역 전문 연주자가 연주한다고만 적었고, 여행객이 칠 수 있다는 말은 없습니다. 2025년 5월 대피 상황에서 누군가 이 피아노를 치는 영상이 있지만, 지금도 있는지와 승객이 자유롭게 칠 수 있는지는 확인되지 않았습니다."],null,"","Savannah/Hilton Head Int'l Airport, Savannah, GA","se",""],
 ["C","The Kress Art Collective","Tampa Tunes · host named on the program's About page","Tampa · FL","other","",2025,27.960465,-82.440859,["The Kress Art Collective is named on the Tampa Tunes 'About' page as a place where one of the program's pianos has been placed; it is believed to be in Tampa. The page gives no address or current status, and access is expected to follow the host's opening hours. Not confirmed as still in place.","The Kress Art Collective figura en la página 'About' de Tampa Tunes como uno de los lugares donde se ha colocado un piano del programa; se cree que está en Tampa. La página no indica la dirección ni el estado actual, y se espera que el acceso siga el horario de apertura del lugar. No se ha confirmado que siga en su lugar.","Tampa Tunes의 'About' 페이지에 프로그램 피아노가 놓인 곳으로 The Kress Art Collective의 이름이 올라 있으며, Tampa에 있는 것으로 보입니다. 페이지에는 주소와 현재 상태가 나와 있지 않고, 이용은 해당 장소 운영 시간에 가능할 것으로 보입니다. 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","The Kress Art Collective, Tampa, FL","se",""],
 ["C","Tootsie's Orchid Lounge, Nashville airport","BNA terminal · leopard-print Baldwin (performance piano)","Nashville · TN","airport","",null,36.119585,-86.682662,["A leopard-print Baldwin piano at Tootsie's Orchid Lounge in the Nashville International Airport (BNA) terminal is used for the airport's scheduled daily live performances, according to an undated airport blog post (only a snippet could be read). It is a performance piano; there is no source saying travelers may play it. It is not confirmed that it is still there.","Un piano Baldwin con estampado de leopardo en Tootsie's Orchid Lounge, en la terminal del Nashville International Airport (BNA), se usa para las actuaciones en vivo diarias programadas del aeropuerto, según una entrada sin fecha del blog del aeropuerto (solo se pudo leer un fragmento). Es un piano para actuaciones; no hay ninguna fuente que diga que los viajeros puedan tocarlo. No se ha confirmado que siga allí.","Nashville International Airport(BNA) 터미널의 Tootsie's Orchid Lounge에 표범 무늬 Baldwin 피아노가 있고, 공항이 매일 정해 둔 라이브 공연에 쓰인다고 날짜 없는 공항 블로그 글(요약만 읽음)이 전합니다. 공연용 피아노이며 여행객이 쳐도 된다는 근거는 없습니다. 지금도 있는지는 확인되지 않았습니다."],null,"","Tootsie's Orchid Lounge, Nashville airport, Nashville, TN","se",""],

 ["C","Athens County Public Libraries","Restored baby grand · concert series","Athens · OH","library","g",2024,39.3344519,-82.0841082,["Ohio University news (May 2024) reported that student piano technicians rebuilt an Athens County Public Libraries baby grand that supports a local concert series; which branch it is in was not confirmed. It is used for performances and events, so there is no evidence that visitors may play it.","Una noticia de Ohio University (mayo de 2024) informó que estudiantes técnicos de piano reconstruyeron un piano de media cola de las Athens County Public Libraries que se usa en un ciclo de conciertos local; no se confirmó en qué sucursal está. Se usa para conciertos y actos, así que no hay constancia de que el público pueda tocarlo.","2024년 5월 Ohio University 소식에 따르면 학생 피아노 기술자들이 지역 연주회 시리즈에 쓰이는 Athens County Public Libraries의 베이비 그랜드를 다시 손봤습니다. 어느 분관에 있는지는 확인되지 않았습니다. 공연·행사용이라 이용자가 쳐도 된다는 근거는 없습니다."],null,"","Athens County Public Libraries, Athens, OH","mw",""],

 ["C","Cleveland Clinic, Miller Pavilion","Karos Grand Lobby · concert grand","Cleveland · OH","hospital","g",2019,41.50553,-81.620534,["The Karos Grand Lobby of the Miller Pavilion on Cleveland Clinic's main campus has a grand piano used for scheduled noon concerts of the Arts & Medicine program, as listed on its 2018–2019 calendars (only snippets could be read). It is for performers; there is no source saying visitors may play it, and an online forum post only mentions that a lobby grand exists. It is not confirmed that the piano or the concerts continue.","El Karos Grand Lobby del Miller Pavilion, en el campus principal de la Cleveland Clinic, tiene un piano de cola que se usa en los conciertos programados de mediodía del programa Arts & Medicine, según sus calendarios de 2018–2019 (solo se pudieron leer fragmentos). Es para intérpretes; no hay ninguna fuente que diga que los visitantes puedan tocarlo, y una publicación en un foro en línea solo menciona que hay un piano de cola en el vestíbulo. No se ha confirmado que el piano o los conciertos continúen.","Cleveland Clinic 본 캠퍼스 Miller Pavilion의 Karos Grand Lobby에 그랜드 피아노가 있고, 2018~2019년 Arts & Medicine 일정표(요약만 읽음)에 따르면 정해진 정오 공연에 쓰입니다. 공연용이며 방문객이 쳐도 된다는 근거는 없고, 온라인 게시판 글도 로비에 그랜드 피아노가 있다는 말뿐입니다. 피아노와 공연이 지금도 이어지는지는 확인되지 않았습니다."],null,"","Cleveland Clinic, Miller Pavilion, Cleveland, OH","mw",""],
 ["C","Detroit Public Library Main Library","Friday concert series","Detroit · MI","library","",null,42.358441,-83.066742,["Detroit Public Library's Main Library holds a Friday concert series; its Music Room was envisioned in 1921 as a place for live concerts. It is used for performances and events, so there is no evidence that visitors may play it.","La biblioteca principal de la Biblioteca Pública de Detroit organiza un ciclo de conciertos los viernes; su Music Room se concibió en 1921 como espacio para conciertos en vivo. Se usa para conciertos y actos, así que no hay constancia de que el público pueda tocarlo.","Detroit 공공도서관 본관은 금요일 연주회 시리즈를 엽니다. 본관 Music Room은 1921년 라이브 연주회 공간으로 구상됐습니다. 공연·행사용이라 이용자가 쳐도 된다는 근거는 없습니다."],null,"","Detroit Public Library Main Library, Detroit, MI","mw",""],

 ["C","Indianapolis Central Library","Clowes Auditorium grand · concerts","Indianapolis · IN","library","g",null,39.778409,-86.156743,["Indianapolis Public Library lists live piano performances in the Clowes Auditorium of its Central Library. It is used for performances and events, so there is no evidence that visitors may play it.","La Biblioteca Pública de Indianápolis anuncia actuaciones de piano en vivo en el Clowes Auditorium de su biblioteca central. Se usa para conciertos y actos, así que no hay constancia de que el público pueda tocarlo.","Indianapolis 공공도서관은 중앙도서관 Clowes Auditorium에서 피아노 연주회를 엽니다. 공연·행사용이라 이용자가 쳐도 된다는 근거는 없습니다."],null,"","Indianapolis Central Library, Indianapolis, IN","mw",""],
 ["C","Kansas City Union Station","Grand Hall · baby grand with Metropolitan Community College","Kansas City · MO","station","g",2025,39.084932,-94.584151,["A baby grand dedicated by Union Station and Metropolitan Community College stands in the Grand Hall of Kansas City Union Station, which is also an Amtrak stop. MCC students give periodic performances on it, and its player system plays music on its own the rest of the time. The source does not say that visitors may sit down and play, so it is unclear whether guests can play. Based on an October 2025 article; it is not confirmed whether the piano is still there.","Un piano de media cola dedicado por Union Station y Metropolitan Community College se encuentra en el Grand Hall de Kansas City Union Station, que también es parada de Amtrak. Estudiantes de MCC ofrecen conciertos periódicos y el resto del tiempo el piano toca música por sí solo con su sistema automático. La fuente no indica que los visitantes puedan sentarse a tocar, así que no está claro si el público puede usarlo. Según un artículo de octubre de 2025; no se ha confirmado que el piano siga allí.","Amtrak 역이기도 한 Kansas City Union Station의 Grand Hall에 Union Station과 Metropolitan Community College가 함께 봉헌한 베이비 그랜드 피아노가 있습니다. MCC 학생들이 때때로 연주하고, 그 밖의 시간에는 자동 연주 기능으로 음악이 흘러나옵니다. 방문객이 앉아서 쳐도 된다는 내용은 근거에 없어, 손님이 칠 수 있는지는 분명하지 않습니다. 2025년 10월 기사 기준이며, 지금도 있는지는 확인되지 않았습니다."],null,"","Kansas City Union Station, Kansas City, MO","mw",""],
 ["C","La Crosse Public Library","Piano recitals · Main and North","La Crosse · WI","library","",null,43.811216,-91.244729,["La Crosse Public Library has hosted piano recitals at its Main and North locations, booked through the meeting rooms. It is used for performances and events, so there is no evidence that visitors may play it.","La Biblioteca Pública de La Crosse ha acogido recitales de piano en sus sedes Main y North, reservados a través de las salas de reuniones. Se usa para conciertos y actos, así que no hay constancia de que el público pueda tocarlo.","La Crosse 공공도서관 본관과 North 분관에서 회의실 예약을 통한 피아노 발표회가 열렸습니다. 공연·행사용이라 이용자가 쳐도 된다는 근거는 없습니다."],null,"","La Crosse Public Library, La Crosse, WI","mw",""],
 ["C","Lisle Library District","Piano · programs and events","Lisle · IL","library","",2021,41.796417,-88.066981,["Lisle Library District's Policy 655 (January 2021) says its piano is for programs and events and is not meant for continual individual practice sessions. It is used for performances and events, so there is no evidence that visitors may play it.","La política 655 del Lisle Library District (enero de 2021) indica que su piano es para programas y actos, no para sesiones continuas de práctica individual. Se usa para conciertos y actos, así que no hay constancia de que el público pueda tocarlo.","Lisle Library District 규정 655(2021년 1월)에 따르면 피아노는 프로그램·행사용이며 개인이 계속 연습하는 용도가 아닙니다. 공연·행사용이라 이용자가 쳐도 된다는 근거는 없습니다."],null,"","Lisle Library District, Lisle, IL","mw",""],
 ["C","Minneapolis-Saint Paul Int'l Airport","Terminal 1 North Mall performance space","Minneapolis · MN","airport","g",2018,44.88506,-93.21444,["Scheduled performers only. A 9-foot Steinway concert grand sits in the North Mall performance space on Terminal 1's main shopping concourse. The airport carefully schedules who plays it, and a 2018 report said you would likely need security clearance and a background check. It is not for walk-up play.","Solo para intérpretes programados. Hay un piano de cola de concierto Steinway de 9 pies en el espacio de presentaciones del North Mall, en el pasillo comercial principal de la Terminal 1. El aeropuerto programa cuidadosamente quién lo toca, y un informe de 2018 decía que probablemente se necesita autorización de seguridad y verificación de antecedentes. No es para tocar libremente.","사전에 일정이 잡힌 연주자 전용입니다. Terminal 1 중앙 쇼핑 구역의 North Mall 공연 공간에 9피트 Steinway 콘서트 그랜드 피아노가 있습니다. 공항이 연주자를 엄격히 배정하며, 2018년 보도에 따르면 보안 인가와 신원 조회가 필요할 가능성이 높습니다. 지나가다 자유롭게 칠 수 있는 피아노가 아닙니다."],null,"","Minneapolis-Saint Paul Int'l Airport, Minneapolis, MN","mw",""],
 ["C","MyMichigan Medical Center Alpena","","Alpena · MI","hospital","d",2024,45.07778,-83.4495,["Volunteers only. The hospital has a donated electronic baby grand that plays pre-programmed music; where it stands is not stated. Pianists who want to volunteer their time to play may contact the development office. Based on a February 2024 report.","Solo para voluntarios. El hospital tiene un piano electrónico de media cola donado que reproduce música preprogramada; no se indica dónde está. Los pianistas que quieran tocar como voluntarios pueden comunicarse con la oficina de desarrollo. Se basa en un informe de febrero de 2024.","자원봉사자 전용입니다. 병원에는 미리 입력된 음악을 자동으로 연주하는 기증받은 전자식 베이비 그랜드 피아노가 있으며, 위치는 나와 있지 않습니다. 자원봉사로 연주하고 싶은 피아니스트는 development office에 문의하면 됩니다. 2024년 2월 보도에 근거한 정보입니다."],null,"","MyMichigan Medical Center Alpena, Alpena, MI","mw",""],
 ["C","Neenah Public Library","Shattuck Community Room · Boston grand · concerts","Neenah · WI","library","g",2023,44.184854,-88.457629,["Neenah Public Library has a Boston GP-193 grand in its Shattuck Community Room. Its 2023 board policy says the piano must be reserved and is used for concerts, recitals and programs, generally not for practice or lessons. It is used for performances and events, so there is no evidence that visitors may play it.","La Biblioteca Pública de Neenah tiene un piano de cola Boston GP-193 en su Shattuck Community Room. Su política de 2023 indica que debe reservarse y se usa para conciertos, recitales y programas, en general no para practicar ni dar clases. Se usa para conciertos y actos, así que no hay constancia de que el público pueda tocarlo.","Neenah 공공도서관 Shattuck Community Room에 Boston GP-193 그랜드 피아노가 있습니다. 2023년 도서관 이사회 규정에 따르면 예약해서 쓰며 연주회·발표회·프로그램용이고, 연습이나 레슨에는 대체로 쓰지 않습니다. 공연·행사용이라 이용자가 쳐도 된다는 근거는 없습니다."],null,"","Neenah Public Library, Neenah, WI","mw",""],
 ["C","Northbrook Public Library","Steinway Model B · Fine Arts concerts","Northbrook · IL","library","g",null,42.130569,-87.830851,["A seven-foot Steinway Model B grand on long-term loan is used for the Fine Arts concert series in the Northbrook Public Library auditorium, with concerts listed through 2026. It is used for performances and events, so there is no evidence that visitors may play it.","Un piano de cola Steinway Model B de siete pies, cedido a largo plazo, se usa en el ciclo de conciertos Fine Arts del auditorio de la Biblioteca Pública de Northbrook, con conciertos anunciados hasta 2026. Se usa para conciertos y actos, así que no hay constancia de que el público pueda tocarlo.","장기 대여받은 7피트 Steinway Model B 그랜드가 Northbrook 공공도서관 강당의 Fine Arts 연주회 시리즈에 쓰이며, 2026년까지 연주회 일정이 있습니다. 공연·행사용이라 이용자가 쳐도 된다는 근거는 없습니다."],null,"","Northbrook Public Library, Northbrook, IL","mw",""],
 ["C","Riley Hospital for Children lobby","Baby grand · weekly volunteer pianist","Indianapolis · IN","hospital","g",null,39.77727,-86.180022,["Riley Hospital for Children in Indianapolis has a baby grand in its lobby that a volunteer pianist plays each week, according to a Riley Children's article of unknown date (only a snippet could be read). It is played by volunteer musicians, and there is no source saying visitors may play it. It is not confirmed that the piano or the volunteer playing is still in place.","El Riley Hospital for Children de Indianápolis tiene un piano de media cola en el vestíbulo que un pianista voluntario toca cada semana, según un artículo de Riley Children's de fecha desconocida (solo se pudo leer un fragmento). Lo tocan músicos voluntarios y no hay ninguna fuente que diga que los visitantes puedan tocarlo. No se ha confirmado que el piano o las actuaciones voluntarias sigan.","Indianapolis의 Riley Hospital for Children 로비에 베이비 그랜드 피아노가 있고 자원봉사 피아니스트가 매주 연주한다고, 날짜를 알 수 없는 Riley Children's 기사(요약만 읽음)가 전합니다. 자원봉사 연주자용이며 방문객이 쳐도 된다는 근거는 없습니다. 피아노와 자원봉사 연주가 지금도 있는지는 확인되지 않았습니다."],null,"","Riley Hospital for Children lobby, Indianapolis, IN","mw",""],
 ["C","Topeka & Shawnee County Public Library","Auditorium Steinway grand","Topeka · KS","library","g",1978,39.050736,-95.696607,["The library's history notes that its Friends group gave a Steinway grand in 1978 for use in the auditorium of Topeka & Shawnee County Public Library. It is used for performances and events, so there is no evidence that visitors may play it.","La historia de la biblioteca indica que su grupo de Amigos donó en 1978 un piano de cola Steinway para el auditorio de la Topeka & Shawnee County Public Library. Se usa para conciertos y actos, así que no hay constancia de que el público pueda tocarlo.","도서관 연혁에 따르면 1978년 후원회(Friends)가 Topeka & Shawnee County Public Library 강당용으로 Steinway 그랜드를 기증했습니다. 공연·행사용이라 이용자가 쳐도 된다는 근거는 없습니다."],null,"","Topeka & Shawnee County Public Library, Topeka, KS","mw",""],
 ["C","West Lafayette Public Library","Sohmer baby grand · receptions and events","West Lafayette · IN","library","g",null,40.425089,-86.907454,["West Lafayette Public Library has a Sohmer baby grand in its main meeting room suite, bought with gift funds and used at receptions and donor events, according to a state library blog post. It is used for performances and events, so there is no evidence that visitors may play it.","La Biblioteca Pública de West Lafayette tiene un piano de media cola Sohmer en su conjunto de salas de reuniones, comprado con donaciones y usado en recepciones y actos con donantes, según un blog de la biblioteca estatal. Se usa para conciertos y actos, así que no hay constancia de que el público pueda tocarlo.","주립도서관 블로그에 따르면 West Lafayette 공공도서관 주 회의실에 기부금으로 산 Sohmer 베이비 그랜드가 있으며 리셉션·후원자 행사에 씁니다. 공연·행사용이라 이용자가 쳐도 된다는 근거는 없습니다."],null,"","West Lafayette Public Library, West Lafayette, IN","mw",""],
 ["C","Ypsilanti District Library","Piano · events for a fee","Ypsilanti · MI","library","",null,42.208295,-83.61485,["Ypsilanti District Library's policy says its piano is available for programs, recitals and special events for a fee, and not for practice by the general public. It is used for performances and events, so there is no evidence that visitors may play it.","La política de la Ypsilanti District Library indica que su piano está disponible para programas, recitales y actos especiales previo pago, y no para la práctica del público general. Se usa para conciertos y actos, así que no hay constancia de que el público pueda tocarlo.","Ypsilanti District Library 규정에 따르면 피아노는 요금을 내고 프로그램·발표회·특별 행사에 쓸 수 있으며 일반인 연습용은 아닙니다. 공연·행사용이라 이용자가 쳐도 된다는 근거는 없습니다."],null,"","Ypsilanti District Library, Ypsilanti, MI","mw",""],
 ["C","Chick-fil-A – Braker and 183","Reported upright · inside the restaurant","Austin · TX","other","u",2024,30.391489,-97.715636,["An upright piano has been reported inside the Chick-fil-A at Braker Ln and US-183 in Austin. The report comes from a community-run database of Austin pianos (2024) and was never checked in person, so whether visitors may play is unverified. Not confirmed as still in place.","Se ha informado de un piano vertical dentro del Chick-fil-A de Braker Ln y US-183, en Austin. El dato procede de una base de datos comunitaria de pianos de Austin (2024) y nunca se comprobó en persona, por lo que no está verificado si los visitantes pueden tocarlo. No se ha confirmado que siga en su lugar.","Austin의 Braker Ln과 US-183 교차 지점에 있는 Chick-fil-A 매장 안에 업라이트 피아노가 있다는 제보가 있습니다. Austin 피아노를 모은 커뮤니티 데이터베이스(2024년)에 제보로만 올라 있고 직접 가서 본 기록이 없어, 방문객이 칠 수 있는지도 알 수 없습니다. 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","Chick-fil-A – Braker and 183, Austin, TX","mt",""],
 ["C","Denver Union Station","Great Hall","Denver · CO","station","g",2025,39.75315,-105.00015,["Booked performers only. A baby grand in the Great Hall is used for the Friday-evening 'Live Piano in the Great Hall' series, which features Colorado pianists. There is no evidence of open play for the public. Based on 2025 information.","Solo para pianistas programados. En el Great Hall hay un piano de media cola que se usa para la serie de los viernes por la noche 'Live Piano in the Great Hall', con pianistas de Colorado. No hay indicios de que el público pueda tocarlo. Información de 2025.","섭외된 연주자 전용입니다. Great Hall의 베이비 그랜드 피아노는 Colorado 피아니스트들이 출연하는 금요일 저녁 'Live Piano in the Great Hall' 공연에 쓰입니다. 일반인이 자유롭게 칠 수 있다는 근거는 없습니다. 2025년 자료 기준입니다."],null,"","Denver Union Station, Denver, CO","mt",""],
 ["C","Downtown Library, Oklahoma City","Atrium baby grand · volunteer pianist hour","Oklahoma City · OK","library","g",2026,35.468541,-97.518733,["The Metropolitan Library System's Downtown Library (300 Park Avenue) has a baby grand in its first-floor atrium, where volunteer pianists play on Mondays and Fridays from noon to 1 pm, according to a library event page for March 2026 (some listings say Monday, Wednesday and Friday). This is a performance series for listeners; there is no evidence that patrons may play the piano themselves. Ask library staff if you want to play.","La Downtown Library del Metropolitan Library System (300 Park Avenue) tiene un piano de media cola en el atrio de la planta baja, donde pianistas voluntarios tocan los lunes y viernes de 12:00 a 13:00, según una página de eventos de la biblioteca de marzo de 2026 (otros anuncios dicen lunes, miércoles y viernes). Es una serie de actuaciones para escuchar; no hay pruebas de que el público pueda tocarlo. Si quiere tocar, pregunte al personal de la biblioteca.","Metropolitan Library System의 Downtown Library(300 Park Avenue) 1층 아트리움에 베이비 그랜드 피아노가 있고, 2026년 3월 도서관 행사 안내에 따르면 매주 월·금 낮 12시~1시에 자원봉사 피아니스트가 연주합니다(월·수·금이라고 적은 안내도 있습니다). 듣는 사람을 위한 연주 프로그램이며, 이용객이 직접 쳐도 된다는 근거는 없습니다. 치고 싶다면 도서관 직원에게 물어보십시오."],null,"","Downtown Library, Oklahoma City, Oklahoma City, OK","mt",""],
 ["C","East Regional Library, Fort Worth","Cliburn competitor concert","Fort Worth · TX","library","",null,32.7610731,-97.223571,["East Regional Library, a Fort Worth Public Library branch, has hosted concerts by Cliburn competition pianists, according to a city library event page. It is used for performances and events, so there is no evidence that visitors may play it.","La East Regional Library, sucursal de la Biblioteca Pública de Fort Worth, ha acogido conciertos de pianistas del concurso Cliburn, según una página de eventos de la biblioteca municipal. Se usa para conciertos y actos, así que no hay constancia de que el público pueda tocarlo.","시립도서관 행사 페이지에 따르면 Fort Worth 공공도서관 East Regional 분관에서 Cliburn 콩쿠르 참가자 연주회가 열렸습니다. 공연·행사용이라 이용자가 쳐도 된다는 근거는 없습니다."],null,"","East Regional Library, Fort Worth, Fort Worth, TX","mt",""],
 ["C","Houston Methodist Crain Garden","Atrium piano · staff pianists","Houston · TX","hospital","",2017,29.7108167,-95.399264,["The Crain Garden atrium at Houston Methodist Hospital in the Texas Medical Center has a piano played by staff pianists; an October 2017 Houston Press story said five staff pianists played seven days a week, plus about 150 special performances a year through the Center for Performing Arts Medicine. This is a performance program, and there is no evidence that visitors may play. The address shown (6565 Fannin St) is the hospital's main address and is assumed, and with only that 2017 source it is not confirmed that the program continues.","El atrio Crain Garden del Houston Methodist Hospital, en el Texas Medical Center, tiene un piano que tocan pianistas del personal; un artículo del Houston Press de octubre de 2017 indicó que cinco pianistas tocaban los siete días de la semana, además de unas 150 actuaciones especiales al año a cargo del Center for Performing Arts Medicine. Es un programa de actuaciones y no hay pruebas de que los visitantes puedan tocarlo. La dirección indicada (6565 Fannin St) es la principal del hospital y es supuesta, y con esa única fuente de 2017 no se ha confirmado que el programa continúe.","Texas Medical Center 안 Houston Methodist Hospital의 Crain Garden 아트리움에는 병원 소속 피아니스트가 연주하는 피아노가 있습니다. 2017년 10월 Houston Press 기사는 소속 피아니스트 5명이 일주일 내내 연주하고, Center for Performing Arts Medicine이 해마다 약 150회의 특별 공연을 연다고 전했습니다. 연주자용 프로그램이며 방문객이 쳐도 된다는 근거는 없습니다. 주소(6565 Fannin St)는 병원 대표 주소로 추정한 것이고, 근거가 2017년 기사 하나뿐이라 지금도 이어지는지는 확인되지 않았습니다."],null,"","Houston Methodist Crain Garden, Houston, TX","mt",""],
 ["C","MD Anderson Cancer Center","Lobby","Houston · TX","hospital","",2020,29.7072,-95.397,["Volunteers only. A lobby piano may be played only with permission and access arranged through volunteer services, as a volunteer piano position. The information is from 2020, when the position was paused during COVID, so current status is unknown.","Solo para voluntarios. El piano del vestíbulo solo se puede tocar con permiso y acceso gestionados a través de los servicios de voluntariado, como puesto de pianista voluntario. La información es de 2020, cuando el puesto estaba en pausa por el COVID, así que se desconoce la situación actual.","자원봉사자 전용입니다. 로비 피아노는 volunteer services를 통해 허가와 출입 권한을 받은 자원봉사 피아니스트만 칠 수 있습니다. 2020년 자료이고 당시 COVID로 이 자원봉사 자리가 중단된 상태였으므로 현재 상태는 알 수 없습니다."],null,"","MD Anderson Cancer Center, Houston, TX","mt",""],
 ["C","Mason Place","Pianos About Town · marked private","Fort Collins · CO","other","u",2026,40.53537,-105.07885,["A Pianos About Town piano is listed at Mason Place in Fort Collins, but the program marks this site '(Private)', so it is not a walk-up piano for the general public. Based on the program's 2026 location list; pianos rotate among about 20 summer and 6 winter sites, so the piano here changes.","Hay un piano de Pianos About Town registrado en Mason Place, en Fort Collins, pero el programa marca este sitio como '(Private)', por lo que no es un piano de libre acceso para el público general. Según la lista de ubicaciones 2026 del programa; los pianos rotan entre unos 20 sitios en verano y 6 en invierno, así que el piano de este punto cambia.","Fort Collins의 Mason Place에 Pianos About Town 피아노가 등록되어 있으나, 프로그램 목록에 '(Private)'로 표시되어 있어 일반인이 자유롭게 연주할 수 있는 피아노가 아닙니다. 2026년 프로그램 위치 목록 기준이며, 피아노는 여름 약 20곳·겨울 약 6곳을 돌며 교체됩니다."],null,"","Mason Place, Fort Collins, CO","mt",""],
 ["C","Planet K – Bee Cave","Reported upright · in the shop","Bee Cave · TX","other","u",2024,30.305175,-97.936956,["An upright piano, said to be out of tune, has been reported at Planet K's Bee Cave shop. The report comes from a community-run database of Austin pianos (2024) and was never checked in person, so whether visitors may play is unverified. Not confirmed as still in place.","Se ha informado de un piano vertical, que según se dice está desafinado, en la tienda Planet K de Bee Cave. El dato procede de una base de datos comunitaria de pianos de Austin (2024) y nunca se comprobó en persona, por lo que no está verificado si los visitantes pueden tocarlo. No se ha confirmado que siga en su lugar.","Planet K의 Bee Cave 매장에 업라이트 피아노(조율이 안 되어 있다고 함)가 있다는 제보가 있습니다. Austin 피아노를 모은 커뮤니티 데이터베이스(2024년)에 제보로만 올라 있고 직접 가서 본 기록이 없어, 방문객이 칠 수 있는지도 알 수 없습니다. 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","Planet K – Bee Cave, Bee Cave, TX","mt",""],

 ["C","Salt Lake City International Airport","Between Concourses A and B (reported)","Salt Lake City · UT","airport","",2023,40.79031,-111.97714,["In August 2023 a traveler's comment on an online forum described a piano at a corner between Concourses A and B, apparently closer to B. Several undated videos show people playing a piano at SLC, but one mentions a 'Do Not Touch' sign, so it may not be open to the public. No official or press source has been found, and it has not been confirmed whether the piano is still there.","En agosto de 2023, el comentario de un viajero en un foro en línea describió un piano en una esquina entre los Concourses A y B, al parecer más cerca del B. Varios videos sin fecha muestran a personas tocando un piano en SLC, pero uno menciona un letrero de 'No tocar', por lo que podría no estar abierto al público. No se ha encontrado ninguna fuente oficial ni de prensa, y no se ha confirmado si el piano sigue allí.","2023년 8월 온라인 게시판의 한 여행객 댓글은 Concourse A와 B 사이 모퉁이, B 쪽에 가까운 곳에 피아노가 있다고 적었습니다. 날짜를 알 수 없는 연주 영상이 여럿 있지만 그중 하나는 '만지지 마시오' 표지를 언급해 일반 연주가 안 될 수도 있습니다. 공식·언론 근거는 찾지 못했고, 지금도 피아노가 있는지는 확인되지 않았습니다."],null,"","Salt Lake City International Airport, Salt Lake City, UT","mt",""],
 ["C","Southern Arizona VA Medical Center","Main lobby piano · volunteer pianist","Tucson · AZ","hospital","",null,32.1814492,-110.9647969,["A volunteer pianist played every week in the main lobby of the Southern Arizona VA Health Care System in Tucson for veterans and visitors, according to a page seen only as a search excerpt; the year is not shown, and the volunteer was said to be retiring in October. This was a performance, and there is no evidence that visitors may play. The address (3601 S 6th Ave) is assumed to be the medical center's, and it is not confirmed that a piano or the program is still there.","Un pianista voluntario tocaba cada semana en el vestíbulo principal del Southern Arizona VA Health Care System, en Tucson, para veteranos y visitantes, según una página vista solo como extracto de búsqueda; no se indica el año y se decía que el voluntario se jubilaba en octubre. Se trataba de actuaciones y no hay pruebas de que los visitantes puedan tocar. La dirección (3601 S 6th Ave) se supone que es la del centro médico, y no se ha confirmado que el piano o el programa sigan allí.","검색 결과 발췌로만 확인한 페이지에 따르면, Tucson의 Southern Arizona VA Health Care System 본관 로비에서 자원봉사 피아니스트가 매주 참전 군인과 방문객을 위해 연주했습니다. 연도는 나와 있지 않고, 그 자원봉사자가 10월에 은퇴한다고 적혀 있었습니다. 연주자용이며 방문객이 쳐도 된다는 근거는 없습니다. 주소(3601 S 6th Ave)는 의료원 주소로 추정한 것이고, 지금도 피아노나 프로그램이 있는지는 확인되지 않았습니다."],null,"","Southern Arizona VA Medical Center, Tucson, AZ","mt",""],
 ["C","Summerglen Library, Fort Worth","Cliburn concerts","Fort Worth · TX","library","",null,32.8739772,-97.2925539,["Summerglen Library, a Fort Worth Public Library branch, hosts free Cliburn concerts by young and amateur pianists. It is used for performances and events, so there is no evidence that visitors may play it.","La Summerglen Library, sucursal de la Biblioteca Pública de Fort Worth, acoge conciertos gratuitos de Cliburn con pianistas jóvenes y aficionados. Se usa para conciertos y actos, así que no hay constancia de que el público pueda tocarlo.","Fort Worth 공공도서관 Summerglen 분관에서 어린이·아마추어 피아니스트가 나오는 Cliburn 무료 연주회가 열립니다. 공연·행사용이라 이용자가 쳐도 된다는 근거는 없습니다."],null,"","Summerglen Library, Fort Worth, Fort Worth, TX","mt",""],
 ["C","Cedars-Sinai South Tower lobby","Music for Healing · volunteer pianists","Los Angeles · CA","hospital","g",2019,34.0751604,-118.3810936,["A donated Yamaha baby grand in the Plaza Level Lobby of Cedars-Sinai Medical Center's South Tower is played by volunteer pianists of the Music for Healing program for patients and visitors. A May 2019 medical news report mentioned volunteers playing there, and an undated Jewish Journal article (seen only as an excerpt) described about 13 volunteers in 2–4 hour weekday shifts. This is a performance program, and there is no evidence that visitors may play; the address (8700 Beverly Blvd) is assumed, and it is not confirmed that the program continues.","Un piano Yamaha de media cola donado, en el Plaza Level Lobby de la South Tower del Cedars-Sinai Medical Center, lo tocan pianistas voluntarios del programa Music for Healing para pacientes y visitantes. Un reportaje de noticias médicas de mayo de 2019 mencionaba a voluntarios tocando allí, y un artículo sin fecha del Jewish Journal (visto solo como extracto) describía a unos 13 voluntarios en turnos de 2 a 4 horas entre semana. Es un programa de actuaciones y no hay pruebas de que los visitantes puedan tocarlo; la dirección (8700 Beverly Blvd) es supuesta y no se ha confirmado que el programa continúe.","Cedars-Sinai Medical Center South Tower의 Plaza Level 로비에 기증받은 Yamaha 베이비 그랜드가 있고, Music for Healing 프로그램의 자원봉사 피아니스트가 환자와 방문객을 위해 연주합니다. 2019년 5월 의료 뉴스 보도는 자원봉사자들이 이곳에서 연주한다고 전했고, 날짜가 없는 Jewish Journal 기사(발췌만 확인)는 약 13명이 평일에 2~4시간씩 맡아 연주한다고 소개했습니다. 연주자용 프로그램이며 방문객이 쳐도 된다는 근거는 없습니다. 주소(8700 Beverly Blvd)는 추정이고, 지금도 이어지는지는 확인되지 않았습니다."],null,"","Cedars-Sinai South Tower lobby, Los Angeles, CA","ca",""],
 ["C","Bay Area Hospital","Lobby","Coos Bay · OR","hospital","",2026,43.38365,-124.23307,["Volunteers only. The hospital lobby has a piano, and the hospital recruits volunteer pianists for 45–60 minute sessions once or twice a month. Open play by visitors is not indicated. The page was seen in November 2026 but its date is unknown, and whether the piano is still there is not confirmed.","Solo para voluntarios. El vestíbulo del hospital tiene un piano y el hospital busca pianistas voluntarios para sesiones de 45 a 60 minutos, una o dos veces al mes. No se indica que los visitantes puedan tocar. La página se consultó en noviembre de 2026 pero se desconoce su fecha, y no está confirmado que el piano siga allí.","자원봉사자 전용입니다. 병원 로비에 피아노가 있으며, 병원이 한 달에 한두 번 45~60분씩 연주할 자원봉사 피아니스트를 모집합니다. 방문객이 자유롭게 칠 수 있다는 내용은 없습니다. 2026년 11월에 확인한 페이지이나 작성일을 알 수 없고, 피아노가 아직 있는지도 확인되지 않았습니다."],null,"","Bay Area Hospital, Coos Bay, OR","pnw",""],
 ["C","Portland International Airport","Terminal · Volunteer Music","Portland · OR","airport","",2026,45.58527,-122.59172,["Volunteer performers only. PDX keeps five pianos across the terminal for its Volunteer Music program, played by about 30 volunteer musicians, according to the airport's official art page and a June 2026 news report. Nothing says travelers may play, and a traveler report says the Concourse D piano is not for public use. The exact location of each piano has not been confirmed.","Solo para músicos voluntarios. Según la página oficial de arte del aeropuerto y una noticia de junio de 2026, PDX tiene cinco pianos repartidos por la terminal para su programa Volunteer Music, tocados por unos 30 músicos voluntarios. Nada indica que los viajeros puedan tocar, y un viajero reportó que el piano del Concourse D no es de uso público. No se ha confirmado la ubicación exacta de cada piano.","자원봉사 연주자 전용입니다. 공항 공식 예술 페이지와 2026년 6월 뉴스에 따르면 PDX는 Volunteer Music 프로그램용으로 터미널 곳곳에 피아노 5대를 두고, 약 30명의 자원봉사 음악가가 연주합니다. 여행객이 칠 수 있다는 안내는 없고, Concourse D 피아노는 일반인용이 아니라는 여행객 글이 있습니다. 피아노별 정확한 자리는 확인되지 않았습니다."],null,"","Portland International Airport, Portland, OR","pnw",""],
 ["C","Downtown Royal Oak","Public Piano Project · Royal Oak Commission for the Arts · locations not published","Royal Oak · MI","street","u",2023,42.48948,-83.144649,["The Royal Oak Commission for the Arts' Public Piano Project places painted pianos outdoors around downtown Royal Oak; the city does not publish specific locations. Anyone can play them, apparently on a seasonal basis. A 2019 report described pianos dotted throughout downtown, the city says none were placed in 2020–2021, and a 2023 annual report lists piano painters. Not confirmed as still in place.","El Public Piano Project de la Royal Oak Commission for the Arts coloca pianos pintados al aire libre por el centro de Royal Oak; la ciudad no publica las ubicaciones concretas. Cualquiera puede tocarlos, al parecer solo por temporada. Una nota de 2019 hablaba de pianos repartidos por todo el centro, la ciudad indica que no se colocaron en 2020-2021 y un informe anual de 2023 menciona a quienes pintaron pianos. No se ha confirmado que sigan en el lugar.","Royal Oak Commission for the Arts의 Public Piano Project는 Royal Oak 시내 곳곳의 야외에 페인팅된 피아노를 놓으며, 구체적인 설치 장소는 공개하지 않습니다. 누구나 칠 수 있고, 계절에 따라 운영되는 것으로 보입니다. 2019년에는 시내 곳곳에 피아노가 있다고 보도되었고, 2020~2021년에는 새로 놓지 않았다고 시가 밝혔으며, 2023년 연례 보고서에 피아노를 칠한 사람들이 올라 있습니다. 지금도 있는지는 확인되지 않았습니다."],null,"","Downtown Royal Oak, Royal Oak, MI","mw","seasonal"],
 ["C","Boston Avenue United Methodist Church","Play Me, Tulsa","Tulsa · OK","other","u",2022,36.143845,-95.984366,["Boston Avenue United Methodist Church in Tulsa appears to have hosted a student-painted upright from Play Me, Tulsa (Saied Music Co. with Tulsa Mayfest). The pianos debut at Mayfest in May and then sit at outdoor host sites through the end of July, free for anyone to play. Host sites change every year and no 2025–2026 list is published; this site is linked from the official 2022 page only, with a single season documented and no address given, and it is not confirmed that a piano is still placed here.","Boston Avenue United Methodist Church, en Tulsa, parece haber acogido un piano vertical pintado por estudiantes del programa Play Me, Tulsa (Saied Music Co. con Tulsa Mayfest). Los pianos se estrenan en Mayfest en mayo y luego permanecen en lugares al aire libre hasta finales de julio; cualquiera puede tocarlos gratis. Los lugares cambian cada año y no se publica la lista de 2025–2026; este lugar solo aparece enlazado en la página oficial de 2022, con una única temporada documentada y sin dirección, y no se ha confirmado que siga habiendo un piano aquí.","Tulsa의 Boston Avenue United Methodist Church에 Play Me, Tulsa(Saied Music Co.·Tulsa Mayfest)의 학생 페인팅 업라이트 피아노가 놓였던 것으로 보입니다. 피아노는 5월 Mayfest에서 처음 공개된 뒤 7월 말까지 야외 호스트 장소에 놓이며, 누구나 무료로 칠 수 있습니다. 호스트 장소는 해마다 바뀌고 2025~2026년 목록은 공개되지 않았습니다. 이곳은 2022년 공식 페이지에 링크로만 올라 있어 한 시즌 기록뿐이고 주소도 나와 있지 않으며, 지금도 이곳에 피아노가 놓이는지는 확인되지 않았습니다."],null,"","Boston Avenue United Methodist Church, Tulsa, OK","mt","Jun–Jul"],
 ["C","Brookside Collective","Play Me, Tulsa","Tulsa · OK","other","u",2022,36.108185,-95.975395,["Brookside Collective in Tulsa appears to have hosted a student-painted upright from Play Me, Tulsa (Saied Music Co. with Tulsa Mayfest). The pianos debut at Mayfest in May and then sit at outdoor host sites through the end of July, free for anyone to play. Host sites change every year and no 2025–2026 list is published; this site is linked from the official 2022 page only, with a single season documented and no address given, and it is not confirmed that a piano is still placed here.","Brookside Collective, en Tulsa, parece haber acogido un piano vertical pintado por estudiantes del programa Play Me, Tulsa (Saied Music Co. con Tulsa Mayfest). Los pianos se estrenan en Mayfest en mayo y luego permanecen en lugares al aire libre hasta finales de julio; cualquiera puede tocarlos gratis. Los lugares cambian cada año y no se publica la lista de 2025–2026; este lugar solo aparece enlazado en la página oficial de 2022, con una única temporada documentada y sin dirección, y no se ha confirmado que siga habiendo un piano aquí.","Tulsa의 Brookside Collective에 Play Me, Tulsa(Saied Music Co.·Tulsa Mayfest)의 학생 페인팅 업라이트 피아노가 놓였던 것으로 보입니다. 피아노는 5월 Mayfest에서 처음 공개된 뒤 7월 말까지 야외 호스트 장소에 놓이며, 누구나 무료로 칠 수 있습니다. 호스트 장소는 해마다 바뀌고 2025~2026년 목록은 공개되지 않았습니다. 이곳은 2022년 공식 페이지에 링크로만 올라 있어 한 시즌 기록뿐이고 주소도 나와 있지 않으며, 지금도 이곳에 피아노가 놓이는지는 확인되지 않았습니다."],null,"","Brookside Collective, Tulsa, OK","mt","Jun–Jul"],
 ["U","University at Buffalo Student Union","Room 145a · North Campus, Amherst","Amherst · NY","university","",2021,43.0011971,-78.7862926,["UB Spectrum reported in September 2021 that a piano in the University at Buffalo North Campus Student Union in Amherst had been moved from the second floor to room 145a, with a sign saying it is provided for the 'use and enjoyment of all'. This is a single source from 2021, so it is not confirmed that the piano is still there.","UB Spectrum informó en septiembre de 2021 que un piano del Student Union del North Campus de la University at Buffalo, en Amherst, se había trasladado del segundo piso a la sala 145a, con un cartel que dice que está para el 'uso y disfrute de todos'. Es una sola fuente de 2021, así que no se ha confirmado que siga allí.","2021년 9월 UB Spectrum은 Amherst의 University at Buffalo North Campus Student Union 피아노가 2층에서 145a호로 옮겨졌고, '모두가 쓰고 즐기도록' 둔 피아노라는 안내판이 있다고 전했습니다. 2021년 자료 하나뿐이라 지금도 있는지는 확인되지 않았습니다."],null,"","University at Buffalo Student Union, Amherst, NY","ny",""],
 ["U","Boston University","GSU link by Mugar Library","Boston · MA","university","",2018,42.3505,-71.1054,["Unverified. A former 'Play Me, I'm Yours' street piano stood in the GSU link between Mugar Library and the George Sherman Union food court, where anybody could go up and play at any time of day. It has not been confirmed since February 2018.","Sin verificar. Un antiguo piano callejero de 'Play Me, I'm Yours' estaba en el GSU link, entre Mugar Library y el patio de comidas del George Sherman Union, donde cualquiera podía acercarse a tocar a cualquier hora del día. No se ha confirmado desde febrero de 2018.","미확인 정보입니다. 'Play Me, I'm Yours' 거리 피아노였던 피아노가 Mugar Library와 George Sherman Union 푸드코트 사이의 GSU link에 놓여, 누구나 하루 중 언제든 칠 수 있었습니다. 2018년 2월 이후로는 확인되지 않았습니다."],null,"","Boston University, Boston, MA","ne",""],
 ["U","Carnegie Library of Pittsburgh, Main","Music, Film & Audio room · digital piano","Pittsburgh · PA","library","d",2009,40.443709,-79.949054,["An archived 2009 page of the Carnegie Library of Pittsburgh described a Kurzweil digital piano in the second-floor Music, Film and Audio room of the Main (Oakland) library for individual use during library hours, with headphones lent at the reference desk on showing a photo ID and a 30-minute limit when busy. The current library website could not be opened and nothing newer was found. It is not confirmed that the piano is still offered.","Una página archivada de 2009 de la Carnegie Library of Pittsburgh describía un piano digital Kurzweil en la sala Music, Film and Audio del segundo piso de la biblioteca principal (Oakland), para uso individual en horario de biblioteca, con auriculares prestados en el mostrador de referencia presentando un documento con foto y un límite de 30 minutos cuando hay demanda. No se pudo abrir el sitio web actual de la biblioteca ni se encontró nada más reciente. No se ha confirmado que el piano se siga ofreciendo.","Carnegie Library of Pittsburgh의 2009년 보관 페이지는 본관(Oakland) 2층 Music, Film and Audio 실에 Kurzweil 디지털 피아노가 있어 도서관 운영 시간에 혼자 쓸 수 있고, 사진 신분증을 보여 주면 참고 데스크에서 헤드폰을 빌려 주며 붐빌 때는 30분으로 제한한다고 적었습니다. 지금 도서관 웹사이트는 열리지 않았고 더 새 자료도 찾지 못했습니다. 지금도 이용할 수 있는지는 확인되지 않았습니다."],null,"","Carnegie Library of Pittsburgh, Main, Pittsburgh, PA","ne",""],
 ["U","McGovern Transit Center","Waiting areas","Lawrence · MA","station","",2021,42.70217,-71.15246,["Unverified. In October 2021 the MVRTA placed ornately decorated, playable second-hand pianos, one in each waiting area of the McGovern Transit Center, with an invitation to play. There is no evidence after 2021, so they may no longer be there.","Sin verificar. En octubre de 2021 la MVRTA colocó pianos de segunda mano, decorados y listos para tocar, uno en cada sala de espera del McGovern Transit Center, con una invitación a tocarlos. No hay referencias posteriores a 2021, así que puede que ya no estén.","미확인 정보입니다. 2021년 10월 MVRTA가 화려하게 장식한 중고 피아노를 McGovern Transit Center의 대기 구역마다 한 대씩 두고 누구나 치도록 했습니다. 2021년 이후의 자료가 없어 지금은 없을 수 있습니다."],null,"","McGovern Transit Center, Lawrence, MA","ne",""],
 ["U","Paramus Public Library","Pianos in the Park · gazebo","Paramus · NJ","park","u",null,40.929738,-74.072051,["A donated piano painted by West Brook Middle School students was reported at the gazebo of the Paramus Public Library in Paramus, the first of several planned for Pianos in the Park, a project of the Borough of Paramus and Paramus schools. It is free, and the general public is invited to play. The report is undated (probably late 2010s) and could not be fully verified. Not confirmed as still in place.","Se informó de un piano donado y pintado por alumnos de West Brook Middle School en el quiosco (gazebo) de Paramus Public Library, en Paramus; era el primero de varios previstos para Pianos in the Park, un proyecto del municipio y las escuelas de Paramus. Es gratuito y se invita al público en general a tocar. La nota no tiene fecha (probablemente de finales de la década de 2010) y no pudo verificarse por completo. No se ha confirmado que siga en el lugar.","Paramus의 Paramus Public Library 가제보에 West Brook Middle School 학생들이 칠한 기증 피아노가 놓였다고 소개되었습니다. Borough of Paramus와 Paramus 학교들이 함께한 Pianos in the Park의 첫 피아노로, 무료이며 일반 시민 누구나 칠 수 있습니다. 자료의 날짜가 확인되지 않았고(2010년대 후반으로 추정) 내용도 충분히 검증되지 않았습니다. 지금도 있는지는 확인되지 않았습니다."],null,"","Paramus Public Library, Paramus, NJ","ne",""],
 ["U","Penn Medicine Perelman Center lobby","Lobby piano · check in at the info desk","Philadelphia · PA","hospital","",2015,39.94758,-75.19313,["A 2015 WHYY story described a visiting medical student playing the lobby piano at Penn Medicine's Perelman Center for Advanced Medicine in Philadelphia after checking in at the information desk, as a sign there asked. This is a single source from 2015, so it is not confirmed that the piano or the rule is still in place. If it is, ask at the information desk first.","Un reportaje de WHYY de 2015 describía a un estudiante de medicina de visita tocando el piano del vestíbulo del Perelman Center for Advanced Medicine de Penn Medicine, en Filadelfia, tras registrarse en el mostrador de información, como pedía un cartel. Es una sola fuente de 2015, así que no se ha confirmado que el piano o esa norma sigan vigentes. Si sigue allí, pregunte primero en el mostrador de información.","2015년 WHYY 보도는 Philadelphia의 Penn Medicine Perelman Center for Advanced Medicine 로비에서, 안내판에 적힌 대로 안내 데스크에 알린 뒤 피아노를 친 방문 의대생을 소개했습니다. 2015년 자료 하나뿐이라 피아노나 그 규칙이 지금도 있는지는 확인되지 않았습니다. 있다면 먼저 안내 데스크에 물어보세요."],null,"","Penn Medicine Perelman Center lobby, Philadelphia, PA","ne",""],
 ["U","Pittsburgh International Airport","Baggage claim and concourses · Free the Music","Pittsburgh · PA","airport","g",2023,40.49285,-80.23729,["In December 2023 the airport's own news site reported three hand-painted pianos from Free the Music Pittsburgh in baggage claim and the concourses, available for anyone to play. Free the Music's undated website says it currently works with PIT. A new landside terminal opened on November 18, 2025, so the old baggage claim spot has likely changed, and it has not been confirmed whether the pianos are still there.","En diciembre de 2023, el sitio de noticias del propio aeropuerto informó de tres pianos pintados a mano de Free the Music Pittsburgh en la zona de recogida de equipaje y en los concourses, disponibles para que cualquiera los tocara. El sitio web de Free the Music, sin fecha, indica que actualmente colabora con PIT. El 18 de noviembre de 2025 abrió una nueva terminal landside, por lo que es probable que la antigua ubicación en la zona de equipaje haya cambiado; no se ha confirmado si los pianos siguen allí.","공항 공식 뉴스는 2023년 12월, Free the Music Pittsburgh의 손그림 피아노 세 대를 수하물 찾는 곳과 탑승동에 두어 누구나 칠 수 있게 했다고 전했습니다. 날짜가 없는 Free the Music 웹사이트에는 현재 PIT와 협력 중이라고 적혀 있습니다. 2025년 11월 18일 새 랜드사이드 터미널이 문을 열어 옛 수하물장 위치는 바뀌었을 가능성이 크며, 지금도 피아노가 있는지는 확인되지 않았습니다."],null,"","Pittsburgh International Airport, Pittsburgh, PA","ne",""],
 ["U","Portland Public Library","Main Library · practice piano · up to 1 hour","Portland · ME","library","",null,43.658006,-70.259522,["An undated radio story record says Portland Public Library's main library provides an on-site piano that patrons can use for up to an hour to practice. It is not confirmed that this is still the case.","Un registro de un reportaje radiofónico sin fecha indica que la biblioteca principal de la Biblioteca Pública de Portland tiene un piano que los usuarios pueden usar hasta una hora para practicar. No se ha confirmado que siga siendo así.","날짜 없는 라디오 보도 기록에 따르면 Portland 공공도서관 본관에는 이용자가 최대 1시간 연습할 수 있는 피아노가 있습니다. 지금도 그런지는 확인되지 않았습니다."],null,"","Portland Public Library, Portland, ME","ne",""],
 ["U","Reading Terminal Market, Philadelphia","Performing arts series · market pianists","Philadelphia · PA","mall","",2012,39.953707,-75.159092,["A 2012 WRTI radio piece profiled the pianists who perform among shoppers at Reading Terminal Market in Philadelphia, part of the market's performing arts series funded by the Knight Foundation. There is no source saying visitors may sit down and play; the piano appears to be for the series' performers. The sources are from 2012, so it is not confirmed that the piano is still there.","Un programa de radio de WRTI de 2012 presentó a los pianistas que tocan entre los compradores del Reading Terminal Market de Filadelfia, dentro de la serie de artes escénicas del mercado financiada por la Knight Foundation. No hay ninguna fuente que diga que los visitantes puedan sentarse a tocar; el piano parece ser para los intérpretes de la serie. Las fuentes son de 2012, así que no se ha confirmado que siga allí.","2012년 WRTI 라디오는 Philadelphia Reading Terminal Market에서 장 보는 사람들 사이에서 연주하는 피아니스트들을 소개했습니다. Knight Foundation이 지원하는 시장 공연 시리즈의 하나입니다. 손님이 앉아서 쳐도 된다는 근거는 없고 공연자용으로 보입니다. 근거가 2012년 자료라 지금도 피아노가 있는지는 확인되지 않았습니다."],null,"","Reading Terminal Market, Philadelphia, Philadelphia, PA","ne",""],
 ["U","The Gazebo @ Walcott Park","Free The Music","Pittsburgh · PA","park","u",2026,40.5401,-80.1804,["Unverified. Pittsburgh's Free The Music program names 'The Gazebo @ Walcott Park' as the home of one of its upright pianos and says its instruments are available for anyone and everyone to use. The program page is undated and gives no address, and the park itself could not be located, so treat this as a lead only.","Sin verificar. El programa Free The Music de Pittsburgh menciona 'The Gazebo @ Walcott Park' como ubicación de uno de sus pianos verticales y dice que sus instrumentos están disponibles para cualquier persona. La página del programa no tiene fecha ni dirección, y no se pudo ubicar el parque, así que tómelo solo como una pista.","미확인 정보입니다. Pittsburgh의 Free The Music 프로그램이 업라이트 피아노 설치 장소로 'The Gazebo @ Walcott Park'를 들고 있으며, 악기는 누구나 사용할 수 있다고 안내합니다. 다만 프로그램 페이지에 날짜와 주소가 없고 공원 위치도 확인하지 못했으므로 참고용으로만 보시기 바랍니다."],null,"","The Gazebo @ Walcott Park, Pittsburgh, PA","ne",""],
 ["U","The Hollander Project garden piano","Braddock · outdoor garden piano","Braddock · PA","other","",2019,40.403402,-79.868382,["A 2019 Pittsburgh Magazine article described a working piano outdoors at The Hollander Project, a women's business incubator in Braddock, kept in a weather-protected structure in a garden open to the neighborhood. It was part of For Good PGH. No source after 2019 was found, so it is not confirmed that the piano is still there.","Un artículo de Pittsburgh Magazine de 2019 describió un piano en funcionamiento al aire libre en The Hollander Project, una incubadora de negocios de mujeres en Braddock, protegido de la intemperie dentro de una estructura en un jardín abierto al vecindario. Formaba parte de For Good PGH. No se encontraron fuentes posteriores a 2019, así que no se ha confirmado que siga allí.","2019년 Pittsburgh Magazine 기사는 Braddock의 여성 창업 지원 공간 The Hollander Project 야외에 칠 수 있는 피아노가 있다고 소개했습니다. 동네 사람들에게 열린 정원 안, 비바람을 막는 구조물 속에 놓여 있었고 For Good PGH의 일이었습니다. 2019년 이후 소식은 찾지 못해 지금도 있는지는 확인되지 않았습니다."],null,"","The Hollander Project garden piano, Braddock, PA","ne",""],
 ["U","West Milford Township Library","Upstairs atrium · donated baby grand","West Milford · NJ","library","g",2022,41.128725,-74.369482,["A donated baby grand piano was moved into the upstairs atrium of West Milford Township Library in May 2022, and the local paper said it would be available to library patrons. It is not stated whether visitors can simply sit down and play or what the rules and hours are, and no news after 2022 was found, so ask the staff first.","En mayo de 2022 se instaló un piano de media cola donado en el atrio superior de la Biblioteca de West Milford Township, y el periódico local dijo que estaría disponible para los usuarios de la biblioteca. No se indica si los visitantes pueden sentarse a tocar libremente ni cuáles son las normas y horarios, y no se encontraron noticias posteriores a 2022, así que conviene preguntar primero al personal.","2022년 5월 West Milford Township 도서관 위층 아트리움에 기증받은 베이비 그랜드 피아노가 놓였고, 지역 신문은 도서관 이용자가 쓸 수 있다고 전했습니다. 그냥 앉아서 쳐도 되는지, 규칙과 시간은 어떤지는 나와 있지 않습니다. 2022년 이후 소식도 찾지 못했으니 먼저 직원에게 물어보세요."],null,"","West Milford Township Library, West Milford, NJ","ne",""],
 ["U","William Pitt Union, University of Pittsburgh","Two main-floor pianos","Pittsburgh · PA","university","",null,40.443387,-79.954839,["An undated article from The Pitt News archive, 'Jamming on key', said there were two pianos in the William Pitt Union (3959 Fifth Avenue), one once owned by jazz musician Mary Lou Williams, and that students played on the main floor between classes. The full article could not be opened and its date is unknown, so it is not confirmed that the pianos are still there or open to play.","Un artículo sin fecha del archivo de The Pitt News, 'Jamming on key', decía que había dos pianos en el William Pitt Union (3959 Fifth Avenue), uno de los cuales perteneció a la música de jazz Mary Lou Williams, y que los estudiantes tocaban en la planta principal entre clases. No se pudo abrir el artículo completo y se desconoce su fecha, así que no se ha confirmado que los pianos sigan allí ni que se puedan tocar.","날짜를 알 수 없는 The Pitt News 보관 기사 'Jamming on key'는 William Pitt Union(3959 Fifth Avenue)에 피아노가 2대 있고, 그중 하나는 재즈 음악가 Mary Lou Williams가 쓰던 것이며, 학생들이 수업 사이에 본층에서 친다고 전했습니다. 전체 기사는 열리지 않았고 날짜도 몰라 지금도 있는지, 칠 수 있는지는 확인되지 않았습니다."],null,"","William Pitt Union, University of Pittsburgh, Pittsburgh, PA","ne",""],
 ["U","Artel Gallery","UWF Public Piano Project","Pensacola · FL","museum","u",2013,30.409465,-87.214979,["The third piano of the 2013 UWF Public Piano Project went to Artel Gallery in Pensacola; it was donated by Dollarhide's Music Center and was to be painted by gallery artists. It was presumably available to gallery visitors. Last documented in 2013; no later record has been found, and it is not confirmed as still in place.","El tercer piano del UWF Public Piano Project de 2013 se destinó a Artel Gallery, en Pensacola; fue donado por Dollarhide's Music Center y lo iban a pintar artistas de la galería. Es de suponer que podían tocarlo los visitantes de la galería. Documentado por última vez en 2013; no se ha encontrado ningún registro posterior y no se ha confirmado que siga en su lugar.","Pensacola의 Artel Gallery에 2013년 UWF Public Piano Project의 세 번째 피아노가 배정되었습니다. Dollarhide's Music Center가 기증했고 갤러리 작가들이 그림을 그릴 예정이었으며, 갤러리 방문객이 칠 수 있었던 것으로 보입니다. 마지막 기록은 2013년이고 이후 기록이 없으며, 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","Artel Gallery, Pensacola, FL","se",""],
 ["U","Chrysler Museum of Art, Norfolk","Museum piano · free entry","Norfolk · VA","culture","",2024,36.856363,-76.29298,["An online forum post from around 2024 says a piano is available to play at the Chrysler Museum of Art in Norfolk, and that entry to the museum is free. Where in the museum it stands and when it can be played are not stated. This rests on a single unverified comment, so it is not confirmed that the piano is still there; ask museum staff.","Una publicación en un foro en línea de alrededor de 2024 dice que en el Chrysler Museum of Art de Norfolk hay un piano disponible para tocar y que la entrada al museo es gratuita. No se indica en qué parte del museo está ni cuándo se puede tocar. Se basa en un solo comentario sin verificar, así que no se ha confirmado que siga allí; pregunte al personal del museo.","2024년쯤의 온라인 게시판 글에 Norfolk의 Chrysler Museum of Art에 칠 수 있는 피아노가 있고 입장은 무료라는 말이 있습니다. 박물관 안 어디에 있는지, 언제 칠 수 있는지는 나와 있지 않습니다. 확인되지 않은 글 하나가 근거라 지금도 있는지는 확인되지 않았으니 박물관 직원에게 물어보세요."],null,"","Chrysler Museum of Art, Norfolk, Norfolk, VA","se",""],
 ["U","Community Maritime Park","UWF Public Piano Project","Pensacola · FL","park","u",2013,30.403127,-87.218665,["The second piano of the 2013 UWF Public Piano Project was placed at Community Maritime Park in Pensacola, painted by UWF student Jessica J. Stepherson. It was open to anyone at the 2013 launch. Last documented in 2013; no later record has been found, so it is likely gone and not confirmed as still in place.","El segundo piano del UWF Public Piano Project de 2013 se colocó en Community Maritime Park, en Pensacola, pintado por Jessica J. Stepherson, estudiante de la UWF. En su lanzamiento en 2013 cualquiera podía tocarlo. Documentado por última vez en 2013; no se ha encontrado ningún registro posterior, por lo que probablemente ya no esté y no se ha confirmado que siga en su lugar.","Pensacola의 Community Maritime Park에 2013년 UWF Public Piano Project의 두 번째 피아노가 놓였으며, UWF 학생 Jessica J. Stepherson이 그림을 그렸습니다. 2013년 설치 당시 누구나 칠 수 있었습니다. 마지막 기록은 2013년이고 이후 기록이 없어 철거되었을 가능성이 높으며, 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","Community Maritime Park, Pensacola, FL","se",""],
 ["U","Crowbar","Tampa Tunes · Ybor City","Tampa · FL","cafe","u",2025,27.96078,-82.4406,["Crowbar in Ybor City has been named as one of six Tampa Tunes piano locations; the exact spot is not given. The program describes 24-hour access to music for the community. Unverified: this rests on a summary of 2024–2025 coverage that we have not read directly, so confirm on site.","Crowbar, en Ybor City, figura como una de las seis ubicaciones de pianos de Tampa Tunes; no se indica el punto exacto. El programa habla de acceso a la música las 24 horas para la comunidad. Sin verificar: el dato se basa en un resumen de la cobertura de 2024–2025 que no hemos leído directamente, así que confírmelo en el lugar.","Ybor City의 Crowbar는 Tampa Tunes 피아노가 놓인 6곳 중 하나로 소개된 곳이며, 정확한 위치는 나와 있지 않습니다. 프로그램은 지역 주민이 24시간 음악을 접할 수 있게 한다고 설명합니다. 미확인 정보입니다. 2024~2025년 보도를 요약한 자료에 근거한 것으로 원문을 직접 확인하지 못했으니 현장에서 확인하시기 바랍니다."],null,"","Crowbar, Tampa, FL","se",""],

 ["U","Dauphin Street","Street piano · near Downtown Mobile Alliance","Mobile · AL","street","u",2016,30.690959,-88.044248,["A donated piano was placed on Dauphin Street near the Downtown Mobile Alliance in Mobile for anyone walking by to play, according to a July 2016 local news report. It was given by an individual donor and Ashland Place United Methodist Church, and the Alliance was looking for an artist to paint it. Last documented in 2016; no later record has been found, so it is likely gone and not confirmed as still in place.","Según un reportaje local de julio de 2016, se colocó un piano donado en Dauphin Street, cerca de Downtown Mobile Alliance, en Mobile, para que lo tocara cualquiera que pasara. Lo donaron una persona particular y Ashland Place United Methodist Church, y la Alliance buscaba un artista para pintarlo. Documentado por última vez en 2016; no se ha encontrado ningún registro posterior, por lo que probablemente ya no esté y no se ha confirmado que siga en su lugar.","2016년 7월 지역 뉴스에 따르면 Mobile의 Dauphin Street, Downtown Mobile Alliance 근처에 기증받은 피아노가 놓여 지나가는 누구나 칠 수 있었습니다. 개인 기증자와 Ashland Place United Methodist Church가 기증했고, Downtown Mobile Alliance는 피아노에 그림을 그릴 작가를 찾고 있었습니다. 마지막 기록은 2016년이고 이후 기록이 없어 철거되었을 가능성이 높으며, 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","Dauphin Street, Mobile, AL","se",""],
