 ["U","Downtown Starkville street pianos","Main Street · painted pianos","Starkville · MS","street","u",2018,33.463853,-88.821926,["Painted street pianos were placed along Main Street in downtown Starkville from May 2018, including one between the Starkville Community Theatre and 929 Coffee Bar and one outside Pop Porium; the Mississippi State student paper said anyone could play, whatever their skill. A later article says the first piano was retired, and no update after 2018 was found, so it is not confirmed that any remain.","Desde mayo de 2018 se colocaron pianos callejeros pintados a lo largo de Main Street, en el centro de Starkville, entre ellos uno entre el Starkville Community Theatre y 929 Coffee Bar y otro frente a Pop Porium; el periódico estudiantil de Mississippi State dijo que cualquiera podía tocarlos, sin importar su nivel. Un artículo posterior indica que el primer piano se retiró, y no se encontró información posterior a 2018, así que no se ha confirmado que quede alguno.","2018년 5월부터 Starkville 시내 Main Street에 그림을 입힌 거리 피아노가 놓였습니다. Starkville Community Theatre와 929 Coffee Bar 사이, Pop Porium 앞 등입니다. Mississippi State 학생 신문은 실력과 상관없이 누구나 칠 수 있다고 전했습니다. 뒤의 기사에 첫 피아노는 치웠다고 나오고 2018년 이후 소식은 찾지 못해, 지금 남아 있는지는 확인되지 않았습니다."],null,"","Downtown Starkville street pianos, Starkville, MS","se",""],

 ["U","Huntsville International Airport","Public waiting area before security","Huntsville · AL","airport","g",2014,34.63769,-86.77683,["In April 2014 the airport's official account said in a comment that there was a public piano in the waiting area, described as just before security near a seating area. No later source has been found, and the airport's amenities page does not mention a piano. It has not been confirmed whether it is still there.","En abril de 2014, la cuenta oficial del aeropuerto indicó en un comentario que había un piano público en la sala de espera, descrito como justo antes del control de seguridad, cerca de una zona de asientos. No se ha encontrado ninguna fuente posterior, y la página de servicios del aeropuerto no menciona ningún piano. No se ha confirmado si sigue allí.","2014년 4월 공항 공식 계정은 댓글로 대기 구역에 공공 피아노가 있다고 밝혔으며, 보안검색대 바로 앞 좌석 근처로 소개되었습니다. 그 뒤의 근거는 찾지 못했고, 공항 편의시설 페이지에도 피아노는 나오지 않습니다. 지금도 있는지는 확인되지 않았습니다."],null,"","Huntsville International Airport, Huntsville, AL","se",""],

 ["U","Little Rock downtown street pianos","Capitol & Main · River Market","Little Rock · AR","street","u",2017,34.747694,-92.266128,["In April 2017, painted pianos donated by Piano Kraft and decorated with three downtown schools appeared in downtown Little Rock, at Capitol Avenue and Main Street, at the River Market and near the 200 block of Main Street, as a midday play break for passersby. This is known only from search snippets of a city release and a 2017 newspaper story, and no later news was found, so it is not confirmed that any pianos remain.","En abril de 2017 aparecieron en el centro de Little Rock pianos pintados, donados por Piano Kraft y decorados con tres escuelas del centro, en Capitol Avenue con Main Street, en el River Market y cerca de la cuadra 200 de Main Street, como una pausa musical para los transeúntes. Solo se conoce por fragmentos de búsqueda de un comunicado de la ciudad y de una noticia de 2017, y no se encontraron noticias posteriores, así que no se ha confirmado que quede algún piano.","2017년 4월 Little Rock 시내 Capitol Avenue와 Main Street 교차로, River Market, Main Street 200번지 근처에 그림을 입힌 피아노가 놓였습니다. Piano Kraft가 기증하고 시내 학교 3곳이 꾸민 것으로, 지나가는 사람이 한낮에 쉬며 치라는 뜻이었습니다. 시 보도자료와 2017년 신문 기사의 검색 요약으로만 알려졌고 이후 소식이 없어, 지금 남아 있는지는 확인되지 않았습니다."],null,"","Little Rock downtown street pianos, Little Rock, AR","se",""],

 ["U","Monroe Carell Jr. Children's Hospital chapel","2nd-floor chapel · baby grand","Nashville · TN","hospital","g",2023,36.139368,-86.802276,["A May 2023 VUMC News story described a teen patient playing the baby grand in the second-floor chapel of Monroe Carell Jr. Children's Hospital at Vanderbilt in Nashville, noting that adult visitors are the ones who typically play it. No formal policy was stated, and this is a single source, so it is not confirmed that the piano is still there and open to play.","Un reportaje de VUMC News de mayo de 2023 describía a un paciente adolescente tocando el piano de media cola de la capilla del segundo piso del Monroe Carell Jr. Children's Hospital at Vanderbilt, en Nashville, y señalaba que normalmente lo tocan visitantes adultos. No se indicaba ninguna norma formal y es una sola fuente, así que no se ha confirmado que el piano siga allí y se pueda tocar.","2023년 5월 VUMC News 보도는 Nashville의 Monroe Carell Jr. Children's Hospital at Vanderbilt 2층 예배실에 있는 베이비 그랜드 피아노를 십대 환자가 친 이야기를 전하며, 보통은 성인 방문객이 친다고 적었습니다. 정해진 규칙은 나와 있지 않고 자료도 하나뿐이라 지금도 있는지, 칠 수 있는지는 확인되지 않았습니다."],null,"","Monroe Carell Jr. Children's Hospital chapel, Nashville, TN","se",""],
 ["U","Owensboro Health Regional Hospital","Lobby","Owensboro · KY","hospital","g",2022,37.77885,-87.06331,["Unverified. A permanent baby grand player piano was placed in the hospital lobby as part of an arts-in-healing effort. Whether visitors may play it is not stated. Based on a single 2022 item, so ask staff.","Sin verificar. Se colocó de forma permanente un piano de media cola automático en el vestíbulo del hospital, como parte de una iniciativa de arte y sanación. No se indica si los visitantes pueden tocarlo. Se basa en una sola nota de 2022; pregunte al personal.","미확인 정보입니다. 치유를 위한 예술 활동의 하나로 병원 로비에 자동 연주 기능이 있는 베이비 그랜드 피아노가 상설로 놓였습니다. 방문객이 칠 수 있는지는 나와 있지 않습니다. 2022년 자료 한 건에 근거한 정보이니 직원에게 문의하시기 바랍니다."],null,"","Owensboro Health Regional Hospital, Owensboro, KY","se",""],
 ["U","Sentara Virginia Beach hospital piano","Hospital public area · reported by a resident","Virginia Beach · VA","hospital","",2024,36.8649846,-76.0260852,["An online forum post from around 2024 says there is a piano at Sentara in Virginia Beach and that the writer has seen random people play it. The post does not name the hospital campus or where the piano stands; the map pin assumes Sentara Virginia Beach General Hospital. This rests on one short comment, so it is not confirmed that the piano is there now or that visitors may play it.","Una publicación en un foro en línea de alrededor de 2024 dice que hay un piano en Sentara, en Virginia Beach, y que su autor ha visto a gente cualquiera tocarlo. No se indica qué campus del hospital ni dónde está el piano; el marcador del mapa supone que es el Sentara Virginia Beach General Hospital. Se basa en un solo comentario breve, así que no se ha confirmado que el piano siga allí ni que los visitantes puedan tocarlo.","2024년쯤의 온라인 게시판 글에 Virginia Beach의 Sentara에 피아노가 있고 아무나 와서 치는 것을 봤다는 말이 있습니다. 어느 병원 건물인지, 피아노가 어디 있는지는 나와 있지 않아 지도 위치는 Sentara Virginia Beach General Hospital로 가정했습니다. 짧은 글 하나가 근거라 지금도 있는지, 방문객이 쳐도 되는지는 확인되지 않았습니다."],null,"","Sentara Virginia Beach hospital piano, Virginia Beach, VA","se",""],
 ["U","Sewell Mill Library and Cultural Center","Play Me Again piano 'Vincent' · gallery","Marietta · GA","library","u",2019,33.950004,-84.492041,["Play Me Again Pianos unveiled 'Vincent', a painted piano with a Starry Night theme, on January 9, 2019, in the Carol and Jim Ney Gallery near the entrance of Sewell Mill Library and Cultural Center in Marietta, and invited the public to play. It is not confirmed that this is still the case.","Play Me Again Pianos presentó el 9 de enero de 2019 'Vincent', un piano pintado con el tema de La noche estrellada, en la Carol and Jim Ney Gallery, junto a la entrada del Sewell Mill Library and Cultural Center de Marietta, e invitó al público a tocarlo. No se ha confirmado que siga siendo así.","Play Me Again Pianos는 2019년 1월 9일 Marietta의 Sewell Mill Library and Cultural Center 입구 근처 Carol and Jim Ney Gallery에 '별이 빛나는 밤' 주제로 칠한 피아노 'Vincent'를 공개하고 누구나 치도록 했습니다. 지금도 그런지는 확인되지 않았습니다."],null,"","Sewell Mill Library and Cultural Center, Marietta, GA","se",""],
 ["U","Swamp Rabbit Cafe & Grocery","Please Play Me piano 'Howard'","Greenville · SC","other","u",2024,34.869825,-82.421998,["'Howard', the first piano placed by Greenville's Please Play Me Pianos and painted by muralist Crosby Jack, was reported in 2024 to be at Swamp Rabbit Cafe & Grocery (205 Cedar Lane Road), where anyone can play it for free. The program's site (2026) says 12 pianos are now around town, but its map could not be read as text, so it is not confirmed that Howard is still at the cafe.","'Howard', el primer piano que colocó Please Play Me Pianos en Greenville, pintado por el muralista Crosby Jack, estaba en 2024 en Swamp Rabbit Cafe & Grocery (205 Cedar Lane Road), donde cualquiera puede tocarlo gratis. El sitio del programa (2026) dice que hay 12 pianos en la ciudad, pero su mapa no se pudo leer como texto, así que no se ha confirmado que Howard siga en la cafetería.","Greenville의 Please Play Me Pianos가 처음 놓은 피아노 'Howard'는 벽화 작가 Crosby Jack이 그림을 입힌 것으로, 2024년 보도에 Swamp Rabbit Cafe & Grocery(205 Cedar Lane Road)에 있으며 누구나 무료로 칠 수 있다고 나왔습니다. 2026년 단체 누리집은 지금 시내에 피아노 12대가 있다고 하지만 지도를 글로 읽지 못해, Howard가 아직 카페에 있는지는 확인되지 않았습니다."],null,"","Swamp Rabbit Cafe & Grocery, Greenville, SC","se",""],
 ["U","Vinyl Music Hall","UWF Public Piano Project · Palafox Street, outside the hall","Pensacola · FL","street","u",2013,30.412678,-87.215245,["A painted piano was placed on Palafox Street just south of Garden Street, outside Vinyl Music Hall in Pensacola, as part of the UWF Public Piano Project of the University of West Florida and the City of Pensacola. It was painted by UWF student Josh Green and was open to anyone passing by at its December 2013 launch. Last documented in 2013; no later record has been found, so it is likely gone and not confirmed as still in place.","Se colocó un piano pintado en Palafox Street, justo al sur de Garden Street, frente a Vinyl Music Hall, en Pensacola, dentro del UWF Public Piano Project de la University of West Florida y la ciudad de Pensacola. Lo pintó Josh Green, estudiante de la UWF, y en su lanzamiento en diciembre de 2013 cualquiera que pasara podía tocarlo. Documentado por última vez en 2013; no se ha encontrado ningún registro posterior, por lo que probablemente ya no esté y no se ha confirmado que siga en su lugar.","Pensacola의 Palafox Street, Garden Street 바로 남쪽 Vinyl Music Hall 앞에 University of West Florida와 Pensacola 시가 함께한 UWF Public Piano Project의 페인팅 피아노가 놓였습니다. UWF 학생 Josh Green이 그림을 그렸고, 2013년 12월 설치 당시 지나가는 누구나 칠 수 있었습니다. 마지막 기록은 2013년이고 이후 기록이 없어 철거되었을 가능성이 높으며, 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","Vinyl Music Hall, Pensacola, FL","se",""],
 ["U","Woodruff Arts Center","Play Me Again Pianos · 'Carly' / 'Liam'","Atlanta · GA","culture","u",2026,33.78938,-84.38466,["Two early Play Me Again Pianos, 'Carly' and 'Liam', were placed at Woodruff Arts Center in Atlanta. Unverified: the program's 2026 gallery says it is fundraising to replace 'Carly', so the pianos may be worn out or already removed. Confirm before making a trip.","Dos de los primeros Play Me Again Pianos, 'Carly' y 'Liam', se instalaron en Woodruff Arts Center, en Atlanta. Sin verificar: la galería 2026 del programa indica que se recaudan fondos para reemplazar a 'Carly', por lo que los pianos podrían estar deteriorados o ya retirados. Confirma antes de ir.","Atlanta의 Woodruff Arts Center는 Play Me Again Pianos의 초기 피아노 두 대('Carly', 'Liam')가 설치되었던 곳입니다. 현재 상태는 확인되지 않았습니다. 2026년 프로그램 갤러리에 'Carly' 교체를 위한 모금 중이라고 나와 있어, 피아노가 낡았거나 이미 철거되었을 수 있습니다. 방문 전에 확인하시기 바랍니다."],null,"","Woodruff Arts Center, Atlanta, GA","se",""],
 ["U","611 Woodward street piano","Bedrock painted piano · downtown Detroit","Detroit · MI","street","u",null,42.33043,-83.046669,["An undated Metro Times article, apparently from the mid-2010s, said Bedrock had placed six artist-painted upright street pianos around downtown Detroit for passers-by, including one at 611 Woodward Ave. Other sites named were Campus Martius, One Detroit Center and Monroe Street. The full article could not be opened and no recent source was found, so it is not confirmed that this piano is still there.","Un artículo sin fecha de Metro Times, al parecer de mediados de la década de 2010, decía que Bedrock había colocado seis pianos verticales callejeros pintados por artistas en el centro de Detroit para los transeúntes, uno de ellos en 611 Woodward Ave. Otros lugares mencionados eran Campus Martius, One Detroit Center y Monroe Street. No se pudo abrir el artículo completo ni se encontraron fuentes recientes, así que no se ha confirmado que este piano siga allí.","날짜가 없는 Metro Times 기사(2010년대 중반 것으로 보임)는 Bedrock이 Detroit 시내에 작가들이 그림을 입힌 업라이트 거리 피아노 6대를 지나가는 사람들을 위해 두었고, 그중 한 대가 611 Woodward Ave에 있다고 전했습니다. 다른 곳으로는 Campus Martius, One Detroit Center, Monroe Street가 나옵니다. 전체 기사는 열리지 않았고 최근 소식도 없어 지금도 있는지는 확인되지 않았습니다."],null,"","611 Woodward street piano, Detroit, MI","mw",""],
 ["U","C.S. Mott Children's Hospital","Lobby","Ann Arbor · MI","hospital","g",2022,42.28189,-83.72717,["Unverified. A baby grand in the lobby is played by a music therapist at lunchtime. Whether visitors may play it is not stated. Based on a single source from around 2022.","Sin verificar. Un musicoterapeuta toca a la hora del almuerzo un piano de media cola ubicado en el vestíbulo. No se indica si los visitantes pueden tocarlo. Se basa en una sola fuente de alrededor de 2022.","미확인 정보입니다. 로비에 있는 베이비 그랜드 피아노를 음악 치료사가 점심시간에 연주합니다. 방문객이 칠 수 있는지는 나와 있지 않습니다. 2022년 무렵의 자료 한 건에 근거한 정보입니다."],null,"","C.S. Mott Children's Hospital, Ann Arbor, MI","mw",""],

 ["U","Kress Family Branch, Brown County Library","Branch piano · ask at the desk","De Pere · WI","library","",2017,44.452035,-88.061148,["A 2017 blog post about library visits says the Kress Family Branch of Brown County Library in De Pere has a piano and that visitors could ask at the desk to play it. It is not confirmed that this is still the case.","Una entrada de blog de 2017 sobre visitas a bibliotecas dice que la sucursal Kress Family de la Brown County Library, en De Pere, tiene un piano y que los visitantes podían pedir en el mostrador para tocarlo. No se ha confirmado que siga siendo así.","도서관 방문기를 쓴 2017년 블로그 글에 따르면 De Pere의 Brown County Library Kress Family 분관에 피아노가 있고, 데스크에 부탁하면 칠 수 있었습니다. 지금도 그런지는 확인되지 않았습니다."],null,"","Kress Family Branch, Brown County Library, De Pere, WI","mw",""],
 ["U","Minneapolis-Saint Paul Int'l Airport","Terminal 2, near Gate H12","Minneapolis · MN","airport","g",2025,44.88506,-93.21444,["The airport foundation's performing-arts proposal page, from around 2025, says its program keeps a Kawai baby grand near Gate H12 in Terminal 2 (Humphrey). It is a program piano for performers, and the page does not say travelers may play it. It has not been confirmed whether it is still there or open to the public.","La página de convocatoria de artes escénicas de la fundación del aeropuerto, de alrededor de 2025, indica que su programa tiene un piano de media cola Kawai cerca de la puerta H12 de la Terminal 2 (Humphrey). Es un piano del programa para intérpretes, y la página no dice que los viajeros puedan tocarlo. No se ha confirmado si sigue allí ni si está abierto al público.","공항 재단의 공연 예술 공모 페이지(2025년 무렵)에 따르면, 재단 프로그램이 Terminal 2(Humphrey) Gate H12 근처에 Kawai 베이비그랜드 피아노를 두고 있습니다. 공연자용 프로그램 피아노이며, 여행객이 칠 수 있다는 안내는 없습니다. 지금도 있는지, 일반에 열려 있는지는 확인되지 않았습니다."],null,"","Minneapolis-Saint Paul Int'l Airport, Minneapolis, MN","mw",""],
 ["U","Monroe Street street piano","Bedrock painted piano · downtown Detroit","Detroit · MI","street","u",null,42.334662,-83.043139,["An undated Metro Times article, apparently from the mid-2010s, said Bedrock had placed six artist-painted upright street pianos around downtown Detroit for passers-by, including one on Monroe Street. Other sites named were 611 Woodward, Campus Martius and One Detroit Center. The exact spot on Monroe Street is not given, and with no recent source found, it is not confirmed that this piano is still there.","Un artículo sin fecha de Metro Times, al parecer de mediados de la década de 2010, decía que Bedrock había colocado seis pianos verticales callejeros pintados por artistas en el centro de Detroit para los transeúntes, uno de ellos en Monroe Street. Otros lugares mencionados eran 611 Woodward, Campus Martius y One Detroit Center. No se indica el punto exacto de Monroe Street y, sin fuentes recientes, no se ha confirmado que este piano siga allí.","날짜가 없는 Metro Times 기사(2010년대 중반 것으로 보임)는 Bedrock이 Detroit 시내에 작가들이 그림을 입힌 업라이트 거리 피아노 6대를 지나가는 사람들을 위해 두었고, 그중 한 대가 Monroe Street에 있다고 전했습니다. 다른 곳으로는 611 Woodward, Campus Martius, One Detroit Center가 나옵니다. Monroe Street의 정확한 자리는 나와 있지 않고 최근 소식도 없어 지금도 있는지는 확인되지 않았습니다."],null,"","Monroe Street street piano, Detroit, MI","mw",""],
 ["U","Ohio Union, Ohio State University","2nd-floor grand piano by the stairwell","Columbus · OH","university","g",2018,39.997664,-83.008547,["A 2018 article in The Lantern mentioned a grand piano by a stairwell on the second floor of the Ohio Union at Ohio State being played in a public space, and another Lantern piece described a regular who played jazz there most afternoons. No rule on who may play was stated. No newer source was found, so it is not confirmed that the piano is still there.","Un artículo de The Lantern de 2018 mencionaba un piano de cola junto a una escalera en el segundo piso del Ohio Union de Ohio State, tocado en un espacio público, y otro artículo de The Lantern describía a un habitual que tocaba jazz allí casi todas las tardes. No se indicaba ninguna norma sobre quién puede tocarlo. No se encontraron fuentes más recientes, así que no se ha confirmado que siga allí.","2018년 The Lantern 기사는 Ohio State의 Ohio Union 2층 계단 옆 그랜드 피아노가 공공 공간에서 연주된다고 전했고, 다른 The Lantern 기사는 거의 매일 오후 그곳에서 재즈를 치는 단골을 소개했습니다. 누가 쳐도 되는지에 대한 규칙은 나와 있지 않습니다. 그 뒤 소식은 찾지 못해 지금도 있는지는 확인되지 않았습니다."],null,"","Ohio Union, Ohio State University, Columbus, OH","mw",""],
 ["U","One Detroit Center street piano","Bedrock painted piano · downtown Detroit","Detroit · MI","street","u",null,42.330064,-83.044935,["An undated Metro Times article, apparently from the mid-2010s, said Bedrock had placed six artist-painted upright street pianos around downtown Detroit for passers-by, including one at One Detroit Center. Other sites named were 611 Woodward, Campus Martius and Monroe Street. The full article could not be opened and no recent source was found, so it is not confirmed that this piano is still there; the map pin is at the building's presumed address on Woodward Ave.","Un artículo sin fecha de Metro Times, al parecer de mediados de la década de 2010, decía que Bedrock había colocado seis pianos verticales callejeros pintados por artistas en el centro de Detroit para los transeúntes, uno de ellos en One Detroit Center. Otros lugares mencionados eran 611 Woodward, Campus Martius y Monroe Street. No se pudo abrir el artículo completo ni se encontraron fuentes recientes, así que no se ha confirmado que este piano siga allí; el marcador del mapa está en la dirección supuesta del edificio en Woodward Ave.","날짜가 없는 Metro Times 기사(2010년대 중반 것으로 보임)는 Bedrock이 Detroit 시내에 작가들이 그림을 입힌 업라이트 거리 피아노 6대를 지나가는 사람들을 위해 두었고, 그중 한 대가 One Detroit Center에 있다고 전했습니다. 다른 곳으로는 611 Woodward, Campus Martius, Monroe Street가 나옵니다. 전체 기사는 열리지 않았고 최근 소식도 없어 지금도 있는지는 확인되지 않았습니다. 지도 위치는 Woodward Ave에 있는 건물의 추정 주소입니다."],null,"","One Detroit Center street piano, Detroit, MI","mw",""],
 ["U","Pedestrian tunnel under US-31","Downtown Petoskey to Bayfront Park","Petoskey · MI","street","u",2023,45.376329,-84.958182,["A piano appeared anonymously in late April 2023 in the pedestrian tunnel under US-31 that links downtown Petoskey with Bayfront Park. Anyone walking through could play it, and the city let it stay pending a public art committee. An October 2024 report refers to it in the past tense, so it may have been removed. Not confirmed as still in place.","A finales de abril de 2023 apareció de forma anónima un piano en el túnel peatonal bajo la US-31 que une el centro de Petoskey con Bayfront Park. Cualquiera que cruzara el túnel podía tocarlo, y la ciudad permitió que se quedara a la espera de un comité de arte público. Una nota de octubre de 2024 se refiere a él en pasado, por lo que es posible que lo hayan retirado. No se ha confirmado que siga en el lugar.","Petoskey 시내와 Bayfront Park를 잇는 US-31 아래 보행자 터널에 2023년 4월 말 누군가 익명으로 피아노를 가져다 놓았습니다. 터널을 지나는 누구나 칠 수 있었고, 시는 공공미술 위원회 구성을 기다리며 그대로 두기로 했습니다. 2024년 10월 보도는 이 피아노를 과거형으로 언급하고 있어 철거되었을 수 있습니다. 지금도 있는지는 확인되지 않았습니다."],null,"","Pedestrian tunnel under US-31, Petoskey, MI","mw",""],
 ["U","Piqua Center","Food court · 1890s Packard upright","Piqua · OH","mall","u",null,40.147925,-84.223275,["A mid-1890s Packard upright stands in the food court of Piqua Center (formerly Miami Valley Centre Mall) in Piqua. It is one of two antique uprights that local antique dealer Artie Parker donated to stay at the mall indefinitely, and it is described as open to the public during regular mall hours. The source article's date is not known; it appears to date from before or around the mall's March 2023 sale and renaming, and it is not confirmed whether the piano is still there.","Un piano vertical Packard de mediados de la década de 1890 se encuentra en el patio de comidas de Piqua Center (antes Miami Valley Centre Mall), en Piqua. Es uno de los dos pianos verticales antiguos que el anticuario local Artie Parker donó para que permanecieran en el centro comercial de forma indefinida, y se indica que el público puede tocarlo en el horario habitual del centro comercial. No se conoce la fecha del artículo de origen; parece ser anterior o cercano a la venta y el cambio de nombre del centro comercial en marzo de 2023, y no se ha confirmado que el piano siga allí.","Piqua의 Piqua Center(옛 Miami Valley Centre Mall) 푸드코트에 1890년대 중반 Packard 업라이트 피아노가 있습니다. 지역 골동품상 Artie Parker가 몰에 기한 없이 두도록 기증한 오래된 업라이트 2대 가운데 하나이며, 몰 영업시간에 누구나 칠 수 있다고 소개됐습니다. 근거 기사의 날짜는 알 수 없고 2023년 3월 몰 매각·이름 변경 전후의 글로 보이며, 지금도 있는지는 확인되지 않았습니다."],null,"","Piqua Center, Piqua, OH","mw",""],
 ["U","Piqua Center","Near the Buckle · 1890s upright","Piqua · OH","mall","u",null,40.147925,-84.223275,["A mid-1890s upright stands near the Buckle store in Piqua Center (formerly Miami Valley Centre Mall) in Piqua. It is the second of two antique uprights donated by local antique dealer Artie Parker; the other is in the food court. It is described as open to the public during regular mall hours. The source article's date is not known, the Buckle store may have closed since, and it is not confirmed whether the piano is still there.","Un piano vertical de mediados de la década de 1890 se encuentra cerca de la tienda Buckle en Piqua Center (antes Miami Valley Centre Mall), en Piqua. Es el segundo de los dos pianos verticales antiguos donados por el anticuario local Artie Parker; el otro está en el patio de comidas. Se indica que el público puede tocarlo en el horario habitual del centro comercial. No se conoce la fecha del artículo de origen, es posible que la tienda Buckle ya haya cerrado y no se ha confirmado que el piano siga allí.","Piqua의 Piqua Center(옛 Miami Valley Centre Mall) 안 Buckle 매장 근처에 1890년대 중반 업라이트 피아노가 있습니다. 지역 골동품상 Artie Parker가 기증한 오래된 업라이트 2대 가운데 나머지 한 대이며, 다른 한 대는 푸드코트에 있습니다. 몰 영업시간에 누구나 칠 수 있다고 소개됐습니다. 근거 기사의 날짜는 알 수 없고 그 뒤 Buckle 매장이 문을 닫았을 수도 있으며, 지금도 있는지는 확인되지 않았습니다."],null,"","Piqua Center, Piqua, OH","mw",""],
 ["U","Purdue University","Outside WALC & Memorial Union · FreePlay Pianos","West Lafayette · IN","university","",2021,40.42371,-86.92119,["Unverified. In 2021 three FreePlay Pianos stood outdoors: in front of the Wilmeth Active Learning Center (WALC), on Third Street, and next to Purdue Memorial Union, all available to the public. Nothing since November 2021 confirms they are still there.","Sin verificar. En 2021 había tres FreePlay Pianos al aire libre: frente al Wilmeth Active Learning Center (WALC), en Third Street y junto al Purdue Memorial Union, todos disponibles para el público. Nada posterior a noviembre de 2021 confirma que sigan allí.","미확인 정보입니다. 2021년에 FreePlay Pianos 3대가 야외, 즉 Wilmeth Active Learning Center(WALC) 앞, Third Street, Purdue Memorial Union 옆에 놓여 누구나 칠 수 있었습니다. 2021년 11월 이후로 아직 있는지 확인해 주는 자료는 없습니다."],null,"","Purdue University, West Lafayette, IN","mw",""],
 ["U","Ripon Public Library","Digital piano","Ripon · WI","library","d",null,43.847378,-88.839225,["A library newsletter item mentions that Ripon Public Library introduced a new digital piano for patrons. Where it stands, who may use it and when were not found, and the item is undated. It is not confirmed that this is still the case.","Una nota de un boletín bibliotecario menciona que la Biblioteca Pública de Ripon presentó un nuevo piano digital para sus usuarios. No se encontró dónde está, quién puede usarlo ni cuándo, y la nota no tiene fecha. No se ha confirmado que siga siendo así.","도서관 소식지 한 줄에 Ripon 공공도서관이 이용자용 디지털 피아노를 새로 들였다는 내용이 있습니다. 어디에 있는지, 누가 언제 칠 수 있는지는 찾지 못했고 날짜도 없습니다. 지금도 그런지는 확인되지 않았습니다."],null,"","Ripon Public Library, Ripon, WI","mw",""],
 ["U","Six Corners sidewalk piano","N Milwaukee Ave · Six Corners, Chicago","Chicago · IL","street","u",2017,41.9539776,-87.7487131,["A Nadig Newspapers article, apparently from 2017, reported that the Six Corners Association put an upright sidewalk piano for passers-by on the 4000 block of N Milwaukee Ave (near 4032) in Chicago; it was donated by Topher Allan Music and installed for the June BBQ Fest. The keys were to be covered and locked every night at 10 pm. This is a single old source, so it is not confirmed that the piano is still there.","Un artículo de Nadig Newspapers, al parecer de 2017, informó que la Six Corners Association colocó un piano vertical en la acera para los transeúntes en la cuadra 4000 de N Milwaukee Ave (cerca del 4032), en Chicago; lo donó Topher Allan Music y se instaló para el BBQ Fest de junio. Las teclas se cubrían y se cerraban con llave cada noche a las 22:00. Es una sola fuente antigua, así que no se ha confirmado que siga allí.","2017년 것으로 보이는 Nadig Newspapers 기사에 따르면 Six Corners Association이 Chicago N Milwaukee Ave 4000번지 블록(4032번지 근처) 인도에 지나가는 사람들이 칠 수 있는 업라이트 피아노를 두었습니다. Topher Allan Music이 기증했고 6월 BBQ Fest에 맞춰 놓였습니다. 건반은 매일 밤 10시에 덮개를 씌우고 잠갔습니다. 오래된 기사 하나가 근거라 지금도 있는지는 확인되지 않았습니다."],null,"","Six Corners sidewalk piano, Chicago, IL","mw",""],
 ["U","The Lord's Diner, downtown Wichita","Free-meal diner · open piano","Wichita · KS","other","",2015,37.693814,-97.335503,["A 2015 KMUW story said the piano at The Lord's Diner, the free-meal diner in downtown Wichita, was open for anyone to play, and told of a patron who taught himself to play there. This is a single source from 2015, so it is not confirmed that the piano is still there. The map pin is at the diner's presumed address.","Un reportaje de KMUW de 2015 decía que el piano de The Lord's Diner, el comedor de comidas gratuitas del centro de Wichita, estaba abierto para que cualquiera lo tocara, y contaba la historia de un usuario que aprendió a tocar allí por su cuenta. Es una sola fuente de 2015, así que no se ha confirmado que siga allí. El marcador del mapa está en la dirección supuesta del comedor.","2015년 KMUW 보도는 Wichita 시내의 무료 급식 식당 The Lord's Diner에 누구나 칠 수 있는 피아노가 있고, 그곳에서 혼자 피아노를 익힌 이용자도 있다고 전했습니다. 2015년 자료 하나뿐이라 지금도 있는지는 확인되지 않았습니다. 지도 위치는 식당의 추정 주소입니다."],null,"","The Lord's Diner, downtown Wichita, Wichita, KS","mw",""],
 ["U","UNMC Truhlsen Eye Institute","Lobby piano · patients and families","Omaha · NE","hospital","",2016,41.252792,-95.976113,["A December 2016 UNMC News story announced holiday piano music by students at the Truhlsen Eye Institute on the UNMC campus in Omaha on December 14 and 21, 2016, and quoted Dr. Christensen saying the piano gives patients and families the chance to play and share their talents. This is a single 2016 source, so it is not confirmed that the piano is still there or open to play. The map pin is at the building's presumed address.","Un artículo de UNMC News de diciembre de 2016 anunciaba música navideña de piano a cargo de estudiantes en el Truhlsen Eye Institute, en el campus de UNMC en Omaha, los días 14 y 21 de diciembre de 2016, y citaba al Dr. Christensen diciendo que el piano da a pacientes y familias la oportunidad de tocar y compartir su talento. Es una sola fuente de 2016, así que no se ha confirmado que el piano siga allí ni que se pueda tocar. El marcador del mapa está en la dirección supuesta del edificio.","2016년 12월 UNMC News는 Omaha UNMC 캠퍼스의 Truhlsen Eye Institute에서 12월 14일과 21일에 학생들의 연말 피아노 연주가 열린다고 알리며, 이 피아노가 환자와 가족에게 직접 치고 재능을 나눌 기회를 준다는 Dr. Christensen의 말을 전했습니다. 2016년 자료 하나뿐이라 지금도 있는지, 칠 수 있는지는 확인되지 않았습니다. 지도 위치는 건물의 추정 주소입니다."],null,"","UNMC Truhlsen Eye Institute, Omaha, NE","mw",""],
 ["U","UW-Milwaukee Student Union","Piano outside the Ballroom · campus level","Milwaukee · WI","university","",2015,43.078681,-87.882216,["A 2015 Media Milwaukee article said a piano had been in the UW-Milwaukee Student Union for more than 15 years and had been moved from street level to the campus level, outside the Ballroom, where students played it. No rule on who may play was stated. No source after 2015 was found, so it is not confirmed that it is still there.","Un artículo de Media Milwaukee de 2015 decía que había un piano en el Student Union de UW-Milwaukee desde hacía más de 15 años y que se había trasladado del nivel de la calle al nivel del campus, frente al Ballroom, donde lo tocaban estudiantes. No se indicaba ninguna norma sobre quién puede tocarlo. No se encontraron fuentes posteriores a 2015, así que no se ha confirmado que siga allí.","2015년 Media Milwaukee 기사는 UW-Milwaukee Student Union에 15년 넘게 피아노가 있었고, 거리 층에서 캠퍼스 층 Ballroom 바깥으로 옮겨져 학생들이 친다고 전했습니다. 누가 쳐도 되는지에 대한 규칙은 나와 있지 않습니다. 2015년 이후 소식은 찾지 못해 지금도 있는지는 확인되지 않았습니다."],null,"","UW-Milwaukee Student Union, Milwaukee, WI","mw",""],
 ["U","Wasser Brewing Co.","Greencastle Piano Project · by the Indiana Street closure","Greencastle · IN","street","",null,39.644545,-86.863301,["A piano from the Greencastle Piano Project is described next to Wasser Brewing Co. in Greencastle, in a community gathering space by the Indiana Street closure. It appears to be open to anyone, though play rules are not stated. The report is undated (likely around 2020) and could not be fully verified. Not confirmed as still in place.","Se describe un piano del Greencastle Piano Project junto a Wasser Brewing Co., en Greencastle, en un espacio de encuentro comunitario junto al tramo cerrado de Indiana Street. Al parecer cualquiera puede tocarlo, aunque no se indican normas de uso. La información no tiene fecha (probablemente de alrededor de 2020) y no pudo verificarse por completo. No se ha confirmado que siga en el lugar.","Greencastle의 Wasser Brewing Co. 옆, Indiana Street 차량 통제 구간의 커뮤니티 모임 공간에 Greencastle Piano Project의 피아노가 있다고 소개되었습니다. 누구나 칠 수 있는 것으로 보이나, 이용 규칙은 명시되어 있지 않습니다. 자료의 날짜가 확인되지 않았고(2020년 무렵으로 추정) 내용도 충분히 검증되지 않았습니다. 지금도 있는지는 확인되지 않았습니다."],null,"","Wasser Brewing Co., Greencastle, IN","mw",""],
 ["U","Benderly-Kendall Opera House","Street piano · Santa Cruz Foundation for the Performing Arts","Patagonia · AZ","street","u",null,31.540202,-110.753927,["A weather-resistant street piano sits just off the sidewalk in front of the Benderly-Kendall Opera House in Patagonia, on the highway across from the town gazebo. It was given to the town by the Santa Cruz Foundation for the Performing Arts (Christina and Fred Wilhelm), and anyone may sit and play; summer hours are roughly Thu–Sun 9am–6pm. The ribbon was cut on May 13 of a year the source does not give (2017 or later), and it is not confirmed whether the piano is still there.","Un piano callejero resistente a la intemperie se encuentra junto a la acera, frente a la Benderly-Kendall Opera House de Patagonia, sobre la carretera y enfrente del quiosco del pueblo. Lo donó al pueblo la Santa Cruz Foundation for the Performing Arts (Christina y Fred Wilhelm), y cualquiera puede sentarse a tocarlo; en verano el horario es aproximadamente de jueves a domingo, de 9:00 a 18:00. Se inauguró un 13 de mayo de un año que la fuente no indica (2017 o después), y no se ha confirmado que el piano siga allí.","Patagonia의 Benderly-Kendall Opera House 앞, 마을 정자(gazebo) 맞은편 도로변 인도 바로 옆에 비바람에 견디게 만든 거리 피아노가 있습니다. Santa Cruz Foundation for the Performing Arts(Christina·Fred Wilhelm)가 마을에 기증한 것으로, 누구나 앉아서 칠 수 있으며 여름에는 대략 목~일 9:00~18:00에 운영됩니다. 5월 13일에 개막했다고 하나 연도는 근거에 없으며(2017년 이후), 지금도 있는지는 확인되지 않았습니다."],null,"","Benderly-Kendall Opera House, Patagonia, AZ","mt",""],
 ["U","Bricktown (Reno Ave & Mickey Mantle Dr)","Street piano · Bricktown plaza","Oklahoma City · OK","street","u",2016,35.464273,-97.50918,["An artist-painted street piano was placed on a Bricktown plaza at Reno Ave and Mickey Mantle Dr in Oklahoma City around 2016. It was the project of a local teenager who had earlier placed one in the Plaza District, and anyone passing by could play. Last documented around 2016; no later record has been found, so it is likely gone and not confirmed as still in place.","Hacia 2016 se colocó un piano callejero pintado por un artista en una plaza de Bricktown, en Reno Ave y Mickey Mantle Dr, en Oklahoma City. Fue el proyecto de un adolescente local que antes había colocado otro en el Plaza District, y cualquiera que pasara podía tocarlo. Documentado por última vez hacia 2016; no se ha encontrado ningún registro posterior, por lo que probablemente ya no esté y no se ha confirmado que siga en su lugar.","Oklahoma City Bricktown의 Reno Ave와 Mickey Mantle Dr 교차 지점 광장에 2016년 무렵 아티스트가 그림을 그린 거리 피아노가 놓였습니다. 앞서 Plaza District에도 피아노를 놓았던 지역 10대 청소년의 프로젝트였고, 지나가는 누구나 칠 수 있었습니다. 마지막 기록은 2016년 무렵이고 이후 기록이 없어 철거되었을 가능성이 높으며, 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","Bricktown (Reno Ave & Mickey Mantle Dr), Oklahoma City, OK","mt",""],
 ["U","Downtown Okmulgee square","Community piano · under an awning","Okmulgee · OK","street","u",2018,35.622856,-95.972204,["A donated piano stood under an awning on the downtown square in Okmulgee, where people stopped to play, according to a 2018 local news report. Anyone passing by could use it. Last documented in 2018; no later record has been found, and it is not confirmed as still in place.","Según un reportaje local de 2018, había un piano donado bajo un toldo en la plaza del centro de Okmulgee, donde la gente se detenía a tocar. Cualquiera que pasara podía usarlo. Documentado por última vez en 2018; no se ha encontrado ningún registro posterior y no se ha confirmado que siga en su lugar.","2018년 지역 뉴스에 따르면 Okmulgee 다운타운 광장의 차양 아래에 기증받은 피아노가 놓여 있었고, 사람들이 들러 연주했습니다. 지나가는 누구나 칠 수 있었습니다. 마지막 기록은 2018년이고 이후 기록이 없으며, 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","Downtown Okmulgee square, Okmulgee, OK","mt",""],
 ["U","Historic Downtown Mansfield","Mansfield 88 Piano Project","Mansfield · TX","street","u",2014,32.56364,-97.14177,["Unverified. The Mansfield 88 Piano Project placed six to eight painted uprights outside businesses in historic downtown Mansfield, for example in front of Lone Star Barbershop at 200 N. Main St. The sources date from 2014–2015 and do not spell out playing rules; a later travel post still mentions pianos around town, but nothing recent confirms them.","Sin verificar. El Mansfield 88 Piano Project colocó entre seis y ocho pianos verticales pintados frente a comercios del centro histórico de Mansfield, por ejemplo delante de Lone Star Barbershop (200 N. Main St.). Las fuentes son de 2014–2015 y no detallan reglas de uso; una nota de viaje posterior aún menciona pianos en la ciudad, pero nada reciente lo confirma.","미확인 정보입니다. Mansfield 88 Piano Project가 Mansfield 역사 도심의 상점 앞(예: Lone Star Barbershop, 200 N. Main St. 앞)에 그림이 그려진 업라이트 피아노 6~8대를 두었습니다. 자료는 2014~2015년 것이고 이용 규칙은 나와 있지 않습니다. 이후 여행 글에도 피아노가 언급되지만 최근 확인 자료는 없습니다."],null,"","Historic Downtown Mansfield, Mansfield, TX","mt",""],
 ["U","Reading Leaves Bookstore Corner","Corner of North Cedar & Broadway","Townsend · MT","street","u",2022,46.3209,-111.51728,["Unverified. A painted upright stood outdoors at the corner of North Cedar and Broadway streets, in front of Reading Leaves Bookstore, for anyone to play regardless of skill level. The only evidence is a 2022 news item, so it may no longer be there.","Sin verificar. Un piano vertical pintado estaba al aire libre en la esquina de las calles North Cedar y Broadway, frente a Reading Leaves Bookstore, para que cualquiera tocara sin importar su nivel. La única referencia es una nota de 2022, así que puede que ya no esté.","미확인 정보입니다. 그림이 그려진 업라이트 피아노가 North Cedar 거리와 Broadway 거리 모퉁이, Reading Leaves Bookstore 앞 야외에 놓여 실력과 상관없이 누구나 칠 수 있었습니다. 근거가 2022년 기사 한 건뿐이어서 지금은 없을 수 있습니다."],null,"","Reading Leaves Bookstore Corner, Townsend, MT","mt",""],
 ["U","Rice University student center","Grand piano · student center","Houston · TX","university","g",2008,29.71796,-95.402223,["A 2008 guest commentary in the University of Houston student paper The Daily Cougar noted that a grand piano was accessible to students in Rice University's student center (6100 Main St). The building is assumed to be the Rice Memorial Center, and the source was seen only as a search excerpt. With only that 2008 mention, it is not confirmed that the piano is still there or who may play it today.","Un comentario invitado de 2008 en The Daily Cougar, el periódico estudiantil de la University of Houston, señalaba que en el centro estudiantil de Rice University (6100 Main St) había un piano de cola al alcance de los estudiantes. Se supone que el edificio es el Rice Memorial Center, y la fuente solo se vio como extracto de búsqueda. Con esa única mención de 2008, no se ha confirmado que el piano siga allí ni quién puede tocarlo hoy.","2008년 University of Houston 학생 신문 The Daily Cougar의 기고문은 Rice University 학생센터(6100 Main St)에 학생들이 칠 수 있는 그랜드 피아노가 있다고 언급했습니다. 건물은 Rice Memorial Center로 추정되며, 근거는 검색 결과 발췌로만 확인했습니다. 2008년 언급 하나뿐이라 지금도 피아노가 있는지, 지금 누가 칠 수 있는지는 확인되지 않았습니다."],null,"","Rice University student center, Houston, TX","mt",""],
 ["U","Bruin Walk, UCLA","UCLA Piano Project · campus piano","Los Angeles · CA","university","",2019,34.070958,-118.446404,["The UCLA Piano Project of the Semel Healthy Campus Initiative put pianos around campus for students and passers-by to play, starting with three in 2019 and later four, including one on Bruin Walk. This is based only on short search excerpts, as the original pages could not be read. A 2024 Daily Bruin opinion piece said only two publicly available pianos remained on the Hill, and a 2026 Daily Bruin article said the pianos are tuned once a year. Whether the Bruin Walk piano is still there is not confirmed.","El UCLA Piano Project, de la Semel Healthy Campus Initiative, colocó pianos en el campus para que estudiantes y transeúntes los tocaran: empezó con tres en 2019 y luego llegó a cuatro, uno de ellos en Bruin Walk. Esto se basa solo en breves extractos de búsqueda, ya que no se pudieron leer las páginas originales. Un artículo de opinión del Daily Bruin de 2024 decía que solo quedaban dos pianos de uso público en el Hill, y uno de 2026 indicaba que los pianos se afinan una vez al año. No se ha confirmado que el piano de Bruin Walk siga allí.","Semel Healthy Campus Initiative의 UCLA Piano Project는 학생과 지나가는 사람이 칠 수 있도록 캠퍼스 곳곳에 피아노를 두었습니다. 2019년 3대로 시작해 나중에 Bruin Walk를 포함한 4곳으로 늘었습니다. 원문 페이지는 열리지 않아 검색 결과의 짧은 발췌만 근거로 삼았습니다. 2024년 Daily Bruin 칼럼은 Hill에 공개된 피아노가 2대뿐이라고 했고, 2026년 Daily Bruin 기사는 피아노를 해마다 조율한다고 전했습니다. Bruin Walk 피아노가 지금도 있는지는 확인되지 않았습니다."],null,"","Bruin Walk, UCLA, Los Angeles, CA","ca",""],
 ["U","Community Arts Workshop","Pianos on State · emeritus piano (2025)","Santa Barbara · CA","culture","u",2026,34.42167,-119.69455,["A 2025 'emeritus' piano from Pianos on State is reported to be kept at the Community Arts Workshop; the exact spot is not given. Unverified: a 2026 article lists it, but does not say whether it stays out year-round or can be played. Check on site before making a trip.","Se informa que un piano 'emérito' de la edición 2025 de Pianos on State se conserva en el Community Arts Workshop; no se indica el punto exacto. Sin verificar: un artículo de 2026 lo menciona, pero no aclara si permanece todo el año ni si se puede tocar. Conviene confirmarlo en el lugar antes de ir.","Pianos on State의 2025년 '명예(emeritus)' 피아노가 Community Arts Workshop에 보관되어 있다고 하며, 정확한 위치는 나와 있지 않습니다. 미확인 정보입니다. 2026년 기사에 언급되어 있으나 연중 놓여 있는지, 연주할 수 있는지는 밝혀져 있지 않습니다. 방문 전에 현장에서 확인하시기 바랍니다."],null,"","Community Arts Workshop, Santa Barbara, CA","ca",""],
 ["U","Dimond Park trail piano","Sausal Creek trail · unofficial 'mystery' piano","Oakland · CA","park","u",2023,37.812148,-122.213326,["In summer 2023 a spinet piano appeared unofficially along the Sausal Creek trail in Oakland's Dimond Park, and hikers stopped to play it freely, KTVU reported in August 2023. Nobody officially placed or maintains it, and no later update was found. It is not confirmed that it is still there, and it may well be gone.","En el verano de 2023 apareció de forma no oficial un piano espineta junto al sendero de Sausal Creek, en el Dimond Park de Oakland, y los excursionistas se detenían a tocarlo libremente, según informó KTVU en agosto de 2023. Nadie lo colocó ni lo mantiene oficialmente, y no se encontró ninguna actualización posterior. No se ha confirmado que siga allí, y es muy posible que ya no esté.","2023년 여름 Oakland Dimond Park의 Sausal Creek 산책로 옆에 누군가 비공식으로 둔 소형 업라이트(스피넷) 피아노가 나타났고, 산책하던 사람들이 자유롭게 쳤다고 2023년 8월 KTVU가 보도했습니다. 공식적으로 두거나 관리하는 곳은 없고, 그 뒤 소식도 찾지 못했습니다. 지금도 있는지는 확인되지 않았으며 이미 없어졌을 가능성이 큽니다."],null,"","Dimond Park trail piano, Oakland, CA","ca",""],
 ["U","Funk Zone","Pianos on State · emeritus piano (2023)","Santa Barbara · CA","street","u",2026,34.41499,-119.69023,["A 2023 'emeritus' piano from Pianos on State is reported to be kept in the Funk Zone; the exact spot is not given. Unverified: a 2026 article lists it, but does not say whether it stays out year-round or can be played. Check on site before making a trip.","Se informa que un piano 'emérito' de la edición 2023 de Pianos on State se conserva en el Funk Zone; no se indica el punto exacto. Sin verificar: un artículo de 2026 lo menciona, pero no aclara si permanece todo el año ni si se puede tocar. Conviene confirmarlo en el lugar antes de ir.","Pianos on State의 2023년 '명예(emeritus)' 피아노가 Funk Zone에 보관되어 있다고 하며, 정확한 위치는 나와 있지 않습니다. 미확인 정보입니다. 2026년 기사에 언급되어 있으나 연중 놓여 있는지, 연주할 수 있는지는 밝혀져 있지 않습니다. 방문 전에 현장에서 확인하시기 바랍니다."],null,"","Funk Zone, Santa Barbara, CA","ca",""],
 ["U","Liberty Station, San Diego","Sing for Hope piano 'Here Comes the Sun'","San Diego · CA","other","u",2023,32.738728,-117.2150038,["A Sing for Hope piano called 'Here Comes the Sun' was placed in 2023 in the outdoor corridor at Dewey Rd and Historic Decatur Rd in Liberty Station. A KPBS story from August 2023 said anyone could play it daily from 7 am to 11 pm until it found a permanent home. No later news was found, so it is not confirmed that it is still there, and it may have been moved.","En 2023 se colocó un piano de Sing for Hope llamado 'Here Comes the Sun' en el pasillo exterior de Dewey Rd y Historic Decatur Rd, en Liberty Station. Un reportaje de KPBS de agosto de 2023 indicó que cualquiera podía tocarlo a diario de 7:00 a 23:00 hasta que encontrara un hogar permanente. No se encontraron noticias posteriores, así que no se ha confirmado que siga allí, y es posible que se haya trasladado.","2023년 Liberty Station의 Dewey Rd와 Historic Decatur Rd 사이 야외 통로에 Sing for Hope 피아노 'Here Comes the Sun'이 놓였습니다. 2023년 8월 KPBS 보도는 영구히 둘 곳이 정해질 때까지 매일 오전 7시~오후 11시 누구나 칠 수 있다고 전했습니다. 그 뒤 소식은 찾지 못해 지금도 있는지는 확인되지 않았으며, 다른 곳으로 옮겨졌을 수도 있습니다."],null,"","Liberty Station, San Diego, San Diego, CA","ca",""],
 ["U","Sacramento State University Union","Lobby piano · scheduled student pianist","Sacramento · CA","university","",2023,38.559645,-121.422324,["The University Union at Sacramento State (6000 J Street) has a lobby piano where a graduate piano student performed once or twice a month as a scheduled gig, according to an April 2023 story in the student paper The State Hornet. The story does not say whether anyone else may play, so there is no evidence that visitors can use it. With only that single 2023 source, it is not confirmed that the piano is still there.","La University Union de Sacramento State (6000 J Street) tiene un piano en el vestíbulo donde un estudiante de posgrado de piano tocaba una o dos veces al mes como actuación programada, según un artículo de abril de 2023 del periódico estudiantil The State Hornet. El artículo no dice si otras personas pueden tocarlo, así que no hay pruebas de que los visitantes puedan usarlo. Con esa única fuente de 2023, no se ha confirmado que el piano siga allí.","Sacramento State의 University Union(6000 J Street) 로비에 피아노가 있고, 2023년 4월 학생 신문 The State Hornet 기사에 따르면 피아노 전공 대학원생이 한 달에 한두 번 정해진 공연으로 연주했습니다. 다른 사람도 쳐도 되는지는 기사에 나오지 않아, 방문객이 쳐도 된다는 근거는 없습니다. 근거가 2023년 기사 하나뿐이라 지금도 피아노가 있는지는 확인되지 않았습니다."],null,"","Sacramento State University Union, Sacramento, CA","ca",""],
 ["U","Stanford Hospital","Atrium","Stanford · CA","hospital","",2012,37.43575,-122.1763,["Unverified. A 2012 campus article lists the Stanford Hospital atrium as a place with a piano, without saying who may play it. Nothing newer confirms that the piano is still there.","Sin verificar. Un artículo universitario de 2012 menciona el atrio de Stanford Hospital como un lugar con piano, sin decir quién puede tocarlo. Nada más reciente confirma que el piano siga allí.","미확인 정보입니다. 2012년 캠퍼스 기사에 Stanford Hospital 아트리움이 피아노가 있는 곳으로 올라 있으나, 누가 칠 수 있는지는 나와 있지 않습니다. 피아노가 아직 있는지 확인해 주는 최근 자료는 없습니다."],null,"","Stanford Hospital, Stanford, CA","ca",""],
 ["U","Stanford University","Tresidder Memorial Union, 2nd-floor lobby","Stanford · CA","university","g",2012,37.42766,-122.17006,["Unverified. A 2012 article describes a black baby grand in the second-floor lobby of Tresidder Memorial Union, facing a wall of windows, and says the building has two pianos. Access rules are not stated, and nothing newer confirms it is still there.","Sin verificar. Un artículo de 2012 describe un piano de media cola negro en el vestíbulo del segundo piso del Tresidder Memorial Union, frente a un ventanal, y dice que el edificio tiene dos pianos. No se indican reglas de acceso y nada más reciente confirma que siga allí.","미확인 정보입니다. 2012년 기사에 Tresidder Memorial Union 2층 로비의 유리벽을 마주 보는 자리에 검은색 베이비 그랜드 피아노가 있고 건물에 피아노가 2대 있다고 나옵니다. 이용 규칙은 나와 있지 않으며, 아직 있는지 확인해 주는 최근 자료는 없습니다."],null,"","Stanford University, Stanford, CA","ca",""],
 ["U","Sunshine Brooks Theater","Oceanside Theatre Company","Oceanside · CA","culture","u",null,33.19639,-117.38013,["Unverified. 'Miss Mary', a painted upright, is said to have found a permanent home at the Sunshine Brooks Theater (Oceanside Theatre Company). The only source is an undated blog that does not say whether the public may play it, so ask at the theater.","Sin verificar. Se dice que 'Miss Mary', un piano vertical pintado, tiene su hogar permanente en el Sunshine Brooks Theater (Oceanside Theatre Company). La única fuente es un blog sin fecha que no aclara si el público puede tocarlo; pregunte en el teatro.","미확인 정보입니다. 그림이 그려진 업라이트 피아노 'Miss Mary'가 Sunshine Brooks Theater(Oceanside Theatre Company)에 상설로 자리 잡았다고 합니다. 날짜 없는 블로그 한 건이 유일한 근거이고 일반인이 칠 수 있는지는 나와 있지 않으니 극장에 문의하시기 바랍니다."],null,"","Sunshine Brooks Theater, Oceanside, CA","ca",""],
 ["U","UCLA Luskin Conference Center","Lobby piano · UCLA Piano Project","Los Angeles · CA","university","",2020,34.0640339,-118.4452846,["The UCLA Luskin Conference Center has a piano linked to the UCLA Piano Project; a February 2020 Luskin newsletter said UCLA students performed piano music there for guests in a Student Music Series. This comes only from a search excerpt, and the address used (425 Westwood Plaza) is assumed. There is no evidence that guests may walk up and play, and it is not confirmed that the piano is still there.","El UCLA Luskin Conference Center tiene un piano vinculado al UCLA Piano Project; un boletín de Luskin de febrero de 2020 indicó que estudiantes de UCLA tocaban música de piano para los huéspedes en una Student Music Series. Esto procede solo de un extracto de búsqueda, y la dirección usada (425 Westwood Plaza) es supuesta. No hay pruebas de que los visitantes puedan tocarlo libremente, y no se ha confirmado que el piano siga allí.","UCLA Luskin Conference Center에는 UCLA Piano Project와 연결된 피아노가 있으며, 2020년 2월 Luskin 소식지는 Student Music Series로 UCLA 학생들이 손님을 위해 피아노를 연주했다고 전했습니다. 근거는 검색 결과 발췌뿐이고, 주소(425 Westwood Plaza)는 추정입니다. 손님이 직접 쳐도 된다는 근거는 없으며, 지금도 피아노가 있는지는 확인되지 않았습니다."],null,"","UCLA Luskin Conference Center, Los Angeles, CA","ca",""],
 ["U","UCSF Cole Hall Steinway","Reservable Steinway · UCSF Campus Life Services","San Francisco · CA","university","g",2026,37.7633138,-122.4581925,["A search result described a reservation page for the Steinway in Cole Hall, booked through UCSF Campus Life Services; the page itself could not be opened. Cole Hall is assumed to be on the Parnassus campus (513 Parnassus Ave), and use may be limited to the UCSF community. Who may reserve it, fees and hours are not confirmed, and it is not confirmed that the arrangement still exists.","Un resultado de búsqueda describía una página de reservas del Steinway de Cole Hall, gestionada por UCSF Campus Life Services; la página en sí no se pudo abrir. Se supone que Cole Hall está en el campus de Parnassus (513 Parnassus Ave), y el uso podría estar limitado a la comunidad de UCSF. No se han confirmado quién puede reservarlo, las tarifas ni el horario, ni que el sistema siga vigente.","검색 결과에 UCSF Campus Life Services를 통해 Cole Hall의 Steinway 피아노를 예약하는 페이지가 소개돼 있었지만, 페이지 자체는 열리지 않았습니다. Cole Hall은 Parnassus 캠퍼스(513 Parnassus Ave)에 있는 것으로 추정되며, UCSF 구성원만 쓸 수 있을 가능성이 있습니다. 누가 예약할 수 있는지, 요금과 시간은 확인되지 않았고 지금도 예약이 되는지도 확인되지 않았습니다."],null,"","UCSF Cole Hall Steinway, San Francisco, CA","ca",""],
 ["U","University of San Francisco","University Center, Parina Lounge","San Francisco · CA","university","",2008,37.77656,-122.45072,["Unverified. A 2008 forum post says Parina Lounge in the University Center building has a piano that anyone can play at random times. The information is very old and has not been confirmed since.","Sin verificar. Una publicación de 2008 en un foro dice que el Parina Lounge, en el edificio University Center, tiene un piano que cualquiera puede tocar en horarios variables. La información es muy antigua y no se ha confirmado desde entonces.","미확인 정보입니다. 2008년 게시판 글에 University Center 건물의 Parina Lounge에 누구나 때때로 칠 수 있는 피아노가 있다고 나옵니다. 매우 오래된 정보이며 그 이후 확인되지 않았습니다."],null,"","University of San Francisco, San Francisco, CA","ca",""],
 ["U","Maui Memorial Medical Center","","Wailuku · HI","hospital","",2018,20.88492,-156.48968,["Unverified. The hospital has a self-playing Disklavier that can also be played by hand; where it stands is not stated. A June 2018 report said people in the community had called asking to play it, but whether the public actually may is not confirmed.","Sin verificar. El hospital tiene un Disklavier automático que también se puede tocar a mano; no se indica dónde está. Un informe de junio de 2018 decía que personas de la comunidad habían llamado para pedir tocarlo, pero no está confirmado que el público realmente pueda hacerlo.","미확인 정보입니다. 병원에는 자동 연주도 되고 손으로도 칠 수 있는 Disklavier가 있으며, 위치는 나와 있지 않습니다. 2018년 6월 보도에는 지역 주민들이 치고 싶다고 병원에 전화했다고 나오지만, 실제로 일반인이 칠 수 있는지는 확인되지 않았습니다."],null,"","Maui Memorial Medical Center, Wailuku, HI","pnw",""],
 ["U","Paradise Inn","Mount Rainier National Park · Main lobby","Ashford · WA","hotel","",2026,46.78669,-121.73375,["Unverified. A 1920s piano stands in the main lobby of Paradise Inn in Mount Rainier National Park, and a news headline said it would soon play again. Whether guests may play it is not clearly stated, and the inn is open only seasonally. Based on a travel blog seen in 2026.","Sin verificar. Hay un piano de la década de 1920 en el vestíbulo principal de Paradise Inn, en Mount Rainier National Park, y un titular de prensa decía que pronto volvería a sonar. No está claro si los huéspedes pueden tocarlo, y el hotel solo abre por temporada. Se basa en un blog de viajes consultado en 2026.","미확인 정보입니다. Mount Rainier National Park 안 Paradise Inn의 메인 로비에 1920년대 피아노가 있으며, 곧 다시 소리를 낼 것이라는 기사 제목이 있었습니다. 투숙객이 칠 수 있는지는 분명하지 않고, 숙소는 특정 계절에만 운영합니다. 2026년에 확인한 여행 블로그에 근거한 정보입니다."],null,"","Paradise Inn, Ashford, WA","pnw",""],
 ["U","Richland Public Library","Schimmel grand · room reservation","Richland · WA","library","g",null,46.279966,-119.279156,["An old, undated page from a local music teachers' chapter describes a 5'9\" Schimmel grand at Richland Public Library, donated by Betty Teel, as available for public use and booked through the library's room reservations; recitals were held there twice a year. It is not confirmed that this is still the case.","Una página antigua y sin fecha de una asociación local de profesores de música describe un piano de cola Schimmel de 5'9\" en la Biblioteca Pública de Richland, donado por Betty Teel, como disponible para uso público y reservable mediante las reservas de salas; allí se hacían recitales dos veces al año. No se ha confirmado que siga siendo así.","지역 음악교사 모임의 오래된 페이지(날짜 없음)는 Betty Teel이 기증한 5피트 9인치 Schimmel 그랜드가 Richland 공공도서관에 있고, 도서관 공간 예약으로 일반인도 쓸 수 있으며 1년에 두 번 발표회가 열린다고 적었습니다. 지금도 그런지는 확인되지 않았습니다."],null,"","Richland Public Library, Richland, WA","pnw",""],
 ["U","Seattle Center","","Seattle · WA","culture","",2026,47.6206,-122.35051,["Unverified. A crowdsourced directory lists a public piano available to play at Seattle Center, on 4th Avenue North, but does not name the building. The listing was updated in August 2026 and has not been confirmed by an official source.","Sin verificar. Un directorio colaborativo indica que hay un piano público disponible para tocar en Seattle Center, sobre 4th Avenue North, pero no dice en qué edificio. La ficha se actualizó en agosto de 2026 y no ha sido confirmada por una fuente oficial.","미확인 정보입니다. 이용자 참여형 목록에 Seattle Center(4th Avenue North)에 누구나 칠 수 있는 공공 피아노가 있다고 올라 있으나, 어느 건물인지는 나와 있지 않습니다. 2026년 8월에 갱신된 정보이며 공식 출처로는 확인되지 않았습니다."],null,"","Seattle Center, Seattle, WA","pnw",""],
 ["U","Carteret Borough Parks","Pianos in the Park","Carteret · NJ","park","u",null,40.58643,-74.22618,["Unverified. The Borough of Carteret's Pianos in the Park program sets upright pianos out in borough parks, rotating them between parks and storing them indoors over winter. Which parks is not known, the program page is undated, and the current status is unknown.","Sin verificar. El programa Pianos in the Park del municipio de Carteret coloca pianos verticales en los parques locales, los rota de un parque a otro y los guarda bajo techo en invierno. No se sabe en qué parques están, la página del programa no tiene fecha y se desconoce su situación actual.","미확인 정보입니다. Carteret 자치구의 Pianos in the Park 프로그램은 업라이트 피아노를 자치구 공원에 내놓고 공원을 바꿔 가며 설치하며, 겨울에는 실내에 보관합니다. 어느 공원인지 알 수 없고 프로그램 페이지에 날짜가 없으며 현재 운영 여부도 확인되지 않았습니다."],null,"","Carteret Borough Parks, Carteret, NJ","ne","Spring–Fall (months not stated)"],
 ["U","Downtown Brunswick street pianos","Artist-painted outdoor pianos","Brunswick · ME","street","u",2017,43.91157,-69.963294,["A September 2017 Maine PBS segment profiled the artists behind painted pianos in downtown Brunswick, described as available to play anytime, around the clock. The organizer, the number of pianos, their exact spots and any later years were not found, so it is not confirmed that they return. The map pin marks Maine Street downtown.","Un reportaje de Maine PBS de septiembre de 2017 presentó a los artistas de los pianos pintados del centro de Brunswick, que se describían como disponibles para tocar a cualquier hora. No se encontraron el organizador, el número de pianos, su ubicación exacta ni años posteriores, así que no se ha confirmado que vuelvan. El marcador del mapa indica Maine Street, en el centro.","2017년 9월 Maine PBS는 Brunswick 시내에 놓인 그림 피아노와 그 작가들을 소개하며, 밤낮없이 언제든 칠 수 있다고 전했습니다. 운영 단체, 대수, 정확한 자리, 이후 연도는 찾지 못해 다시 놓이는지는 확인되지 않았습니다. 지도 위치는 시내 Maine Street입니다."],null,"","Downtown Brunswick street pianos, Brunswick, ME","ne","Summer (months not stated)"],
 ["U","Pianos in the Squares, Portland","Monument, Congress, Longfellow & Bramhall Squares","Portland · ME","street","u",2019,43.657252,-70.258877,["Pianos in the Squares put painted pianos in four downtown Portland squares along Congress Street (Monument, Congress, Longfellow and Bramhall) for anyone to play in daylight through July, with nearby businesses bringing them in at night. It ran in 2018 and 2019; in 2022 the city's 'Piano in the Park' moved a single piano to a different park each week. No edition after 2022 was found, so it is not confirmed that it still happens.","Pianos in the Squares colocó pianos pintados en cuatro plazas del centro de Portland a lo largo de Congress Street (Monument, Congress, Longfellow y Bramhall) para que cualquiera los tocara de día durante julio; los negocios cercanos los guardaban por la noche. Se celebró en 2018 y 2019; en 2022, 'Piano in the Park' de la ciudad llevó un solo piano a un parque distinto cada semana. No se encontraron ediciones posteriores a 2022, así que no se ha confirmado que continúe.","Pianos in the Squares는 Portland 시내 Congress Street를 따라 있는 광장 4곳(Monument·Congress·Longfellow·Bramhall)에 그림을 입힌 피아노를 두고, 7월 한 달 낮 동안 누구나 치게 했습니다. 밤에는 근처 가게가 안으로 들여놓았습니다. 2018년과 2019년에 열렸고, 2022년에는 시의 'Piano in the Park'가 피아노 1대를 매주 다른 공원으로 옮겼습니다. 2022년 이후 소식은 찾지 못해 지금도 열리는지는 확인되지 않았습니다."],null,"","Pianos in the Squares, Portland, Portland, ME","ne","Jul"],
 ["U","Princeton Piano Project","Artist-painted pianos · downtown Princeton","Princeton · NJ","street","u",2022,40.352249,-74.66115,["The Arts Council of Princeton has placed artist-painted upright pianos outdoors downtown in spring, calling it a springtime tradition; sites have included the Arts Council (102 Witherspoon St), Palmer Square and the Princeton Garden Theatre (160 Nassau St). It began in 2022 with about seven pianos tied to April arts events. No 2023–2026 edition was found, so it is not confirmed that it still runs.","El Arts Council of Princeton ha colocado en primavera pianos verticales pintados por artistas en el centro, y lo llama una tradición primaveral; entre los lugares han estado el Arts Council (102 Witherspoon St), Palmer Square y el Princeton Garden Theatre (160 Nassau St). Empezó en 2022 con unos siete pianos ligados a las actividades artísticas de abril. No se encontraron ediciones de 2023 a 2026, así que no se ha confirmado que continúe.","Arts Council of Princeton은 봄마다 작가들이 그림을 입힌 업라이트 피아노를 시내 야외에 두고 이를 봄의 전통이라고 소개합니다. 놓인 곳은 Arts Council(102 Witherspoon St), Palmer Square, Princeton Garden Theatre(160 Nassau St) 등입니다. 2022년 4월 예술 행사와 함께 7대쯤으로 시작했으나 2023~2026년 소식은 찾지 못해 지금도 이어지는지는 확인되지 않았습니다."],null,"","Princeton Piano Project, Princeton, NJ","ne","Apr"],
 ["U","Russo Park","Wooster Piano · Wooster Square","New Haven · CT","park","u",null,41.303326,-72.917911,["The Wooster Piano was reported in Russo Park, in the Wooster Square area of New Haven, and described as the city's first outdoor piano. It is free for anyone to play, apparently in summer; a later report says it returned for a second summer. The reports are undated (around 2017–2019) and could not be fully verified. Not confirmed as still in place.","Se informó del Wooster Piano en Russo Park, en la zona de Wooster Square de New Haven, descrito como el primer piano al aire libre de la ciudad. Es gratuito y cualquiera puede tocarlo, al parecer en verano; una nota posterior indica que volvió un segundo verano. Las notas no tienen fecha (hacia 2017-2019) y no pudieron verificarse por completo. No se ha confirmado que siga en el lugar.","New Haven Wooster Square 지역의 Russo Park에 Wooster Piano가 있다고 소개되었으며, 이 도시의 첫 야외 피아노로 알려졌습니다. 무료이며 누구나 칠 수 있고, 여름철에 운영되는 것으로 보입니다. 이후 기사에 두 번째 여름에도 다시 놓였다고 나오지만, 자료의 날짜가 확인되지 않았고(2017~2019년 무렵) 내용도 충분히 검증되지 않았습니다. 지금도 있는지는 확인되지 않았습니다."],null,"","Russo Park, New Haven, CT","ne","seasonal"],
 ["U","Atlanta-Fulton Central Library","Pianos for Peace painted baby grand · festival display","Atlanta · GA","library","g",2023,33.757745,-84.38846,["During the Pianos for Peace festival, a baby grand hand-painted by Reginald Laurent was displayed at Atlanta-Fulton Central Library through September 21, 2023, and anyone was welcome to play it during regular hours, according to the library's blog; a festival piano was also shown there in 2016. These were temporary displays, and it is not confirmed that one returns each year.","Durante el festival Pianos for Peace, un piano de media cola pintado a mano por Reginald Laurent se exhibió en la Atlanta-Fulton Central Library hasta el 21 de septiembre de 2023, y cualquiera podía tocarlo en horario normal, según el blog de la biblioteca; en 2016 también hubo allí un piano del festival. Fueron exhibiciones temporales y no se ha confirmado que se repitan cada año.","도서관 블로그에 따르면 Pianos for Peace 축제 때 Reginald Laurent가 손으로 칠한 베이비 그랜드가 2023년 9월 21일까지 Atlanta-Fulton Central Library에 전시됐고, 정규 개관 시간에 누구나 칠 수 있었습니다. 2016년에도 축제 피아노가 놓였습니다. 한시 전시였고 해마다 다시 오는지는 확인되지 않았습니다."],null,"","Atlanta-Fulton Central Library, Atlanta, GA","se","Aug–Sep"],
 ["U","Central Avenue Overpass","St. Petersburg Public Piano Project","St. Petersburg · FL","street","u",2021,27.8934,-82.71579,["Unverified. The St. Petersburg Public Piano Project placed an upright under the highway overpass near Central Avenue for the public to play; a replacement piano went in there in 2021. The program was listed as running each year from October to May, and nothing from 2025–2026 confirms it is still there.","Sin verificar. El St. Petersburg Public Piano Project colocó un piano vertical bajo el paso elevado de la autopista, cerca de Central Avenue, para que el público lo tocara; en 2021 se puso allí un piano de reemplazo. El programa figuraba como anual, de octubre a mayo, y nada de 2025–2026 confirma que siga en el lugar.","미확인 정보입니다. St. Petersburg Public Piano Project가 Central Avenue 근처 고속도로 고가 아래에 누구나 칠 수 있는 업라이트 피아노를 두었고, 2021년에 교체용 피아노가 놓였습니다. 프로그램은 매년 10월부터 5월까지 운영하는 것으로 소개되어 있으며, 2025~2026년에 아직 있는지 확인한 자료는 없습니다."],null,"","Central Avenue Overpass, St. Petersburg, FL","se","Oct–May"],
 ["U","Cumberland Park, Nashville","Make Music Nashville · summer park piano","Nashville · TN","park","",null,36.162012,-86.767851,["A NewsChannel5 story invited the community to play a piano that Make Music Nashville placed in Cumberland Park, open to anyone through the end of July. The story's year is not shown and the full page could not be opened, so it is not known which summer this was or whether the piano comes back. It is not confirmed that it is still offered.","Un reportaje de NewsChannel5 invitaba a la comunidad a tocar un piano que Make Music Nashville colocó en Cumberland Park, abierto a cualquiera hasta finales de julio. No se ve el año del reportaje y no se pudo abrir la página completa, así que no se sabe de qué verano se trata ni si el piano vuelve. No se ha confirmado que se siga ofreciendo.","NewsChannel5 보도는 Make Music Nashville이 Cumberland Park에 둔 피아노를 7월 말까지 누구나 와서 쳐 보라고 알렸습니다. 보도 연도가 보이지 않고 전체 페이지도 열리지 않아 어느 해 여름의 일인지, 해마다 다시 놓이는지는 알 수 없습니다. 지금도 운영하는지는 확인되지 않았습니다."],null,"","Cumberland Park, Nashville, Nashville, TN","se","Summer (until end of Jul)"],
 ["U","Market Square","Piano Project of Knoxville · downtown","Knoxville · TN","plaza","u",null,35.96541,-83.9197,["Painted, playable pianos are reported at Market Square and other downtown Knoxville spots for a couple of weeks each spring and fall. They are placed in public spaces for the community to play. Unverified: this rests on brief listings whose dates we could not see, and the current status is not confirmed.","Se informa que hay pianos pintados y aptos para tocar en Market Square y otros puntos del centro de Knoxville durante un par de semanas cada primavera y otoño. Se colocan en espacios públicos para que la comunidad participe. Sin verificar: el dato se basa en listados breves cuyas fechas no pudimos ver, y la situación actual no está confirmada.","Knoxville 도심의 Market Square 등지에 매년 봄과 가을 2주가량 연주 가능한 색칠 피아노가 놓인다고 합니다. 지역 주민 누구나 참여할 수 있도록 공공장소에 설치됩니다. 미확인 정보입니다. 날짜를 확인하지 못한 간략한 자료에 근거한 것이며 현재 운영 여부는 확인되지 않았습니다."],null,"","Market Square, Knoxville, TN","se","spring & fall"],
 ["U","Sharon Forks Library, Forsyth County","Pianos for Peace festival piano","Cumming · GA","library","u",2019,34.118765,-84.15623,["Sharon Forks Library in Cumming displayed a Pianos for Peace festival piano outside its meeting room during the 2018 and 2019 festivals, and any patron could take a turn playing, according to the library's news blog (August 2019). An earlier piano was donated to a school after the festival. It is not confirmed that this is still the case.","La Sharon Forks Library, en Cumming, exhibió un piano del festival Pianos for Peace junto a su sala de reuniones durante los festivales de 2018 y 2019, y cualquier usuario podía tocarlo, según el blog de noticias de la biblioteca (agosto de 2019). Un piano anterior se donó a una escuela al terminar el festival. No se ha confirmado que siga siendo así.","도서관 소식 블로그(2019년 8월)에 따르면 Cumming의 Sharon Forks Library는 2018·2019년 Pianos for Peace 축제 때 회의실 밖에 축제 피아노를 두었고, 이용자 누구나 돌아가며 칠 수 있었습니다. 앞선 피아노는 축제가 끝난 뒤 학교에 기증됐습니다. 지금도 그런지는 확인되지 않았습니다."],null,"","Sharon Forks Library, Forsyth County, Cumming, GA","se","Festival period (months not stated)"],
 ["U","39Rainbow, Kansas City","Pianos on Parade · painted outdoor piano","Kansas City · MO","street","u",2015,39.041989,-94.590486,["A June 2015 post by Lane4 Group described a sponsored Pianos on Parade painted piano outdoors at 39Rainbow (4705 Central Street, Kansas City) for passers-by during the summer. The program, run by Keys 4/4 Kids and the Kansas City Music Teachers Association, ran in the summers of 2014 and 2015. No later edition was found, so it is not confirmed that the piano or the program still exists.","Una publicación de Lane4 Group de junio de 2015 describía un piano pintado patrocinado de Pianos on Parade, al aire libre en 39Rainbow (4705 Central Street, Kansas City), para los transeúntes durante el verano. El programa, de Keys 4/4 Kids y la Kansas City Music Teachers Association, se celebró los veranos de 2014 y 2015. No se encontraron ediciones posteriores, así que no se ha confirmado que el piano o el programa continúen.","2015년 6월 Lane4 Group 글은 Kansas City 39Rainbow(4705 Central Street) 야외에 후원으로 놓인 Pianos on Parade 그림 피아노를 여름 동안 지나가는 사람들이 칠 수 있다고 소개했습니다. Keys 4/4 Kids와 Kansas City Music Teachers Association이 연 이 행사는 2014년과 2015년 여름에 열렸습니다. 그 뒤 소식은 찾지 못해 피아노나 행사가 지금도 있는지는 확인되지 않았습니다."],null,"","39Rainbow, Kansas City, Kansas City, MO","mw","Summer (months not stated)"],
 ["U","Avila University, Goppert Theatre lobby","Pianos on Parade · painted piano (2015)","Kansas City · MO","university","u",2015,38.912329,-94.591563,["In summer 2015 Pianos on Parade, run by Keys 4/4 Kids and the Kansas City Music Teachers Association for the association's centennial, put about 100 painted pianos around Kansas City, and an Avila University Centennial-themed upright was placed in the Goppert Theatre lobby for the public to play. This comes from a search-result snippet of an Avila page and is a single old source. It is not confirmed that the piano is still in the lobby or open to play.","En el verano de 2015, Pianos on Parade, organizado por Keys 4/4 Kids y la Kansas City Music Teachers Association por el centenario de esta, colocó unos 100 pianos pintados en Kansas City, y en el vestíbulo del Goppert Theatre se puso un piano vertical con el tema del centenario de Avila University para que el público lo tocara. Esto procede de un fragmento de resultado de búsqueda de una página de Avila y es una sola fuente antigua. No se ha confirmado que el piano siga en el vestíbulo ni que se pueda tocar.","2015년 여름 Keys 4/4 Kids와 Kansas City Music Teachers Association이 협회 100주년을 맞아 연 Pianos on Parade가 Kansas City 곳곳에 그림을 입힌 피아노 약 100대를 두었고, Avila University의 Goppert Theatre 로비에도 대학 100주년을 주제로 한 업라이트 피아노가 일반인이 칠 수 있게 놓였습니다. Avila 페이지의 검색 결과 요약이 근거이고 오래된 자료 하나뿐입니다. 지금도 로비에 있는지, 칠 수 있는지는 확인되지 않았습니다."],null,"","Avila University, Goppert Theatre lobby, Kansas City, MO","mw","Summer (months not stated)"],
 ["U","Central West End, St. Louis","Make Music Pianos · painted street piano","St. Louis · MO","street","u",2024,38.642455,-90.257983,["Make Music St. Louis placed colorful painted pianos for public use around the St. Louis area, including one in the Central West End, according to a Riverfront Times article from around mid-2024 (only a search summary could be read). Other sites named were the Delmar Loop trolley stops, Strauss Park in Grand Center, the Riverfront by the Arch, the National Blues Museum, Clayton and Ferguson. The months and exact spot are not stated, and it is not confirmed that the piano is still put out each year.","Make Music St. Louis colocó pianos pintados de colores para uso público en la zona de St. Louis, entre ellos uno en el Central West End, según un artículo de Riverfront Times de mediados de 2024 aproximadamente (solo se pudo leer un resumen de búsqueda). Otros lugares mencionados eran las paradas del tranvía del Delmar Loop, Strauss Park en Grand Center, la Riverfront junto al Arch, el National Blues Museum, Clayton y Ferguson. No se indican los meses ni el punto exacto, y no se ha confirmado que el piano se siga colocando cada año.","2024년 중반쯤의 Riverfront Times 기사(검색 요약만 읽음)에 따르면 Make Music St. Louis가 St. Louis 일대에 누구나 칠 수 있는 알록달록한 그림 피아노를 두었고, 그중 한 대가 Central West End에 놓였습니다. 다른 곳으로는 Delmar Loop 트롤리 정류장, Grand Center의 Strauss Park, Arch 옆 강변, National Blues Museum, Clayton, Ferguson이 나옵니다. 운영 달과 정확한 자리는 나와 있지 않고, 해마다 지금도 놓이는지는 확인되지 않았습니다."],null,"","Central West End, St. Louis, St. Louis, MO","mw","Summer (months not stated)"],
 ["U","Courthouse Square","Keys in the City","Charlotte · MI","street","u",2017,42.564482,-84.836572,["A piano from Keys in the City, a project of LEAP, the City of Charlotte and Windwalker Underground Gallery, was placed outdoors at Courthouse Square in Charlotte, Michigan. Anyone can play it; it is covered with a tarp at night and in bad weather. Unveiled in August 2017, with no evidence of later seasons. Not confirmed as still in place.","Un piano de Keys in the City, proyecto de LEAP, la ciudad de Charlotte y Windwalker Underground Gallery, se colocó al aire libre en Courthouse Square, en Charlotte (Michigan). Cualquiera puede tocarlo; se cubre con una lona por la noche y cuando hay mal tiempo. Se inauguró en agosto de 2017 y no hay indicios de temporadas posteriores. No se ha confirmado que siga en el lugar.","Michigan주 Charlotte의 Courthouse Square 야외에 Keys in the City 피아노가 놓였습니다. LEAP, City of Charlotte, Windwalker Underground Gallery가 함께한 프로젝트로, 누구나 칠 수 있으며 밤과 궂은 날씨에는 방수포로 덮어 둡니다. 2017년 8월에 공개되었고 이후 시즌이 이어졌다는 자료는 없습니다. 지금도 있는지는 확인되지 않았습니다."],null,"","Courthouse Square, Charlotte, MI","mw","seasonal"],
 ["U","Delmar Loop trolley stops","Make Music Pianos · about 8 painted pianos","University City · MO","street","u",2024,38.656053,-90.305824,["Make Music St. Louis placed colorful painted pianos for public use around the St. Louis area, including about eight along the Delmar Loop trolley stops in University City, according to a Riverfront Times article from around mid-2024 (only a search summary could be read). Other sites named were Strauss Park in Grand Center, the Riverfront by the Arch, the National Blues Museum, the Central West End, Clayton and Ferguson. The months and exact spots are not stated, and it is not confirmed that the pianos are still put out each year.","Make Music St. Louis colocó pianos pintados de colores para uso público en la zona de St. Louis, entre ellos unos ocho a lo largo de las paradas del tranvía del Delmar Loop, en University City, según un artículo de Riverfront Times de mediados de 2024 aproximadamente (solo se pudo leer un resumen de búsqueda). Otros lugares mencionados eran Strauss Park en Grand Center, la Riverfront junto al Arch, el National Blues Museum, el Central West End, Clayton y Ferguson. No se indican los meses ni los puntos exactos, y no se ha confirmado que los pianos se sigan colocando cada año.","2024년 중반쯤의 Riverfront Times 기사(검색 요약만 읽음)에 따르면 Make Music St. Louis가 St. Louis 일대에 누구나 칠 수 있는 알록달록한 그림 피아노를 두었고, University City의 Delmar Loop 트롤리 정류장을 따라 8대쯤이 놓였습니다. 다른 곳으로는 Grand Center의 Strauss Park, Arch 옆 강변, National Blues Museum, Central West End, Clayton, Ferguson이 나옵니다. 운영 달과 정확한 자리는 나와 있지 않고, 해마다 지금도 놓이는지는 확인되지 않았습니다."],null,"","Delmar Loop trolley stops, University City, MO","mw","Summer (months not stated)"],

 ["U","Government Square","3CDC summer programming","Cincinnati · OH","transit","",2026,39.10158,-84.51023,["Unverified. A piano was added to Government Square in downtown Cincinnati as part of 3CDC's summer programming. This rests on a single mention in an April 2026 report, which does not say whether the public may play it or exactly where it stands.","Sin verificar. Se agregó un piano en Government Square, en el centro de Cincinnati, como parte de la programación de verano de 3CDC. El dato proviene de una sola mención en un informe de abril de 2026, que no dice si el público puede tocarlo ni dónde está exactamente.","미확인 정보입니다. 3CDC의 여름 프로그램의 하나로 Cincinnati 도심 Government Square에 피아노가 놓였다고 합니다. 2026년 4월 보도에 한 번 언급된 것이 전부이며, 일반인이 칠 수 있는지와 정확한 위치는 나와 있지 않습니다."],null,"","Government Square, Cincinnati, OH","mw","Summer (months not stated)"],
 ["U","Iowa City Pedestrian Mall","Ped Mall piano project","Iowa City · IA","street","u",null,41.65856,-91.53304,["Unverified. Upright street pianos have been set out on the downtown Pedestrian Mall, tended by M.C. Ginsberg staff; one is decorated with a glass mosaic by City High students. This comes from a single undated column, so the months and the current status are not confirmed.","Sin verificar. En el Pedestrian Mall del centro se han colocado pianos verticales callejeros, cuidados por el personal de M.C. Ginsberg; uno está decorado con un mosaico de vidrio hecho por estudiantes de City High. El dato viene de una sola columna sin fecha, así que no están confirmados ni los meses ni la situación actual.","미확인 정보입니다. 도심 Pedestrian Mall에 업라이트 거리 피아노가 놓였고 M.C. Ginsberg 직원들이 관리해 왔으며, 그중 한 대는 City High 학생들이 유리 모자이크로 장식했습니다. 날짜 없는 칼럼 한 건이 근거여서 운영 시기와 현재 상태는 확인되지 않았습니다."],null,"","Iowa City Pedestrian Mall, Iowa City, IA","mw","Seasonal (months not stated)"],
 ["U","Kayak, Bike & Brew","Traverse City Street Pianos · Warehouse District","Traverse City · MI","street","u",2017,44.765256,-85.62642,["A second street piano was added in July 2017 next to Kayak, Bike & Brew (229 Garland St) in Traverse City's Warehouse District, part of the Traverse City Street Pianos by Life and Whim. Anyone can play it outdoors in summer and fall, weather permitting. No confirmation was found after 2019. Not confirmed as still in place.","En julio de 2017 se añadió un segundo piano callejero junto a Kayak, Bike & Brew (229 Garland St), en el Warehouse District de Traverse City, dentro de los Traverse City Street Pianos de Life and Whim. Cualquiera puede tocarlo al aire libre en verano y otoño, si el tiempo lo permite. No hay confirmación posterior a 2019. No se ha confirmado que siga en el lugar.","Traverse City Warehouse District의 Kayak, Bike & Brew(229 Garland St) 옆에 2017년 7월 Life and Whim의 Traverse City Street Pianos 두 번째 거리 피아노가 추가되었습니다. 날씨가 허락하는 한 여름과 가을에 야외에서 누구나 칠 수 있습니다. 2019년 이후 확인된 자료가 없어, 지금도 있는지는 확인되지 않았습니다."],null,"","Kayak, Bike & Brew, Traverse City, MI","mw","Jul–fall"],

 ["U","Paint Creek Center for the Arts lawn","'Kaleidoscope Keys' · painted street piano","Rochester · MI","street","u",2022,42.680904,-83.136404,["A painted upright, 'Kaleidoscope Keys', was unveiled on June 8, 2022, on the lawn of Paint Creek Center for the Arts (407 Pine St., Rochester, Michigan) by Music Shapes and PCCA for anyone to play. C&G News (June 2022) said it was not a permanent installation because of Michigan weather. No later year was found, so it is not confirmed that it returns.","Un piano vertical pintado, 'Kaleidoscope Keys', se presentó el 8 de junio de 2022 en el césped del Paint Creek Center for the Arts (407 Pine St., Rochester, Michigan), de la mano de Music Shapes y PCCA, para que cualquiera lo tocara. C&G News (junio de 2022) dijo que no era una instalación permanente por el clima de Michigan. No se encontraron años posteriores, así que no se ha confirmado que vuelva.","2022년 6월 8일 Michigan주 Rochester의 Paint Creek Center for the Arts(407 Pine St.) 잔디밭에 Music Shapes와 PCCA가 그림을 입힌 업라이트 피아노 'Kaleidoscope Keys'를 공개해 누구나 칠 수 있게 했습니다. 2022년 6월 C&G News는 Michigan 날씨 때문에 상설 설치는 아니라고 전했습니다. 그 뒤 해의 소식은 찾지 못해 다시 놓이는지는 확인되지 않았습니다."],null,"","Paint Creek Center for the Arts lawn, Rochester, MI","mw","from Jun (end not stated)"],
