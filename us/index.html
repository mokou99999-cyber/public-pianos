<style>
:root{
  --paper:#ECEBE6; --paper-2:#E2E0D9; --ink:#1A1918; --ink-2:#4F4C47; --ink-3:#6B675F;
  --line:#CFCCC4; --felt:#B23A2E; --brass:#9A742A;
  --gS:#B23A2E; --gA:#2E6B3E; --gB:#9A742A; --gC:#5A6470; --gU:#8C877F;
  --gS-bg:#F3DAD6; --gA-bg:#DCEBDF; --gB-bg:#F0E6CC; --gC-bg:#E1E4E8; --gU-bg:#E6E4DF;
}
body{background:var(--paper);color-scheme:light;color:var(--ink);font-family:"IBM Plex Sans KR","IBM Plex Sans Thai","Noto Sans SC","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:900px;margin:0 auto;padding-block:28px 64px;padding-inline:20px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow .by{font-family:Fraunces,serif;font-style:italic;font-weight:600;text-transform:none;letter-spacing:0;font-size:14px;color:var(--felt);margin-left:6px;text-decoration:none;border-bottom:1px solid transparent}
.eyebrow .by:hover{border-color:var(--felt)}
.lang{display:flex;gap:4px}
.lang button{font:inherit;font-size:13px;letter-spacing:.06em;padding:8px 13px;min-height:36px;border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer;border-radius:3px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lang button.main{font-size:16px;font-weight:600;padding:8px 18px;border-width:2px;border-color:var(--ink)}
.lang{flex-wrap:wrap}
.lang button:focus-visible,.chip:focus-visible{outline:2px solid var(--felt);outline-offset:2px}
header{display:grid;gap:10px;border-bottom:1px solid var(--line);padding-bottom:22px}
h1{font-family:Fraunces,"IBM Plex Sans KR","IBM Plex Sans Thai",Georgia,serif;font-weight:300;font-size:clamp(32px,6vw,54px);line-height:1.08;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:italic;font-weight:600;color:var(--felt)}
:root[lang="th"] h1{font-style:normal;font-weight:400;line-height:1.3}
:root[lang="th"] h1 em{font-style:normal}
:root[lang="zh"] h1,:root[lang="ja"] h1{font-weight:500;line-height:1.3}
:root[lang="zh"] h1 em,:root[lang="ja"] h1 em{font-style:normal}
:root[lang="ko"] h1{font-weight:400;line-height:1.18}
:root[lang="ko"] h1 em{font-style:normal}
:root[lang="ko"] h1,:root[lang="ko"] .lede,:root[lang="ko"] .legend,:root[lang="ko"] .verdict,:root[lang="ko"] .meta,:root[lang="ko"] footer{word-break:keep-all;overflow-wrap:anywhere}
.lede{max-width:62ch;color:var(--ink-2);margin:0}
.lede.call{color:var(--ink);font-weight:500;border-left:3px solid var(--felt);padding-left:12px;cursor:pointer}
.lede.call:hover{color:var(--felt)}
.counts{display:flex;flex-wrap:wrap;gap:8px 18px;font-variant-numeric:tabular-nums;font-size:14px;margin-top:6px}
.counts b{font-family:Fraunces,serif;font-weight:600;font-size:22px;margin-right:4px}
.counts button{font:inherit;background:none;border:0;padding:4px 0;color:var(--ink);cursor:pointer;border-bottom:1px solid transparent}
.counts button:hover{border-color:var(--ink)}
.counts button:focus-visible{outline:2px solid var(--felt);outline-offset:2px}
.legend{display:grid;gap:6px;margin:22px 0 0;padding:0;list-style:none;font-size:14px;color:var(--ink-2)}
.legend li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:baseline}
.tag{display:inline-block;font-family:Fraunces,serif;font-weight:600;font-size:13px;line-height:1;padding:5px 0;width:30px;text-align:center;border-radius:3px;border:1px solid currentColor}
.tag.S{color:var(--gS);background:var(--gS-bg);font-weight:700}.tag.A{color:var(--gA);background:var(--gA-bg)}.tag.B{color:var(--gB);background:var(--gB-bg)}
.tag.C{color:var(--gC);background:var(--gC-bg)}.tag.U{color:var(--gU);background:var(--gU-bg);border-style:dashed}
.chip.zreset{border-color:var(--ink);color:var(--ink);font-weight:500}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:26px 0 8px}
.zone{font:inherit;text-align:left;display:grid;gap:8px;padding:14px 14px 12px;border:1px solid var(--line);background:var(--paper-2);border-radius:4px;color:var(--ink);cursor:pointer;min-width:0}
.zone:hover{border-color:var(--ink-3)}
.zone[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.zone:focus-visible{outline:2px solid var(--felt);outline-offset:2px}
.zone .zn{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);line-height:1.3}
.zone .zc{font-family:Fraunces,serif;font-weight:600;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.zone .zk{display:block;width:100%;height:auto;margin-top:4px}
.zone .zk .w{fill:#F7F5EF;stroke:var(--line);stroke-width:.6}
.zone .zk .w.S{fill:var(--gS)}.zone .zk .w.A{fill:var(--gA)}.zone .zk .w.B{fill:var(--gB)}.zone .zk .w.C{fill:var(--gC)}
.zone .zk .w.U{fill:#F7F5EF;stroke:var(--gU);stroke-dasharray:1.5 1.2;stroke-width:1}
.zone .zk .b{fill:var(--ink)}
@media (max-width:640px){.zones{grid-template-columns:repeat(2,1fr);gap:8px}.zone{padding:12px 12px 10px}.zone .zc{font-size:24px}}
.plot .dot{stroke:var(--paper-2);stroke-width:1.5}
.plot .dS{fill:var(--gS)}.plot .dA{fill:var(--gA)}.plot .dB{fill:var(--gB)}.plot .dC{fill:var(--gC)}.plot .dU{fill:var(--gU)}
.plotnote{font-size:12px;color:var(--ink-3);margin:0 0 18px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:10px 0 10px;margin:14px 0 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.bar .srow{display:flex;gap:8px;align-items:center}
.bar input{flex:1;min-width:0;font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#F7F5EF;color:var(--ink)}
.bar input:focus{outline:2px solid var(--felt);outline-offset:1px}
.bar .rcount{font-size:13px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.empty{padding:28px 0;color:var(--ink-3);text-align:center}
.gw{font-weight:600}.gw.S{color:var(--gS)}.gw.A{color:var(--gA)}.gw.B{color:var(--gB)}.gw.C{color:var(--gC)}.gw.U{color:var(--gU)}
.card .map-m{display:none}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;font:inherit;font-size:14px;font-weight:600;padding:12px 18px;border-radius:999px;background:var(--felt);color:#fff;border:0;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer}
.fab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.chip{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sep{font-size:12px;color:var(--ink-3);align-self:center;padding:0 4px}
.list{display:grid;border-top:1px solid var(--line)}
.card{display:grid;grid-template-columns:38px 1fr auto;gap:6px 14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.card .side{display:grid;gap:8px;justify-items:start}
.card .ph{display:block;width:150px;aspect-ratio:4/3;overflow:hidden;border-radius:4px;border:1px solid var(--line);background:var(--paper-2);padding:0;cursor:zoom-in}
.card .ph:focus-visible{outline:2px solid var(--felt);outline-offset:2px}
.lb{position:fixed;inset:0;background:rgba(20,19,18,.92);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px;z-index:10;cursor:zoom-out}
.lb img{max-width:100%;max-height:85vh;object-fit:contain;border-radius:4px}
.lb .cap{color:#EDE9E1;font-size:13px}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .credit{font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.card .contrib{margin:6px 0 0;font-size:13px;color:var(--felt);font-weight:500}
.card .contrib a,.contribs li a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor}
.contribs{margin-top:28px;padding:16px 18px;border:1px solid var(--line);border-radius:4px;background:var(--paper-2)}
.contribs h2{font-family:Fraunces,serif;font-weight:600;font-size:18px;margin:0 0 6px}
.contribs p{margin:0;color:var(--ink-2)}
.contribs ul{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.contribs li{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-weight:500}
.card .name{font-weight:600;font-size:16px;line-height:1.3;margin:0}
.card .th{color:var(--ink-3);font-size:13px;font-weight:400;margin-left:6px}
.card .meta{font-size:13px;color:var(--ink-3);margin:2px 0 0}
.card .verdict{margin:6px 0 0;color:var(--ink-2);max-width:62ch}
.card a{color:var(--ink);font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap;line-height:1;align-self:start}
.card a:hover{border-color:var(--felt);color:var(--felt)}
.card.hide{display:none}
footer a{color:var(--ink);font-weight:500;text-decoration:none;border-bottom:1px solid var(--line)}footer a:hover{color:var(--felt);border-color:var(--felt)}
footer .line{display:flex;gap:14px;align-items:center;margin-top:8px}
footer .line img{width:120px;height:120px;border:1px solid var(--line);border-radius:4px;background:#fff;flex:none}
footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3);display:grid;gap:6px;max-width:70ch}
@media (max-width:520px){
  .card{grid-template-columns:34px 1fr}
  .card .side{grid-column:2;width:100%;margin-top:2px}
  .card .ph{width:100%;height:220px;aspect-ratio:auto}
  .card .map-d{display:none}
  .card .map-m{display:inline-block;margin:6px 0 2px}
  .counts b{font-size:19px}
}
.vrow{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{font:inherit;font-size:13px;padding:6px 16px;min-height:32px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible{outline:2px solid var(--felt);outline-offset:-2px}
.chip.near[aria-pressed="true"]{background:var(--felt);border-color:var(--felt);color:#fff}
.locmsg{font-size:12px;color:var(--ink-3)}
#map{position:relative;z-index:0;height:62vh;min-height:340px;max-height:640px;margin-top:12px;border:1px solid var(--line);border-radius:4px;background:var(--paper-2)}
#map .leaflet-tile-pane{filter:sepia(.25) saturate(.7) brightness(1.02)}
#map.leaflet-container{font:inherit}
.leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.45}
.pp b{font-size:14px}.pp .pm{color:var(--ink-3);font-size:12px;margin:2px 0 6px}.pp p{margin:0 0 8px}
.pp img{display:block;width:100%;height:120px;object-fit:cover;border-radius:3px;margin:0 0 6px}
.pp .pa{display:flex;gap:6px;flex-wrap:wrap}
.pp .pa a,.pp .pa button{font:inherit;font-size:12px;line-height:1;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);text-decoration:none;cursor:pointer}
.card .dist{color:var(--felt);font-weight:600}
.card.flash{animation:flash 1.8s ease-out}
@keyframes flash{from{background:var(--gB-bg)}to{background:transparent}}
.counts .vis{display:inline-flex;align-items:baseline;padding:4px 0 4px 16px;border-left:2px solid var(--felt);color:var(--felt);font-weight:500}
.counts .vis b{color:var(--felt)}
.news{margin:10px 0 2px;padding:8px 12px;border:1px solid #e3dccf;border-radius:10px;background:#fbf8f2;font-size:.92rem}
.news summary{cursor:pointer;font-weight:600}
.news p{margin:6px 0 0;line-height:1.5}
.news .newsnote{color:#6b6257;font-size:.86rem}
.card .new{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;background:#c8102e;color:#fff;font-size:.68rem;font-weight:700;letter-spacing:.04em;vertical-align:middle}
.chip[data-v="new"]{border-color:#c8102e;color:#c8102e}
.chip[data-v="new"][aria-pressed="true"]{background:#c8102e;color:#fff}
.ctry{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:-8px 0 14px}.ctry a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line)}.ctry a:hover{color:var(--felt);border-color:var(--felt)}
.seas{font-weight:600;color:var(--brass)}
</style>

 es:{h1:"Aquí es donde están los pianos. <em>Pianistas, salgan a repartir amor y paz.</em>",grade:g=>'Grado '+g,U:"Sin verificar",legend:{"S":"Escenario público. Cualquiera puede tocar y siempre hay gente pasando.","A":"Libre para tocar. Solo siéntate.","B":"Con condiciones. Horarios, registro o preguntar al personal.","C":"Piano para intérpretes. No hay evidencia de que los visitantes puedan tocar.","U":"Sin verificar. Hay registro de un piano, pero no está confirmado que siga ahí."},plotnote:"Las zonas siguen aproximadamente la geografía. Cada tecla presionada es un piano y el color es el grado. Toca una zona para ver solo esa zona; toca otra vez para quitar el filtro.",all:"Todos",allR:"Ver todas las zonas",seen:"última confirmación ",noyear:"sin evidencia fechada",map:"Google Maps",photo:"Foto:",contrib:"Colaborador:",gword:{"S":"Escenario público","A":"Libre para tocar","B":"Con condiciones","C":"Solo intérpretes","U":"Sin verificar"},search:"Buscar lugares o zonas",none:"Nada coincide. Prueba a quitar los filtros.",results:n=>n+(n===1?' lugar':' lugares'),report:"Reportar un piano",call:"¡Siempre son bienvenidos nuevos pianos! Quien reporte uno aparece como colaborador de esta página.",ch:"Colaboradores",cp:"Las personas que nos avisaron de un piano. Reporta uno y tu nombre aparecerá aquí.",f2:"¿Tocaste en alguno? Envía una foto. El grado se actualiza y pasa al siguiente pianista. También se aceptan lugares nuevos.",f3:"Reportes y videos: mensaje directo a <a href=\"https://instagram.com/doc_isu\" target=\"_blank\" rel=\"noopener\">@doc_isu</a> en Instagram.",season:"temporada ",yr:"Solo todo el año",lede:"Pianos en todo Estados Unidos en los que cualquiera puede sentarse a tocar: programas de pianos callejeros, parques y plazas, aeropuertos, estaciones, bibliotecas y vestíbulos de hospitales. Más de 550 lugares hasta ahora, reunidos de listas oficiales de programas, anuncios municipales y noticias locales, cada uno con un grado según si de verdad se puede tocar. Muchos pianos callejeros son de temporada: salen a finales de primavera y se guardan en otoño, así que revisa la temporada en cada tarjeta. El mapa es gratis para todos. Si tocas, ve y toca. Ese asiento es un concierto gratis, y así es como se reparten la música, el amor y la paz.",f1:"Los grados combinan listas oficiales de programas, anuncios municipales y noticias locales. El año indica la última confirmación del piano. Los pianos callejeros cambian de lugar cada año y se guardan fuera de temporada, así que confirma antes de ir.",f4:""},
 ko:{h1:"피아노가 있는 곳을 알려드립니다. <em>연주자들이여, 사랑과 평화를 퍼뜨리세요.</em>",grade:g=>g+'등급',U:"미확정",legend:{"S":"공개 무대. 누구나 치고, 청중과 유동인구가 항상 있습니다.","A":"자유 연주. 앉아서 치면 됩니다.","B":"조건부. 시간·예약·직원 확인 같은 조건이 있습니다.","C":"연주자용 피아노. 손님이 쳐도 된다는 근거는 없습니다.","U":"미확정. 피아노가 있다는 기록은 있으나 지금도 있는지 확인하지 못했습니다."},plotnote:"구역은 대략적인 위치 순으로 놓았습니다. 눌린 건반 하나가 피아노 한 대, 색은 등급입니다. 구역을 누르면 그 구역만 보이고, 다시 누르면 풀립니다.",all:"전체",allR:"전 지역 보기",seen:"최근 확인 ",noyear:"확인 연도 없음",map:"구글맵",photo:"사진:",contrib:"공헌자:",gword:{"S":"공개 무대","A":"자유 연주","B":"조건부","C":"연주자용","U":"미확정"},search:"장소·지역 검색",none:"조건에 맞는 곳이 없습니다. 필터를 풀어 보세요.",results:n=>n+'곳',report:"피아노 제보",call:"신규 피아노 장소 제보는 언제든 환영입니다! 제보자는 페이지 공헌자로 등재됩니다.",ch:"공헌자",cp:"이 지도에 장소를 알려 주신 분들입니다. 제보하시면 이름이 여기에 올라갑니다.",f2:"다녀오셨으면 사진 한 장 보내 주세요. 등급을 갱신해 다음 연주자에게 전합니다. 새 장소 제보도 환영합니다.",f3:"제보와 연주 영상은 인스타그램 <a href=\"https://instagram.com/doc_isu\" target=\"_blank\" rel=\"noopener\">@doc_isu</a> DM으로.",season:"운영 시기 ",yr:"연중 운영만",lede:"미국 전역에서 누구나 앉아서 칠 수 있는 피아노를 모았습니다. 거리 피아노 프로그램, 공원과 광장, 공항, 역, 도서관, 병원 로비까지 지금까지 550여 곳입니다. 프로그램 공식 목록과 시 발표, 지역 뉴스에서 모아 정말 쳐도 되는지 등급을 매겼습니다. 거리 피아노는 늦봄에 나왔다가 가을에 들어가는 계절 설치가 많으니, 카드의 운영 시기를 꼭 확인하세요. 지도는 누구에게나 무료입니다. 피아노를 치신다면 가서 치세요. 그 자리가 곧 무료 공연이고, 음악, 사랑, 평화는 그렇게 퍼집니다.",f1:"등급은 프로그램 공식 목록과 시 발표, 지역 뉴스를 합쳐 매겼고 근거 연도는 마지막으로 피아노가 확인된 해입니다. 거리 피아노는 해마다 자리가 바뀌고 비시즌에는 치워지니 가기 전에 한 번 더 확인하세요.",f4:""}

 ["S","Syracuse Hancock International Airport","Main departures hall","Syracuse · NY","airport","",2025,43.11122,-76.11427,["A piano stands in the airport's grand hall, the main departures hall, reportedly before the security escalators. A local radio station's April 2025 report says anyone is welcome to step up, sit down and play; it is roped off only to protect it from luggage. The exact spot has not been re-checked.","Hay un piano en el gran vestíbulo del aeropuerto, la sala principal de salidas, al parecer antes de las escaleras mecánicas que llevan al control de seguridad. Un reportaje de una emisora de radio local de abril de 2025 dice que cualquiera puede acercarse, sentarse y tocar; está acordonado solo para protegerlo del equipaje. La ubicación exacta no se ha vuelto a comprobar.","공항 그랜드 홀, 곧 출발 홀에 피아노가 있으며 보안검색 에스컬레이터 앞이라고 전해집니다. 2025년 4월 지역 라디오 방송 기사에 따르면 누구나 다가가 앉아서 칠 수 있고, 둘러친 줄은 짐에 부딪히지 않도록 보호하려는 것입니다. 정확한 자리는 다시 확인되지 않았습니다."],null,"","Syracuse Hancock International Airport, Syracuse, NY","ny",""],
 ["S","Anthem Row","Pianos in the City by Shadd · I Street entrance","Washington · DC","plaza","u",2026,38.90185,-77.02246,["Two colorful pianos stand at the I Street entrance to Anthem Row in downtown DC. Passersby are welcome to play and perform. The DowntownDC BID's page is still live in 2026 but undated, and a May 2025 report said the pianos would stay 'through Fall 2025', so they may be seasonal or already gone.","Dos pianos coloridos están en la entrada de I Street de Anthem Row, en el centro de Washington, DC. Invitan a quienes pasan a tocar y presentarse. La página del DowntownDC BID sigue activa en 2026 pero no tiene fecha, y una nota de mayo de 2025 decía que estarían 'hasta el otoño de 2025', por lo que podrían ser de temporada o ya haber sido retirados.","워싱턴 DC 도심 Anthem Row의 I Street 쪽 입구에 알록달록한 피아노 2대가 놓여 있습니다. 지나가는 누구나 연주하고 공연할 수 있습니다. DowntownDC BID 안내 페이지는 2026년에도 게시되어 있으나 날짜가 없고, 2025년 5월 보도에는 '2025년 가을까지' 전시한다고 되어 있어 시즌제이거나 이미 철거되었을 수 있습니다."],null,"","Anthem Row, Washington, DC","ne",""],
 ["S","Boston Logan International Airport","Terminal E atrium","Boston · MA","airport","",2026,42.3656,-71.00961,["A Steinway piano stands in the Terminal E atrium, past security. Massport's official art and exhibits page says everyone is welcome to play. The page is undated but current as of 2026.","Un piano Steinway se encuentra en el atrio de la Terminal E, después del control de seguridad. La página oficial de arte y exposiciones de Massport dice que todos son bienvenidos a tocarlo. La página no tiene fecha, pero está vigente en 2026.","Terminal E 아트리움 보안검색대 안쪽에 Steinway 피아노가 있습니다. Massport 공식 예술·전시 페이지는 누구나 쳐도 된다고 안내합니다. 페이지에 날짜는 없지만 2026년 현재 게시되어 있습니다."],null,"","Boston Logan International Airport, Boston, MA","ne",""],
 ["S","Newark Liberty International Airport","Terminal C · Sing for Hope","Newark · NJ","airport","g",2026,40.68848,-74.17686,["Two Sing for Hope grand pianos are past security in Terminal C. Sing for Hope's official program page says they are open daily for anyone to play, with public play listed from 2024 through the end of 2027. An August 2026 blog post also reports the pianos open to the public.","Dos pianos de cola de Sing for Hope se encuentran después del control de seguridad en la Terminal C. La página oficial del programa indica que cualquiera puede tocarlos todos los días y fija el periodo de uso público desde 2024 hasta finales de 2027. Una publicación de blog de agosto de 2026 también los describe como abiertos al público.","Terminal C 보안검색대 안쪽에 Sing for Hope 그랜드 피아노 두 대가 있습니다. Sing for Hope 공식 프로그램 페이지는 누구나 매일 칠 수 있다고 안내하며, 공개 연주 기간을 2024년부터 2027년 말까지로 적고 있습니다. 2026년 8월 블로그 글도 일반에 열려 있다고 전합니다."],["../img/us-newark-ewr-t.jpg","../img/us-newark-ewr.jpg","<a href=\"https://commons.wikimedia.org/wiki/File:2025-09-12_10_42_00_A_Sing_for_Hope_Piano_within_Terminal_C_of_Newark_Liberty_International_Airport_in_Newark,_Essex_County,_New_Jersey.jpg\" target=\"_blank\" rel=\"noopener\">Famartin</a> · <a href=\"https://creativecommons.org/licenses/by-sa/4.0\" target=\"_blank\" rel=\"noopener\">CC BY-SA 4.0</a> · Wikimedia Commons, 2025"],"","Newark Liberty International Airport, Newark, NJ","ne",""],
 ["S","Ponce City Market","3rd Level, Trestle · Play Me Again Pianos","Atlanta · GA","mall","",2024,33.77198,-84.36568,["'Lin', a free public piano from the nonprofit Play Me Again Pianos, is on the 3rd Level in the Trestle breezeway near the bike valet, just off the BeltLine. Anyone may play. It was installed on February 17, 2024, replacing an earlier piano from 2017.","'Lin', un piano público gratuito de la organización sin fines de lucro Play Me Again Pianos, está en el 3rd Level, en el pasaje del Trestle cerca del estacionamiento de bicicletas, a un paso del BeltLine. Cualquiera puede tocar. Se instaló el 17 de febrero de 2024 en reemplazo de un piano anterior de 2017.","비영리 단체 Play Me Again Pianos의 무료 공공 피아노 'Lin'이 3rd Level의 Trestle 통로, 자전거 보관소 근처에 있으며 BeltLine에서 바로 이어집니다. 누구나 칠 수 있습니다. 2017년에 있던 피아노를 대신해 2024년 2월 17일에 설치되었습니다."],["../img/us-ponce-city-t.jpg","../img/us-ponce-city.jpg","<a href=\"https://commons.wikimedia.org/wiki/File:Public_piano.jpg\" target=\"_blank\" rel=\"noopener\">Tyler Lahti</a> · <a href=\"https://creativecommons.org/licenses/by-sa/2.0/\" target=\"_blank\" rel=\"noopener\">CC BY-SA 2.0</a> · Wikimedia Commons, 2022"],"","Ponce City Market, Atlanta, GA","se",""],
 ["S","Fergus Falls Public Library","","Fergus Falls · MN","library","d",2025,46.27914,-96.0719,["A patron-donated digital piano with headphones at the library, 205 E. Hampden Ave; the spot inside is not stated. It is available for anyone to play; ask at the front desk. Reported in December 2025.","Piano digital con audífonos, donado por un usuario, en la biblioteca (205 E. Hampden Ave); no se indica el punto exacto dentro del edificio. Está disponible para que cualquiera lo toque; pregunte en la recepción. Informado en diciembre de 2025.","도서관(205 E. Hampden Ave)에 이용자가 기증한 디지털 피아노와 헤드폰이 있으며, 관내 정확한 위치는 나와 있지 않습니다. 누구나 칠 수 있으니 안내 데스크에 문의하시면 됩니다. 2025년 12월 보도 기준입니다."],null,"","Fergus Falls Public Library, Fergus Falls, MN","mw",""],
 ["S","John Glenn Columbus Int'l Airport","Main ticket lobby","Columbus · OH","airport","",2025,39.99994,-82.88718,["A piano stands in the main ticket lobby, before security. In a post for World Mental Health Day around October 2025, the airport authority invited passengers to sit down and play it. The airport also has an official art and music page.","Hay un piano en el vestíbulo principal de venta de boletos, antes del control de seguridad. En una publicación por el Día Mundial de la Salud Mental, de alrededor de octubre de 2025, la autoridad aeroportuaria invitó a los pasajeros a sentarse a tocarlo. El aeropuerto también tiene una página oficial de arte y música.","보안검색대 앞 메인 발권 로비에 피아노가 있습니다. 공항공사는 2025년 10월 무렵 세계 정신건강의 날 공식 글에서 승객들에게 앉아서 쳐 보라고 권했습니다. 공항에는 공식 예술·음악 안내 페이지도 있습니다."],null,"","John Glenn Columbus Int'l Airport, Columbus, OH","mw",""],
 ["S","Mayo Clinic Gonda Building","Subway level, Nathan Landow Atrium","Rochester · MN","hospital","g",2009,44.02291,-92.46623,["A grand piano stands on the subway level of the Gonda Building, in the Nathan Landow Atrium in front of the two-story window wall. Anyone may play; a 2016 report describes drop-by use of 30 minutes or less by patients, visitors and employees, with no singing. The latest evidence is from 2020 and has not been re-verified since.","Hay un piano de cola en el nivel subway del Gonda Building, en el Nathan Landow Atrium, frente al ventanal de dos pisos. Cualquiera puede tocar; un informe de 2016 describe un uso ocasional de 30 minutos o menos por parte de pacientes, visitantes y empleados, sin cantar. La referencia más reciente es de 2020 y no se ha vuelto a verificar.","Gonda Building의 subway level, Nathan Landow Atrium의 2층 높이 유리벽 앞에 그랜드 피아노가 있습니다. 누구나 칠 수 있으며, 2016년 보도에 따르면 환자·방문객·직원이 30분 이내로 잠깐 치는 방식이고 노래는 할 수 없습니다. 가장 최근 근거는 2020년이며 그 이후 다시 확인되지 않았습니다."],null,"","Mayo Clinic Gonda Building, Rochester, MN","mw",""],
 ["S","John Wayne Airport","Post-security, between Terminals A and B","Santa Ana · CA","airport","d",2026,33.67469,-117.86924,["The Play Me! Piano, an AvantGrand hybrid digital piano, is past security on the upper level between Terminals A and B. The airport's official page invites all airport guests to sit down and play. The page is current but carries no date.","El Play Me! Piano, un piano digital híbrido AvantGrand, está después del control de seguridad, en el nivel superior entre las terminales A y B. La página oficial del aeropuerto invita a todos los visitantes a sentarse a tocar. La página está vigente, pero no tiene fecha.","Play Me! Piano는 AvantGrand 하이브리드 디지털 피아노로, 보안검색대 안쪽 Terminal A와 B 사이 위층에 있습니다. 공항 공식 페이지는 공항 이용객 누구나 앉아서 쳐 보라고 안내합니다. 현재 게시된 페이지이지만 작성 날짜는 적혀 있지 않습니다."],null,"","John Wayne Airport, Santa Ana, CA","ca",""],
 ["S","Los Angeles International Airport","Terminal 7, past the TSA checkpoint","Los Angeles · CA","airport","g",2025,33.94215,-118.40361,["A Kawai baby grand stands in Terminal 7, beyond the TSA checkpoint. In May 2025 the airport's official news release said passengers can play the Kawai pianos in Terminal 7 and Terminal B. The pianos debuted in June 2019 and can also play by themselves.","Un piano de media cola Kawai se encuentra en la Terminal 7, pasado el control de la TSA. En mayo de 2025, un comunicado oficial del aeropuerto indicó que los pasajeros pueden tocar los pianos Kawai de la Terminal 7 y de la Terminal B. Los pianos se estrenaron en junio de 2019 y también pueden tocar solos.","Terminal 7의 TSA 검색대 안쪽에 Kawai 베이비그랜드 피아노가 있습니다. 2025년 5월 공항 공식 보도자료는 승객이 Terminal 7과 Terminal B의 Kawai 피아노를 칠 수 있다고 밝혔습니다. 이 피아노들은 2019년 6월 처음 놓였고, 자동 연주도 됩니다."],null,"","Los Angeles International Airport, Los Angeles, CA","ca",""],
 ["S","Los Angeles International Airport","Tom Bradley International Terminal (Terminal B)","Los Angeles · CA","airport","g",2025,33.94215,-118.40361,["A Kawai baby grand is in the Tom Bradley International Terminal (Terminal B). In May 2025 the airport's official news release said passengers can play the Kawai pianos in Terminal B and Terminal 7. The exact spot within the terminal has not been re-checked.","Un piano de media cola Kawai se encuentra en la Terminal Internacional Tom Bradley (Terminal B). En mayo de 2025, un comunicado oficial del aeropuerto indicó que los pasajeros pueden tocar los pianos Kawai de la Terminal B y de la Terminal 7. La ubicación exacta dentro de la terminal no se ha vuelto a comprobar.","Tom Bradley International Terminal(Terminal B)에 Kawai 베이비그랜드 피아노가 있습니다. 2025년 5월 공항 공식 보도자료는 승객이 Terminal B와 Terminal 7의 Kawai 피아노를 칠 수 있다고 밝혔습니다. 터미널 안 정확한 자리는 다시 확인되지 않았습니다."],null,"","Los Angeles International Airport, Los Angeles, CA","ca",""],
 ["S","Los Angeles Union Station","Passenger Concourse","Los Angeles · CA","station","",2026,34.05618,-118.23678,["The piano is in the Passenger Concourse, just outside the ticketed waiting area. All players are welcome for up to 20 minutes, daily from 8 am to 8 pm; no tip jars, and management may close it at its discretion. From the station's official page, live as of November 2026.","El piano está en el Passenger Concourse, justo afuera de la sala de espera para pasajeros con boleto. Cualquiera puede tocar hasta 20 minutos, todos los días de 8:00 a 20:00; no se permiten frascos de propinas y la administración puede cerrarlo a su criterio. Según la página oficial de la estación, vigente en noviembre de 2026.","피아노는 Passenger Concourse, 승차권 소지자 대기 구역 바로 밖에 있습니다. 누구나 최대 20분까지 칠 수 있고 매일 오전 8시~오후 8시에 이용할 수 있습니다. 팁 통은 둘 수 없으며 관리 측 판단으로 닫을 수 있습니다. 2026년 11월 현재 게시 중인 역 공식 페이지 기준입니다."],["../img/us-la-union-station-t.jpg","../img/us-la-union-station.jpg","<a href=\"https://www.flickr.com/photos/35320672@N08/30545004366\" target=\"_blank\" rel=\"noopener\">Michael VH</a> · <a href=\"https://creativecommons.org/licenses/by/2.0/\" target=\"_blank\" rel=\"noopener\">CC BY 2.0</a> · Flickr"],"","Los Angeles Union Station, Los Angeles, CA","ca",""],
 ["S","Santa Barbara Municipal Airport","Baggage claim · Pianos on State","Santa Barbara · CA","airport","",2026,34.42748,-119.84203,["A piano stands in the baggage claim area; the airport's official 'Holiday Cheer' post mentions it being played over the holidays. During Pianos on State, held from September 29 to October 19 in 2026, festival pianos were also placed at the airport, according to the Santa Barbara Independent and the airport's own event page. The festival pianos are temporary, and the airport's posts do not spell out who may play the baggage claim piano at other times.","Hay un piano en la zona de recogida de equipaje; la publicación oficial 'Holiday Cheer' del aeropuerto menciona que se toca durante las fiestas. Durante Pianos on State, celebrado del 29 de septiembre al 19 de octubre de 2026, también se colocaron pianos del festival en el aeropuerto, según el Santa Barbara Independent y la propia página de eventos del aeropuerto. Los pianos del festival son temporales, y las publicaciones del aeropuerto no aclaran quién puede tocar el piano de la zona de equipaje en otras épocas.","수하물 찾는 곳에 피아노가 있으며, 공항 공식 'Holiday Cheer' 글은 연휴 기간 연주를 소개합니다. Santa Barbara Independent와 공항 공식 행사 안내에 따르면 2026년 9월 29일~10월 19일 Pianos on State 기간에는 축제 피아노도 공항에 놓였습니다. 축제 피아노는 기간 한정이며, 그 밖의 때에 수하물장 피아노를 누가 칠 수 있는지는 공항 글에 나와 있지 않습니다."],null,"","Santa Barbara Municipal Airport, Santa Barbara, CA","ca",""],
 ["S","Sonoma Plaza","Square Keys · near the duck pond","Sonoma · CA","plaza","u",2026,38.29277,-122.45774,["The 'Square Keys' piano sits beneath the trees near the duck pond in Sonoma Plaza. Residents and visitors of any musical background can sit down and play, or simply listen. Unveiled July 16, 2026; the announcement mentions an 'installation period' without dates, so it may be temporary.","El piano 'Square Keys' está bajo los árboles, cerca del estanque de patos de Sonoma Plaza. Residentes y visitantes, sin importar su formación musical, pueden sentarse a tocar o simplemente escuchar. Se inauguró el 16 de julio de 2026; el anuncio menciona un 'periodo de instalación' sin fechas, por lo que podría ser temporal.","'Square Keys' 피아노는 Sonoma Plaza의 오리 연못 근처 나무 아래에 있습니다. 주민과 방문객 누구나 음악 경험과 관계없이 앉아서 연주하거나 감상할 수 있습니다. 2026년 7월 16일에 공개되었으며, 기사에 날짜 없이 '설치 기간'이라는 표현이 있어 한시적으로 운영될 수 있습니다."],null,"","Sonoma Plaza, Sonoma, CA","ca",""],
 ["S","University of Oregon","Erb Memorial Union, Taylor Lounge","Eugene · OR","university","g",2025,44.04483,-123.07261,["A Steinway grand in Taylor Lounge at the Erb Memorial Union (EMU). Any employee, student or visitor may play it; it has been open for play since 1950. Reported in March 2025.","Un piano de cola Steinway en el Taylor Lounge del Erb Memorial Union (EMU). Cualquier empleado, estudiante o visitante puede tocarlo; ha estado abierto para tocar desde 1950. Informado en marzo de 2025.","Erb Memorial Union(EMU)의 Taylor Lounge에 Steinway 그랜드 피아노가 있습니다. 교직원, 학생, 방문객 누구나 칠 수 있으며 1950년부터 개방되어 왔습니다. 2025년 3월 보도 기준입니다."],null,"","University of Oregon, Eugene, OR","pnw",""],
 ["S","Astoria Park","Sing for Hope Pianos · 'Music Heals Us'","New York · NY","park","u",2026,40.77854,-73.92283,["The Sing for Hope Piano 'Music Heals Us' was placed at Astoria Park (Queens) in the 2026 season (site name only, no street address). Anyone may play with no time limit, but be considerate of others waiting. Out about three weeks a year in late May–June (2026: May 18–June 7); sites change yearly, so check next season's list.","El Sing for Hope Piano 'Music Heals Us' se instaló en Astoria Park (Queens) en la temporada 2026; solo se indica el nombre del sitio, sin dirección. Cualquiera puede tocar sin límite de tiempo, con consideración hacia quienes esperan. Los pianos están unas tres semanas al año, entre fines de mayo y junio (del 18 de mayo al 7 de junio en 2026), y los sitios cambian cada año; consulta la lista de la próxima temporada.","2026년 시즌에 Sing for Hope Piano(작품명 'Music Heals Us')가 Astoria Park(Queens)에 설치되었습니다. 장소 이름만 안내되어 있고 주소는 없습니다. 시간 제한 없이 누구나 연주할 수 있으나 기다리는 분들을 배려해 주시기 바랍니다. 매년 5월 말~6월에 약 3주간만 운영되고(2026년은 5월 18일~6월 7일) 장소는 해마다 바뀌므로 다음 시즌 목록을 확인하시기 바랍니다."],null,"","Astoria Park, New York, NY","ny","late May–Jun"],

 ["S","Littleton Main Street","Be Glad! Make Music! · 6 sidewalk pianos","Littleton · NH","street","u",2026,44.30706,-71.7737,["Six upright pianos stand on the sidewalks along Main Street in downtown Littleton; individual spots are not listed. Anyone may play, and older sources give hours of 9 am–10 pm. Confirmed in 2026: the Chamber of Commerce repairs, tunes and stores them each year, and they are out roughly May–October.","Seis pianos verticales se colocan en las aceras de Main Street, en el centro de Littleton; no se detallan los puntos exactos. Cualquiera puede tocarlos, y fuentes anteriores indican un horario de 9:00 a 22:00. Confirmado en 2026: la Cámara de Comercio los repara, afina y guarda cada año, y están en la calle aproximadamente de mayo a octubre.","Littleton 도심 Main Street 인도 곳곳에 업라이트 피아노 6대가 놓이며, 개별 위치는 공개되어 있지 않습니다. 누구나 연주할 수 있고, 예전 자료에는 이용 시간이 9:00~22:00로 나와 있습니다. 2026년 자료로 확인되었으며, 상공회의소가 매년 수리·조율·보관하고 대략 5~10월에만 내놓습니다."],null,"","Littleton Main Street, Littleton, NH","ne","May–Oct"],

 ["S","Bessemer Park","Pianos in the Parks · outside the fieldhouse","Chicago · IL","park","u",2026,41.733,-87.55647,["The piano is outside the fieldhouse at Bessemer Park, 8930 S. Muskegon Ave., Chicago. Everyone is welcome to stop by and play during the park's open hours; free beginner lessons run on set days. Part of Pianos in the Parks, which ran June 21–July 31 in 2026; the list of parks changes each year.","El piano está afuera del fieldhouse de Bessemer Park (8930 S. Muskegon Ave.), Chicago. Todos pueden acercarse a tocar durante el horario del parque, y hay clases gratuitas para principiantes en días fijos. Forma parte de Pianos in the Parks, que en 2026 se realizó del 21 de junio al 31 de julio; la lista de parques cambia cada año.","Chicago Bessemer Park(8930 S. Muskegon Ave.)의 fieldhouse 바깥에 피아노가 놓입니다. 공원 운영 시간 동안 누구나 들러서 연주할 수 있고, 정해진 날에는 무료 초보자 레슨도 열립니다. Pianos in the Parks 프로그램으로 2026년에는 6월 21일~7월 31일에 운영되었으며, 대상 공원은 해마다 바뀝니다."],null,"","Bessemer Park, Chicago, IL","mw","late Jun–Jul"],

 ["S","Transit stage near Guu's on Main","Public Piano Project · downtown","Stevens Point · WI","plaza","u",2025,44.53152,-89.59628,["A student-painted upright piano sits under a small shelter on the transit stage, in the public space near Guu's on Main in downtown Stevens Point. It is available for anyone to play. The information is from June 2025, the 6th consecutive year (installed around early June and kept out for the season); later seasons are not confirmed.","Un piano vertical pintado por estudiantes está bajo un pequeño techo en el escenario 'transit stage', en el espacio público cerca de Guu's on Main, en el centro de Stevens Point. Cualquiera puede tocarlo. La información es de junio de 2025, sexto año consecutivo (se instala a inicios de junio y queda toda la temporada); las temporadas posteriores no están confirmadas.","Stevens Point 도심 Guu's on Main 근처 공공 공간의 transit stage에 학생들이 색칠한 업라이트 피아노가 작은 지붕 아래 놓입니다. 누구나 연주할 수 있습니다. 2025년 6월 자료 기준이며(6년 연속, 6월 초쯤 설치되어 시즌 내내 유지), 이후 시즌은 확인되지 않았습니다."],null,"","Transit stage near Guu's on Main, Stevens Point, WI","mw","from early Jun"],

 ["S","Arlington Theatre","Pianos on State · 1317 State St.","Santa Barbara · CA","culture","u",2026,34.42461,-119.7065,["A Pianos on State piano was placed at the Arlington Theatre, 1317 State St., Santa Barbara, in fall 2026. The public is invited to play impromptu; a single listing gives the hours as daily 10 AM–10 PM. Runs about three weeks each fall (Sept 29–Oct 19 in 2026) and sites change yearly, so check the official map next season.","En otoño de 2026 se colocó un piano de Pianos on State en Arlington Theatre, 1317 State St., Santa Barbara. Se invita al público a explorar los instrumentos y tocar de forma espontánea; el horario informado es de 10:00 a 22:00 todos los días, según un único listado. El programa dura unas tres semanas cada otoño (del 29 de septiembre al 19 de octubre en 2026) y los sitios cambian cada año; consulta el mapa oficial la próxima temporada.","2026년 가을 Santa Barbara의 Arlington Theatre(1317 State St.)에 Pianos on State 피아노가 설치되었습니다. 누구나 악기를 둘러보고 즉흥으로 연주할 수 있으며, 이용 시간은 매일 오전 10시~오후 10시로 알려져 있으나 목록 한 건에만 근거한 정보입니다. 매년 가을 약 3주간만 운영되고(2026년은 9월 29일~10월 19일) 장소는 해마다 바뀌므로 다음 시즌에는 공식 지도를 확인하시기 바랍니다."],null,"","Arlington Theatre, Santa Barbara, CA","ca","late Sep–mid-Oct"],

 ["A","Port Authority Bus Terminal","North Wing ground floor · Sing for Hope","New York · NY","station","u",2021,40.75676,-73.99044,["A Sing for Hope upright on the ground floor of the North Wing, above the center stairs. It was described as open for anyone and everyone to play; older coverage mentions set visiting hours for safety. The page is undated (latest date mentioned is 2021) and the piano is not on Sing for Hope's 2026 list of year-round locations, so it may be gone.","Piano vertical de Sing for Hope en la planta baja del North Wing, sobre las escaleras centrales. Se describía como abierto para que cualquiera lo tocara; notas anteriores mencionan horarios de visita fijos por seguridad. La página no tiene fecha (la más reciente que menciona es 2021) y el piano no aparece en la lista 2026 de ubicaciones abiertas todo el año de Sing for Hope, así que puede que ya no esté.","North Wing 1층, 중앙 계단 위쪽에 있는 Sing for Hope 업라이트 피아노입니다. 누구나 칠 수 있도록 개방되어 있다고 소개되었고, 예전 보도에는 안전을 위해 이용 시간이 정해져 있다고 나옵니다. 페이지에 날짜가 없고(언급된 가장 최근 연도는 2021년) Sing for Hope의 2026년 연중 개방 장소 목록에는 없어, 지금은 없을 수 있습니다."],null,"","Port Authority Bus Terminal, New York, NY","ny",""],
 ["A","7DrumCity","Rehearsal rooms with piano · Truxton Circle","Washington · DC","other","",2024,38.909942,-77.009361,["【PAID】 7DrumCity, a community music space in the Truxton Circle area of Washington, DC, has rehearsal rooms with a piano that are booked by the hour for a fee. It also holds regular open jam sessions; check its calendar. A January 2024 guide noted that it is not exactly public. Not confirmed as still in place.","【DE PAGO】 7DrumCity, un espacio musical comunitario en la zona de Truxton Circle, en Washington, DC, tiene salas de ensayo con piano que se reservan por hora y se pagan. También organiza jam sessions abiertas con regularidad; conviene consultar su calendario. Una guía de enero de 2024 advertía que no es exactamente un piano público. No se ha confirmado que siga en el lugar.","【유료】 Washington, DC Truxton Circle 지역의 커뮤니티 음악 공간 7DrumCity에는 피아노가 있는 연습실이 있으며, 시간 단위로 예약해 요금을 내고 이용합니다. 정기적으로 오픈 잼 세션도 열리므로 일정표를 확인하시기 바랍니다. 2024년 1월 안내 글은 이곳을 엄밀한 의미의 공공 피아노는 아니라고 소개했습니다. 지금도 있는지는 확인되지 않았습니다."],null,"","7DrumCity, Washington, DC","ne",""],
 ["A","Bangor Public Library","Grand piano · no reservation","Bangor · ME","library","g",null,44.804456,-68.771682,["Bangor Public Library has a grand piano that anyone may sit down and play during library hours, with no reservation needed, though calling ahead is suggested. This comes from an undated radio station article citing the library's own post. It is not confirmed that this is still the case.","La Biblioteca Pública de Bangor tiene un piano de cola que cualquiera puede tocar en horario de biblioteca, sin reserva, aunque se recomienda llamar antes. El dato viene de un artículo de una emisora de radio sin fecha que cita una publicación de la propia biblioteca. No se ha confirmado que siga siendo así.","Bangor 공공도서관에는 개관 시간에 누구나 예약 없이 앉아 칠 수 있는 그랜드 피아노가 있으며, 미리 전화해 보라고 권합니다. 도서관 자체 게시글을 인용한 라디오 방송국 기사(날짜 없음)에 나온 내용입니다. 지금도 그런지는 확인되지 않았습니다."],null,"","Bangor Public Library, Bangor, ME","ne",""],
 ["A","Pyanoe Plaza","Piano 4 Pyanoe Plaza · Belmar Arts Center · Sancious all-weather piano","Belmar · NJ","park","d",2024,40.18047,-74.025545,["An all-weather digital piano in a weatherproof concrete shell stands in Pyanoe Plaza at 9th Ave and Main St in Belmar, honoring David Sancious and his mother Stelma. It is free for anyone to come and play; hours are not published. Unveiled in November 2024 through the Belmar Arts Center's Piano 4 Pyanoe Plaza project and presented as a permanent centerpiece, with a formal dedication scheduled for May 2025.","Un piano digital para intemperie, con carcasa de hormigón resistente al clima, se encuentra en Pyanoe Plaza, en 9th Ave y Main St, en Belmar; rinde homenaje a David Sancious y a su madre Stelma. Es gratuito y cualquiera puede acercarse a tocar; no se publica el horario. Se presentó en noviembre de 2024 dentro del proyecto Piano 4 Pyanoe Plaza de Belmar Arts Center, como pieza central permanente, con una dedicación formal prevista para mayo de 2025.","Belmar의 9th Ave와 Main St가 만나는 Pyanoe Plaza에 콘크리트 외장의 전천후 야외 디지털 피아노가 있습니다. David Sancious와 그의 어머니 Stelma를 기리는 피아노로, 무료이며 누구나 와서 칠 수 있고 이용 시간은 공개되어 있지 않습니다. Belmar Arts Center의 Piano 4 Pyanoe Plaza 프로젝트로 2024년 11월에 공개되어 광장의 상설 시설로 소개되었으며, 정식 헌정식은 2025년 5월로 예정되어 있었습니다."],null,"","Pyanoe Plaza, Belmar, NJ","ne",""],
 ["A","Right Proper Brewing Company (Brookland)","Restroom piano","Washington · DC","other","",2024,38.926799,-76.993071,["A piano sits inside the restroom, described as a mini conservatory, at Right Proper Brewing Company's Brookland location in Washington, DC. Customers can reach it during taproom hours; play rules are not stated. Listed in a guide to DC's public pianos in January 2024. Not confirmed as still in place.","En el local de Brookland de Right Proper Brewing Company, en Washington, DC, hay un piano dentro del baño, descrito como un pequeño conservatorio. Los clientes pueden acceder a él en el horario del taproom; no se indican normas de uso. Figuraba en una guía de pianos públicos de DC de enero de 2024. No se ha confirmado que siga en el lugar.","Washington, DC의 Right Proper Brewing Company Brookland 지점에는 화장실 안에 피아노가 있으며, 작은 음악실처럼 꾸며져 있다고 합니다. 탭룸 영업시간에 손님이 이용할 수 있고, 연주 규칙은 명시되어 있지 않습니다. 2024년 1월 DC 공공 피아노 안내에 실렸으며, 지금도 있는지는 확인되지 않았습니다."],null,"","Right Proper Brewing Company (Brookland), Washington, DC","ne",""],
 ["A","1920 Ybor","Tampa Tunes · 'Abundance'","Tampa · FL","street","u",2024,27.96047,-82.43738,["The painted piano 'Abundance' is at the 1920 Ybor music venue, 1920 E 7th Ave, where the first Tampa Tunes piano was unveiled on January 6, 2024. The program's pianos are meant for anyone to play, anytime, for free. The information dates from November 2024, so confirm it is still there.","El piano pintado 'Abundance' está en la sala de conciertos 1920 Ybor (1920 E 7th Ave), donde se presentó el primer piano de Tampa Tunes el 6 de enero de 2024. Los pianos del programa están pensados para que cualquiera toque, en cualquier momento y gratis. La información es de noviembre de 2024, así que confirme que siga allí.","색칠된 피아노 'Abundance'는 음악 공연장 1920 Ybor(1920 E 7th Ave)에 있으며, 이곳에서 2024년 1월 6일 Tampa Tunes의 첫 피아노가 공개되었습니다. 이 프로그램의 피아노는 누구나 언제든 무료로 연주할 수 있도록 마련된 것입니다. 2024년 11월 자료에 근거한 정보이므로 지금도 있는지 확인하시기 바랍니다."],null,"","1920 Ybor, Tampa, FL","se",""],
 ["A","719 N. Franklin Street","Tampa Tunes × Tampa Downtown Partnership · Downtown River Arts","Tampa · FL","street","",2025,27.950558,-82.458885,["A public piano was placed at 719 N. Franklin Street, in the Downtown River Arts neighborhood in downtown Tampa, one of seven set out by the Tampa Downtown Partnership with Tampa Tunes, one per downtown neighborhood. It is free for anyone passing by to play. The placement was announced on March 10, 2025 for National Music Month and the announcement does not say how long the pianos stay, so it may be temporary; not confirmed as still in place.","Se colocó un piano público en 719 N. Franklin Street, en el barrio de Downtown River Arts, en el centro de Tampa; es uno de los siete que Tampa Downtown Partnership instaló junto con Tampa Tunes, uno por cada barrio del centro. Cualquiera que pase puede tocarlo gratis. La instalación se anunció el 10 de marzo de 2025 con motivo del National Music Month y el anuncio no indica cuánto tiempo permanecen los pianos, por lo que puede ser temporal; no se ha confirmado que siga en su lugar.","Tampa 다운타운의 Downtown River Arts 지역 719 N. Franklin Street에 공공 피아노가 놓였습니다. Tampa Downtown Partnership이 Tampa Tunes와 함께 다운타운 동네마다 1대씩, 모두 7대를 설치한 것 중 하나로, 지나가는 누구나 무료로 칠 수 있습니다. 2025년 3월 10일 National Music Month를 맞아 발표되었고 설치 기간은 안내되지 않아 임시 설치일 수 있으며, 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","719 N. Franklin Street, Tampa, FL","se",""],
 ["A","Alpharetta Arts Center","Play Me Again Pianos · 'Ms. Jean' · terrace","Alpharetta · GA","culture","u",2026,34.08196,-84.29767,["An outdoor upright nicknamed 'Ms. Jean' stands on the terrace of Alpharetta Arts Center in Alpharetta. It is one of the Play Me Again Pianos, freely accessible public pianos that anyone can play year-round. Listed as currently installed in the program's 2026 gallery; no street address is given.","Un piano vertical al aire libre, apodado 'Ms. Jean', se encuentra en la terraza de Alpharetta Arts Center, en Alpharetta. Es uno de los Play Me Again Pianos, pianos públicos de libre acceso que cualquiera puede tocar durante todo el año. Figura como instalado actualmente en la galería 2026 del programa; no se indica la dirección exacta.","Alpharetta의 Alpharetta Arts Center 테라스에 야외 업라이트 피아노(애칭 'Ms. Jean')가 있습니다. Play Me Again Pianos 프로그램의 피아노로, 누구나 연중 자유롭게 연주할 수 있습니다. 2026년 프로그램 갤러리에 현재 설치된 피아노로 올라 있으며, 정확한 주소는 안내되어 있지 않습니다."],null,"","Alpharetta Arts Center, Alpharetta, GA","se",""],
 ["A","Andrew P. Sanchez & Copelin-Byrd Multi-Service Center","Sing for Hope Pianos New Orleans · 'Starry Crescendo' & 'Ethereal Blossoms'","New Orleans · LA","other","u",2025,29.966344,-90.013998,["Two Sing for Hope Pianos, 'Starry Crescendo' and 'Ethereal Blossoms', are listed at the Andrew P. Sanchez & Copelin-Byrd Multi-Service Center (1616 Fats Domino Avenue), a community center in New Orleans' Lower Ninth Ward, named as their permanent home after the Feb 4–20, 2025 public residency. They are expected to be open to anyone during community center hours; the hours listed for the 2025 residency were Mon–Fri 8am–8pm and Sat 8am–2pm. Based on the program's 2025 page; not confirmed as still in place.","Dos Sing for Hope Pianos, 'Starry Crescendo' y 'Ethereal Blossoms', figuran en el Andrew P. Sanchez & Copelin-Byrd Multi-Service Center (1616 Fats Domino Avenue), un centro comunitario del Lower Ninth Ward de New Orleans, indicado como su sede permanente tras la residencia pública del 4 al 20 de febrero de 2025. Se espera que cualquiera pueda tocarlos en el horario del centro; el horario indicado para la residencia de 2025 era de lunes a viernes, de 8:00 a 20:00, y sábados de 8:00 a 14:00. Según la página del programa de 2025; no se ha confirmado que sigan en su lugar.","New Orleans Lower Ninth Ward의 커뮤니티 센터인 Andrew P. Sanchez & Copelin-Byrd Multi-Service Center(1616 Fats Domino Avenue)에 놓인 것으로 안내된 Sing for Hope Piano 2대('Starry Crescendo', 'Ethereal Blossoms')입니다. 프로그램은 2025년 2월 4~20일 공개 전시 뒤 이곳을 두 피아노의 상설 보금자리로 적고 있습니다. 센터 운영 시간에 누구나 칠 수 있을 것으로 보이며, 2025년 전시 때 안내된 시간은 월~금 8:00~20:00, 토 8:00~14:00였습니다. 2025년 프로그램 페이지 기준이며, 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","Andrew P. Sanchez & Copelin-Byrd Multi-Service Center, New Orleans, LA","se",""],
 ["A","Atlantic Station","Play Me Again Pianos · 'Waverly'","Atlanta · GA","mall","u",2026,33.79125,-84.39874,["An outdoor upright nicknamed 'Waverly' stands at Atlantic Station in Atlanta. It is one of the Play Me Again Pianos, freely accessible public pianos that anyone can play year-round. Listed as currently installed in the program's 2026 gallery; no street address is given.","Un piano vertical al aire libre, apodado 'Waverly', se encuentra en Atlantic Station, en Atlanta. Es uno de los Play Me Again Pianos, pianos públicos de libre acceso que cualquiera puede tocar durante todo el año. Figura como instalado actualmente en la galería 2026 del programa; no se indica la dirección exacta.","Atlanta의 Atlantic Station에 야외 업라이트 피아노(애칭 'Waverly')가 있습니다. Play Me Again Pianos 프로그램의 피아노로, 누구나 연중 자유롭게 연주할 수 있습니다. 2026년 프로그램 갤러리에 현재 설치된 피아노로 올라 있으며, 정확한 주소는 안내되어 있지 않습니다."],null,"","Atlantic Station, Atlanta, GA","se",""],
 ["A","Augusta University Summerville Campus","JNSA Painted Pianos","Augusta · GA","culture","u",2024,33.47568,-82.02245,["A painted piano by Francie Klopotic stands on Augusta University's Summerville Campus; the exact spot is not given. It is available to play and view. Dedicated March 20, 2024 as part of the Jessye Norman School of the Arts' Painted Pianos and still listed as current.","Un piano pintado por Francie Klopotic está en el Summerville Campus de Augusta University; no se indica el punto exacto. Se puede tocar y contemplar. Se inauguró el 20 de marzo de 2024 dentro de los Painted Pianos de la Jessye Norman School of the Arts y sigue figurando como vigente.","Francie Klopotic이 그린 색칠 피아노가 Augusta University Summerville Campus에 있으며, 정확한 위치는 나와 있지 않습니다. 누구나 연주하고 감상할 수 있습니다. Jessye Norman School of the Arts의 Painted Pianos 프로젝트로 2024년 3월 20일에 설치 기념식을 열었고, 현재도 운영 중인 곳으로 안내되어 있습니다."],null,"","Augusta University Summerville Campus, Augusta, GA","se",""],
 ["A","Baldwin & Co.","Sing for Hope Pianos New Orleans · 'Our Secret Recipe'","New Orleans · LA","other","u",2025,29.968254,-90.057114,["The Sing for Hope Piano 'Our Secret Recipe' is listed at Baldwin & Co. (1030 Elysian Fields Avenue) in New Orleans, named by the program as the piano's permanent home after its Feb 4–20, 2025 public residency. It is expected to be open to anyone during the coffee shop and bookstore's hours; the hours listed for the 2025 residency were daily 7am–6pm. Based on the program's 2025 page; not confirmed as still in place.","El Sing for Hope Piano 'Our Secret Recipe' figura en Baldwin & Co. (1030 Elysian Fields Avenue), en New Orleans, lugar que el programa indica como sede permanente del piano tras su residencia pública del 4 al 20 de febrero de 2025. Se espera que cualquiera pueda tocarlo en el horario de la cafetería y librería; el horario indicado para la residencia de 2025 era todos los días, de 7:00 a 18:00. Según la página del programa de 2025; no se ha confirmado que siga en su lugar.","New Orleans의 Baldwin & Co.(1030 Elysian Fields Avenue)에 놓인 것으로 안내된 Sing for Hope Piano 'Our Secret Recipe'입니다. 프로그램은 2025년 2월 4~20일 공개 전시 뒤 이곳을 피아노의 상설 보금자리로 적고 있습니다. 카페 겸 서점 영업시간에 누구나 칠 수 있을 것으로 보이며, 2025년 전시 때 안내된 시간은 매일 7:00~18:00였습니다. 2025년 프로그램 페이지 기준이며, 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","Baldwin & Co., New Orleans, LA","se",""],
 ["A","Brittingham-Midtown Community Center","Sing for Hope Pianos · 'Synesthesia Therapy'","Newport News · VA","other","u",2024,37.043504,-76.462494,["The Sing for Hope piano 'Synesthesia Therapy' is listed with Brittingham-Midtown Community Center (570 McLawhorne Dr) in Newport News as its permanent home after the spring 2024 public residency (Mar 29–Apr 18). It is presumably available to center visitors during opening hours, but play rules are not confirmed, so ask staff. Based on the program's 2024 page. Not confirmed as still in place.","El piano de Sing for Hope 'Synesthesia Therapy' figura con Brittingham-Midtown Community Center (570 McLawhorne Dr), en Newport News, como su sede permanente tras la residencia pública de primavera de 2024 (del 29 de marzo al 18 de abril). Se supone que los visitantes del centro pueden tocarlo en el horario de apertura, pero las normas de uso no están confirmadas; conviene preguntar al personal. La información procede de la página del programa de 2024. No se ha confirmado que siga en el lugar.","Newport News의 Brittingham-Midtown Community Center(570 McLawhorne Dr)는 2024년 봄 공개 기간(3월 29일~4월 18일)이 끝난 뒤 Sing for Hope 피아노 'Synesthesia Therapy'의 상설 보금자리로 올라 있습니다. 센터 운영 시간에 방문객이 칠 수 있을 것으로 보이나 이용 규칙은 확인되지 않았으므로 직원에게 문의하시기 바랍니다. 2024년 프로그램 페이지를 근거로 한 것이며, 지금도 있는지는 확인되지 않았습니다."],null,"","Brittingham-Midtown Community Center, Newport News, VA","se",""],
 ["A","Bywater Bakery","Sing for Hope Pianos New Orleans · 'All Smiles'","New Orleans · LA","other","u",2025,29.962999,-90.039121,["The Sing for Hope Piano 'All Smiles' is listed at Bywater Bakery (3624 Dauphine Street) in New Orleans, named by the program as the piano's permanent home after its Feb 4–20, 2025 public residency. It is expected to be open to anyone during bakery hours; the hours listed for the 2025 residency were Thu–Mon 8am–3pm. Based on the program's 2025 page; not confirmed as still in place.","El Sing for Hope Piano 'All Smiles' figura en Bywater Bakery (3624 Dauphine Street), en New Orleans, lugar que el programa indica como sede permanente del piano tras su residencia pública del 4 al 20 de febrero de 2025. Se espera que cualquiera pueda tocarlo en el horario de la panadería; el horario indicado para la residencia de 2025 era de jueves a lunes, de 8:00 a 15:00. Según la página del programa de 2025; no se ha confirmado que siga en su lugar.","New Orleans의 Bywater Bakery(3624 Dauphine Street)에 놓인 것으로 안내된 Sing for Hope Piano 'All Smiles'입니다. 프로그램은 2025년 2월 4~20일 공개 전시 뒤 이곳을 피아노의 상설 보금자리로 적고 있습니다. 베이커리 영업시간에 누구나 칠 수 있을 것으로 보이며, 2025년 전시 때 안내된 시간은 목~월 8:00~15:00였습니다. 2025년 프로그램 페이지 기준이며, 지금도 그 자리에 있는지는 확인되지 않았습니다."],["../img/us-bywater-bakery-t.jpg","../img/us-bywater-bakery.jpg","<a href=\"https://commons.wikimedia.org/wiki/File:Bywater_Bakery_New_Orleans_April_2018_Tom_McDermott_piano.jpg\" target=\"_blank\" rel=\"noopener\">Infrogmation of New Orleans</a> · <a href=\"https://creativecommons.org/licenses/by-sa/4.0\" target=\"_blank\" rel=\"noopener\">CC BY-SA 4.0</a> · Wikimedia Commons, 2018"],"","Bywater Bakery, New Orleans, LA","se",""],

 ["A","Giving Hope","Sing for Hope Pianos New Orleans · 'Selfless Service'","New Orleans · LA","other","u",2025,30.050759,-89.951576,["The Sing for Hope Piano 'Selfless Service' is listed at Giving Hope (13040 I-10 Service Road) in New Orleans, named by the program as the piano's permanent home after its Feb 4–20, 2025 public residency. It is expected to be open to visitors of the Giving Hope community center and food pantry during opening hours; the hours listed for the 2025 residency were Tue–Fri 7–11am and Sat 9am–12pm. Based on the program's 2025 page; not confirmed as still in place.","El Sing for Hope Piano 'Selfless Service' figura en Giving Hope (13040 I-10 Service Road), en New Orleans, lugar que el programa indica como sede permanente del piano tras su residencia pública del 4 al 20 de febrero de 2025. Se espera que puedan tocarlo quienes visiten el centro comunitario y banco de alimentos Giving Hope en su horario de apertura; el horario indicado para la residencia de 2025 era de martes a viernes, de 7:00 a 11:00, y sábados de 9:00 a 12:00. Según la página del programa de 2025; no se ha confirmado que siga en su lugar.","New Orleans의 Giving Hope(13040 I-10 Service Road)에 놓인 것으로 안내된 Sing for Hope Piano 'Selfless Service'입니다. 프로그램은 2025년 2월 4~20일 공개 전시 뒤 이곳을 피아노의 상설 보금자리로 적고 있습니다. 커뮤니티 센터·푸드 팬트리 운영 시간에 방문객이 칠 수 있을 것으로 보이며, 2025년 전시 때 안내된 시간은 화~금 7:00~11:00, 토 9:00~12:00였습니다. 2025년 프로그램 페이지 기준이며, 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","Giving Hope, New Orleans, LA","se",""],

 ["A","HCC Ybor City Campus","Tampa Tunes · 'Charge'","Tampa · FL","culture","u",2024,27.96289,-82.44324,["The painted piano 'Charge' is at the Hillsborough Community College (HCC) Ybor City campus; whether it sits indoors or outside is not stated. Tampa Tunes pianos are meant for anyone to play, anytime, for free. The information comes from a November 2024 article, so confirm it is still there.","El piano pintado 'Charge' está en el campus Ybor City del Hillsborough Community College (HCC); no se indica si se encuentra en el interior o al aire libre. Los pianos de Tampa Tunes están pensados para que cualquiera toque, en cualquier momento y gratis. La información proviene de un artículo de noviembre de 2024, así que confirme que siga allí.","색칠된 피아노 'Charge'는 Hillsborough Community College(HCC) Ybor City 캠퍼스에 있으며, 실내인지 야외인지는 나와 있지 않습니다. Tampa Tunes 피아노는 누구나 언제든 무료로 연주할 수 있도록 마련된 것입니다. 2024년 11월 기사에 근거한 정보이므로 지금도 있는지 확인하시기 바랍니다."],null,"","HCC Ybor City Campus, Tampa, FL","se",""],
 ["A","Hilton Tampa Downtown","Tampa Tunes × Tampa Downtown Partnership · Downtown Core · 211 Patio","Tampa · FL","hotel","",2025,27.946221,-82.457752,["A public piano was placed on the 211 Patio of the Hilton Tampa Downtown (211 N. Tampa St.), in the Downtown Core neighborhood in downtown Tampa, one of seven set out by the Tampa Downtown Partnership with Tampa Tunes, one per downtown neighborhood. It is free for anyone passing by to play. The placement was announced on March 10, 2025 for National Music Month and the announcement does not say how long the pianos stay, so it may be temporary; not confirmed as still in place.","Se colocó un piano público en el 211 Patio del Hilton Tampa Downtown (211 N. Tampa St.), en el barrio de Downtown Core, en el centro de Tampa; es uno de los siete que Tampa Downtown Partnership instaló junto con Tampa Tunes, uno por cada barrio del centro. Cualquiera que pase puede tocarlo gratis. La instalación se anunció el 10 de marzo de 2025 con motivo del National Music Month y el anuncio no indica cuánto tiempo permanecen los pianos, por lo que puede ser temporal; no se ha confirmado que siga en su lugar.","Tampa 다운타운의 Downtown Core 지역 Hilton Tampa Downtown(211 N. Tampa St.)의 211 Patio에 공공 피아노가 놓였습니다. Tampa Downtown Partnership이 Tampa Tunes와 함께 다운타운 동네마다 1대씩, 모두 7대를 설치한 것 중 하나로, 지나가는 누구나 무료로 칠 수 있습니다. 2025년 3월 10일 National Music Month를 맞아 발표되었고 설치 기간은 안내되지 않아 임시 설치일 수 있으며, 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","Hilton Tampa Downtown, Tampa, FL","se",""],
 ["A","Main Street Park, Mocksville","'The Melody of Mocksville' · painted piano","Mocksville · NC","park","u",2025,35.894024,-80.561785,["A painted public piano called 'The Melody of Mocksville' was unveiled on July 31, 2025, in Main Street Park near the fountain in downtown Mocksville. The local paper (August 2025) reported that anyone may play it, however well or badly. No later update was found, so it is not confirmed that it is still there. The map pin marks the town center.","Un piano público pintado llamado 'The Melody of Mocksville' se presentó el 31 de julio de 2025 en Main Street Park, junto a la fuente del centro de Mocksville. El periódico local (agosto de 2025) informó que cualquiera puede tocarlo, sin importar su nivel. No se encontró información posterior, así que no se ha confirmado que siga allí. El marcador del mapa indica el centro del pueblo.","2025년 7월 31일 Mocksville 시내 분수대 옆 Main Street Park에 그림을 입힌 공용 피아노 'The Melody of Mocksville'가 공개됐습니다. 2025년 8월 지역 신문은 실력과 상관없이 누구나 칠 수 있다고 전했습니다. 그 뒤 소식은 찾지 못해 지금도 있는지는 확인되지 않았습니다. 지도 위치는 마을 중심입니다."],null,"","Main Street Park, Mocksville, Mocksville, NC","se",""],

 ["A","Pam Iorio Garage","Tampa Tunes × Tampa Downtown Partnership · Water Street · pedestrian entrance","Tampa · FL","street","",2025,27.942198,-82.454506,["A public piano was placed at the pedestrian entrance of the Pam Iorio Garage (640 S. Florida Ave.), in the Water Street neighborhood in downtown Tampa, one of seven set out by the Tampa Downtown Partnership with Tampa Tunes, one per downtown neighborhood. It is free for anyone passing by to play. The placement was announced on March 10, 2025 for National Music Month and the announcement does not say how long the pianos stay, so it may be temporary; not confirmed as still in place.","Se colocó un piano público en la entrada peatonal del Pam Iorio Garage (640 S. Florida Ave.), en el barrio de Water Street, en el centro de Tampa; es uno de los siete que Tampa Downtown Partnership instaló junto con Tampa Tunes, uno por cada barrio del centro. Cualquiera que pase puede tocarlo gratis. La instalación se anunció el 10 de marzo de 2025 con motivo del National Music Month y el anuncio no indica cuánto tiempo permanecen los pianos, por lo que puede ser temporal; no se ha confirmado que siga en su lugar.","Tampa 다운타운의 Water Street 지역 Pam Iorio Garage(640 S. Florida Ave.) 보행자 출입구에 공공 피아노가 놓였습니다. Tampa Downtown Partnership이 Tampa Tunes와 함께 다운타운 동네마다 1대씩, 모두 7대를 설치한 것 중 하나로, 지나가는 누구나 무료로 칠 수 있습니다. 2025년 3월 10일 National Music Month를 맞아 발표되었고 설치 기간은 안내되지 않아 임시 설치일 수 있으며, 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","Pam Iorio Garage, Tampa, FL","se",""],
 ["A","Plaza Fiesta","Play Me Again Pianos · 'Iris'","Chamblee · GA","mall","u",2026,33.8633,-84.30824,["An outdoor upright nicknamed 'Iris' stands at Plaza Fiesta in Chamblee. It is one of the Play Me Again Pianos, freely accessible public pianos that anyone can play year-round. Listed as currently installed in the program's 2026 gallery; no street address is given.","Un piano vertical al aire libre, apodado 'Iris', se encuentra en Plaza Fiesta, en Chamblee. Es uno de los Play Me Again Pianos, pianos públicos de libre acceso que cualquiera puede tocar durante todo el año. Figura como instalado actualmente en la galería 2026 del programa; no se indica la dirección exacta.","Chamblee의 Plaza Fiesta에 야외 업라이트 피아노(애칭 'Iris')가 있습니다. Play Me Again Pianos 프로그램의 피아노로, 누구나 연중 자유롭게 연주할 수 있습니다. 2026년 프로그램 갤러리에 현재 설치된 피아노로 올라 있으며, 정확한 주소는 안내되어 있지 않습니다."],null,"","Plaza Fiesta, Chamblee, GA","se",""],

 ["A","StudioBE","Sing for Hope Pianos New Orleans · 'Plant a Smile'","New Orleans · LA","museum","u",2025,29.964077,-90.047741,["【PAID】 StudioBE is a ticketed gallery, and the piano may be inside the paid area; the admission price is not given. The Sing for Hope Piano 'Plant a Smile' is listed at StudioBE (2941 Royal Street) in New Orleans, named by the program as its permanent home after the Feb 4–20, 2025 public residency. It is expected to be open to gallery visitors during opening hours; the hours listed for the 2025 residency were Wed–Sat 11am–6pm and Sun 2–6pm. Based on the program's 2025 page; not confirmed as still in place.","【DE PAGO】 StudioBE es una galería con entrada de pago y el piano puede estar dentro de la zona de pago; no se indica el precio. El Sing for Hope Piano 'Plant a Smile' figura en StudioBE (2941 Royal Street), en New Orleans, lugar que el programa indica como su sede permanente tras la residencia pública del 4 al 20 de febrero de 2025. Se espera que puedan tocarlo los visitantes de la galería en su horario de apertura; el horario indicado para la residencia de 2025 era de miércoles a sábado, de 11:00 a 18:00, y domingos de 14:00 a 18:00. Según la página del programa de 2025; no se ha confirmado que siga en su lugar.","【유료】 StudioBE는 입장권이 필요한 갤러리이며 피아노가 유료 구역 안에 있을 수 있습니다(입장료는 나와 있지 않습니다). New Orleans의 StudioBE(2941 Royal Street)에 놓인 것으로 안내된 Sing for Hope Piano 'Plant a Smile'로, 프로그램은 2025년 2월 4~20일 공개 전시 뒤 이곳을 상설 보금자리로 적고 있습니다. 갤러리 운영 시간에 관람객이 칠 수 있을 것으로 보이며, 2025년 전시 때 안내된 시간은 수~토 11:00~18:00, 일 14:00~18:00였습니다. 2025년 프로그램 페이지 기준이며, 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","StudioBE, New Orleans, LA","se",""],

 ["A","Chicago O'Hare International Airport","Concourse C, Gate C17","Chicago · IL","airport","g",2025,41.98026,-87.90899,["A public baby grand stands next to Gate C17 in Concourse C, by the Beaudevin wine bar, past security. In January 2025 The Washington Post and other outlets reported that a piano tuner repaired it during a layover and that it was open to the public again. This rests on news reports, not an official airport page.","Un piano de media cola de uso público está junto a la puerta C17 del Concourse C, al lado del bar de vinos Beaudevin, después del control de seguridad. En enero de 2025, The Washington Post y otros medios informaron que un afinador lo reparó durante una escala y que volvía a estar abierto al público. La información proviene de medios de prensa, no de una página oficial del aeropuerto.","보안검색대 안쪽 Concourse C의 Gate C17 옆, Beaudevin 와인바 곁에 공공 베이비그랜드 피아노가 있습니다. 2025년 1월 The Washington Post 등 여러 매체가 경유 중이던 피아노 조율사가 이 피아노를 고쳤고 다시 일반에 열렸다고 보도했습니다. 공항 공식 안내가 아닌 언론 보도 기준입니다."],null,"","Chicago O'Hare International Airport, Chicago, IL","mw",""],
 ["A","Downtown Des Moines Skywalk","City Sounds · 2 indoor pianos","Des Moines · IA","other","u",2026,41.59119,-93.63057,["Two indoor upright pianos sit in the downtown Des Moines skywalk system; the exact spots are not published. They are available year-round for anyone to play. Listed by the program in 2026 (installed with the Greater Des Moines Partnership), so look around the skywalks or ask locally to find them.","Hay dos pianos verticales bajo techo en la red de pasarelas (skywalks) del centro de Des Moines; no se han publicado los puntos exactos. Están disponibles todo el año para quien quiera tocar. Figuran en la información del programa de 2026 (instalados junto con Greater Des Moines Partnership), así que conviene recorrer las pasarelas o preguntar en el lugar para encontrarlos.","Des Moines 도심 스카이워크(skywalk) 안에 실내 업라이트 피아노 2대가 있으며, 정확한 위치는 공개되어 있지 않습니다. 연중 누구나 연주할 수 있습니다. 2026년 프로그램 안내에 실려 있고 Greater Des Moines Partnership과 함께 설치한 것으로, 위치는 스카이워크를 둘러보시거나 현장에서 문의하시기 바랍니다."],null,"","Downtown Des Moines Skywalk, Des Moines, IA","mw",""],
 ["A","Downtown Vermillion street piano","Main Street · outdoor community piano","Vermillion · SD","street","u",2025,42.779398,-96.933694,["An outdoor community piano stands under the awning outside Wynie Mae's AVEDA Salon & Spa on Main Street in downtown Vermillion; Vermillion's arts group says it was installed in September 2020. An August 2025 KWIT radio story describes passersby playing it on summer days, including a local who stops to play many days a week on the way to the library. Whether it is put away in winter is not stated.","Un piano comunitario al aire libre está bajo el toldo frente a Wynie Mae's AVEDA Salon & Spa, en Main Street, en el centro de Vermillion; el grupo de arte local indica que se instaló en septiembre de 2020. Un reportaje de la radio KWIT de agosto de 2025 describe a transeúntes tocándolo en días de verano, entre ellos un vecino que se detiene a tocar muchos días a la semana de camino a la biblioteca. No se indica si se guarda en invierno.","Vermillion 시내 Main Street의 Wynie Mae's AVEDA Salon & Spa 앞 차양 아래에 야외 공용 피아노가 있습니다. 지역 예술 단체에 따르면 2020년 9월에 놓였습니다. 2025년 8월 KWIT 라디오 보도는 여름날 지나가던 사람들이 이 피아노를 치는 모습을 전했고, 도서관 가는 길에 일주일에 여러 번 들러 치는 주민도 소개했습니다. 겨울에 치워 두는지는 나와 있지 않습니다."],null,"","Downtown Vermillion street piano, Vermillion, SD","mw",""],
 ["A","Eskenazi Health","Marianne Tobias Music Program · Eli Lilly and Company Foundation Concourse","Indianapolis · IN","hospital","",2024,39.77752,-86.184286,["A piano stands in the Eli Lilly and Company Foundation Concourse on the downtown Eskenazi Health campus in Indianapolis, part of the Marianne Tobias Music Program. It is available to the public 24 hours a day, and both professionals and amateurs play it. A local TV report in June 2024 described it as open around the clock.","Hay un piano en el Eli Lilly and Company Foundation Concourse del campus de Eskenazi Health en el centro de Indianapolis, dentro del Marianne Tobias Music Program. Está disponible para el público las 24 horas del día y lo tocan tanto profesionales como aficionados. Un reportaje de televisión local de junio de 2024 lo describía como abierto al público a toda hora.","Indianapolis 시내 Eskenazi Health 캠퍼스의 Eli Lilly and Company Foundation Concourse에 Marianne Tobias Music Program의 피아노가 있습니다. 일반인에게 24시간 열려 있으며, 전문 연주자와 아마추어 모두 연주합니다. 2024년 6월 지역 방송 보도에서 24시간 개방된 피아노로 소개되었습니다."],null,"","Eskenazi Health, Indianapolis, IN","mw",""],
 ["A","Kansas State University","K-State Student Union","Manhattan · KS","university","",2021,39.1998,-96.58101,["Several pianos are placed throughout the K-State Student Union. They are available anytime for anyone who wishes to play, with no scheduling of performers. The statement dates from September 2021 and the page is no longer online, so current status is unconfirmed.","Hay varios pianos distribuidos por el K-State Student Union. Están disponibles en cualquier momento para quien quiera tocar, sin programación de intérpretes. La información es de septiembre de 2021 y la página ya no está en línea, así que la situación actual no está confirmada.","K-State Student Union 건물 곳곳에 피아노 여러 대가 있습니다. 치고 싶은 사람은 누구나 언제든 칠 수 있으며 연주자를 따로 배정하지 않습니다. 2021년 9월 자료이고 해당 페이지는 현재 내려가 있어 지금 상태는 확인되지 않았습니다."],null,"","Kansas State University, Manhattan, KS","mw",""],
 ["A","Piano Alley","Kimball piano · southeast alley off the Square","Jasper · IN","street","u",2023,38.391429,-86.930826,["A restored Kimball piano sits at the start of the southeast alley off the Square in downtown Jasper, known as Piano Alley. Anyone can play it. Unveiled in October 2023; the source does not say whether it stays out in winter. Not confirmed as still in place.","Un piano Kimball restaurado se encuentra al inicio del callejón sureste que sale de la plaza (the Square) en el centro de Jasper, conocido como Piano Alley. Cualquiera puede tocarlo. Se inauguró en octubre de 2023; la fuente no indica si permanece al aire libre en invierno. No se ha confirmado que siga en el lugar.","Jasper 시내 광장(the Square)에서 남동쪽으로 난 골목 입구, Piano Alley에 복원된 Kimball 피아노가 놓여 있습니다. 누구나 칠 수 있습니다. 2023년 10월에 공개되었으며, 겨울에도 밖에 두는지는 자료에 나와 있지 않습니다. 지금도 있는지는 확인되지 않았습니다."],null,"","Piano Alley, Jasper, IN","mw",""],
 ["A","Austin Public Library – Windsor Park Branch","Upright piano inside the branch","Austin · TX","library","u",2024,30.311664,-97.690216,["An upright piano is reported inside the Windsor Park Branch of Austin Public Library (5833 Westminster Dr). A community-run database of Austin pianos marks it playable, fairly well tuned with a few notes out, as of a visit on August 3, 2024; library visitors can presumably play during branch hours. The official branch page does not mention it, and it is not confirmed as still in place.","Se informa de un piano vertical dentro de la Windsor Park Branch de Austin Public Library (5833 Westminster Dr). Una base de datos comunitaria de pianos de Austin lo marca como utilizable, bastante bien afinado y con algunas notas desajustadas, según una visita del 3 de agosto de 2024; es de suponer que los visitantes pueden tocarlo en el horario de la sucursal. La página oficial de la sucursal no lo menciona y no se ha confirmado que siga en su lugar.","Austin Public Library Windsor Park Branch(5833 Westminster Dr) 안에 업라이트 피아노가 있다고 알려져 있습니다. Austin 피아노를 모은 커뮤니티 데이터베이스에는 2024년 8월 3일 방문 기준 연주 가능(조율은 무난하나 몇 음이 어긋남)으로 올라 있으며, 지점 운영 시간에 방문객이 칠 수 있을 것으로 보입니다. 공식 지점 페이지에는 피아노 언급이 없고, 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","Austin Public Library – Windsor Park Branch, Austin, TX","mt",""],
 ["A","Coalville City Hall","Art Pianos for All","Coalville · UT","other","u",2026,40.91686,-111.39843,["An Art Pianos for All upright in a public area of Coalville City Hall, 10 S Main St. The program places its pianos for all to play, during building hours. It is in the arts council's current public art guide, but that page is undated and a 2022 listing said only five of the program's pianos were still maintained, so check before you go.","Piano vertical del programa Art Pianos for All, en un área pública del Coalville City Hall (10 S Main St.). El programa coloca sus pianos para que cualquiera los toque, dentro del horario del edificio. Figura en la guía de arte público vigente del consejo de artes, pero la página no tiene fecha y un listado de 2022 decía que solo cinco pianos del programa seguían en mantenimiento; conviene confirmar antes de ir.","Art Pianos for All 프로그램의 업라이트 피아노로, Coalville City Hall(10 S Main St.)의 공용 공간에 있습니다. 누구나 칠 수 있도록 둔 피아노이며 건물 운영 시간에 이용할 수 있습니다. 예술위원회의 현행 공공미술 안내에 실려 있으나 페이지에 날짜가 없고, 2022년 자료에는 프로그램 피아노 중 5대만 관리되고 있다고 되어 있어 방문 전 확인이 필요합니다."],null,"","Coalville City Hall, Coalville, UT","mt",""],
 ["A","Dallas Public Library – Lakewood Branch","Branch piano · no sign-up reported","Dallas · TX","library","",2026,32.810375,-96.753423,["The Lakewood Branch of Dallas Public Library (6121 Worth Street) lists a piano among its features; the type of piano is not stated. A third-party library directory says patrons may play it during regular branch hours without signing up, and the branch can confirm at 214-670-1376. Listed on the official branch page as of November 2026; the directory entry was checked in September 2026.","La Lakewood Branch de Dallas Public Library (6121 Worth Street) incluye un piano entre sus servicios; no se indica el tipo de piano. Un directorio externo de bibliotecas señala que los usuarios pueden tocarlo en el horario habitual de la sucursal sin inscribirse; se puede confirmar con la sucursal en el 214-670-1376. Figura en la página oficial de la sucursal a noviembre de 2026; la entrada del directorio se verificó en septiembre de 2026.","Dallas Public Library Lakewood Branch(6121 Worth Street)는 시설 목록에 피아노를 올려 두고 있으며, 피아노 종류는 나와 있지 않습니다. 외부 도서관 안내 사이트에 따르면 이용자는 지점 운영 시간에 신청 없이 칠 수 있으며, 지점(214-670-1376)에 확인할 수 있습니다. 2026년 11월 기준 공식 지점 페이지에 올라 있고, 외부 안내는 2026년 9월에 확인된 내용입니다."],null,"","Dallas Public Library – Lakewood Branch, Dallas, TX","mt",""],
 ["A","Dallas Public Library – North Oak Cliff Branch","Branch piano · ask staff","Dallas · TX","library","",2026,32.744817,-96.827024,["The North Oak Cliff Branch of Dallas Public Library (302 West Tenth Street) lists a piano among its features, alongside the auditorium and conference room; the type of piano is not stated. No rules for playing are published and use may be tied to the auditorium, so ask branch staff. Listed on the official branch page as of November 2026.","La North Oak Cliff Branch de Dallas Public Library (302 West Tenth Street) incluye un piano entre sus servicios, junto al auditorio y la sala de conferencias; no se indica el tipo de piano. No se publican normas de uso y es posible que dependa del uso del auditorio, así que conviene preguntar al personal. Figura en la página oficial de la sucursal a noviembre de 2026.","Dallas Public Library North Oak Cliff Branch(302 West Tenth Street)는 시설 목록에 강당·회의실과 나란히 피아노를 올려 두고 있으며, 피아노 종류는 나와 있지 않습니다. 이용 규칙은 공개되어 있지 않고 강당 이용과 묶여 있을 수 있으므로 지점 직원에게 문의하시기 바랍니다. 2026년 11월 기준 공식 지점 페이지에 올라 있습니다."],null,"","Dallas Public Library – North Oak Cliff Branch, Dallas, TX","mt",""],
 ["A","Dallas Public Library – Renner Frankford Branch","Branch piano · ask staff","Dallas · TX","library","",2026,32.997721,-96.794614,["The Renner Frankford Branch of Dallas Public Library (6400 Frankford Road) lists a piano among its features; the type of piano is not stated. No rules for playing are published, so ask branch staff before sitting down. Listed on the official branch page as of November 2026.","La Renner Frankford Branch de Dallas Public Library (6400 Frankford Road) incluye un piano entre sus servicios; no se indica el tipo de piano. No se publican normas de uso, así que conviene preguntar al personal antes de tocar. Figura en la página oficial de la sucursal a noviembre de 2026.","Dallas Public Library Renner Frankford Branch(6400 Frankford Road)는 시설 목록에 피아노를 올려 두고 있으며, 피아노 종류는 나와 있지 않습니다. 이용 규칙은 공개되어 있지 않으므로 치기 전에 지점 직원에게 문의하시기 바랍니다. 2026년 11월 기준 공식 지점 페이지에 올라 있습니다."],null,"","Dallas Public Library – Renner Frankford Branch, Dallas, TX","mt",""],
 ["A","Denver International Airport","Center of Concourse B · United","Denver · CO","airport","",2025,39.85635,-104.67641,["In December 2025 United Airlines placed a grand piano in the center of Concourse B, and CBS Colorado reported that anyone who knows how to play was welcome to. Denver7 and the travel blog Live and Let's Fly reported the same. It appears to have been a holiday-season installation, and it has not been confirmed whether the piano is still there.","En diciembre de 2025, United Airlines colocó un piano de cola en el centro del Concourse B, y CBS Colorado informó que cualquiera que supiera tocar era bienvenido. Denver7 y el blog de viajes Live and Let's Fly publicaron lo mismo. Parece haber sido una instalación de la temporada navideña, y no se ha confirmado si el piano sigue allí.","2025년 12월 United 항공이 Concourse B 한가운데에 그랜드 피아노를 놓았고, CBS Colorado는 칠 줄 아는 사람이면 누구나 환영한다고 보도했습니다. Denver7과 여행 블로그 Live and Let's Fly도 같은 내용을 전했습니다. 연휴 기간 한정 설치로 보이며, 지금도 피아노가 있는지는 확인되지 않았습니다."],null,"","Denver International Airport, Denver, CO","mt",""],
 ["A","Firehouse Alley Parking Structure","Pianos About Town · rotating painted piano","Fort Collins · CO","street","u",2026,40.58796,-105.07332,["A painted Pianos About Town piano is listed at the Firehouse Alley Parking Structure in Fort Collins. The program invites people to admire the artwork and play a tune. Based on the program's 2026 location list. Pianos rotate among about 20 summer and 6 winter sites, so the piano here changes; confirm before a visit.","Hay un piano pintado de Pianos About Town registrado en Firehouse Alley Parking Structure, en Fort Collins. El programa invita a admirar la obra y tocar una melodía. Según la lista de ubicaciones 2026 del programa; los pianos rotan entre unos 20 sitios en verano y 6 en invierno, por lo que el piano de este punto cambia y conviene confirmarlo antes de ir.","Fort Collins의 Firehouse Alley Parking Structure에 Pianos About Town의 페인팅 피아노가 있는 것으로 등록되어 있습니다. 누구나 작품을 감상하고 한 곡 연주해 볼 수 있도록 한 프로그램입니다. 2026년 프로그램 위치 목록 기준이며, 피아노가 여름 약 20곳·겨울 약 6곳을 돌며 교체되므로 방문 전에 확인하시기 바랍니다."],null,"","Firehouse Alley Parking Structure, Fort Collins, CO","mt",""],
