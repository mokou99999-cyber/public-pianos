 ["B","USF Marshall Student Center","Tampa Tunes · Centre Gallery, 2nd floor","Tampa · FL","culture","u",2024,28.06374,-82.41371,["A Tampa Tunes piano is in the Centre Gallery on the 2nd floor of the Marshall Student Center at the University of South Florida. It is free to play, but it is indoors in a university building, so expect access only while the building is open. The information dates from November 2024, so confirm it is still there.","Hay un piano de Tampa Tunes en la Centre Gallery, en el segundo piso del Marshall Student Center de la University of South Florida. Se puede tocar gratis, pero está dentro de un edificio universitario, por lo que el acceso depende del horario del edificio. La información es de noviembre de 2024, así que confirme que siga allí.","University of South Florida의 Marshall Student Center 2층 Centre Gallery에 Tampa Tunes 피아노가 있습니다. 무료로 연주할 수 있지만 대학 건물 실내에 있어 건물이 열려 있는 시간에만 이용할 수 있습니다. 2024년 11월 자료에 근거한 정보이므로 지금도 있는지 확인하시기 바랍니다."],null,"","USF Marshall Student Center, Tampa, FL","se",""],
 ["B","Alley Works","B-Town Piano Project · W 6th St","Bloomington · IN","other","",2021,39.16748,-86.535178,["A piano from the B-Town Piano Project was hosted at Alley Works (217 W 6th St) in Bloomington. It appears to be open to anyone during the venue's opening hours, though play rules are not stated. Listed as a host site on the project website in 2021. Not confirmed as still in place.","Alley Works (217 W 6th St), en Bloomington, acogió un piano del B-Town Piano Project. Al parecer cualquiera puede tocarlo durante el horario de apertura, aunque no se indican normas de uso. Figuraba como sede en el sitio web del proyecto en 2021. No se ha confirmado que siga en el lugar.","Bloomington의 Alley Works(217 W 6th St)는 B-Town Piano Project 피아노가 놓인 곳으로 소개되었습니다. 운영 시간 중에는 누구나 칠 수 있는 것으로 보이나, 이용 규칙은 명시되어 있지 않습니다. 2021년 프로젝트 웹사이트에 설치 장소로 올라 있었으며, 지금도 있는지는 확인되지 않았습니다."],null,"","Alley Works, Bloomington, IN","mw",""],
 ["B","Artisan Alley","B-Town Piano Project · W 2nd St","Bloomington · IN","other","",2021,39.161465,-86.535298,["Artisan Alley (222 W 2nd St) in Bloomington is listed as a host site of the B-Town Piano Project, and a November 2021 IPM article confirms a piano there; the type of piano is not stated. The piano is expected to be open to anyone during open hours. Last documented in 2021; not confirmed as still in place.","Artisan Alley (222 W 2nd St), en Bloomington, figura como lugar anfitrión del B-Town Piano Project, y un artículo de IPM de noviembre de 2021 confirma que hay un piano allí; no se indica el tipo de piano. Se espera que cualquiera pueda tocar el piano en el horario de apertura. Documentado por última vez en 2021; no se ha confirmado que siga en su lugar.","Bloomington의 Artisan Alley(222 W 2nd St)는 B-Town Piano Project의 호스트 장소로 올라 있습니다. 2021년 11월 IPM 기사도 이곳에 피아노가 있다고 확인했으며, 피아노 종류는 나와 있지 않습니다. 운영 시간에 누구나 칠 수 있을 것으로 보입니다. 마지막 기록은 2021년이며, 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","Artisan Alley, Bloomington, IN","mw",""],
 ["B","Artisan Alley","B-Town Piano Project · W Kirkwood Ave","Bloomington · IN","other","",2021,39.166733,-86.542395,["A piano from the B-Town Piano Project was hosted at Artisan Alley (804 W Kirkwood Ave) in Bloomington. It appears to be open to anyone during the venue's opening hours, though play rules are not stated. Listed as a host site on the project website in 2021. Not confirmed as still in place.","Artisan Alley (804 W Kirkwood Ave), en Bloomington, acogió un piano del B-Town Piano Project. Al parecer cualquiera puede tocarlo durante el horario de apertura, aunque no se indican normas de uso. Figuraba como sede en el sitio web del proyecto en 2021. No se ha confirmado que siga en el lugar.","Bloomington의 Artisan Alley(804 W Kirkwood Ave)는 B-Town Piano Project 피아노가 놓인 곳으로 소개되었습니다. 운영 시간 중에는 누구나 칠 수 있는 것으로 보이나, 이용 규칙은 명시되어 있지 않습니다. 2021년 프로젝트 웹사이트에 설치 장소로 올라 있었으며, 지금도 있는지는 확인되지 않았습니다."],null,"","Artisan Alley, Bloomington, IN","mw",""],
 ["B","Bloomington Transit Center","Giving Piano Initiative · IU Jacobs School of Music Project Jumpstart","Bloomington · IN","station","u",2018,39.164253,-86.532364,["A retired school piano with a cracked frame was placed at the downtown Bloomington Transit Center through the Giving Piano Initiative of IU Jacobs School of Music's Project Jumpstart. Anyone may play any type of music at any time while the transit center is open. Last documented in April 2018, with no later confirmation. Not confirmed as still in place.","Un piano escolar retirado, con el armazón agrietado, se colocó en Bloomington Transit Center, la terminal de autobuses del centro, a través de la Giving Piano Initiative de Project Jumpstart (IU Jacobs School of Music). Cualquiera puede tocar cualquier tipo de música en cualquier momento mientras la terminal esté abierta. Documentado por última vez en abril de 2018, sin confirmación posterior. No se ha confirmado que siga en el lugar.","Bloomington 시내 버스 환승센터인 Bloomington Transit Center에 IU Jacobs School of Music Project Jumpstart의 Giving Piano Initiative를 통해 프레임에 금이 간 퇴역 학교 피아노가 놓였습니다. 환승센터가 열려 있는 동안 누구나 어떤 음악이든 언제든 칠 수 있습니다. 마지막 기록은 2018년 4월이고 이후 확인된 자료가 없어, 지금도 있는지는 확인되지 않았습니다."],null,"","Bloomington Transit Center, Bloomington, IN","mw",""],
 ["B","BuffaLouie's","B-Town Piano Project · outside the restaurant","Bloomington · IN","street","u",2021,39.165956,-86.527087,["A decorated piano from the B-Town Piano Project was placed outdoors in front of BuffaLouie's restaurant in Bloomington. Anyone passing by can play it. Last documented in November 2021. Not confirmed as still in place.","Un piano decorado del B-Town Piano Project se colocó al aire libre frente al restaurante BuffaLouie's, en Bloomington. Cualquiera que pase puede tocarlo. Documentado por última vez en noviembre de 2021. No se ha confirmado que siga en el lugar.","Bloomington의 BuffaLouie's 식당 앞 야외에 B-Town Piano Project의 장식된 피아노가 놓였습니다. 지나가는 누구나 칠 수 있습니다. 마지막 기록은 2021년 11월이며, 지금도 있는지는 확인되지 않았습니다."],null,"","BuffaLouie's, Bloomington, IN","mw",""],
 ["B","Chelsea Hospital","Main lobby","Chelsea · MI","hospital","g",2026,42.31003,-84.01691,["A Knabe grand stands in the main lobby of Chelsea Hospital (Trinity Health). Experienced pianists from the visiting public are welcome to play, but should arrange it through the hospital's director of philanthropy. Reported in March 2026.","Hay un piano de cola Knabe en el vestíbulo principal de Chelsea Hospital (Trinity Health). Los pianistas con experiencia entre el público visitante son bienvenidos, pero deben coordinarlo con el director de filantropía del hospital. Informado en marzo de 2026.","Chelsea Hospital(Trinity Health) 메인 로비에 Knabe 그랜드 피아노가 있습니다. 연주 경험이 있는 방문객은 칠 수 있으나, 병원의 director of philanthropy를 통해 미리 조율해야 합니다. 2026년 3월 보도 기준입니다."],null,"","Chelsea Hospital, Chelsea, MI","mw",""],
 ["B","Chicago Public Library, Uptown Branch","Bookable study rooms · upright piano","Chicago · IL","library","u",2026,41.958187,-87.654199,["The Uptown Branch of Chicago Public Library has bookable study rooms, and a search-result snippet of the library's room-booking page (2026) says each room contains an upright piano, a music stand and a coat rack so patrons can practice or perform music. The full page could not be opened, so the booking rules, hours and whether a library card is needed are not known, and it is not confirmed that the pianos are still in place. Check with the branch before going; the map pin is at the branch's presumed address.","La sucursal Uptown de la Biblioteca Pública de Chicago tiene salas de estudio que se pueden reservar, y un fragmento de resultado de búsqueda de su página de reservas (2026) indica que cada sala tiene un piano vertical, un atril y un perchero para que los usuarios practiquen o interpreten música. No se pudo abrir la página completa, así que no se conocen las normas de reserva, el horario ni si hace falta carné, y no se ha confirmado que los pianos sigan allí. Consulte con la sucursal antes de ir; el marcador del mapa está en la dirección supuesta de la sucursal.","Chicago 공공도서관 Uptown 분관에는 예약해 쓰는 스터디룸이 있고, 도서관 방 예약 페이지의 검색 결과 요약(2026년)에는 방마다 업라이트 피아노·악보대·옷걸이가 있어 이용자가 연습하거나 연주할 수 있다고 나옵니다. 전체 페이지는 열리지 않아 예약 규칙·시간·도서관 카드 필요 여부는 알 수 없고, 지금도 피아노가 있는지는 확인되지 않았습니다. 가기 전에 분관에 문의하세요. 지도 위치는 분관의 추정 주소입니다."],null,"","Chicago Public Library, Uptown Branch, Chicago, IL","mw",""],
 ["B","Flint Bishop International Airport (FNT)","Flint School of Performing Arts community pianos","Flint · MI","airport","u",2019,42.963702,-83.746433,["A community piano painted by a local artist was placed at Flint Bishop International Airport by the Flint School of Performing Arts; its location inside the terminal is not stated. Anyone arriving or departing can play it. Announced in February 2019 as the school's third community piano. Not confirmed as still in place.","Flint School of Performing Arts colocó en Flint Bishop International Airport un piano comunitario pintado por un artista local; no se indica en qué parte de la terminal está. Cualquier persona que llegue o salga puede tocarlo. Se anunció en febrero de 2019 como el tercer piano comunitario de la escuela. No se ha confirmado que siga en el lugar.","Flint Bishop International Airport에 Flint School of Performing Arts가 지역 예술가가 칠한 커뮤니티 피아노를 놓았습니다. 터미널 안 어느 자리인지는 나와 있지 않습니다. 공항을 오가는 누구나 칠 수 있습니다. 2019년 2월에 이 학교의 세 번째 커뮤니티 피아노로 발표되었으며, 지금도 있는지는 확인되지 않았습니다."],null,"","Flint Bishop International Airport (FNT), Flint, MI","mw",""],
 ["B","Flint Farmers' Market","Flint School of Performing Arts community pianos","Flint · MI","other","",2019,43.016879,-83.687133,["A community piano from the Flint School of Performing Arts stands at the Flint Farmers' Market in Flint. Anyone is welcome to play during market hours (Tuesday, Thursday and Saturday). It was named as an existing community piano in a 2019 press release. Not confirmed as still in place.","Hay un piano comunitario de Flint School of Performing Arts en Flint Farmers' Market, en Flint. Cualquiera puede tocarlo en el horario del mercado (martes, jueves y sábados). Un comunicado de prensa de 2019 lo mencionaba como piano comunitario ya existente. No se ha confirmado que siga en el lugar.","Flint의 Flint Farmers' Market에 Flint School of Performing Arts의 커뮤니티 피아노가 있습니다. 시장이 열리는 시간(화·목·토요일)에 누구나 칠 수 있습니다. 2019년 보도자료에 이미 운영 중인 커뮤니티 피아노로 언급되었으며, 지금도 있는지는 확인되지 않았습니다."],null,"","Flint Farmers' Market, Flint, MI","mw",""],
 ["B","Genesee Valley Mall","Flint School of Performing Arts community pianos","Flint · MI","mall","",2019,42.979682,-83.769964,["A community piano from the Flint School of Performing Arts stands at Genesee Valley Mall in Flint. It appears to be open to anyone during mall hours, though play rules are not stated. It was named as an existing community piano in a 2019 press release. Not confirmed as still in place.","Hay un piano comunitario de Flint School of Performing Arts en Genesee Valley Mall, en Flint. Al parecer cualquiera puede tocarlo en el horario del centro comercial, aunque no se indican normas de uso. Un comunicado de prensa de 2019 lo mencionaba como piano comunitario ya existente. No se ha confirmado que siga en el lugar.","Flint의 Genesee Valley Mall에 Flint School of Performing Arts의 커뮤니티 피아노가 있습니다. 쇼핑몰 운영 시간 중에는 누구나 칠 수 있는 것으로 보이나, 이용 규칙은 명시되어 있지 않습니다. 2019년 보도자료에 이미 운영 중인 커뮤니티 피아노로 언급되었으며, 지금도 있는지는 확인되지 않았습니다."],null,"","Genesee Valley Mall, Flint, MI","mw",""],
 ["B","Hamilton Lane Library","Play Our Piano · upright","Hamilton · OH","library","u",2025,39.402712,-84.558256,["Hamilton Lane Library offers an upright piano for visitors to play during scheduled 'Play Our Piano' sessions, according to an August 2025 Lane Libraries event listing. Session days and times were not found. It is not confirmed that this is still the case.","La Hamilton Lane Library ofrece un piano vertical para que los visitantes toquen durante las sesiones programadas 'Play Our Piano', según un anuncio de Lane Libraries de agosto de 2025. No se encontraron los días ni horarios. No se ha confirmado que siga siendo así.","2025년 8월 Lane Libraries 행사 안내에 따르면 Hamilton Lane Library는 정해진 'Play Our Piano' 시간에 방문객이 업라이트 피아노를 칠 수 있게 합니다. 요일과 시간은 찾지 못했습니다. 지금도 그런지는 확인되지 않았습니다."],null,"","Hamilton Lane Library, Hamilton, OH","mw",""],
 ["B","Harold Washington Library Center","Arts & Music practice rooms","Chicago · IL","library","u",2026,41.87616,-87.62811,["Six practice rooms with upright pianos, plus a Chamber Room with a baby grand, in the Arts & Music area. Use is limited to one hour; reserve up to a week ahead online, in person or by phone, or walk in if a room is free. Photo ID is required (a library card is one accepted ID). Current as of 2026.","Seis salas de práctica con pianos verticales, más una Chamber Room con piano de media cola, en el área de Arts & Music. El uso es de hasta una hora; se reserva con hasta una semana de anticipación en línea, en persona o por teléfono, o se puede entrar sin reserva si hay sala libre. Se requiere identificación con foto (la credencial de la biblioteca es una de las aceptadas). Vigente en 2026.","Arts & Music 구역에 업라이트 피아노가 있는 연습실 6곳과 베이비 그랜드 피아노가 있는 Chamber Room이 있습니다. 최대 1시간 이용할 수 있으며, 온라인·방문·전화로 1주일 전부터 예약하거나 빈 방이 있으면 바로 이용할 수 있습니다. 사진이 있는 신분증이 필요하며 도서관 카드도 신분증으로 인정됩니다. 2026년 현재 기준입니다."],null,"","Harold Washington Library Center, Chicago, IL","mw",""],
 ["B","Indiana Memorial Union","South Lounge","Bloomington · IN","university","",2010,39.167703,-86.523707,["A piano stands in the South Lounge of the Indiana Memorial Union in Bloomington. Facilities staff said there is no policy against playing it, but the lounge is a quiet-study space and courtesy is expected. Last documented in 2010 (article updated in 2014). Not confirmed as still in place.","Hay un piano en el South Lounge de Indiana Memorial Union, en Bloomington. El personal del edificio indicó que no existe ninguna norma que impida tocarlo, pero el salón es un espacio de estudio en silencio y se espera consideración. Documentado por última vez en 2010 (artículo actualizado en 2014). No se ha confirmado que siga en el lugar.","Bloomington의 Indiana Memorial Union South Lounge에 피아노가 있습니다. 시설 직원은 연주를 금지하는 규정이 없다고 밝혔으나, 조용히 공부하는 공간이므로 배려가 필요합니다. 마지막 기록은 2010년(기사 2014년 수정)이며, 지금도 있는지는 확인되지 않았습니다."],null,"","Indiana Memorial Union, Bloomington, IN","mw",""],
 ["B","Indiana Memorial Union","Gallery Starbucks · white Baldwin baby grand","Bloomington · IN","university","g",2013,39.16793,-86.52362,["A white Baldwin baby grand stands in the Gallery Starbucks of the Indiana Memorial Union in Bloomington. According to the building's associate director, anyone can sit down and play. Last documented in January 2013, when it was in disrepair with restoration planned. Not confirmed as still in place.","Un piano de cola pequeño (baby grand) Baldwin de color blanco se encuentra en el Gallery Starbucks de Indiana Memorial Union, en Bloomington. Según el director adjunto del edificio, cualquiera puede sentarse a tocar. Documentado por última vez en enero de 2013, cuando estaba en mal estado y se preveía restaurarlo. No se ha confirmado que siga en el lugar.","Bloomington의 Indiana Memorial Union 안 Gallery Starbucks에 흰색 Baldwin 베이비 그랜드 피아노가 있습니다. 건물 부책임자에 따르면 누구나 앉아서 칠 수 있습니다. 마지막 기록은 2013년 1월로, 당시 상태가 좋지 않아 복원이 계획되어 있었습니다. 지금도 있는지는 확인되지 않았습니다."],null,"","Indiana Memorial Union, Bloomington, IN","mw",""],
 ["B","Kansas City Public Library, Central","Study Room 414 · Clavinova digital piano","Kansas City · MO","library","d",2026,39.102581,-94.583883,["Room 414 on the fourth floor of Kansas City Public Library's Central Library is a reservable study room for up to two people with a bench and a Clavinova digital piano. It is free with a library account, with a two-hour limit; the key and headphones are picked up at the 3South desk. This is from the library's official spaces page, checked November 2026.","La sala 414, en el cuarto piso de la Central Library de la Kansas City Public Library, es una sala de estudio reservable para hasta dos personas, con banqueta y un piano digital Clavinova. Es gratuita con cuenta de la biblioteca y tiene un límite de dos horas; la llave y los auriculares se recogen en el mostrador 3South. Información de la página oficial de espacios de la biblioteca, consultada en noviembre de 2026.","Kansas City 공공도서관 중앙관 4층 414호는 최대 2명이 예약해 쓰는 스터디룸으로, 의자와 Clavinova 디지털 피아노가 있습니다. 도서관 계정이 있으면 무료이고 2시간까지 쓸 수 있으며, 열쇠와 헤드폰은 3South 데스크에서 받습니다. 도서관 공식 공간 안내 페이지(2026년 11월 확인)에 따른 내용입니다."],null,"","Kansas City Public Library, Central, Kansas City, MO","mw",""],
 ["B","Minneapolis Central Library","Anna M. Heilmaier Piano Room","Minneapolis · MN","library","g",2026,44.98061,-93.26996,["A grand piano in a soundproofed room at Minneapolis Central Library (Hennepin County Library). Patrons play by online reservation: age 18 and up (a guardian books for a child), one hour per day and three hours per week. Current as of 2026; whether a library card is required is not confirmed.","Piano de cola en una sala insonorizada de la Minneapolis Central Library (Hennepin County Library). Los usuarios tocan con reserva en línea: mayores de 18 años (un tutor reserva por un menor), una hora por día y tres horas por semana. Vigente en 2026; no está confirmado si se requiere credencial de la biblioteca.","Minneapolis Central Library(Hennepin County Library)의 방음실에 그랜드 피아노가 있습니다. 온라인 예약으로 이용하며, 만 18세 이상(어린이는 보호자가 예약)이 하루 1시간, 주 3시간까지 칠 수 있습니다. 2026년 현재 기준이며 도서관 카드가 필요한지는 확인되지 않았습니다."],null,"","Minneapolis Central Library, Minneapolis, MN","mw",""],
 ["B","Minneapolis-Saint Paul Int'l Airport","Terminal 1 baggage claim, by carousel 6","Minneapolis · MN","airport","g",2018,44.88506,-93.21444,["In June 2018 a Kawai baby grand stood outside security on level one of Terminal 1 (Lindbergh), in arrivals next to baggage claim #6, and was open to all comers. That 2018 article is the most recent source found. A Kawai baby grand is now reported near Gate H12 in Terminal 2, so this piano may have moved, and it has not been confirmed whether it is still here.","En junio de 2018 había un piano de media cola Kawai fuera del control de seguridad, en el nivel uno de la Terminal 1 (Lindbergh), en llegadas junto a la cinta de equipaje n.º 6, abierto a cualquiera. Ese artículo de 2018 es la fuente más reciente encontrada. Ahora se menciona un piano de media cola Kawai cerca de la puerta H12 de la Terminal 2, por lo que este piano podría haberse trasladado; no se ha confirmado si sigue aquí.","2018년 6월 기사에 따르면 Terminal 1(Lindbergh) 1층 도착 구역, 보안검색대 밖 6번 수하물 수취대 옆에 Kawai 베이비그랜드 피아노가 있었고 누구나 칠 수 있었습니다. 찾은 근거 가운데 이 2018년 기사가 가장 최근 것입니다. 지금은 Terminal 2 Gate H12 근처에 Kawai 베이비그랜드가 있다고 하여 이 피아노가 옮겨졌을 수 있으며, 지금도 이 자리에 있는지는 확인되지 않았습니다."],null,"","Minneapolis-Saint Paul Int'l Airport, Minneapolis, MN","mw",""],
 ["B","Monroe County Public Library","B-Town Piano Project · lobby","Bloomington · IN","library","",2021,39.166705,-86.53048,["Two pianos were reported in the lobby of the Monroe County Public Library in Bloomington, linked to the B-Town Piano Project. They appear to be open to anyone during library hours, though play rules are not stated. Last documented in November 2021, and they may have been a temporary display. Not confirmed as still in place.","Se informó de dos pianos en el vestíbulo de Monroe County Public Library, en Bloomington, vinculados al B-Town Piano Project. Al parecer cualquiera puede tocarlos durante el horario de la biblioteca, aunque no se indican normas de uso. Documentados por última vez en noviembre de 2021; es posible que fueran una exhibición temporal. No se ha confirmado que sigan en el lugar.","Bloomington의 Monroe County Public Library 로비에 B-Town Piano Project와 관련된 피아노 두 대가 있다고 소개되었습니다. 도서관 운영 시간 중에는 누구나 칠 수 있는 것으로 보이나, 이용 규칙은 명시되어 있지 않습니다. 마지막 기록은 2021년 11월이며, 임시 전시였을 가능성이 있습니다. 지금도 있는지는 확인되지 않았습니다."],null,"","Monroe County Public Library, Bloomington, IN","mw",""],
 ["B","Osceola Public Library","Genealogy Room · digital piano · ages 6+","Osceola · IA","library","d",2024,41.031781,-93.767961,["Osceola Public Library bought a digital piano for people who have no piano at home; it is in the upstairs Genealogy Room. A July 2024 local news report says patrons aged 6 and up (6–10 with an adult) may play during library hours when the room is free, and a librarian can reserve the room. It is not confirmed that this is still the case.","La Biblioteca Pública de Osceola compró un piano digital para quienes no tienen piano en casa; está en la Genealogy Room del piso superior. Según una noticia local de julio de 2024, los usuarios de 6 años en adelante (de 6 a 10, con un adulto) pueden tocarlo en horario de biblioteca cuando la sala está libre, y el personal puede reservar la sala. No se ha confirmado que siga siendo así.","Osceola 공공도서관은 집에 피아노가 없는 사람을 위해 디지털 피아노를 들여 위층 Genealogy Room에 두었습니다. 2024년 7월 지역 보도에 따르면 6세 이상(6~10세는 보호자 동반)이면 방이 비어 있을 때 도서관 개관 시간에 칠 수 있고, 사서에게 방 예약을 부탁할 수 있습니다. 지금도 그런지는 확인되지 않았습니다."],null,"","Osceola Public Library, Osceola, IA","mw",""],
 ["B","Oxford Lane Library","Play Our Piano · Fridays 4–5:30 pm · ages 8+","Oxford · OH","library","",2026,39.505405,-84.74822,["Oxford Lane Library holds 'Play Our Piano' sessions at its lobby piano on Fridays from 4:00 to 5:30 pm, open to ages 8 and up, whether experienced pianists, beginners or listeners. The Lane Libraries event calendar lists the sessions through August 2026.","La Oxford Lane Library organiza sesiones 'Play Our Piano' con el piano del vestíbulo los viernes de 4:00 a 5:30 pm, para mayores de 8 años, ya sean pianistas con experiencia, principiantes u oyentes. El calendario de Lane Libraries anuncia las sesiones hasta agosto de 2026.","Oxford Lane Library는 매주 금요일 오후 4시~5시 30분 로비 피아노로 'Play Our Piano' 시간을 엽니다. 8세 이상이면 숙련자든 초보든 듣기만 하든 참여할 수 있습니다. Lane Libraries 행사 일정에 2026년 8월까지 잡혀 있습니다."],null,"","Oxford Lane Library, Oxford, OH","mw",""],
 ["B","Pipestone County Medical Center","Lobby inside the front doors","Pipestone · MN","hospital","g",2022,43.99112,-96.32281,["A Steinway baby grand sits in the lobby just inside the front doors, placed in August 2022. Those with playing experience are welcome to sit down for a few songs; tell the front-desk attendant first. The evidence dates from September 2022.","Hay un piano de media cola Steinway en el vestíbulo, justo al pasar las puertas principales, colocado en agosto de 2022. Quienes tengan experiencia pueden sentarse a tocar algunas piezas; avise primero a la persona de la recepción. La referencia es de septiembre de 2022.","정문을 들어서면 바로 나오는 로비에 2022년 8월에 놓인 Steinway 베이비 그랜드 피아노가 있습니다. 연주 경험이 있는 분은 앉아서 몇 곡 칠 수 있으며, 먼저 안내 데스크 직원에게 알려야 합니다. 2022년 9월 자료 기준입니다."],null,"","Pipestone County Medical Center, Pipestone, MN","mw",""],
 ["B","Soma Coffee House and Juice Bar (East 3rd St)","B-Town Piano Project · East 3rd St","Bloomington · IN","other","u",2021,39.163836,-86.516241,["Soma Coffee House and Juice Bar (1400 E 3rd St) in Bloomington is listed as a host site of the B-Town Piano Project, and a November 2021 IPM article confirms a piano at the Soma on Third and Jordan. The piano is expected to be open to anyone during cafe hours. Last documented in 2021; not confirmed as still in place.","Soma Coffee House and Juice Bar (1400 E 3rd St), en Bloomington, figura como lugar anfitrión del B-Town Piano Project, y un artículo de IPM de noviembre de 2021 confirma que hay un piano en el Soma de Third y Jordan. Se espera que cualquiera pueda tocar el piano en el horario de la cafetería. Documentado por última vez en 2021; no se ha confirmado que siga en su lugar.","Bloomington의 Soma Coffee House and Juice Bar(1400 E 3rd St)는 B-Town Piano Project의 호스트 장소로 올라 있습니다. 2021년 11월 IPM 기사도 Third와 Jordan 교차로의 Soma에 피아노가 있다고 확인했습니다. 카페 영업시간에 누구나 칠 수 있을 것으로 보입니다. 마지막 기록은 2021년이며, 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","Soma Coffee House and Juice Bar (East 3rd St), Bloomington, IN","mw",""],
 ["B","Soma Coffee House and Juice Bar (Kirkwood)","B-Town Piano Project · Kirkwood","Bloomington · IN","other","",2021,39.166317,-86.53006,["Soma Coffee House and Juice Bar (322 E Kirkwood Ave) in Bloomington is listed as a host site of the B-Town Piano Project on the project's website; the type of piano is not stated. The piano is expected to be open to anyone during cafe hours. Last documented in 2021; not confirmed as still in place.","Soma Coffee House and Juice Bar (322 E Kirkwood Ave), en Bloomington, figura como lugar anfitrión del B-Town Piano Project en el sitio web del proyecto; no se indica el tipo de piano. Se espera que cualquiera pueda tocar el piano en el horario de la cafetería. Documentado por última vez en 2021; no se ha confirmado que siga en su lugar.","Bloomington의 Soma Coffee House and Juice Bar(322 E Kirkwood Ave)는 B-Town Piano Project의 호스트 장소로 올라 있습니다(프로젝트 웹사이트 기준, 피아노 종류는 나와 있지 않음). 카페 영업시간에 누구나 칠 수 있을 것으로 보입니다. 마지막 기록은 2021년이며, 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","Soma Coffee House and Juice Bar (Kirkwood), Bloomington, IN","mw",""],
 ["B","St. Louis Lambert International Airport","Terminal 1, lower level before security","St. Louis · MO","airport","g",2019,38.74994,-90.37482,["In June 2019 a travel blog described a year-round 'Play Me' grand piano, provided by HMSHost, on the lower level of Terminal 1 before security, at the Aero stage. It was open to anyone who can sit down and play a tune or two. No confirmation after 2019 has been found, so it is not known whether it is still there.","En junio de 2019, un blog de viajes describió un piano de cola 'Play Me' disponible todo el año, aportado por HMSHost, en el nivel inferior de la Terminal 1, antes del control de seguridad, junto al escenario Aero. Estaba abierto a cualquiera que quisiera sentarse a tocar una o dos piezas. No se ha encontrado ninguna confirmación posterior a 2019, por lo que no se sabe si sigue allí.","2019년 6월 한 여행 블로그는 Terminal 1 아래층 보안검색대 앞 Aero 무대 자리에 HMSHost가 둔 연중 'Play Me' 그랜드 피아노가 있다고 전했습니다. 앉아서 한두 곡 칠 줄 아는 사람이면 누구나 칠 수 있었습니다. 2019년 이후 확인된 근거가 없어 지금도 있는지는 확인되지 않았습니다."],null,"","St. Louis Lambert International Airport, St. Louis, MO","mw",""],
 ["B","Station Park","City of Hilliard · Hilliard Public Arts Commission · 1946 Kimball upright","Hilliard · OH","park","u",2022,40.034007,-83.160103,["A 1946 Kimball upright, donated in 2021 and painted by volunteers, stands in Station Park in Hilliard. Anyone can play it daily on a first-come, first-served basis; it is moved indoors at night. Last documented in July 2022, and it is not stated whether it returns each year. Not confirmed as still in place.","Un piano vertical Kimball de 1946, donado en 2021 y pintado por voluntarios, se encuentra en Station Park, en Hilliard. Cualquiera puede tocarlo a diario, por orden de llegada; por la noche se guarda en el interior. Documentado por última vez en julio de 2022; no se indica si vuelve cada año. No se ha confirmado que siga en el lugar.","Hilliard의 Station Park에 1946년산 Kimball 업라이트 피아노가 있습니다. 2021년에 기증받아 자원봉사자들이 칠한 피아노로, 매일 먼저 온 순서대로 누구나 칠 수 있고 밤에는 실내로 옮깁니다. 마지막 기록은 2022년 7월이며, 해마다 다시 놓는지는 나와 있지 않습니다. 지금도 있는지는 확인되지 않았습니다."],null,"","Station Park, Hilliard, OH","mw",""],
 ["B","Sutton Loop Park","Artists First · pavilion","Maplewood · MO","park","u",2017,38.610442,-90.320358,["A donated upright decorated by Artists First stands under the pavilion in Sutton Loop Park, Maplewood. Anyone visiting the park can play it. Installed in April 2017, with no later confirmation found. Not confirmed as still in place.","Un piano vertical donado y decorado por Artists First se encuentra bajo el pabellón de Sutton Loop Park, en Maplewood. Cualquier visitante del parque puede tocarlo. Se instaló en abril de 2017 y no se halló confirmación posterior. No se ha confirmado que siga en el lugar.","Maplewood의 Sutton Loop Park 파빌리온 아래에 Artists First가 꾸민 기증 업라이트 피아노가 있습니다. 공원을 찾는 누구나 칠 수 있습니다. 2017년 4월에 설치되었고 이후 확인된 자료는 없습니다. 지금도 있는지는 확인되지 않았습니다."],null,"","Sutton Loop Park, Maplewood, MO","mw",""],
 ["B","Town Square","Art Infusion 2023 · 'Come Play With Us'","Janesville · WI","park","u",2023,42.681262,-89.02356,["A piano painted during Art Infusion (Sept 8–10, 2023) is listed at Town Square on Water Street in Janesville under the name 'Come Play With Us'. The visitor bureau invites visitors to play it. The listing dates from 2023 and could not be fully verified. Not confirmed as still in place.","En Town Square, sobre Water Street, en Janesville, figura un piano pintado durante Art Infusion (del 8 al 10 de septiembre de 2023) con el nombre 'Come Play With Us'. La oficina de turismo invita a los visitantes a tocarlo. El listado es de 2023 y no pudo verificarse por completo. No se ha confirmado que siga en el lugar.","Janesville Water Street의 Town Square에 Art Infusion(2023년 9월 8~10일) 때 칠한 피아노가 'Come Play With Us'라는 이름으로 소개되어 있습니다. 관광 안내 기관이 방문객에게 연주를 권하고 있습니다. 2023년 자료이며 내용이 충분히 검증되지는 않았습니다. 지금도 있는지는 확인되지 않았습니다."],null,"","Town Square, Janesville, WI","mw",""],
 ["B","Village Pub","B-Town Piano Project","Bloomington · IN","other","",2021,39.167717,-86.533498,["Village Pub (206 N Walnut St) in Bloomington is listed as a host site of the B-Town Piano Project on the project's website and is also named in Bloom Magazine in December 2021; the type of piano is not stated. The piano is expected to be open to anyone during business hours. Last documented in 2021; not confirmed as still in place.","Village Pub (206 N Walnut St), en Bloomington, figura como lugar anfitrión del B-Town Piano Project en el sitio web del proyecto y también aparece en Bloom Magazine en diciembre de 2021; no se indica el tipo de piano. Se espera que cualquiera pueda tocar el piano en el horario del local. Documentado por última vez en 2021; no se ha confirmado que siga en su lugar.","Bloomington의 Village Pub(206 N Walnut St)은 B-Town Piano Project의 호스트 장소로 올라 있습니다(프로젝트 웹사이트 기준, 2021년 12월 Bloom Magazine에도 이름이 나옴, 피아노 종류는 나와 있지 않음). 영업시간에 누구나 칠 수 있을 것으로 보입니다. 마지막 기록은 2021년이며, 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","Village Pub, Bloomington, IN","mw",""],
 ["B","Westlake Porter Public Library","Meeting room","Westlake · OH","library","",2026,41.44762,-81.92399,["The library's piano(s) are in a meeting room and are primarily for scheduled public performances. Drop-in requests to play may be accommodated if the room is available, so ask staff. Based on 2026 information.","El piano (o los pianos) de la biblioteca están en una sala de reuniones y se usan principalmente para presentaciones públicas programadas. Las solicitudes sin cita para tocar pueden atenderse si la sala está disponible; pregunte al personal. Información de 2026.","도서관의 피아노는 회의실에 있으며 주로 일정이 잡힌 공개 공연에 쓰입니다. 피아노가 있는 방이 비어 있으면 예약 없이 요청해도 칠 수 있는 경우가 있으니 직원에게 문의하시기 바랍니다. 2026년 자료 기준입니다."],null,"","Westlake Porter Public Library, Westlake, OH","mw",""],
 ["B","Westwood Branch Library, Cincinnati","Meeting room piano · book the room","Cincinnati · OH","library","",2026,39.148154,-84.600303,["The Westwood Branch of the Public Library of Cincinnati and Hamilton County, on Epworth Ave, lists a piano in its meeting room, which is booked through the library's online room-booking system in one-hour slots by default (library listing checked November 2026). It is not stated whether the room may be booked just to play or practice the piano, so ask the branch first.","La sucursal Westwood de la biblioteca pública de Cincinnati y el condado de Hamilton, en Epworth Ave, indica que su sala de reuniones tiene un piano; la sala se reserva mediante el sistema de reservas en línea de la biblioteca, en turnos de una hora por defecto (listado de la biblioteca consultado en noviembre de 2026). No se indica si se puede reservar la sala solo para tocar o practicar el piano, así que pregunte primero en la sucursal.","Cincinnati·Hamilton County 공공도서관 Westwood 분관(Epworth Ave) 회의실에 피아노가 있다고 도서관 공간 목록에 나와 있습니다. 회의실은 도서관 온라인 예약으로 기본 1시간 단위로 빌립니다(2026년 11월 확인). 피아노를 치거나 연습하려고만 회의실을 빌릴 수 있는지는 나와 있지 않으니 먼저 분관에 물어보세요."],null,"","Westwood Branch Library, Cincinnati, Cincinnati, OH","mw",""],
 ["B","550 Brewing Taproom","Aztec Painted Pianos · 'Music Is Healing'","Aztec · NM","other","u",2020,36.821367,-107.994374,["'Music Is Healing' by Bonnie Adams, one of the Aztec Painted Pianos (Big Sound in a Small Town), was placed at 550 Brewing Taproom (119 E. Chuska St) in Aztec, New Mexico; an August 2020 Durango Herald report names this spot as one of the program's 'Play Me' piano sites. Anyone is encouraged to show up and play, though hours are not stated. A July 2024 local news report shows the program still running but says the pianos go out on the streets in summer, so they may not be there year-round, and this piano is not confirmed as still in place.","'Music Is Healing', de Bonnie Adams, uno de los Aztec Painted Pianos (Big Sound in a Small Town), se colocó en 550 Brewing Taproom (119 E. Chuska St), en Aztec, Nuevo México; un reportaje del Durango Herald de agosto de 2020 cita este lugar como uno de los puntos con pianos 'Play Me' del programa. Se anima a cualquiera a acercarse y tocar, aunque no se indica el horario. Una noticia local de julio de 2024 muestra que el programa sigue activo, pero dice que los pianos salen a la calle en verano, por lo que podrían no estar todo el año; no se ha confirmado que este piano siga en su lugar.","Aztec Painted Pianos(Big Sound in a Small Town) 프로그램의 피아노로, Bonnie Adams의 작품 'Music Is Healing'입니다. New Mexico주 Aztec의 550 Brewing Taproom(119 E. Chuska St)에 놓였으며, 2020년 8월 Durango Herald 기사가 이곳을 프로그램의 'Play Me' 피아노 장소로 꼽았습니다. 누구나 와서 쳐 보라고 권하지만 이용 시간은 나와 있지 않습니다. 2024년 7월 지역 기사로 프로그램이 이어지고 있음은 확인되지만 피아노를 여름에 거리에 둔다고 하여 1년 내내 있지는 않을 수 있으며, 이 피아노가 지금도 있는지는 확인되지 않았습니다."],null,"","550 Brewing Taproom, Aztec, NM","mt",""],
 ["B","Albuquerque Convention Center","Public Pianos Project · 'The Pinato'","Albuquerque · NM","other","u",2019,35.087362,-106.6488,["'The Pinato', a piñata-themed piano by Adrian Martin, was made in 2019 for the City of Albuquerque's Public Pianos Project, and a local news report from around that time places it in the Albuquerque Convention Center. It was presumably playable by convention center visitors; the city's public-art listing gives no site, and the companion piano on Civic Plaza was reported destroyed by vandals. Last documented in 2019; not confirmed as still in place.","'The Pinato', un piano con temática de piñata de Adrian Martin, se creó en 2019 para el Public Pianos Project de la ciudad de Albuquerque, y un reportaje local de esa época lo sitúa en el Albuquerque Convention Center. Es de suponer que podían tocarlo los visitantes del centro de convenciones; el registro de arte público de la ciudad no indica el lugar, y se informó que el piano compañero de Civic Plaza fue destruido por vándalos. Documentado por última vez en 2019; no se ha confirmado que siga en su lugar.","Adrian Martin이 만든 피냐타 테마 피아노 'The Pinato'는 2019년 Albuquerque 시의 Public Pianos Project 작품이며, 그 무렵 지역 뉴스는 이 피아노가 Albuquerque Convention Center에 있다고 전했습니다. 컨벤션 센터 방문객이 칠 수 있었던 것으로 보이나 시의 공공미술 목록에는 설치 장소가 나와 있지 않고, 함께 만들어진 Civic Plaza의 피아노는 훼손으로 부서졌다고 보도되었습니다. 마지막 기록은 2019년이며, 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","Albuquerque Convention Center, Albuquerque, NM","mt",""],
 ["B","Austin History Center","Reception Room piano · key at Reading Room desk","Austin · TX","library","",null,30.271714,-97.745891,["The Austin History Center, part of Austin Public Library, has a piano in its Reception Room that visitors may use. The library's meeting-space page (date not shown) says the key is available on request at the Reading Room desk. It is not confirmed that this is still the case.","El Austin History Center, de la Biblioteca Pública de Austin, tiene un piano en su Reception Room que los visitantes pueden usar. La página de espacios de la biblioteca (sin fecha) indica que la llave se pide en el mostrador de la Reading Room. No se ha confirmado que siga siendo así.","Austin 공공도서관 소속 Austin History Center의 Reception Room에 방문객이 쓸 수 있는 피아노가 있습니다. 도서관 공간 안내 페이지(날짜 없음)에 따르면 열쇠는 Reading Room 데스크에서 요청하면 받을 수 있습니다. 지금도 그런지는 확인되지 않았습니다."],null,"","Austin History Center, Austin, TX","mt",""],
 ["B","Aztec Lil Flower Shop","Aztec Painted Pianos · 'Dr. Seuss'","Aztec · NM","street","u",2020,36.822549,-107.995138,["'Dr. Seuss' by Sandy Waybourn, one of the Aztec Painted Pianos (Big Sound in a Small Town), was placed at Aztec Lil Flower Shop (101 N. Main Ave) in Aztec, New Mexico; an August 2020 Durango Herald report names this spot as one of the program's 'Play Me' piano sites. Anyone is encouraged to show up and play, though hours are not stated. A July 2024 local news report shows the program still running but says the pianos go out on the streets in summer, so they may not be there year-round, and this piano is not confirmed as still in place.","'Dr. Seuss', de Sandy Waybourn, uno de los Aztec Painted Pianos (Big Sound in a Small Town), se colocó en Aztec Lil Flower Shop (101 N. Main Ave), en Aztec, Nuevo México; un reportaje del Durango Herald de agosto de 2020 cita este lugar como uno de los puntos con pianos 'Play Me' del programa. Se anima a cualquiera a acercarse y tocar, aunque no se indica el horario. Una noticia local de julio de 2024 muestra que el programa sigue activo, pero dice que los pianos salen a la calle en verano, por lo que podrían no estar todo el año; no se ha confirmado que este piano siga en su lugar.","Aztec Painted Pianos(Big Sound in a Small Town) 프로그램의 피아노로, Sandy Waybourn의 작품 'Dr. Seuss'입니다. New Mexico주 Aztec의 Aztec Lil Flower Shop(101 N. Main Ave)에 놓였으며, 2020년 8월 Durango Herald 기사가 이곳을 프로그램의 'Play Me' 피아노 장소로 꼽았습니다. 누구나 와서 쳐 보라고 권하지만 이용 시간은 나와 있지 않습니다. 2024년 7월 지역 기사로 프로그램이 이어지고 있음은 확인되지만 피아노를 여름에 거리에 둔다고 하여 1년 내내 있지는 않을 수 있으며, 이 피아노가 지금도 있는지는 확인되지 않았습니다."],null,"","Aztec Lil Flower Shop, Aztec, NM","mt",""],
 ["B","Colorado State University","Lory Student Center, third floor","Fort Collins · CO","university","g",2025,40.57294,-105.08484,["Two baby grands in the Lory Student Center: one on the third floor near the stairs to the West Lawn, the other moving between the area outside LSC Theater and the Diane Warren Kindness Lounge. They can be played when unlocked, but they can be locked and are not always available. Reported in April 2025.","Dos pianos de media cola en el Lory Student Center: uno en el tercer piso, cerca de las escaleras hacia el West Lawn, y otro que se mueve entre la entrada del LSC Theater y el Diane Warren Kindness Lounge. Se pueden tocar cuando no están con llave, pero pueden estar cerrados y no siempre están disponibles. Informado en abril de 2025.","Lory Student Center에 베이비 그랜드 피아노 2대가 있습니다. 한 대는 West Lawn으로 내려가는 계단 근처 3층에 있고, 다른 한 대는 LSC Theater 앞과 Diane Warren Kindness Lounge를 오가며 놓입니다. 잠겨 있지 않을 때 칠 수 있으나 잠가 두는 경우가 있어 항상 이용할 수 있는 것은 아닙니다. 2025년 4월 보도 기준입니다."],null,"","Colorado State University, Fort Collins, CO","mt",""],
 ["B","Edmon Low Library, Oklahoma State University","Browsing Room Steinway · by request","Stillwater · OK","library","g",2026,36.1230647,-97.0697025,["A Steinway baby grand stands in the Peggy V. Helmerich Browsing Room of OSU's Edmon Low Library in Stillwater. The library's venue page says musicians may use it by request at least two weeks ahead during operating hours, at no charge; in 2020 an Open Piano Night was open to the public one Friday a month. It is not confirmed that this is still the case.","Un piano de media cola Steinway está en la Peggy V. Helmerich Browsing Room de la Edmon Low Library de OSU, en Stillwater. La página de la biblioteca indica que los músicos pueden usarlo solicitándolo con dos semanas de antelación, en horario de apertura y sin costo; en 2020 hubo una Open Piano Night abierta al público un viernes al mes. No se ha confirmado que siga siendo así.","Stillwater의 OSU Edmon Low Library Peggy V. Helmerich Browsing Room에 Steinway 베이비 그랜드가 있습니다. 도서관 공간 안내에 따르면 연주자는 2주 전에 요청하면 운영 시간에 무료로 쓸 수 있고, 2020년에는 한 달에 한 번 금요일 일반인에게 열린 Open Piano Night가 있었습니다. 지금도 그런지는 확인되지 않았습니다."],null,"","Edmon Low Library, Oklahoma State University, Stillwater, OK","mt",""],

 ["B","Klyde Warren Park","Piano in the Park · Reading Room","Dallas · TX","park","u",2026,32.78936,-96.80162,["A green upright piano is brought out at the Reading Room in Klyde Warren Park (earlier at the Muse Family Pavilion). It is free and first come, first served, but only during scheduled sessions: recent listings say Sundays 10 am–2 pm. Based on brief 2026 listings; check the park calendar before going.","Un piano vertical verde se saca al Reading Room de Klyde Warren Park (antes estaba en el Muse Family Pavilion). Es gratuito y por orden de llegada, pero solo durante las sesiones programadas: los anuncios recientes indican domingos de 10:00 a 14:00. Basado en anuncios breves de 2026; revise el calendario del parque antes de ir.","Klyde Warren Park의 Reading Room에 초록색 업라이트 피아노가 나옵니다(예전에는 Muse Family Pavilion). 무료이며 선착순으로 누구나 칠 수 있지만, 정해진 시간에만 운영됩니다. 최근 안내로는 일요일 10:00~14:00입니다. 2026년의 간략한 안내에 근거한 정보이므로 방문 전 공원 일정표를 확인하시기 바랍니다."],null,"","Klyde Warren Park, Dallas, TX","mt",""],
 ["B","Levy Park","Public Piano Play · outdoor solar-powered piano","Houston · TX","park","",2021,29.732564,-95.424354,["Levy Park (3801 Eastside St) in Houston has had an outdoor solar-powered piano, described as part of the park's 2017 redesign. It is free for anyone; event listings from 2018–2021 show 'Public Piano Play' sessions on Fridays, for example noon–6pm, so it may be available only at set times. Last documented in 2021; not confirmed as still in place.","Levy Park (3801 Eastside St), en Houston, ha contado con un piano al aire libre alimentado por energía solar, descrito como parte del rediseño del parque de 2017. Es gratuito para cualquiera; las carteleras de 2018–2021 muestran sesiones de 'Public Piano Play' los viernes, por ejemplo de 12:00 a 18:00, por lo que quizá solo esté disponible en horarios fijos. Documentado por última vez en 2021; no se ha confirmado que siga en su lugar.","Houston의 Levy Park(3801 Eastside St)에는 2017년 공원 재단장 때 들어온 것으로 소개된 야외 태양광 피아노가 있었습니다. 누구나 무료로 칠 수 있으며, 2018~2021년 행사 안내에는 금요일(예: 12:00~18:00)에 'Public Piano Play' 시간이 잡혀 있어 정해진 시간에만 열릴 수 있습니다. 마지막 기록은 2021년이며, 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","Levy Park, Houston, TX","mt",""],

 ["B","Provo City Library","Room #156 · Open Piano Lab","Provo · UT","library","d",2026,40.24105,-111.65752,["Electric keyboards are set up in Small Programming Room #156 at 550 North University Avenue during Open Piano Lab. It runs only on scheduled event dates (for example April 15, 2026, 9 am–9 pm); all ages, no instructor, headphones required and provided. Check the library's event listings for dates.","Durante el Open Piano Lab se instalan teclados eléctricos en la Small Programming Room #156, en 550 North University Avenue. Solo funciona en fechas programadas (por ejemplo, el 15 de abril de 2026, de 9:00 a 21:00); para todas las edades, sin instructor, con audífonos obligatorios que la biblioteca proporciona. Consulte el calendario de eventos de la biblioteca.","Open Piano Lab이 열리는 날 550 North University Avenue의 Small Programming Room #156에 전자 키보드가 마련됩니다. 정해진 행사 날짜에만 운영하며(예: 2026년 4월 15일 오전 9시~오후 9시), 전 연령 이용 가능하고 강사는 없으며 헤드폰은 필수이고 도서관에서 제공합니다. 날짜는 도서관 행사 일정을 확인하시기 바랍니다."],null,"","Provo City Library, Provo, UT","mt",""],
 ["B","Texas A&M Memorial Student Center","Flag Room · Steinway grand","College Station · TX","university","g",2012,30.612258,-96.341544,["A Steinway Model B grand stands in the Flag Room of the Memorial Student Center (MSC) at Texas A&M University in College Station. The university has described it as open to anyone who wants to play while the MSC is open, with players expected to come prepared. The official account dates from 2012; a 2025 campus-tour description still calls it open to anyone, but it is not confirmed as still in place.","Un piano de cola Steinway Model B se encuentra en el Flag Room del Memorial Student Center (MSC) de Texas A&M University, en College Station. La universidad lo ha descrito como abierto a cualquiera que quiera tocar mientras el MSC esté abierto, y se espera que quien toque venga preparado. La información oficial data de 2012; una descripción de un recorrido por el campus de 2025 sigue diciendo que está abierto a cualquiera, pero no se ha confirmado que siga en su lugar.","College Station의 Texas A&M University Memorial Student Center(MSC) Flag Room에 Steinway Model B 그랜드 피아노가 있습니다. 대학은 MSC가 열려 있는 동안 치고 싶은 사람 누구에게나 열려 있다고 소개했으며, 연주자는 준비해 와서 치도록 안내되어 있습니다. 공식 소개는 2012년 것이고 2025년 캠퍼스 투어 안내에도 누구나 칠 수 있다고 나오지만, 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","Texas A&M Memorial Student Center, College Station, TX","mt",""],
 ["B","UT Health San Antonio Center for Brain Health","Ann Biggs Community Room · donated piano","San Antonio · TX","hospital","",2025,29.5048654,-98.5761158,["A donated piano sits in the Ann Biggs Community Room of UT Health San Antonio's new Center for Brain Health, at the corner of Floyd Curl Dr and Charles Katz Dr in the South Texas Medical Center. UT Health San Antonio's Mission magazine (November 2025) said the center would open in December 2025 and that the keys are waiting for anyone moved to play. Because it is a community room in a clinical building, access may depend on building hours and room bookings, so check with staff before you go.","Un piano donado está en la Ann Biggs Community Room del nuevo Center for Brain Health de UT Health San Antonio, en la esquina de Floyd Curl Dr y Charles Katz Dr, en el South Texas Medical Center. La revista Mission de UT Health San Antonio (noviembre de 2025) indicó que el centro abriría en diciembre de 2025 y que el teclado espera a cualquiera que sienta ganas de tocar. Al tratarse de una sala comunitaria en un edificio clínico, el acceso puede depender del horario del edificio y de las reservas de la sala, así que consulte al personal antes de ir.","South Texas Medical Center의 Floyd Curl Dr와 Charles Katz Dr 모퉁이에 있는 UT Health San Antonio의 새 Center for Brain Health 안 Ann Biggs Community Room에 기증받은 피아노가 있습니다. UT Health San Antonio의 Mission 매거진(2025년 11월)은 센터가 2025년 12월에 문을 연다며, 치고 싶은 사람 누구나를 기다린다고 전했습니다. 진료 건물 안의 공용 공간이라 건물 운영 시간과 방 사용 일정에 따라 들어가지 못할 수 있으니 가기 전에 직원에게 확인하십시오."],null,"","UT Health San Antonio Center for Brain Health, San Antonio, TX","mt",""],
 ["B","Uintah County Library","Piano practice · by booking","Vernal · UT","library","",null,40.456775,-109.52529,["Uintah County Library in Vernal has taken room bookings titled 'Piano Practice', including students practicing for a recital, so its piano appears bookable for practice. The dates of these bookings are not shown. It is not confirmed that this is still the case.","La Uintah County Library, en Vernal, ha registrado reservas de sala tituladas 'Piano Practice', incluidas de estudiantes que ensayaban para un recital, por lo que su piano parece reservable para practicar. No se ven las fechas. No se ha confirmado que siga siendo así.","Vernal의 Uintah County Library에는 'Piano Practice'라는 이름의 공간 예약 기록이 있고, 발표회를 앞둔 학생 연습도 있어 피아노를 연습용으로 예약할 수 있는 것으로 보입니다. 예약 날짜는 나와 있지 않습니다. 지금도 그런지는 확인되지 않았습니다."],null,"","Uintah County Library, Vernal, UT","mt",""],
 ["B","dT-Alley (Downtown Alley)","Fremont East art alley · community piano","Las Vegas · NV","street","",2020,36.168716,-115.144641,["dT-Alley (Downtown Alley) is a T-shaped art alley in Fremont East, between Las Vegas Blvd, 6th Street, Fremont Street and Carson Avenue, and was the first alley revitalization project in Las Vegas (Todd Kessler). A February 2020 AP article listed a community piano among its interactive installations, along with a puppet theater and a confessional. The alley is an open art walk, so the piano may be open to passers-by, but the source does not say so directly. The only source is from 2020, and it is not confirmed whether the piano is still there.","dT-Alley (Downtown Alley) es un callejón de arte en forma de T en Fremont East, entre Las Vegas Blvd, 6th Street, Fremont Street y Carson Avenue, y fue el primer proyecto de revitalización de callejones en Las Vegas (Todd Kessler). Un artículo de AP de febrero de 2020 mencionó un piano comunitario entre sus instalaciones interactivas, junto con un teatro de títeres y un confesionario. El callejón es un paseo de arte abierto, por lo que el piano podría estar disponible para quienes pasan, pero la fuente no lo dice directamente. La única fuente es de 2020 y no se ha confirmado que el piano siga allí.","dT-Alley(Downtown Alley)는 Las Vegas Fremont East의 Las Vegas Blvd, 6th Street, Fremont Street, Carson Avenue 사이에 있는 T자 모양 예술 골목으로, Las Vegas 최초의 골목 재생 사업(Todd Kessler)입니다. 2020년 2월 AP 기사는 인형극장, 고해실과 함께 커뮤니티 피아노를 이 골목의 체험형 설치물로 소개했습니다. 누구나 드나드는 골목이라 지나가는 사람이 칠 수 있을 수도 있지만, 근거에 직접 나와 있지는 않습니다. 근거가 2020년 기사뿐이며, 지금도 있는지는 확인되지 않았습니다."],null,"","dT-Alley (Downtown Alley), Las Vegas, NV","mt",""],
 ["B","88Keys Coffee","Sing for Hope Pianos · inside the coffee shop","Lakewood · CA","cafe","u",2026,33.84671,-118.15899,["A Sing for Hope Piano sits inside 88Keys Coffee, a coffee shop in Lakewood, CA. It is listed as open year-round, and the shop's opening hours apply. Based on the program's 2026 listing.","Hay un Sing for Hope Piano dentro de 88Keys Coffee, una cafetería en Lakewood, California. Figura como abierto todo el año y rige el horario de la cafetería. Según el listado 2026 del programa.","Lakewood(CA)의 커피숍 88Keys Coffee 안에 Sing for Hope Piano가 있습니다. 연중 개방으로 안내되어 있으며 커피숍 영업시간에 맞춰 이용할 수 있습니다. 2026년 프로그램 목록 기준입니다."],null,"","88Keys Coffee, Lakewood, CA","ca",""],
 ["B","Central Santa Rosa Library","Sonoma County Library","Santa Rosa · CA","library","d",2026,38.44127,-122.71066,["A Williams Overture 2 digital piano at the Central Santa Rosa Library; the spot inside is not stated. Anyone may play after checking in with staff; headphones are required, and you can reserve one hour up to a week ahead by phone at (707) 308-3020. From the library's current page (2026).","Piano digital Williams Overture 2 en la Central Santa Rosa Library; no se indica el punto exacto dentro del edificio. Cualquiera puede tocar después de avisar al personal; se requieren audífonos y se puede reservar una hora con hasta una semana de anticipación llamando al (707) 308-3020. Según la página vigente de la biblioteca (2026).","Central Santa Rosa Library에 Williams Overture 2 디지털 피아노가 있으며, 관내 정확한 위치는 나와 있지 않습니다. 직원에게 먼저 알리면 누구나 칠 수 있고 헤드폰을 사용해야 합니다. 전화((707) 308-3020)로 최대 1주일 전부터 1시간 예약할 수 있습니다. 도서관의 현행 페이지(2026년) 기준입니다."],null,"","Central Santa Rosa Library, Santa Rosa, CA","ca",""],
 ["B","Riverside Main Library","Riverside Public Library","Riverside · CA","library","g",2026,33.98375,-117.37613,["A vintage 1936 Steinway Model B at the Main Library. It can be reserved on Fridays, 2–4 pm, by library-card holders who are experienced players aged 12 and up. Current as of 2026, but based on a single listing, so confirm with the library.","Un Steinway Model B de 1936 en la Main Library. Se puede reservar los viernes de 14:00 a 16:00 y es para titulares de credencial de la biblioteca con experiencia, de 12 años en adelante. Vigente en 2026, pero basado en una sola fuente; confirme con la biblioteca.","Main Library에 1936년산 빈티지 Steinway Model B 피아노가 있습니다. 금요일 오후 2~4시에 예약해 이용할 수 있으며, 도서관 카드가 있고 연주 경험이 있는 만 12세 이상이 대상입니다. 2026년 현재 기준이나 자료 한 곳에만 근거하므로 도서관에 확인하시기 바랍니다."],null,"","Riverside Main Library, Riverside, CA","ca",""],
 ["B","SF State, The Depot","Cesar Chavez Student Center · student piano","San Francisco · CA","university","u",2022,37.733528,-122.50161,["A piano across from The Depot stage in the Cesar Chavez Student Center at San Francisco State University, donated by Creative Arts around 2020, is open to any student who wants to play during student center hours (about 8 am–10 pm on weekdays and 8 am–4 pm on Saturdays). The student paper Golden Gate Xpress reported this in November 2022 and said it is busiest at lunchtime. Access is aimed at students, so non-students should ask at the center, and it is not confirmed that the piano is still there.","Un piano frente al escenario de The Depot, en el Cesar Chavez Student Center de la San Francisco State University, donado por Creative Arts hacia 2020, está abierto a todos los estudiantes que quieran tocar en el horario del centro (aprox. de 8:00 a 22:00 entre semana y de 8:00 a 16:00 los sábados). El periódico estudiantil Golden Gate Xpress lo informó en noviembre de 2022 y señaló que la hora de más uso es el almuerzo. El acceso está pensado para estudiantes, así que quienes no lo sean deben preguntar en el centro, y no se ha confirmado que el piano siga allí.","San Francisco State University의 Cesar Chavez Student Center 안 The Depot 무대 맞은편에 Creative Arts가 2020년 무렵 기증한 피아노가 있으며, 학생센터 운영 시간(대략 평일 오전 8시~오후 10시, 토요일 오전 8시~오후 4시)에 치고 싶은 학생은 누구나 칠 수 있습니다. 학생 신문 Golden Gate Xpress가 2022년 11월 이렇게 보도했고, 점심시간에 가장 붐빈다고 전했습니다. 학생 대상이라 학생이 아니면 센터에 물어봐야 하며, 지금도 피아노가 있는지는 확인되지 않았습니다."],null,"","SF State, The Depot, San Francisco, CA","ca",""],
 ["B","San Mateo County Center","Community piano · lobby, 500 County Center","Redwood City · CA","other","u",2026,37.48825,-122.22989,["A community upright piano stands in the lobby of the county building at 500 County Center. It is available to the public, but only while the building is open. Unveiled March 11, 2026 as the second of three planned community pianos in Redwood City; the other sites were not named.","Un piano vertical comunitario está en el vestíbulo del edificio del condado, en 500 County Center. Está disponible para el público, pero solo en el horario de apertura del edificio. Se inauguró el 11 de marzo de 2026 como el segundo de tres pianos comunitarios previstos en Redwood City; no se mencionaron las otras ubicaciones.","500 County Center의 카운티 청사 로비에 커뮤니티 업라이트 피아노가 있습니다. 누구나 이용할 수 있지만 건물 개방 시간에만 가능합니다. 2026년 3월 11일에 공개되었으며 Redwood City에 계획된 커뮤니티 피아노 3대 중 두 번째입니다. 나머지 장소는 기사에 나와 있지 않습니다."],null,"","San Mateo County Center, Redwood City, CA","ca",""],
 ["B","Collaboration Coffee","Yakima Painted Pianos · Yakima Sunrise Rotary Club","Yakima · WA","other","",2023,46.601472,-120.506031,["A painted piano from Yakima Painted Pianos, a Yakima Sunrise Rotary Club project, was placed at Collaboration Coffee in Yakima, painted by Aislinn Kalstad and Amanda Ontiveros. A February 2023 Yakima Herald report (updated in March 2024) names this as one of the first sites when placement resumed after the pandemic. The pianos are free to use during the host's business hours, but this site has not been confirmed for 2025–2026, so it is not known whether the piano is still there.","Un piano pintado de Yakima Painted Pianos, un proyecto del Yakima Sunrise Rotary Club, se colocó en Collaboration Coffee, en Yakima, pintado por Aislinn Kalstad y Amanda Ontiveros. Un reportaje del Yakima Herald de febrero de 2023 (actualizado en marzo de 2024) cita este lugar como una de las primeras sedes cuando se reanudó la colocación de pianos tras la pandemia. Los pianos se pueden usar gratis en el horario del establecimiento, pero esta sede no se ha confirmado para 2025–2026, por lo que no se sabe si el piano sigue allí.","Yakima Sunrise Rotary Club의 Yakima Painted Pianos 프로그램 채색 피아노가 Yakima의 Collaboration Coffee에 놓였으며, Aislinn Kalstad와 Amanda Ontiveros가 그렸습니다. 2023년 2월 Yakima Herald 기사(2024년 3월 수정)는 코로나 뒤 설치를 다시 시작할 때의 첫 장소 가운데 하나로 이곳을 꼽았습니다. 영업시간에 무료로 칠 수 있지만, 이 장소의 2025~2026년 설치는 확인되지 않아 지금도 피아노가 있는지는 알 수 없습니다."],null,"","Collaboration Coffee, Yakima, WA","pnw",""],
 ["B","Glenwood Square","Yakima Painted Pianos · Yakima Sunrise Rotary Club","Yakima · WA","mall","",2023,46.592368,-120.578277,["A painted piano from Yakima Painted Pianos, a Yakima Sunrise Rotary Club project, was placed at Glenwood Square in Yakima, next to Zesta Cucina, with artwork by Diane Ford. A February 2023 Yakima Herald report (updated in March 2024) names this as one of the first sites when placement resumed after the pandemic. The pianos are free to use during the host's business hours, but this site has not been confirmed for 2025–2026, so it is not known whether the piano is still there.","Un piano pintado de Yakima Painted Pianos, un proyecto del Yakima Sunrise Rotary Club, se colocó en Glenwood Square, en Yakima, junto a Zesta Cucina, con obra de Diane Ford. Un reportaje del Yakima Herald de febrero de 2023 (actualizado en marzo de 2024) cita este lugar como una de las primeras sedes cuando se reanudó la colocación de pianos tras la pandemia. Los pianos se pueden usar gratis en el horario del establecimiento, pero esta sede no se ha confirmado para 2025–2026, por lo que no se sabe si el piano sigue allí.","Yakima Sunrise Rotary Club의 Yakima Painted Pianos 프로그램 채색 피아노가 Yakima의 Glenwood Square(Zesta Cucina 옆)에 놓였으며, 그림은 Diane Ford의 작품입니다. 2023년 2월 Yakima Herald 기사(2024년 3월 수정)는 코로나 뒤 설치를 다시 시작할 때의 첫 장소 가운데 하나로 이곳을 꼽았습니다. 영업시간에 무료로 칠 수 있지만, 이 장소의 2025~2026년 설치는 확인되지 않아 지금도 피아노가 있는지는 알 수 없습니다."],null,"","Glenwood Square, Yakima, WA","pnw",""],
 ["B","Seattle Central Library","Level 8 music practice rooms","Seattle · WA","library","d",2026,47.60677,-122.33264,["Digital pianos in two music practice rooms on level 8 of the Central Library, 1000 Fourth Ave. Reserve a room for one hour, up to a week in advance, by phone at 206-386-4636, and bring photo ID at check-in. From the library's current page (2026); a 2016 article said use was free, and a library-card requirement is not stated.","Pianos digitales en dos salas de práctica musical en el nivel 8 de la Central Library, 1000 Fourth Ave. Reserve una sala por una hora, con hasta una semana de anticipación, llamando al 206-386-4636, y lleve una identificación con foto al registrarse. Según la página vigente de la biblioteca (2026); un artículo de 2016 decía que era gratis, y no se indica si se requiere credencial de la biblioteca.","Central Library(1000 Fourth Ave) 8층의 음악 연습실 두 곳에 디지털 피아노가 있습니다. 전화(206-386-4636)로 최대 1주일 전부터 1시간 단위로 예약하고, 체크인할 때 사진이 있는 신분증을 가져가야 합니다. 도서관의 현행 페이지(2026년) 기준이며, 2016년 기사에는 무료라고 되어 있고 도서관 카드가 필요한지는 나와 있지 않습니다."],null,"","Seattle Central Library, Seattle, WA","pnw",""],

 ["B","Amazement Square","Hill City Keys · Academy Center of the Arts","Lynchburg · VA","museum","u",2018,37.416155,-79.140449,["A May 2018 WDBJ7 news report names Amazement Square in Lynchburg as a site for Hill City Keys, the Academy Center of the Arts' summer program of painted pianos. The pianos are free for anyone to play during the summer season only. A June 2024 post from the Academy Center shows the program still running in its tenth year, but this site has not been confirmed for 2024–2026, so it is not known whether a piano is here now.","Un reportaje de WDBJ7 de mayo de 2018 menciona Amazement Square, en Lynchburg, como sede de Hill City Keys, el programa veraniego de pianos pintados del Academy Center of the Arts. Cualquiera puede tocar los pianos gratis, solo durante la temporada de verano. Una publicación del Academy Center de junio de 2024 muestra que el programa sigue en su décimo año, pero esta sede no se ha confirmado para 2024–2026, por lo que no se sabe si hay un piano aquí ahora.","2018년 5월 WDBJ7 뉴스가 소개한 Hill City Keys(Academy Center of the Arts의 여름 채색 피아노 프로그램) 설치 장소에 Lynchburg의 Amazement Square도 들어 있습니다. 여름철에만 누구나 무료로 칠 수 있습니다. Academy Center의 2024년 6월 글로 프로그램이 10년째 이어지고 있음은 확인되지만, 이 장소의 2024~2026년 설치는 확인되지 않아 지금 피아노가 있는지는 알 수 없습니다."],null,"","Amazement Square, Lynchburg, VA","se","Jun–Aug"],
 ["B","Bank of the James","Hill City Keys · Academy Center of the Arts","Lynchburg · VA","other","u",2018,37.415235,-79.142172,["A May 2018 WDBJ7 news report names Bank of the James in Lynchburg as a site for Hill City Keys, the Academy Center of the Arts' summer program of painted pianos. The pianos are free for anyone to play during the summer season only. A June 2024 post from the Academy Center shows the program still running in its tenth year, but this site has not been confirmed for 2024–2026, so it is not known whether a piano is here now.","Un reportaje de WDBJ7 de mayo de 2018 menciona Bank of the James, en Lynchburg, como sede de Hill City Keys, el programa veraniego de pianos pintados del Academy Center of the Arts. Cualquiera puede tocar los pianos gratis, solo durante la temporada de verano. Una publicación del Academy Center de junio de 2024 muestra que el programa sigue en su décimo año, pero esta sede no se ha confirmado para 2024–2026, por lo que no se sabe si hay un piano aquí ahora.","2018년 5월 WDBJ7 뉴스가 소개한 Hill City Keys(Academy Center of the Arts의 여름 채색 피아노 프로그램) 설치 장소에 Lynchburg의 Bank of the James도 들어 있습니다. 여름철에만 누구나 무료로 칠 수 있습니다. Academy Center의 2024년 6월 글로 프로그램이 10년째 이어지고 있음은 확인되지만, 이 장소의 2024~2026년 설치는 확인되지 않아 지금 피아노가 있는지는 알 수 없습니다."],null,"","Bank of the James, Lynchburg, VA","se","Jun–Aug"],
 ["B","Christopher Newport University","Sing for Hope Pianos · spring residency · about 10 sites citywide","Newport News · VA","street","u",2025,37.059879,-76.488375,["Sing for Hope Pianos, with Christopher Newport University and the Ferguson Center, has placed pianos at about ten public sites around Newport News for roughly three weeks each spring; this marker sits at the CNU site (1 Avenue of the Arts). They are free for anyone to play during the residency (Mar 29–Apr 18 in 2024, Mar 28–Apr 18 in 2025). The 2025 site list was not published and a 2026 edition is not confirmed, as it may have been a two-year project. Not confirmed as still in place.","Sing for Hope Pianos, junto con Christopher Newport University y Ferguson Center, ha colocado pianos en unos diez lugares públicos de Newport News durante unas tres semanas cada primavera; este punto corresponde a la sede de CNU (1 Avenue of the Arts). Son gratuitos y cualquiera puede tocarlos mientras dura la residencia (del 29 de marzo al 18 de abril en 2024; del 28 de marzo al 18 de abril en 2025). No se publicó la lista de lugares de 2025 y no está confirmada una edición de 2026, ya que pudo ser un proyecto de dos años. No se ha confirmado que sigan en el lugar.","Sing for Hope Pianos는 Christopher Newport University·Ferguson Center와 함께 매년 봄 약 3주 동안 Newport News 시내 공공장소 10곳가량에 피아노를 놓아 왔으며, 이 표시는 CNU 자리(1 Avenue of the Arts)에 둔 것입니다. 무료이며 기간 중(2024년 3월 29일~4월 18일, 2025년 3월 28일~4월 18일) 누구나 칠 수 있습니다. 2025년 설치 장소 목록은 공개되지 않았고, 2년짜리 프로젝트였을 수 있어 2026년 개최는 확인되지 않았습니다. 지금도 있는지는 확인되지 않았습니다."],null,"","Christopher Newport University, Newport News, VA","se","Mar–Apr"],
 ["B","Kegney Brothers Irish Pub","Hill City Keys · Academy Center of the Arts","Lynchburg · VA","other","u",2018,37.412686,-79.140114,["A May 2018 WDBJ7 news report names Kegney Brothers Irish Pub in Lynchburg as a site for Hill City Keys, the Academy Center of the Arts' summer program of painted pianos. The pianos are free for anyone to play during the summer season only. A June 2024 post from the Academy Center shows the program still running in its tenth year, but this site has not been confirmed for 2024–2026, so it is not known whether a piano is here now.","Un reportaje de WDBJ7 de mayo de 2018 menciona Kegney Brothers Irish Pub, en Lynchburg, como sede de Hill City Keys, el programa veraniego de pianos pintados del Academy Center of the Arts. Cualquiera puede tocar los pianos gratis, solo durante la temporada de verano. Una publicación del Academy Center de junio de 2024 muestra que el programa sigue en su décimo año, pero esta sede no se ha confirmado para 2024–2026, por lo que no se sabe si hay un piano aquí ahora.","2018년 5월 WDBJ7 뉴스가 소개한 Hill City Keys(Academy Center of the Arts의 여름 채색 피아노 프로그램) 설치 장소에 Lynchburg의 Kegney Brothers Irish Pub도 들어 있습니다. 여름철에만 누구나 무료로 칠 수 있습니다. Academy Center의 2024년 6월 글로 프로그램이 10년째 이어지고 있음은 확인되지만, 이 장소의 2024~2026년 설치는 확인되지 않아 지금 피아노가 있는지는 알 수 없습니다."],null,"","Kegney Brothers Irish Pub, Lynchburg, VA","se","Jun–Aug"],

 ["B","American Academy of Neurology","Pianos on Parade · Downtown East","Minneapolis · MN","plaza","u",2026,44.97787,-93.25633,["A painted upright is placed at the American Academy of Neurology (201 Chicago Ave, Downtown East) in Minneapolis during Pianos on Parade. Anyone is welcome to play, but this piano is available during weekday business hours only; some sites also host Thursday noon performances. Out in August only (Aug 1–31 in 2026), and the site list changes every year.","Durante Pianos on Parade se coloca un piano vertical pintado en American Academy of Neurology (201 Chicago Ave, Downtown East), en Minneapolis. Cualquiera puede tocarlo, aunque este piano solo está disponible en horario de oficina de lunes a viernes; en algunos puntos hay presentaciones los jueves al mediodía. Los pianos solo están en agosto (del 1 al 31 de agosto en 2026) y la lista de lugares cambia cada año.","Minneapolis의 American Academy of Neurology(201 Chicago Ave, Downtown East)에 Pianos on Parade 기간 동안 페인팅된 업라이트 피아노가 놓입니다. 누구나 연주할 수 있으나 이 피아노는 평일 업무 시간에만 이용할 수 있으며, 일부 장소에서는 목요일 정오 공연도 열립니다. 매년 8월에만 운영되고(2026년은 8월 1일~31일) 설치 장소는 해마다 바뀝니다."],null,"","American Academy of Neurology, Minneapolis, MN","mw","Aug"],
 ["B","Front & Park (Chase Bank building)","Traverse City Street Pianos · Life and Whim","Traverse City · MI","street","u",2017,44.763835,-85.618646,["A street piano is set outdoors at the corner of Front and Park (250 E Front St, Chase Bank building) in Traverse City, part of the Traverse City Street Pianos by Life and Whim. Anyone can play it in summer and fall, weather permitting; the pianos go out from mid-July through fall. Last documented in 2017; the organizer said the pianos would return in 2019, with no later confirmation. Not confirmed as still in place.","Un piano callejero se coloca al aire libre en la esquina de Front y Park (250 E Front St, edificio de Chase Bank), en Traverse City, dentro de los Traverse City Street Pianos de Life and Whim. Cualquiera puede tocarlo en verano y otoño, si el tiempo lo permite; los pianos salen desde mediados de julio hasta el otoño. Documentado por última vez en 2017; el organizador anunció que los pianos volverían en 2019, sin confirmación posterior. No se ha confirmado que siga en el lugar.","Traverse City의 Front와 Park 모퉁이(250 E Front St, Chase Bank 건물) 야외에 Life and Whim의 Traverse City Street Pianos 거리 피아노가 놓입니다. 날씨가 허락하는 한 여름과 가을에 누구나 칠 수 있으며, 피아노는 7월 중순부터 가을까지 나와 있습니다. 마지막 기록은 2017년이고, 주최 측이 2019년에도 다시 놓겠다고 알린 뒤로는 확인된 자료가 없습니다. 지금도 있는지는 확인되지 않았습니다."],null,"","Front & Park (Chase Bank building), Traverse City, MI","mw","Jul–fall"],
 ["B","The Heidelberg","Columbia street pianos · 9th Street sidewalk","Columbia · MO","street","u",2018,38.946831,-92.32747,["A street piano stands on the 9th Street sidewalk outside The Heidelberg in Columbia, part of the Columbia street pianos run by the Columbia Piano Technicians Guild and The District. Anyone can play it; an October 2018 article described it as always there for anybody, apparently during a summer season whose months are not stated. Last documented in 2018; not confirmed as still in place.","Un piano callejero se encuentra en la acera de 9th Street, frente a The Heidelberg, en Columbia; forma parte de los pianos callejeros de Columbia, a cargo del Columbia Piano Technicians Guild y The District. Cualquiera puede tocarlo; un artículo de octubre de 2018 lo describía como siempre presente y para todos, al parecer durante una temporada de verano cuyos meses no se indican. Documentado por última vez en 2018; no se ha confirmado que siga en el lugar.","Columbia의 The Heidelberg 앞 9th Street 인도에 거리 피아노가 있습니다. Columbia Piano Technicians Guild와 The District가 운영하는 Columbia street pianos의 하나로, 누구나 칠 수 있습니다. 2018년 10월 기사는 이 피아노가 늘 그 자리에 있고 누구에게나 열려 있다고 전했으며, 여름철에 운영되는 것으로 보이나 운영 달은 나와 있지 않습니다. 마지막 기록은 2018년이며, 지금도 있는지는 확인되지 않았습니다."],null,"","The Heidelberg, Columbia, MO","mw","seasonal"],
 ["B","Jenks Riverwalk","Play Me, Tulsa","Jenks · OK","street","u",2022,36.027362,-95.958906,["Jenks Riverwalk in Jenks has hosted a student-painted upright from Play Me, Tulsa (Saied Music Co. with Tulsa Mayfest). The pianos debut at Mayfest in May and then sit at outdoor host sites through the end of July, free for anyone to play. Host sites change every year and no 2025–2026 list is published; this site is last documented as a host in 2022 (also 2019 and 2021), and it is not confirmed that a piano is still placed here.","Jenks Riverwalk, en Jenks, ha acogido un piano vertical pintado por estudiantes del programa Play Me, Tulsa (Saied Music Co. con Tulsa Mayfest). Los pianos se estrenan en Mayfest en mayo y luego permanecen en lugares al aire libre hasta finales de julio; cualquiera puede tocarlos gratis. Los lugares cambian cada año y no se publica la lista de 2025–2026; este lugar está documentado como sede por última vez en 2022 (también en 2019 y 2021), y no se ha confirmado que siga habiendo un piano aquí.","Jenks의 Jenks Riverwalk에 Play Me, Tulsa(Saied Music Co.·Tulsa Mayfest)의 학생 페인팅 업라이트 피아노가 놓인 적이 있습니다. 피아노는 5월 Mayfest에서 처음 공개된 뒤 7월 말까지 야외 호스트 장소에 놓이며, 누구나 무료로 칠 수 있습니다. 호스트 장소는 해마다 바뀌고 2025~2026년 목록은 공개되지 않았습니다. 이곳은 2019·2021년에 이어 2022년이 마지막 호스트 기록이며, 지금도 이곳에 피아노가 놓이는지는 확인되지 않았습니다."],null,"","Jenks Riverwalk, Jenks, OK","mt","Jun–Jul"],

 ["B","Old Town Square","Pianos About Town · live painting site","Fort Collins · CO","plaza","u",2026,40.58757,-105.07591,["In Old Town Square, Fort Collins, artists paint Pianos About Town pianos live from May through October. It is not stated whether the piano can be played while the painting is in progress, so ask before playing. Based on 2026 program information; the downtown listing also mentions rotating pianos in Old Town Square, Jazz Alley and Oak Street Plaza.","En Old Town Square, Fort Collins, los artistas pintan en vivo los pianos de Pianos About Town de mayo a octubre. No se indica si el piano puede tocarse mientras lo pintan, así que pregunta antes de tocar. Según información del programa de 2026; el listado del centro también menciona pianos rotativos en Old Town Square, Jazz Alley y Oak Street Plaza.","Fort Collins의 Old Town Square에서는 5월부터 10월까지 아티스트가 Pianos About Town 피아노를 현장에서 직접 페인팅합니다. 작업 중인 피아노를 연주할 수 있는지는 안내되어 있지 않으므로 연주 전에 물어보시기 바랍니다. 2026년 프로그램 정보 기준이며, 다운타운 안내에는 Old Town Square, Jazz Alley, Oak Street Plaza의 순환 피아노도 소개되어 있습니다."],null,"","Old Town Square, Fort Collins, CO","mt","May–Oct"],
 ["B","Plaza Santa Cecilia","Play Me, Tulsa","Tulsa · OK","street","u",2022,36.131016,-95.852341,["Plaza Santa Cecilia in Tulsa has hosted a student-painted upright from Play Me, Tulsa (Saied Music Co. with Tulsa Mayfest). The pianos debut at Mayfest in May and then sit at outdoor host sites through the end of July, free for anyone to play. Host sites change every year and no 2025–2026 list is published; this site is last documented as a host in 2022 (also 2019), and it is not confirmed that a piano is still placed here.","Plaza Santa Cecilia, en Tulsa, ha acogido un piano vertical pintado por estudiantes del programa Play Me, Tulsa (Saied Music Co. con Tulsa Mayfest). Los pianos se estrenan en Mayfest en mayo y luego permanecen en lugares al aire libre hasta finales de julio; cualquiera puede tocarlos gratis. Los lugares cambian cada año y no se publica la lista de 2025–2026; este lugar está documentado como sede por última vez en 2022 (también en 2019), y no se ha confirmado que siga habiendo un piano aquí.","Tulsa의 Plaza Santa Cecilia에 Play Me, Tulsa(Saied Music Co.·Tulsa Mayfest)의 학생 페인팅 업라이트 피아노가 놓인 적이 있습니다. 피아노는 5월 Mayfest에서 처음 공개된 뒤 7월 말까지 야외 호스트 장소에 놓이며, 누구나 무료로 칠 수 있습니다. 호스트 장소는 해마다 바뀌고 2025~2026년 목록은 공개되지 않았습니다. 이곳은 2019년에 이어 2022년이 마지막 호스트 기록이며, 지금도 이곳에 피아노가 놓이는지는 확인되지 않았습니다."],null,"","Plaza Santa Cecilia, Tulsa, OK","mt","Jun–Jul"],
