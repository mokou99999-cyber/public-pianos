 ["U","University of Missouri","Columbia street pianos · Lowry Mall / Fine Arts Building","Columbia · MO","university","u",2016,38.944889,-92.326604,["A street piano from the Columbia street pianos program was placed outdoors on the University of Missouri campus in Columbia; reports mention both the Fine Arts Building and Lowry Mall, so the exact spot is unclear. Anyone walking by can play it, apparently on a seasonal basis. Last documented in 2016. Not confirmed as still in place.","Un piano callejero del programa de pianos callejeros de Columbia se colocó al aire libre en el campus de University of Missouri, en Columbia; las fuentes mencionan tanto el Fine Arts Building como Lowry Mall, por lo que el punto exacto no está claro. Cualquiera que pase puede tocarlo, al parecer solo por temporada. Documentado por última vez en 2016. No se ha confirmado que siga en el lugar.","Columbia의 University of Missouri 캠퍼스 야외에 Columbia street pianos 프로그램의 거리 피아노가 놓였습니다. 자료에 따라 Fine Arts Building 앞과 Lowry Mall이 함께 언급되어 정확한 자리는 분명하지 않습니다. 지나가는 누구나 칠 수 있으며, 계절에 따라 운영되는 것으로 보입니다. 마지막 기록은 2016년이며, 지금도 있는지는 확인되지 않았습니다."],null,"","University of Missouri, Columbia, MO","mw","seasonal"],
 ["U","Windwalker Underground Gallery","Keys in the City · in front of the gallery","Charlotte · MI","street","u",2017,42.563512,-84.835771,["A piano from Keys in the City, a project of LEAP, the City of Charlotte and Windwalker Underground Gallery, was placed outdoors in front of the gallery (125 S Cochran Ave) in Charlotte, Michigan. Anyone can play it; it is covered with a tarp at night and in bad weather. Unveiled in August 2017, with no evidence of later seasons. Not confirmed as still in place.","Un piano de Keys in the City, proyecto de LEAP, la ciudad de Charlotte y Windwalker Underground Gallery, se colocó al aire libre frente a la galería (125 S Cochran Ave), en Charlotte (Michigan). Cualquiera puede tocarlo; se cubre con una lona por la noche y cuando hay mal tiempo. Se inauguró en agosto de 2017 y no hay indicios de temporadas posteriores. No se ha confirmado que siga en el lugar.","Michigan주 Charlotte의 Windwalker Underground Gallery(125 S Cochran Ave) 앞 야외에 Keys in the City 피아노가 놓였습니다. LEAP, City of Charlotte, Windwalker Underground Gallery가 함께한 프로젝트로, 누구나 칠 수 있으며 밤과 궂은 날씨에는 방수포로 덮어 둡니다. 2017년 8월에 공개되었고 이후 시즌이 이어졌다는 자료는 없습니다. 지금도 있는지는 확인되지 않았습니다."],null,"","Windwalker Underground Gallery, Charlotte, MI","mw","seasonal"],
 ["U","16th Street Mall","Tremont to Lawrence St · Your Keys to the City","Denver · CO","street","u",2019,39.69234,-104.98716,["Unverified. Painted uprights stood on the 16th Street Mall median between Tremont and Lawrence Streets, free for anyone to play daily from 8 am to 10 pm, May 1 to September 30. The latest evidence is from 2019; nothing from 2021–2026 was found and the street has since been rebuilt, so the program may have ended.","Sin verificar. Había pianos verticales pintados en el camellón del 16th Street Mall, entre las calles Tremont y Lawrence, que cualquiera podía tocar todos los días de 8:00 a 22:00, del 1 de mayo al 30 de septiembre. La última referencia es de 2019; no se encontró nada de 2021 a 2026 y la calle fue reconstruida, así que el programa pudo haber terminado.","미확인 정보입니다. 16th Street Mall의 Tremont 거리와 Lawrence 거리 사이 중앙 구역에 그림이 그려진 업라이트 피아노가 놓여, 5월 1일부터 9월 30일까지 매일 오전 8시~오후 10시에 누구나 칠 수 있었습니다. 가장 최근 근거가 2019년이고 2021~2026년 자료는 찾지 못했으며, 이후 거리가 재정비되어 프로그램이 종료되었을 수 있습니다."],null,"","16th Street Mall, Denver, CO","mt","May–Sep"],
 ["U","Bountiful Davis Arts Center","People's Piano Project · summer painted piano","Bountiful · UT","culture","u",2018,40.892231,-111.880694,["Deseret Industries' People's Piano Project listed a painted piano, open to the public, at the Bountiful Davis Arts Center (90 N Main St, Bountiful), near Salt Lake City, in its summer 2018 list. That 2018 list is the only source found. It is not confirmed that a piano has been there since.","El People's Piano Project de Deseret Industries incluyó en su lista del verano de 2018 un piano pintado de uso público en el Bountiful Davis Arts Center (90 N Main St, Bountiful), cerca de Salt Lake City. Esa lista de 2018 es la única fuente encontrada. No se ha confirmado que haya habido un piano allí desde entonces.","Deseret Industries의 People's Piano Project는 2018년 여름 목록에 Salt Lake City 근교 Bountiful의 Bountiful Davis Arts Center(90 N Main St)의 그림 피아노를 올리고 누구나 칠 수 있다고 안내했습니다. 찾은 근거는 그 2018년 목록뿐입니다. 그 뒤로도 피아노가 놓였는지는 확인되지 않았습니다."],null,"","Bountiful Davis Arts Center, Bountiful, UT","mt","Summer (months not stated)"],
 ["U","Chase Home Museum, Liberty Park","People's Piano Project · porch piano","Salt Lake City · UT","park","u",2018,40.743702,-111.871555,["Deseret Industries' People's Piano Project put a painted piano on the porch of the Chase Home Museum in Liberty Park (1150 South Constitution Drive) for anyone to play in summer. The site appeared in both the 2017 and 2018 summer lists, which invited people to stop by the porch and play a song. Nothing after 2018 was found, so it is not confirmed that the piano is still there or that the program continues.","El People's Piano Project de Deseret Industries colocó un piano pintado en el porche del Chase Home Museum, en Liberty Park (1150 South Constitution Drive), para que cualquiera lo tocara en verano. El lugar figuraba en las listas de los veranos de 2017 y 2018, que invitaban a pasar por el porche y tocar una canción. No se encontró nada posterior a 2018, así que no se ha confirmado que el piano siga allí ni que el programa continúe.","Deseret Industries의 People's Piano Project는 Liberty Park 안 Chase Home Museum(1150 South Constitution Drive) 현관에 그림을 입힌 피아노를 두고 여름 동안 누구나 치게 했습니다. 이곳은 2017년과 2018년 여름 목록에 모두 올랐고, 현관에 들러 한 곡 치고 가라고 안내했습니다. 2018년 이후 소식은 찾지 못해 지금도 피아노가 있는지, 프로그램이 이어지는지는 확인되지 않았습니다."],null,"","Chase Home Museum, Liberty Park, Salt Lake City, UT","mt","Summer (months not stated)"],
 ["U","Gallivan Center patio","People's Piano Project · summer painted piano","Salt Lake City · UT","park","u",2017,40.764128,-111.890985,["Deseret Industries' People's Piano Project placed a painted piano, open to the public, on the patio behind the outdoor stage at the Gallivan Center (239 Main Street) in summer 2017. The site was not on the 2018 list, and the only source is that 2017 announcement. It is not confirmed that a piano has been there since.","El People's Piano Project de Deseret Industries colocó en el verano de 2017 un piano pintado de uso público en el patio detrás del escenario exterior del Gallivan Center (239 Main Street). El lugar no figuraba en la lista de 2018 y la única fuente es ese anuncio de 2017. No se ha confirmado que haya habido un piano allí desde entonces.","Deseret Industries의 People's Piano Project는 2017년 여름 Gallivan Center(239 Main Street) 야외 무대 뒤 파티오에 누구나 칠 수 있는 그림 피아노를 두었습니다. 2018년 목록에는 없었고, 근거는 2017년 안내 하나뿐입니다. 그 뒤로도 피아노가 놓였는지는 확인되지 않았습니다."],null,"","Gallivan Center patio, Salt Lake City, UT","mt","Summer (months not stated)"],
 ["U","Gathering Place","Play Me, Tulsa · Sensory Garden","Tulsa · OK","park","u",2019,36.12516,-95.984021,["The Sensory Garden at Gathering Place in Tulsa has hosted a student-painted upright from Play Me, Tulsa (Saied Music Co. with Tulsa Mayfest). The pianos debut at Mayfest in May and then sit at outdoor host sites through the end of July, free for anyone to play. Host sites change every year and no 2025–2026 list is published; this site is documented only for 2019, when the piano was available daily during park hours through July 21, and it is not confirmed that a piano is still placed here.","El Sensory Garden de Gathering Place, en Tulsa, ha acogido un piano vertical pintado por estudiantes del programa Play Me, Tulsa (Saied Music Co. con Tulsa Mayfest). Los pianos se estrenan en Mayfest en mayo y luego permanecen en lugares al aire libre hasta finales de julio; cualquiera puede tocarlos gratis. Los lugares cambian cada año y no se publica la lista de 2025–2026; este lugar solo está documentado en 2019, cuando el piano estuvo disponible a diario en el horario del parque hasta el 21 de julio, y no se ha confirmado que siga habiendo un piano aquí.","Tulsa의 Gathering Place 안 Sensory Garden에 Play Me, Tulsa(Saied Music Co.·Tulsa Mayfest)의 학생 페인팅 업라이트 피아노가 놓인 적이 있습니다. 피아노는 5월 Mayfest에서 처음 공개된 뒤 7월 말까지 야외 호스트 장소에 놓이며, 누구나 무료로 칠 수 있습니다. 호스트 장소는 해마다 바뀌고 2025~2026년 목록은 공개되지 않았습니다. 이곳은 2019년 기록뿐으로 당시 7월 21일까지 공원 운영 시간에 매일 칠 수 있었고 이후 기록은 없으며, 지금도 이곳에 피아노가 놓이는지는 확인되지 않았습니다."],null,"","Gathering Place, Tulsa, OK","mt","Jun–Jul"],

 ["U","Cal Anderson Park, Seattle","Pianos in the Parks · Capitol Hill","Seattle · WA","park","u",2019,47.617038,-122.319169,["Pianos in the Parks, run by Seattle Parks & Recreation with KEXP, places artist-painted outdoor pianos in city parks for anyone to play for two to three weeks each summer, roughly late July to mid-August. Cal Anderson Park was a site in 2014 and 2015, as reported by the Capitol Hill Seattle Blog; the 2019 season ran August 1–18 with 13 pianos, according to MyBallard. Locations change every year, and no season after 2019 could be confirmed, so it is not confirmed that the program continues or that this park is still used.","Pianos in the Parks, de Seattle Parks & Recreation junto con KEXP, coloca pianos pintados por artistas al aire libre en parques de la ciudad para que cualquiera los toque durante dos o tres semanas cada verano, aproximadamente de finales de julio a mediados de agosto. Cal Anderson Park fue sede en 2014 y 2015, según el Capitol Hill Seattle Blog; la temporada de 2019 fue del 1 al 18 de agosto con 13 pianos, según MyBallard. Los lugares cambian cada año y no se pudo confirmar ninguna temporada posterior a 2019, así que no se ha confirmado que el programa continúe ni que este parque siga participando.","Seattle Parks & Recreation과 KEXP가 운영하는 Pianos in the Parks는 해마다 여름 2~3주(대략 7월 말~8월 중순) 동안 작가가 그림을 입힌 야외 피아노를 시내 공원에 두고 누구나 치게 합니다. Capitol Hill Seattle Blog에 따르면 Cal Anderson Park에는 2014년과 2015년에 피아노가 놓였고, MyBallard에 따르면 2019년에는 8월 1~18일에 13대가 놓였습니다. 장소는 해마다 바뀌고 2019년 이후 회차는 확인하지 못해, 프로그램이 이어지는지와 이 공원에 다시 놓이는지는 확인되지 않았습니다."],null,"","Cal Anderson Park, Seattle, Seattle, WA","pnw","Jul–Aug"],
 ["U","Cathedral Park","Piano. Push. Play.","Portland · OR","park","u",2026,45.58911,-122.75637,["Cathedral Park has been named as a summer piano or concert spot for Piano. Push. Play. in past seasons. When a piano is there, it is meant for anyone to play. Unverified: this comes from undated third-party listings and is not confirmed for the current year; the season is July–August.","Cathedral Park figura como lugar de pianos o conciertos de verano de Piano. Push. Play. en temporadas anteriores. Cuando hay un piano, está pensado para que cualquiera lo toque. Sin verificar: el dato proviene de listados de terceros sin fecha y no está confirmado para el año en curso; la temporada es julio–agosto.","Cathedral Park는 지난 시즌 Piano. Push. Play.의 여름 피아노·공연 장소로 소개된 곳입니다. 피아노가 놓여 있을 때는 누구나 연주할 수 있습니다. 미확인 정보입니다. 날짜가 없는 외부 목록에 근거한 것이며 올해 설치 여부는 확인되지 않았습니다. 시즌은 7~8월입니다."],null,"","Cathedral Park, Portland, OR","pnw","Jul–Aug"],

 ["U","Riverfront Park Clock Tower","Piano in the Park · summer painted piano","Spokane · WA","park","u",2019,47.6614902,-117.4190073,["A painted upright piano was placed at the base of the Clock Tower in Spokane's Riverfront Park in June 2018 under Piano in the Park, run by the Piano Technicians Guild with Spokane Parks; the city invited visitors to play it all summer. A September 2019 Spokesman-Review story said it was still out and would be stored after Labor Day as weather allowed. No news after 2019 was found, so it is not confirmed that it still returns.","En junio de 2018 se colocó un piano vertical pintado al pie de la Clock Tower, en el Riverfront Park de Spokane, dentro de Piano in the Park, a cargo del Piano Technicians Guild y Spokane Parks; la ciudad invitó a los visitantes a tocarlo todo el verano. Un artículo del Spokesman-Review de septiembre de 2019 indicó que seguía afuera y que se guardaría después del Labor Day según el clima. No se encontraron noticias posteriores a 2019, así que no se ha confirmado que siga volviendo.","2018년 6월 Spokane Riverfront Park의 Clock Tower 아래에 그림을 입힌 업라이트 피아노가 놓였습니다. Piano Technicians Guild와 Spokane Parks가 함께 하는 Piano in the Park 프로그램이며, 시는 여름 내내 누구나 쳐 보라고 안내했습니다. 2019년 9월 Spokesman-Review 기사는 피아노가 아직 밖에 있고 날씨를 보아 Labor Day 뒤에 치운다고 전했습니다. 2019년 이후 소식은 찾지 못해 지금도 놓이는지는 확인되지 않았습니다."],null,"","Riverfront Park Clock Tower, Spokane, WA","pnw","Jun–Sep"],
 ["U","Riverfront Park Looff Carrousel","Piano in the Park · summer painted piano","Spokane · WA","park","u",2019,47.6606049,-117.4202142,["A second Piano in the Park upright was installed outside the Looff Carrousel in Spokane's Riverfront Park in May 2019, painted by kindergartners from Adams Elementary; KREM reported two pianos in the park that year. It was set out for any park visitor to play from about May to September. No news after 2019 was found, so it is not confirmed that it is still there or still returns.","En mayo de 2019 se instaló un segundo piano vertical de Piano in the Park frente al Looff Carrousel, en el Riverfront Park de Spokane, pintado por niños de kínder de Adams Elementary; KREM informó ese año de dos pianos en el parque. Estaba disponible para cualquier visitante aproximadamente de mayo a septiembre. No se encontraron noticias posteriores a 2019, así que no se ha confirmado que siga allí o que vuelva.","2019년 5월 Spokane Riverfront Park의 Looff Carrousel 앞에 Piano in the Park의 두 번째 업라이트 피아노가 놓였고, Adams Elementary 유치반 아이들이 그림을 입혔습니다. 그해 KREM은 공원에 피아노 2대가 놓였다고 보도했습니다. 대략 5월부터 9월까지 공원에 온 누구나 칠 수 있게 두었습니다. 2019년 이후 소식은 찾지 못해 지금도 있는지, 다시 놓이는지는 확인되지 않았습니다."],null,"","Riverfront Park Looff Carrousel, Spokane, WA","pnw","May–Sep"],

 ["U","Volunteer Park, Seattle","Pianos in the Parks · Capitol Hill","Seattle · WA","park","u",2019,47.629566,-122.315614,["Pianos in the Parks, run by Seattle Parks & Recreation with KEXP, places artist-painted outdoor pianos in city parks for anyone to play for two to three weeks each summer, roughly late July to mid-August. Volunteer Park was a site in 2014, 2015 and 2019; the 2019 season ran August 1–18 with 13 pianos, according to MyBallard (July 2019). Locations change every year, and no season after 2019 could be confirmed, so it is not confirmed that the program continues or that this park is still used.","Pianos in the Parks, de Seattle Parks & Recreation junto con KEXP, coloca pianos pintados por artistas al aire libre en parques de la ciudad para que cualquiera los toque durante dos o tres semanas cada verano, aproximadamente de finales de julio a mediados de agosto. Volunteer Park fue sede en 2014, 2015 y 2019; la temporada de 2019 fue del 1 al 18 de agosto con 13 pianos, según MyBallard (julio de 2019). Los lugares cambian cada año y no se pudo confirmar ninguna temporada posterior a 2019, así que no se ha confirmado que el programa continúe ni que este parque siga participando.","Seattle Parks & Recreation과 KEXP가 운영하는 Pianos in the Parks는 해마다 여름 2~3주(대략 7월 말~8월 중순) 동안 작가가 그림을 입힌 야외 피아노를 시내 공원에 두고 누구나 치게 합니다. Volunteer Park는 2014년·2015년·2019년에 피아노가 놓인 곳이며, MyBallard(2019년 7월)에 따르면 2019년에는 8월 1~18일에 13대가 놓였습니다. 장소는 해마다 바뀌고 2019년 이후 회차는 확인하지 못해, 프로그램이 이어지는지와 이 공원에 다시 놓이는지는 확인되지 않았습니다."],null,"","Volunteer Park, Seattle, Seattle, WA","pnw","Jul–Aug"],
];
</script>
<script>
const LI = {en:0,es:1,ko:2};
const ZONES = [
 ["ny",["New York","Nueva York","뉴욕주"],[]],
 ["ne",["New England · Mid-Atlantic","Nueva Inglaterra · Atlántico Medio","뉴잉글랜드·중부 대서양"],[]],
 ["se",["Southeast","Sureste","남동부"],[]],
 ["mw",["Midwest","Medio Oeste","중서부"],[]],
 ["mt",["Mountain · Southwest","Montaña · Suroeste","산악·남서부"],[]],
 ["ca",["California","California","캘리포니아"],[]],
 ["pnw",["Pacific Northwest · Hawaii","Noroeste del Pacífico · Hawái","태평양 북서부·하와이"],[]],
];
const zoneOf = p => p[13];
const GL = {S:"S",A:"A",B:"B",C:"C",U:"?"};
const q = s => document.querySelector(s);
const state = {grade:"all", zone:"all", lang:"en", q:"", view:"list", me:null, visits:null};  // 언제 열어도 태국어로 시작

const linkify = t => t.replace(/@([A-Za-z0-9._]+)/g, (m,h)=>`<a href="https://www.instagram.com/${h}" target="_blank" rel="noopener">@${h}</a>`);
const gmaps = p => "https://www.google.com/maps/search/?api=1&query="+(p[12]?encodeURIComponent(p[12]):p[7]+","+p[8]);
const u = () => UI[state.lang];
const li = () => LI[state.lang];

function renderText(){
  const t=u();
  document.documentElement.lang = state.lang;
  q("#h1").innerHTML=t.h1; q("#lede").textContent=t.lede; q("#call").textContent=t.call;
  q("#ch").textContent=t.ch; q("#cp").textContent=t.cp; q("#cl").innerHTML=[...new Set(P.map(p=>p[11]).filter(Boolean))].map(n=>`<li>${linkify(n)}</li>`).join(""); q("#plotnote").textContent=t.plotnote;
  { const nu=NEWS.ui[state.lang]||NEWS.ui.en; const show=P.some(isNew); q("#news").hidden=!show; q("#newsh").textContent=nu.h; q("#newsb").textContent=nu.b; q("#newsn").textContent=nu.n; q("#newss").textContent=nu.s||""; }
  q("#f1").textContent=t.f1; q("#f2").textContent=t.f2; q("#f3").innerHTML=t.f3; q("#f4").textContent=t.f4;
  q("#legend").innerHTML=["S","A","B","C","U"].map(g=>`<li><span class="tag ${g}">${GL[g]}</span><span>${t.legend[g]}</span></li>`).join("");
  const c={S:0,A:0,B:0,C:0,U:0}; P.forEach(p=>c[p[0]]++);
  q("#counts").innerHTML=["S","A","B","C","U"].map(g=>`<button type="button" data-g="${g}"><b>${c[g]}</b>${g==="U"?t.U:t.grade(g)}</button>`).join("");
  q("#q").placeholder=t.search; q("#empty").textContent=t.none; q("#fab").textContent=t.report;
  const v=U2(); q("#seg").children[0].textContent=v.list; q("#seg").children[1].textContent=v.mapv; q("#near").textContent=v.near;
  if(state.visits) q("#counts").insertAdjacentHTML("beforeend",`<span class="vis"><b>${state.visits}</b>${v.visits}</span>`);
  document.querySelectorAll("#lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.l===state.lang));
}

function renderFilters(){
  const t=u(), f=q("#filters");
  const mk=(k,v,label)=>`<button class="chip" type="button" data-k="${k}" data-v="${v}" aria-pressed="${state[k]===v}">${label}</button>`;
  f.innerHTML = mk("grade","all",t.all)+mk("grade","S","S")+mk("grade","A","A")+mk("grade","B","B")+mk("grade","C","C")+mk("grade","U",t.U)+(P.some(p=>p[14])?mk("grade","yr",t.yr):"")
    +`<button class="chip zreset" type="button" data-k="zone" data-v="all" ${state.zone==="all"?"hidden":""}>← ${t.allR}</button>`;
}

function renderList(){
  const t=u(), i=li();
  q("#list").innerHTML = (state.me?[...P].sort((a,b)=>dist(a)-dist(b)):P).map(p=>`
  <article class="card" id="c${P.indexOf(p)}" data-g="${p[0]}" data-new="0" data-seas="${p[14]?1:0}" data-z="${zoneOf(p)}" data-s="${[p[1],p[2],p[3],ZONES.find(z=>z[0]===zoneOf(p))[1].join(" "),T[p[4]].join(" "),p[9].join(" ")].join(" ").toLowerCase().replace(/"/g,"")}">
    <span class="tag ${p[0]}">${GL[p[0]]}</span>
    <div>
      <h2 class="name">${p[1]}${isNew(p)?'<span class="new">NEW</span>':""}${p[2]?`<span class="th">${p[2]}</span>`:""}</h2>
      <p class="meta">${state.me?`<span class="dist">${km(p)}</span> · `:""}<span class="gw ${p[0]}">${t.gword[p[0]]}</span> · ${p[3]} · ${T[p[4]][i]}${p[5]?" · "+K[p[5]][i]:""} · ${p[6]?t.seen+p[6]:t.noyear}${p[14]?` · <b class="seas">${t.season}${p[14]}</b>`:""}</p>
      <a class="map-m" href="${gmaps(p)}" target="_blank" rel="noopener">${t.map}</a>
      <p class="verdict">${p[9][i]}</p>
      ${p[11]?`<p class="contrib">${t.contrib} ${linkify(p[11])}</p>`:""}
    </div>
    <div class="side">${p[10]?`<button class="ph" type="button" data-full="${p[10][1]}" data-cap="${p[1]}"><img src="${p[10][0]}" alt="${p[1]}" loading="lazy"></button><span class="credit">${t.photo} ${p[10][2]}</span>`:""}<a class="map-d" href="${gmaps(p)}" target="_blank" rel="noopener">${t.map}</a></div>
  </article>`).join("");
}

function applyFilter(){
  const needle=state.q.trim().toLowerCase();
  const ok=el=>(state.grade==="all"||(state.grade==="yr"?el.dataset.seas==="0":el.dataset.g===state.grade))&&(state.zone==="all"||el.dataset.z===state.zone)&&(!needle||el.dataset.s.includes(needle));
  let shown=0; document.querySelectorAll(".card").forEach(el=>{ const v=ok(el); el.classList.toggle("hide",!v); if(v) shown++; });
  q("#empty").hidden = shown>0; q("#rcount").textContent=u().results(shown);
  const zr=q(".zreset"); if(zr){ zr.hidden = state.zone==="all"; }
  renderMarkers();
  document.querySelectorAll(".zone").forEach(el=>{
    el.setAttribute("aria-pressed", state.zone===el.dataset.z);
    el.querySelectorAll(".zk .w[data-g]").forEach(d=>d.style.opacity=(state.grade==="all"||state.grade==="yr"||d.dataset.g===state.grade)?1:.25);
  });
}

function renderZones(){
  const i=li(), order={S:0,A:1,B:2,C:3,U:4};
  const KW=10, H=40;
  const blackAfter=[0,1,3,4,5];               // 옥타브 안에서 검은건반이 붙는 흰건반 자리 (C D F G A)
  q("#zones").innerHTML = ZONES.map(z=>{
    const pts=P.filter(p=>zoneOf(p)===z[0]).sort((a,b)=>order[a[0]]-order[b[0]]);
    const WHITES=Math.max(14, Math.ceil(pts.length/7)*7);   // 기본 2옥타브, 장소가 넘치면 옥타브 단위로 늘림
    let k="";
    for(let w=0; w<WHITES; w++){
      const p=pts[w];
      k+=`<rect class="w ${p?p[0]:""}" ${p?`data-g="${p[0]}"`:""} x="${w*KW}" y="0" width="${KW}" height="${H}" rx="1.2">${p?`<title>${p[1]}</title>`:""}</rect>`;
    }
    for(let w=0; w<WHITES-1; w++){ if(blackAfter.includes(w%7)) k+=`<rect class="b" x="${(w+1)*KW-3}" y="0" width="6" height="${H*0.6}" rx="1"/>`; }
    return `<button class="zone" type="button" data-z="${z[0]}" aria-pressed="${state.zone===z[0]}">
      <span class="zn">${z[1][i]}</span>
      <span class="zc">${pts.length}</span>
      <svg class="zk" viewBox="0 0 ${WHITES*KW} ${H}" aria-hidden="true">${k}</svg>
    </button>`; }).join("");
}

// ── 지도 탭·내 주변 (GitHub 사이트에서만. claude.ai 미리보기는 바깥 지도·위치를 막는다)
const LIVE = /github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname);
const UI2 = {
 en:{"list":"List","mapv":"Map","near":"📍 Near me","locating":"Finding you…","locErr":"Could not get your location. Please allow location access in your browser.","more":"Show in list","visits":"visits"},
 es:{"list":"Lista","mapv":"Mapa","near":"📍 Cerca de mí","locating":"Buscando tu ubicación…","locErr":"No se pudo obtener tu ubicación. Permite el acceso a la ubicación en tu navegador.","more":"Ver en la lista","visits":"visitas"},
 ko:{"list":"목록","mapv":"지도","near":"📍 내 주변","locating":"위치 확인 중…","locErr":"위치를 가져오지 못했습니다. 브라우저에서 위치 권한을 허용해 주세요.","more":"목록에서 보기","visits":"누적 방문"}
};
const U2 = () => UI2[state.lang];
const dist = p => { if(!state.me) return 0; const r=x=>x*Math.PI/180, dLa=r(p[7]-state.me.lat), dLo=r(p[8]-state.me.lng);
  const a=Math.sin(dLa/2)**2+Math.cos(r(state.me.lat))*Math.cos(r(p[7]))*Math.sin(dLo/2)**2; return 12742*Math.asin(Math.sqrt(a)); };
const km = p => { const d=dist(p); return d<1 ? Math.round(d*100)*10+" m" : (d<10 ? d.toFixed(1) : Math.round(d))+" km"; };
const visible = () => [...document.querySelectorAll(".card:not(.hide)")].map(el=>P[+el.id.slice(1)]);
const GCOL = {S:"#B23A2E",A:"#2E6B3E",B:"#9A742A",C:"#5A6470",U:"#8C877F"};
let map=null, layer=null;
const loadLeaflet = () => window.L ? Promise.resolve() : new Promise((ok,ng)=>{
  const c=document.createElement("link"); c.rel="stylesheet"; c.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(c);
  const j=document.createElement("script"); j.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"; j.onload=ok; j.onerror=ng; document.head.appendChild(j); });
function popupHtml(p){
  const t=u(), i=li(), v=p[9][i];
  return `<div class="pp"><b>${p[1]}</b><div class="pm"><span class="gw ${p[0]}">${t.gword[p[0]]}</span> · ${T[p[4]][i]}${state.me?" · "+km(p):""}</div>`
    +`${p[10]?`<img src="${p[10][0]}" alt="">`:""}<p>${v.length>140?v.slice(0,140)+"…":v}</p>`
    +`<div class="pa"><a href="${gmaps(p)}" target="_blank" rel="noopener">${t.map}</a><button type="button" data-goto="${P.indexOf(p)}">${U2().more}</button></div></div>`;
}
function renderMarkers(){
  if(!map) return; layer.clearLayers();
  const rank={U:0,C:1,B:2,A:3,S:4};                     // 나중에 그린 핀이 위로 — S가 맨 위
  visible().sort((a,b)=>rank[a[0]]-rank[b[0]]).forEach(p=>L.circleMarker([p[7],p[8]],{
    radius:p[0]==="S"?10:p[0]==="U"?6:8, color:"#fff", weight:2, fillColor:GCOL[p[0]], fillOpacity:p[0]==="U"?.6:.95
  }).bindPopup(()=>popupHtml(p),{maxWidth:260}).addTo(layer));
  if(state.me) L.circleMarker([state.me.lat,state.me.lng],{radius:7,color:"#fff",weight:3,fillColor:"#2B6CB0",fillOpacity:1}).addTo(layer);
}
function fitView(){
  if(!map) return; const vis=visible();
  if(state.me){ const near=[...vis].sort((a,b)=>dist(a)-dist(b)).slice(0,5);
    map.fitBounds(L.latLngBounds([[state.me.lat,state.me.lng],...near.map(p=>[p[7],p[8]])]),{padding:[30,30],maxZoom:15}); return; }
  let pts=vis; if(state.zone==="all"){ const core=vis.filter(p=>p[8]>-126&&p[7]<50); if(core.length) pts=core; }
  if(pts.length) map.fitBounds(L.latLngBounds(pts.map(p=>[p[7],p[8]])),{padding:[30,30],maxZoom:15});
}
async function setView(v){
  state.view=v; q("#list").hidden=v==="map"; q("#map").hidden=v!=="map";
  [...q("#seg").children].forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===v));
  if(v!=="map") return;
  try{ await loadLeaflet(); }catch(e){ setView("list"); return; }
  if(!map){ map=L.map("map",{scrollWheelZoom:false});
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,                // 키 없는 OSM 기본 타일 (CARTO는 키 필요해짐)
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
    layer=L.layerGroup().addTo(map); }
  map.invalidateSize(); renderMarkers(); fitView();
}
function locate(){
  const m=q("#locmsg");
  if(state.me){ state.me=null; m.textContent=""; q("#near").setAttribute("aria-pressed",false); renderList(); applyFilter(); fitView(); return; }
  if(!navigator.geolocation){ m.textContent=U2().locErr; return; }
  m.textContent=U2().locating;
  navigator.geolocation.getCurrentPosition(pos=>{
    state.me={lat:pos.coords.latitude,lng:pos.coords.longitude}; m.textContent=""; q("#near").setAttribute("aria-pressed",true);
    renderList(); applyFilter(); fitView(); q("#bar").scrollIntoView({behavior:"smooth",block:"start"});
  }, ()=>{ m.textContent=U2().locErr; }, {timeout:10000, maximumAge:300000});
}
if(LIVE){
  q("#vrow").hidden=false;
  q("#seg").onclick=e=>{ const b=e.target.closest("button"); if(b) setView(b.dataset.v); };
  q("#near").onclick=locate;
  q("#map").addEventListener("click",e=>{ const b=e.target.closest("[data-goto]"); if(!b) return;
    setView("list"); const c=q("#c"+b.dataset.goto); c.scrollIntoView({behavior:"smooth",block:"center"}); c.classList.remove("flash"); void c.offsetWidth; c.classList.add("flash"); });
}

// ── 누적 방문 (GoatCounter). 코드를 넣으면 켜지고, GC_MIN 이상일 때만 보인다
const GC_CODE = "", GC_MIN = 300;
const GC_BASE = 1340;   // GoatCounter 시작 전 Cloudflare 누적 방문 — 시작일 기준 숫자로 맞출 것
if(GC_CODE && location.hostname.endsWith("github.io")){
  const g=document.createElement("script"); g.async=true; g.src="https://gc.zgo.at/count.js"; g.dataset.goatcounter=`https://${GC_CODE}.goatcounter.com/count`; document.body.appendChild(g);
  fetch(`https://${GC_CODE}.goatcounter.com/counter/TOTAL.json`).then(r=>r.ok?r.json():null).then(j=>{
    const n=j ? GC_BASE + +String(j.count).replace(/\D/g,"") : 0;
    if(n<GC_MIN) return; const t0=performance.now();
    const step=now=>{ const k=Math.min(1,(now-t0)/900); state.visits=Math.round(n*(1-(1-k)**3)).toLocaleString("en-US"); renderText(); if(k<1) requestAnimationFrame(step); };
    requestAnimationFrame(step); }).catch(()=>{});
}

function renderAll(){ renderText(); renderFilters(); renderZones(); renderList(); applyFilter(); }
q("#lang").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; state.lang=b.dataset.l; renderAll(); };
q("#filters").onclick=e=>{ const b=e.target.closest(".chip"); if(!b) return; state[b.dataset.k]=b.dataset.v; if(b.dataset.k==="grade"&&b.dataset.v==="all") state.zone="all"; renderFilters(); applyFilter(); };
q("#q").oninput=e=>{ state.q=e.target.value; applyFilter(); };
q("#counts").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; state.grade=b.dataset.g; renderFilters(); applyFilter(); q("#bar").scrollIntoView({behavior:"smooth",block:"start"}); };
const toContact=()=>q("#contribs").scrollIntoView({behavior:"smooth",block:"start"});
q("#fab").onclick=toContact; q("#call").onclick=toContact;
q("#zones").onclick=e=>{ const b=e.target.closest(".zone"); if(!b) return; state.zone = state.zone===b.dataset.z ? "all" : b.dataset.z; applyFilter(); fitView(); };
q("#list").onclick=e=>{ const b=e.target.closest(".ph"); if(!b) return; q("#lbimg").src=b.dataset.full; q("#lbimg").alt=b.dataset.cap; q("#lbcap").textContent=b.dataset.cap; q("#lb").hidden=false; };
q("#lb").onclick=()=>{ q("#lb").hidden=true; q("#lbimg").src=""; };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ q("#lb").hidden=true; } });
renderAll();
</script>

</body>
</html>
