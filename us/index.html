 ["A","Glacier Park International Airport","Second floor, past security","Kalispell · MT","airport","",2025,48.30679,-114.25207,["The airport has installed a new grand piano on the second floor of the terminal, past security, and anyone who has cleared security may play it. This comes from a KPAX news report believed to date from mid-2025; its exact date has not been confirmed.","El aeropuerto instaló un nuevo piano de cola en el segundo piso de la terminal, después del control de seguridad, y cualquiera que haya pasado el control puede tocarlo. La información proviene de un reportaje de KPAX que se estima de mediados de 2025; su fecha exacta no se ha confirmado.","공항이 터미널 2층 보안검색대 안쪽에 새 그랜드 피아노를 들였고, 보안검색을 통과한 사람은 누구나 칠 수 있습니다. 2025년 중반 것으로 보이는 KPAX 뉴스 기사 기준이며, 정확한 날짜는 확인되지 않았습니다."],null,"","Glacier Park International Airport, Kalispell, MT","mt",""],
 ["A","Hilton Austin","Two grand pianos · 4th and 6th floor meeting levels","Austin · TX","hotel","g",2024,30.265183,-97.738103,["Two grand pianos are reported at the Hilton Austin, on the 4th-floor and 6th-floor meeting levels. They can be played when no events are underway and the pianos are not locked up; they can also be reserved for events. A community-run database of Austin pianos marks them playable as of a visit on September 4, 2024; not confirmed as still in place.","Se informa de dos pianos de cola en el Hilton Austin, en los niveles de salas de reuniones de los pisos 4 y 6. Se pueden tocar cuando no hay eventos en curso y los pianos no están bajo llave; también pueden reservarse para eventos. Una base de datos comunitaria de pianos de Austin los marca como utilizables según una visita del 4 de septiembre de 2024; no se ha confirmado que sigan en su lugar.","Austin의 Hilton Austin 4층과 6층 회의장 층에 그랜드 피아노 2대가 있다고 알려져 있습니다. 행사가 없고 피아노가 잠겨 있지 않을 때 칠 수 있으며, 행사용으로 예약되기도 합니다. Austin 피아노를 모은 커뮤니티 데이터베이스에 2024년 9월 4일 방문 기준 연주 가능으로 올라 있으며, 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","Hilton Austin, Austin, TX","mt",""],
 ["A","Houston Public Library – Central Library","Jesse H. Jones Building · grand piano · by reservation","Houston · TX","library","g",2026,29.759382,-95.369954,["A Pearl River grand piano (5 ft 7 in) is listed under the 'Central Library Piano' space at Houston Public Library's Central Library, Jesse H. Jones Building (500 McKinney St.). It appears to be booked through the library's reservation calendar for practice or small performances; library-card and time-limit rules are not stated on the page. Listed on the library's official equipment page as of November 2026.","Un piano de cola Pearl River (5 pies 7 pulgadas) figura en el espacio 'Central Library Piano' de la Central Library de Houston Public Library, Jesse H. Jones Building (500 McKinney St.). Al parecer se reserva mediante el calendario de reservas de la biblioteca para practicar o dar pequeñas presentaciones; la página no indica requisitos de carné ni límites de tiempo. Figura en la página oficial de equipamiento de la biblioteca a noviembre de 2026.","Houston Public Library의 Central Library, Jesse H. Jones Building(500 McKinney St.)에 'Central Library Piano' 공간의 장비로 Pearl River 그랜드 피아노(5피트 7인치)가 올라 있습니다. 연습이나 소규모 연주를 위해 도서관 예약 캘린더로 예약해 쓰는 것으로 보이며, 도서관 카드 조건이나 시간 제한은 페이지에 나와 있지 않습니다. 2026년 11월 기준 도서관 공식 장비 페이지에 올라 있습니다."],null,"","Houston Public Library – Central Library, Houston, TX","mt",""],

 ["A","Ledges Event Center","Art Pianos for All","Coalville · UT","culture","u",2026,40.91706,-111.39188,["An Art Pianos for All upright in a public area of the Ledges Event Center, 202 Park Rd. The program places its pianos for all to play, during building hours. It is in the arts council's current public art guide, but that page is undated and a 2022 listing said only five of the program's pianos were still maintained, so check before you go.","Piano vertical del programa Art Pianos for All, en un área pública del Ledges Event Center (202 Park Rd.). El programa coloca sus pianos para que cualquiera los toque, dentro del horario del edificio. Figura en la guía de arte público vigente del consejo de artes, pero la página no tiene fecha y un listado de 2022 decía que solo cinco pianos del programa seguían en mantenimiento; conviene confirmar antes de ir.","Art Pianos for All 프로그램의 업라이트 피아노로, Ledges Event Center(202 Park Rd.)의 공용 공간에 있습니다. 누구나 칠 수 있도록 둔 피아노이며 건물 운영 시간에 이용할 수 있습니다. 예술위원회의 현행 공공미술 안내에 실려 있으나 페이지에 날짜가 없고, 2022년 자료에는 프로그램 피아노 중 5대만 관리되고 있다고 되어 있어 방문 전 확인이 필요합니다."],null,"","Ledges Event Center, Coalville, UT","mt",""],

 ["A","South Summit Aquatic Center","Art Pianos for All","Kamas · UT","other","u",2026,40.64009,-111.27252,["An Art Pianos for All upright in a public area of the South Summit Aquatic Center, 350 E 200 S in Kamas. The program places its pianos for all to play, during building hours. It is in the arts council's current public art guide, but that page is undated and a 2022 listing said only five of the program's pianos were still maintained, so check before you go.","Piano vertical del programa Art Pianos for All, en un área pública del South Summit Aquatic Center (350 E 200 S, Kamas). El programa coloca sus pianos para que cualquiera los toque, dentro del horario del edificio. Figura en la guía de arte público vigente del consejo de artes, pero la página no tiene fecha y un listado de 2022 decía que solo cinco pianos del programa seguían en mantenimiento; conviene confirmar antes de ir.","Art Pianos for All 프로그램의 업라이트 피아노로, Kamas의 South Summit Aquatic Center(350 E 200 S) 공용 공간에 있습니다. 누구나 칠 수 있도록 둔 피아노이며 건물 운영 시간에 이용할 수 있습니다. 예술위원회의 현행 공공미술 안내에 실려 있으나 페이지에 날짜가 없고, 2022년 자료에는 프로그램 피아노 중 5대만 관리되고 있다고 되어 있어 방문 전 확인이 필요합니다."],null,"","South Summit Aquatic Center, Kamas, UT","mt",""],
 ["A","St. Rose Dominican, Siena Campus","Main lobby","Henderson · NV","hospital","",2025,36.00425,-115.11503,["A piano is in the main lobby. A November 2025 article says the St. Rose hospitals have lobby pianos that are open to anyone. That statement covers the St. Rose hospitals in general rather than this campus by name, and it rests on a single article, so confirm at the front desk.","Hay un piano en el vestíbulo principal. Un artículo de noviembre de 2025 dice que los hospitales St. Rose tienen pianos en sus vestíbulos abiertos a cualquiera. La afirmación se refiere a los hospitales St. Rose en general y no a este campus en particular, y se basa en un solo artículo; confirme en la recepción.","메인 로비에 피아노가 있습니다. 2025년 11월 기사에 따르면 St. Rose 병원들의 로비 피아노는 누구나 칠 수 있습니다. 다만 이 내용은 이 캠퍼스를 따로 지목한 것이 아니라 St. Rose 병원 전반에 대한 설명이고 기사 한 건에 근거하므로, 안내 데스크에서 확인하시기 바랍니다."],null,"","St. Rose Dominican, Siena Campus, Henderson, NV","mt",""],

 ["A","Davis Food Co-op","In the Key of Davis · year-round","Davis · CA","market","u",2024,38.54934,-121.73993,["A vibrantly painted In the Key of Davis piano is placed at Davis Food Co-op, 620 G Street, Davis, for everyone to play. The city's 2026 arts page lists it as a year-round piano. The location comes from a June 2024 listing and has not been reconfirmed since.","Hay un piano de In the Key of Davis, pintado con colores vivos, en Davis Food Co-op, 620 G Street, Davis. Los pianos están ahí para que todos puedan tocar. La página de arte de la ciudad (2026) lo clasifica como piano disponible todo el año. La ubicación proviene de un listado de junio de 2024 y no se ha vuelto a confirmar.","Davis의 Davis Food Co-op(620 G Street)에 In the Key of Davis의 화려하게 페인팅된 피아노가 놓입니다. 누구나 연주할 수 있는 피아노입니다. 시 예술 안내 페이지(2026년)에는 연중 운영 피아노로 분류되어 있습니다. 위치는 2024년 6월 목록 기준이며 이후 다시 확인되지는 않았습니다."],null,"","Davis Food Co-op, Davis, CA","ca",""],
 ["A","Downtown Nevada City","Painted Pianos","Nevada City · CA","street","u",2025,39.26156,-121.01606,["Painted pianos are planned for spots throughout downtown Nevada City; the locations are not listed. They are meant for anyone to play, inviting spontaneous performances. Based on an April 2025 report that pianos were expected on the streets from June 2025; season length is unknown and nothing newer confirms them.","Está previsto colocar pianos pintados en distintos puntos del centro de Nevada City; no se detallan las ubicaciones. Están pensados para que cualquiera toque e invitan a presentaciones espontáneas. Según una nota de abril de 2025, se esperaban en las calles desde junio de 2025; se desconoce la duración de la temporada y no hay confirmación más reciente.","Nevada City 도심 곳곳에 색칠된 피아노를 놓을 계획이며, 개별 위치는 공개되어 있지 않습니다. 누구나 즉흥적으로 연주할 수 있도록 마련된 피아노입니다. 2025년 4월 보도에 따르면 2025년 6월부터 거리에 놓일 예정이었으며, 운영 기간은 알 수 없으며 이후 확인된 자료는 없습니다."],null,"","Downtown Nevada City, Nevada City, CA","ca",""],
 ["A","JFK Promenade, Golden Gate Park","Illuminate Golden Mile · outdoor upright","San Francisco · CA","park","u",2026,37.787936,-122.40752,["An outdoor upright piano stands on the car-free JFK Promenade in Golden Gate Park, and anyone can play it during park hours. An April 2026 ABC7 report said the park was down to its last working public piano after vandalism and weather; the nonprofit Illuminate restored donated pianos and placed them there about four years earlier. A news photo suggests the remaining piano is near Blue Heron (Stow) Lake, but the exact spot is not confirmed.","Un piano vertical al aire libre está en el JFK Promenade, la vía sin coches del Golden Gate Park, y cualquiera puede tocarlo en el horario del parque. Un reportaje de ABC7 de abril de 2026 indicó que al parque le quedaba un solo piano público en funcionamiento tras el vandalismo y el clima; la organización Illuminate restauró pianos donados y los colocó allí unos cuatro años antes. Una foto de la noticia sugiere que el piano que queda está cerca del lago Blue Heron (Stow), pero el lugar exacto no está confirmado.","Golden Gate Park의 차 없는 길 JFK Promenade에 야외 업라이트 피아노가 있으며, 공원 운영 시간에는 누구나 칠 수 있습니다. 2026년 4월 ABC7 보도에 따르면 훼손과 날씨 탓에 공원에 제대로 쳐지는 공용 피아노가 1대만 남았습니다. 비영리 단체 Illuminate가 기증받은 피아노를 고쳐 약 4년 전에 이곳에 두었습니다. 보도 사진으로 보아 남은 피아노는 Blue Heron(Stow) Lake 근처로 보이지만 정확한 자리는 확인되지 않았습니다."],null,"","JFK Promenade, Golden Gate Park, San Francisco, CA","ca",""],

 ["A","Museum of Making Music","Backstage Lounge","Carlsbad · CA","museum","",2021,33.12741,-117.31711,["【PAID】 Museum admission applies (price not confirmed). The interactive Backstage Lounge inside the museum is a hands-on area that includes a piano alongside guitars, a harp and percussion. Based on a description from around 2021, after the museum reopened following renovation.","【DE PAGO】 Se paga la entrada al museo (precio no confirmado). El Backstage Lounge, un área interactiva dentro del museo, incluye un piano junto con guitarras, un arpa y percusión para probar. Se basa en una descripción de alrededor de 2021, tras la reapertura del museo luego de su renovación.","【유료】 박물관 입장료를 내야 합니다(금액은 확인되지 않음). 박물관 안 체험 공간인 Backstage Lounge에 기타, 하프, 타악기와 함께 직접 쳐 볼 수 있는 피아노가 있습니다. 박물관이 새 단장 후 다시 문을 연 2021년 무렵의 설명에 근거한 정보입니다."],null,"","Museum of Making Music, Carlsbad, CA","ca",""],
 ["A","San Diego International Airport","Terminal 2","San Diego · CA","airport","",2026,32.73289,-117.18971,["The airport's official website lists a 'Terminal 2 – Public Piano' venue, and an official event page from January 2026 features an automatic player piano at Terminal 2's Sunset Cove. A travel guide places a piano in the Terminal 2 West Rotunda before security and says anyone can play. The exact spot, and an official statement that passengers may play, have not been confirmed.","El sitio oficial del aeropuerto incluye un espacio llamado 'Terminal 2 – Public Piano', y una página oficial de eventos de enero de 2026 presenta un piano de reproducción automática en Sunset Cove, en la Terminal 2. Una guía de viajes sitúa un piano en la West Rotunda de la Terminal 2, antes del control de seguridad, y dice que cualquiera puede tocarlo. No se han confirmado la ubicación exacta ni una indicación oficial de que los pasajeros puedan tocarlo.","공항 공식 사이트에 'Terminal 2 – Public Piano'라는 장소 항목이 있고, 2026년 1월 공식 행사 페이지는 Terminal 2 Sunset Cove의 자동 연주 피아노를 소개합니다. 한 여행 안내 글은 Terminal 2 West Rotunda 보안검색대 앞에 누구나 칠 수 있는 피아노가 있다고 적었습니다. 정확한 자리와 승객이 쳐도 된다는 공식 안내는 확인되지 않았습니다."],null,"","San Diego International Airport, San Diego, CA","ca",""],
 ["A","San José Mineta International Airport","Terminal B, baggage claim","San Jose · CA","airport","g",null,37.36353,-121.92859,["A baby grand piano is in the Terminal B baggage claim area. The airport's official amenities page lists it and says anyone may play. The page carries no date, so it is worth checking on site.","Hay un piano de media cola en la zona de recogida de equipaje de la Terminal B. La página oficial de servicios del aeropuerto lo incluye y dice que cualquiera puede tocarlo. La página no tiene fecha, por lo que conviene comprobarlo en el lugar.","Terminal B 수하물 찾는 곳에 베이비그랜드 피아노가 있습니다. 공항 공식 편의시설 페이지에 올라 있으며 누구나 칠 수 있다고 안내합니다. 페이지에 날짜가 없으니 현장에서 한 번 확인하는 것이 좋습니다."],null,"","San José Mineta International Airport, San Jose, CA","ca",""],

 ["A","Pacific Antiques Mall","Lunchroom","Tacoma · WA","mall","",2026,47.16364,-122.43476,["A public piano is in the lunchroom of Pacific Antiques Mall, 10228 Pacific Ave S. Visitors are invited to enjoy it; no rules or hours are stated. The mall's own page says it was recently tuned; the page is live in 2026 but undated.","Hay un piano público en el comedor de Pacific Antiques Mall, 10228 Pacific Ave S. Se invita a los visitantes a disfrutarlo; no se indican reglas ni horarios. La página del lugar dice que fue afinado recientemente; está vigente en 2026 pero no tiene fecha.","Pacific Antiques Mall(10228 Pacific Ave S)의 lunchroom에 공공 피아노가 있습니다. 방문객 누구나 즐길 수 있다고 안내하며 이용 규칙이나 시간은 나와 있지 않습니다. 매장 페이지에 최근 조율했다고 되어 있고, 2026년 현재 게시 중이지만 날짜는 없습니다."],null,"","Pacific Antiques Mall, Tacoma, WA","pnw",""],
 ["A","Auburndale Library","Artful Pianos · 'Share the Spotlight'","Newton · MA","street","u",2026,42.34647,-71.24944,["The painted piano 'Share the Spotlight' sits outside the Auburndale Library in Auburndale. Anyone may play; a volunteer 'Piano Pal' looks after each piano, and it may be covered with a tarp. Confirmed in June 2026: seven Artful Pianos go out in late May and stay until Labor Day each year. No street number is given.","El piano pintado 'Share the Spotlight' está frente a la Auburndale Library, en Auburndale. Cualquiera puede tocarlo y cada piano tiene un voluntario encargado ('Piano Pal'); es posible que lo encuentre cubierto con una lona. Confirmado en junio de 2026: cada año los voluntarios instalan siete Artful Pianos a fines de mayo y permanecen hasta el Labor Day. No se indica el número de calle.","색칠된 피아노 'Share the Spotlight' 한 대가 Auburndale의 Auburndale Library 앞에 놓입니다. 누구나 연주할 수 있고 피아노마다 자원봉사자 'Piano Pal'이 관리하며, 방수포로 덮여 있을 수 있습니다. 2026년 6월 자료로 확인되었으며, 매년 5월 말 자원봉사자들이 Artful Pianos 7대를 내놓아 Labor Day까지 둡니다. 번지는 나와 있지 않습니다."],null,"","Auburndale Library, Newton, MA","ne","late May–Labor Day"],

 ["A","Dillsburg Area Public Library","Painted piano at the entrance · outdoor","Dillsburg · PA","library","u",2025,40.112403,-77.030072,["A donated upright piano, painted and installed by two Northern High School seniors, stands outside the Dillsburg Area Public Library entrance under the overhang, and visitors are invited to play. An August 2025 York County Libraries post said it would stay outside until the Farmers Fair (October 13–18, 2025). Whether it returns in later years is not known.","Un piano vertical donado, pintado e instalado por dos estudiantes de último año de Northern High School, está fuera de la entrada de la Dillsburg Area Public Library, bajo el alero, y se invita a los visitantes a tocarlo. Una publicación de York County Libraries de agosto de 2025 decía que seguiría fuera hasta la Farmers Fair (13–18 de octubre de 2025). No se sabe si vuelve en años siguientes.","Northern High School 졸업반 학생 두 명이 칠하고 설치한 기증 업라이트 피아노가 Dillsburg Area Public Library 입구 밖 차양 아래에 있으며, 방문객 누구나 치도록 권합니다. 2025년 8월 York County Libraries 게시글은 Farmers Fair(2025년 10월 13~18일)까지 밖에 둔다고 했습니다. 이후 해에도 다시 나오는지는 알 수 없습니다."],null,"","Dillsburg Area Public Library, Dillsburg, PA","ne","Summer–Oct"],

 ["A","Main Street, Nashua","Downtown Pianos","Nashua · NH","street","u",2026,42.74488,-71.4589,["Pianos are set out along Main Street in downtown Nashua; an upright also stood in the Library Walk in 2025. Anyone is invited to play. Announced for 'All Summer 2026' by the Downtown Nashua Association, which revived a 2016–2019 tradition, but individual spots have not been published.","Se colocan pianos a lo largo de Main Street, en el centro de Nashua; en 2025 también hubo un piano vertical en el Library Walk. Cualquiera está invitado a tocar. La Downtown Nashua Association, que retomó una tradición de 2016–2019, lo anunció para 'todo el verano de 2026', pero aún no ha publicado los puntos exactos.","Nashua 도심 Main Street 일대에 피아노가 놓이며, 2025년에는 Library Walk에도 업라이트 피아노가 있었습니다. 누구나 연주할 수 있습니다. 2016~2019년의 전통을 되살린 Downtown Nashua Association이 '2026년 여름 내내' 운영한다고 안내했지만, 개별 위치는 아직 공개되지 않았습니다."],null,"","Main Street, Nashua, Nashua, NH","ne","summer"],

 ["A","The Winter Center","Keys for the City · Millersville","Millersville · PA","culture","u",2026,40.00051,-76.35856,["A Keys for the City piano is listed at The Winter Center in Millersville; the exact spot is not given. The program says its pianos appear from the third week of May and are accessible 24/7 for anyone to play. It is on the program's 2026 list but missing from the local newspaper's list, so confirm before visiting; the season is May–September.","Un piano de Keys for the City figura en The Winter Center, en Millersville; no se indica el punto exacto. Según el programa, los pianos aparecen desde la tercera semana de mayo y están accesibles las 24 horas para quien quiera tocar. Aparece en la lista oficial de ubicaciones 2026, pero no en la del periódico local, así que confirme antes de ir; la temporada es de mayo a septiembre.","Millersville의 The Winter Center에 Keys for the City 피아노가 있는 것으로 안내되어 있으나 정확한 위치는 나와 있지 않습니다. 프로그램 측에 따르면 피아노는 5월 셋째 주부터 놓이며 24시간 누구나 연주할 수 있습니다. 2026년 공식 장소 목록에는 있지만 지역 신문 목록에는 없으므로 방문 전에 확인하시기 바랍니다. 시즌은 5~9월입니다."],null,"","The Winter Center, Millersville, PA","ne","May–Sep"],
 ["A","Wolfeboro","Street Piano Project · around town","Wolfeboro · NH","street","u",2026,43.5845,-71.21055,["Several upright pianos, many painted by Kingswood Regional High School students, are placed around Wolfeboro each spring and summer; the spots are not listed. They are street pianos for anyone of any age to play. Based on a February 2026 report; the locations still need confirming.","Cada primavera y verano se colocan varios pianos verticales en distintos puntos de Wolfeboro, muchos pintados por estudiantes de Kingswood Regional High School; no se detallan las ubicaciones. Son pianos callejeros para que toque cualquiera, de cualquier edad. Basado en un informe de febrero de 2026; las ubicaciones aún deben confirmarse.","매년 봄·여름 Wolfeboro 시내 곳곳에 업라이트 피아노 여러 대가 놓이며, 상당수는 Kingswood Regional High School 학생들이 색칠한 것입니다. 개별 위치는 나와 있지 않습니다. 나이에 관계없이 누구나 연주할 수 있는 거리 피아노입니다. 2026년 2월 자료 기준이며 위치는 추가 확인이 필요합니다."],null,"","Wolfeboro, Wolfeboro, NH","ne","spring–summer"],
 ["A","Downtown Lynchburg","Hill City Keys · Academy Center of the Arts · about 8 pianos","Lynchburg · VA","street","u",2024,37.417274,-79.144313,["Hill City Keys, run by the Academy Center of the Arts (600 Main St), places about eight painted pianos at outdoor spots around downtown Lynchburg each summer. They are free for anyone to play during the season, roughly June to August. The program has run since 2014 and its 10th-anniversary season opened in June 2024; later seasons and the current site list are not confirmed. Not confirmed as still in place.","Hill City Keys, de Academy Center of the Arts (600 Main St), coloca cada verano unos ocho pianos pintados en puntos al aire libre del centro de Lynchburg. Son gratuitos y cualquiera puede tocarlos durante la temporada, aproximadamente de junio a agosto. El programa existe desde 2014 y su temporada del décimo aniversario abrió en junio de 2024; las temporadas posteriores y la lista actual de lugares no están confirmadas. No se ha confirmado que sigan en el lugar.","Academy Center of the Arts(600 Main St)가 운영하는 Hill City Keys는 매년 여름 Lynchburg 시내 야외 여러 곳에 페인팅된 피아노 8대가량을 놓습니다. 무료이며 시즌(대략 6~8월) 동안 누구나 칠 수 있습니다. 2014년부터 이어진 프로그램으로 10주년 시즌이 2024년 6월에 시작되었고, 그 뒤 시즌과 현재 설치 장소 목록은 확인되지 않았습니다. 지금도 있는지는 확인되지 않았습니다."],null,"","Downtown Lynchburg, Lynchburg, VA","se","Jun–Aug"],
 ["A","Main Street, Downtown Thomasville","Painted Piano Project · PACE Downtown Thomasville","Thomasville · NC","street","u",2025,35.882929,-80.082004,["Painted pianos are set out along Main Street in downtown Thomasville (near the Big Chair) by PACE Downtown Thomasville's Painted Piano Project; individual sites are not published. They are free for passersby to play through the summer, roughly May to August, and an annual Painted Piano Festival evening features pianists. Ten pianos debuted in August 2023, seven were reported in 2024, and the festival was last documented in May 2025. Not confirmed as still in place.","El Painted Piano Project de PACE Downtown Thomasville coloca pianos pintados a lo largo de Main Street, en el centro de Thomasville (cerca de la Big Chair); no se publican las ubicaciones de cada piano. Son gratuitos y quedan a disposición de quienes pasan durante el verano, aproximadamente de mayo a agosto; cada año hay además una velada del Painted Piano Festival con pianistas. En agosto de 2023 se estrenaron diez pianos, en 2024 se informó de siete y el festival se documentó por última vez en mayo de 2025. No se ha confirmado que sigan en el lugar.","Thomasville 시내 Main Street(Big Chair 근처)를 따라 PACE Downtown Thomasville의 Painted Piano Project 피아노들이 놓이며, 피아노별 위치는 공개되어 있지 않습니다. 무료이고 여름 동안(대략 5~8월) 지나가는 누구나 칠 수 있으며, 해마다 피아니스트들이 참여하는 Painted Piano Festival 저녁 행사가 열립니다. 2023년 8월 10대로 시작해 2024년에는 7대로 보도되었고, 축제는 2025년 5월 것이 마지막 기록입니다. 지금도 있는지는 확인되지 않았습니다."],null,"","Main Street, Downtown Thomasville, Thomasville, NC","se","May–Aug"],
 ["A","Beverly Area Planning Association","Chicago Plays · Beverly","Chicago · IL","other","u",2026,41.71427,-87.66713,["A Chicago Plays public piano is listed at the Beverly Area Planning Association in Beverly. The program gives free access to pianos in public spaces, so anyone can play. Pianos are out from early June to mid-October each year; this site rests on a single listing plus a July 2026 local news mention, so confirm the piano is there before a special trip.","Hay un piano público de Chicago Plays registrado en Beverly Area Planning Association, en Beverly. El programa ofrece acceso gratuito a pianos en espacios públicos de Chicago, así que cualquiera puede tocar. Los pianos están desde principios de junio hasta mediados de octubre de cada año; este punto se basa en un único listado y una mención en la prensa local de julio de 2026, por lo que conviene confirmar que el piano esté antes de ir.","Chicago의 Beverly 지역 Beverly Area Planning Association에 Chicago Plays 공공 피아노가 있는 것으로 등록되어 있습니다. Chicago의 공공장소에서 누구나 무료로 피아노를 칠 수 있게 하는 프로그램입니다. 매년 6월 초부터 10월 중순까지 운영되며, 이 위치는 목록 한 건과 2026년 7월 지역 언론 언급에만 근거한 정보이므로 방문 전에 피아노가 있는지 확인하시기 바랍니다."],null,"","Beverly Area Planning Association, Chicago, IL","mw","Jun–mid-Oct"],
 ["A","Black Cat Ice Cream","City Sounds · outside","Des Moines · IA","cafe","u",2026,41.58524,-93.63384,["A painted upright piano is bolted down outside Black Cat Ice Cream, a 2026 host site of City Sounds: The Des Moines Public Piano Project. Anyone in the community may play. Out from mid-May (May 16 in 2026) until the October Piano Smash; no street address is given, and the city is assumed to be the Des Moines area.","Un piano vertical pintado está fijado al suelo frente a Black Cat Ice Cream, sede 2026 de City Sounds: The Des Moines Public Piano Project. Está pensado para que cualquier persona de la comunidad lo toque. Los pianos salen a mediados de mayo (16 de mayo en 2026) y permanecen hasta el Piano Smash de octubre; la fuente no indica la dirección ni la ciudad, que se supone es el área de Des Moines.","City Sounds: The Des Moines Public Piano Project의 2026년 설치 장소인 Black Cat Ice Cream 앞 야외에 색칠된 업라이트 피아노가 고정되어 있습니다. 지역 주민과 방문객 누구나 연주할 수 있습니다. 피아노는 5월 중순(2026년은 5월 16일)에 나와 10월 Piano Smash 행사 때까지 놓이며, 출처에 도로명 주소는 나와 있지 않습니다. 도시명도 적혀 있지 않아 Des Moines 일대로 추정한 것입니다."],null,"","Black Cat Ice Cream, Des Moines, IA","mw","mid-May–Oct"],
 ["A","Catzen Coffee","Grand Avenue public pianos · outside","St. Paul · MN","street","u",2026,44.9399,-93.1602,["An upright piano stands outside Catzen Coffee on Grand Avenue in St. Paul, one of the Grand Avenue public pianos (Hovland Conservatory / Keys 4/4 Kids). Passersby are welcome to play. In place for the summer only, per an August 2026 report; no street number is given and the city is inferred, so confirm the spot locally.","Hay un piano vertical frente a Catzen Coffee, en Grand Avenue (St. Paul), uno de los Grand Avenue public pianos (Hovland Conservatory / Keys 4/4 Kids). Cualquier transeúnte puede tocarlo. Solo permanece durante el verano, según un artículo de agosto de 2026; la fuente no indica el número de calle y la ciudad se deduce, así que conviene confirmar el punto exacto.","St. Paul Grand Avenue의 Catzen Coffee 앞 거리에 업라이트 피아노가 놓여 있습니다. Grand Avenue public pianos(Hovland Conservatory / Keys 4/4 Kids)의 하나로, 지나가는 누구나 연주할 수 있습니다. 여름철에만 설치되며 2026년 8월 기사 기준 정보입니다. 기사에 번지와 도시명이 없어 도시는 추정이므로 정확한 위치는 현장에서 확인하시기 바랍니다."],null,"","Catzen Coffee, St. Paul, MN","mw","summer"],
 ["A","Chicago Union Station","Chicago Plays · Public Pianos","Chicago · IL","station","",2026,41.87869,-87.64031,["'State of Flow', a painted playable-art piano, was placed at Chicago Union Station (225 S. Canal Street) in 2026 by the nonprofit Chicago Plays; the spot inside the station is not stated. Anyone may take a seat and play a song. It is listed as seasonal, but the months are not given.","'State of Flow', un piano pintado como arte para tocar, fue colocado en 2026 en Chicago Union Station (225 S. Canal Street) por la organización sin fines de lucro Chicago Plays; no se indica el punto exacto dentro de la estación. Cualquiera puede sentarse y tocar una pieza. Figura como de temporada, pero no se indican los meses.","비영리 단체 Chicago Plays가 2026년에 Chicago Union Station(225 S. Canal Street)에 그림이 그려진 연주 가능한 예술 피아노 'State of Flow'를 두었으며, 역 안 정확한 위치는 나와 있지 않습니다. 누구나 앉아서 한 곡 칠 수 있습니다. 계절 한정으로 분류되어 있으나 운영 월은 나와 있지 않습니다."],null,"","Chicago Union Station, Chicago, IL","mw","Seasonal (months not stated)"],
 ["A","County Fair Foods","Chicago Plays · Morgan Park/Beverly","Chicago · IL","market","u",2026,41.69683,-87.68169,["A Chicago Plays public piano is listed at County Fair Foods in the Morgan Park/Beverly area. The program gives free access to pianos in public spaces, so anyone can play. Pianos are out from early June to mid-October each year; this site rests on a single listing plus a July 2026 local news mention, so confirm the piano is there before a special trip.","Hay un piano público de Chicago Plays registrado en County Fair Foods, en la zona de Morgan Park/Beverly. El programa ofrece acceso gratuito a pianos en espacios públicos de Chicago, así que cualquiera puede tocar. Los pianos están desde principios de junio hasta mediados de octubre de cada año; este punto se basa en un único listado y una mención en la prensa local de julio de 2026, por lo que conviene confirmar que el piano esté antes de ir.","Chicago의 Morgan Park/Beverly 지역 County Fair Foods에 Chicago Plays 공공 피아노가 있는 것으로 등록되어 있습니다. Chicago의 공공장소에서 누구나 무료로 피아노를 칠 수 있게 하는 프로그램입니다. 매년 6월 초부터 10월 중순까지 운영되며, 이 위치는 목록 한 건과 2026년 7월 지역 언론 언급에만 근거한 정보이므로 방문 전에 피아노가 있는지 확인하시기 바랍니다."],null,"","County Fair Foods, Chicago, IL","mw","Jun–mid-Oct"],
 ["A","Downtown Troy","Painted Pianos Project · 8 pianos","Troy · OH","street","u",2026,40.03963,-84.20332,["Eight painted pianos are placed throughout downtown Troy around the Public Square, including one at the Miami County Courthouse Plaza; the other 2026 spots are not listed. They are out for the public to play. The 2026 run was June 8–Sept 1, based on a brief listing; the project is held every two years (2022, 2024, 2026), not annually.","Ocho pianos pintados se reparten por el centro de Troy, en torno a Public Square, uno de ellos en la Miami County Courthouse Plaza; no se detallan los demás puntos de 2026. Están a disposición del público para tocar. La edición 2026 fue del 8 de junio al 1 de septiembre, según un listado breve; el proyecto se realiza cada dos años (2022, 2024, 2026), no anualmente.","Troy 도심 Public Square 일대에 색칠된 피아노 8대가 놓이며, 그중 1대는 Miami County Courthouse Plaza에 있습니다. 나머지 2026년 위치는 공개되어 있지 않습니다. 누구나 연주할 수 있습니다. 2026년에는 6월 8일~9월 1일에 운영되었고(간략한 목록 한 건 기준), 매년이 아니라 2년마다(2022·2024·2026년) 열립니다."],null,"","Downtown Troy, Troy, OH","mw","Jun–early Sep"],

 ["A","Abravanel Hall Plaza","Key Changes · summer piano installation","Salt Lake City · UT","street","u",2026,40.768465,-111.895285,["Key Changes places playable pianos on Abravanel Hall Plaza (123 W. South Temple) in Salt Lake City in summer; it is run by the Gina Bachauer International Piano Foundation with The Blocks and Salt Lake County Arts & Culture. The 2026 edition, Jason Manley's 'Piano Assemblage Ensemble', is a sculpture built from five deconstructed pianos with one working piano anyone may play, unveiled June 5 and playable through September 8. The event is held every two years (2024 brought six upcycled artist pianos to the same plaza, and there was no 2025 edition), so the next one would be expected in 2028. The 2026 season has ended, and it is not confirmed whether anything playable remains on the plaza now.","Key Changes instala pianos para tocar en Abravanel Hall Plaza (123 W. South Temple), en Salt Lake City, durante el verano; lo organizan la Gina Bachauer International Piano Foundation, The Blocks y Salt Lake County Arts & Culture. La edición de 2026, 'Piano Assemblage Ensemble' de Jason Manley, es una escultura hecha con cinco pianos desmontados que incluye un piano en funcionamiento que cualquiera puede tocar; se presentó el 5 de junio y se pudo tocar hasta el 8 de septiembre. El evento se celebra cada dos años (en 2024 hubo seis pianos reciclados por artistas en la misma plaza y no hubo edición en 2025), por lo que la próxima se esperaría en 2028. La temporada de 2026 ya terminó y no se ha confirmado que quede algún piano en la plaza.","Key Changes는 여름철 Salt Lake City의 Abravanel Hall Plaza(123 W. South Temple)에 누구나 칠 수 있는 피아노를 두는 행사로, Gina Bachauer International Piano Foundation이 The Blocks, Salt Lake County Arts & Culture와 함께 엽니다. 2026년에는 피아노 5대를 해체해 만든 Jason Manley의 조형물 'Piano Assemblage Ensemble' 안에 실제로 칠 수 있는 피아노 1대가 들어갔고, 6월 5일 공개돼 9월 8일까지 운영됐습니다. 이 행사는 2년마다 열리며(2024년에는 같은 광장에 작가들이 꾸민 재활용 피아노 6대가 놓였고 2025년에는 열리지 않았습니다), 다음은 2028년으로 예상됩니다. 2026년 운영 기간은 끝났고, 지금 광장에 피아노가 남아 있는지는 확인되지 않았습니다."],null,"","Abravanel Hall Plaza, Salt Lake City, UT","mt","Jun–Sep"],
 ["A","Bixby Historic Plummer's Station","Play Me, Tulsa · Bixby High School piano","Bixby · OK","other","u",2024,35.943442,-95.882371,["Bixby Historic Plummer's Station, believed to be in Bixby, has hosted a student-painted upright from Play Me, Tulsa (Saied Music Co. with Tulsa Mayfest). The pianos debut at Mayfest in May and then sit at outdoor host sites through the end of July, free for anyone to play. Host sites change every year and no 2025–2026 list is published; this is the only host location named on the official 2024 pianos page, for the Bixby High School piano, and it is not confirmed that a piano is still placed here.","Bixby Historic Plummer's Station, que se cree que está en Bixby, ha acogido un piano vertical pintado por estudiantes del programa Play Me, Tulsa (Saied Music Co. con Tulsa Mayfest). Los pianos se estrenan en Mayfest en mayo y luego permanecen en lugares al aire libre hasta finales de julio; cualquiera puede tocarlos gratis. Los lugares cambian cada año y no se publica la lista de 2025–2026; es el único lugar anfitrión que nombra la página oficial de pianos de 2024, para el piano de Bixby High School, y no se ha confirmado que siga habiendo un piano aquí.","Bixby에 있는 것으로 보이는 Bixby Historic Plummer's Station에 Play Me, Tulsa(Saied Music Co.·Tulsa Mayfest)의 학생 페인팅 업라이트 피아노가 놓인 적이 있습니다. 피아노는 5월 Mayfest에서 처음 공개된 뒤 7월 말까지 야외 호스트 장소에 놓이며, 누구나 무료로 칠 수 있습니다. 호스트 장소는 해마다 바뀌고 2025~2026년 목록은 공개되지 않았습니다. 이곳은 2024년 공식 피아노 페이지에 이름이 나온 유일한 호스트 장소(Bixby High School 피아노)이며, 지금도 이곳에 피아노가 놓이는지는 확인되지 않았습니다."],null,"","Bixby Historic Plummer's Station, Bixby, OK","mt","Jun–Jul"],
 ["A","1275 Broadway Plz","Painted Pianos · 'Once Upon a Tune'","Walnut Creek · CA","street","u",2026,37.89676,-122.05887,["The painted piano 'Once Upon a Tune' is at 1275 Broadway Plz, Walnut Creek. The Downtown Association places these pianos in public areas for the community to play and share their music. The program returned in May 2026 (dedicated May 27); the location guide is undated and gives no end date, so it may not be out year-round.","El piano pintado 'Once Upon a Tune' está en 1275 Broadway Plz, Walnut Creek. La Downtown Association coloca estos pianos en espacios públicos para que la comunidad toque y comparta su música. El programa regresó en mayo de 2026 (inauguración el 27 de mayo), pero la guía de ubicaciones no tiene fecha y no se indica cuándo termina, por lo que quizá no esté todo el año.","Walnut Creek의 1275 Broadway Plz에 색칠된 피아노 'Once Upon a Tune' 한 대가 있습니다. Downtown Association이 지역 주민 누구나 연주하고 음악을 나눌 수 있도록 공공장소에 놓은 피아노입니다. 프로그램은 2026년 5월에 다시 시작되었지만(5월 27일 기념식), 위치 안내에 날짜가 없고 종료 시점도 나와 있지 않아 연중 놓여 있지 않을 수 있습니다."],null,"","1275 Broadway Plz, Walnut Creek, CA","ca","from May"],

 ["A","Central Park","In the Key of Davis · Third & C Streets","Davis · CA","park","u",2024,38.54527,-121.74449,["A vibrantly painted In the Key of Davis piano is placed in Central Park, at Third and C Streets, Davis, for everyone to play. The city's 2026 arts page lists it as seasonal: outdoors in the dry months, from about June until the fall rains. The location comes from a June 2024 listing, so confirm the piano is out before you go.","Hay un piano de In the Key of Davis, pintado con colores vivos, en Central Park, en Third y C Streets, Davis. Los pianos están ahí para que todos puedan tocar. La página de arte de la ciudad (2026) lo clasifica como de temporada: está al aire libre en los meses secos, aproximadamente desde junio hasta las lluvias de otoño. La ubicación proviene de un listado de junio de 2024; confirma que el piano esté antes de ir.","Davis의 Central Park(Third and C Streets)에 In the Key of Davis의 화려하게 페인팅된 피아노가 놓입니다. 누구나 연주할 수 있는 피아노입니다. 시 예술 안내 페이지(2026년)에는 계절 운영 피아노로 분류되어 있어, 건기인 6월경부터 가을비가 오기 전까지만 야외에 설치됩니다. 위치는 2024년 6월 목록 기준이므로 방문 전에 설치 여부를 확인하시기 바랍니다."],null,"","Central Park, Davis, CA","ca","Jun–fall"],

 ["A","Downtown Lodi","Painted Pianos · 4–5 pianos","Lodi · CA","street","u",2026,38.13412,-121.27418,["Four or five painted pianos are placed around Lodi each year: one near the Lodi Public Library, one downtown and others at various spots. They are out for the public to play and sing along. Reported in May 2026, but season dates and exact spots are not given; ask the Lodi Arts Commission.","Cada año se colocan cuatro o cinco pianos pintados en Lodi: uno cerca de la Lodi Public Library, otro en el centro y los demás en distintos puntos. Están a disposición del público para tocar y cantar. Se informó en mayo de 2026, pero no se indican las fechas de la temporada ni los puntos exactos; consulte a la Lodi Arts Commission.","Lodi에는 매년 색칠된 피아노 4~5대가 놓입니다. 1대는 Lodi Public Library 근처, 1대는 도심에 있고 나머지는 여러 곳에 흩어져 있습니다. 누구나 연주하고 함께 노래할 수 있습니다. 2026년 5월 기사로 확인되었으나 운영 기간과 정확한 위치는 나와 있지 않으므로 Lodi Arts Commission에 문의하시기 바랍니다."],null,"","Downtown Lodi, Lodi, CA","ca","seasonal"],

 ["A","Water Light Public Plaza","Painted Pianos · 'Jazzin' on Locust'","Walnut Creek · CA","street","u",2026,37.90006,-122.06133,["The painted piano 'Jazzin' on Locust' is at Water Light Public Plaza, 1501 Locust St, Walnut Creek. The Downtown Association places these pianos in public areas for the community to play and share their music. The program returned in May 2026 (dedicated May 27); the location guide is undated and gives no end date, so it may not be out year-round.","El piano pintado 'Jazzin' on Locust' está en Water Light Public Plaza, 1501 Locust St, Walnut Creek. La Downtown Association coloca estos pianos en espacios públicos para que la comunidad toque y comparta su música. El programa regresó en mayo de 2026 (inauguración el 27 de mayo), pero la guía de ubicaciones no tiene fecha y no se indica cuándo termina, por lo que quizá no esté todo el año.","Walnut Creek의 Water Light Public Plaza(1501 Locust St)에 색칠된 피아노 'Jazzin' on Locust' 한 대가 있습니다. Downtown Association이 지역 주민 누구나 연주하고 음악을 나눌 수 있도록 공공장소에 놓은 피아노입니다. 프로그램은 2026년 5월에 다시 시작되었지만(5월 27일 기념식), 위치 안내에 날짜가 없고 종료 시점도 나와 있지 않아 연중 놓여 있지 않을 수 있습니다."],null,"","Water Light Public Plaza, Walnut Creek, CA","ca","from May"],
 ["A","Director Park","Piano. Push. Play. · 815 SW Park Ave.","Portland · OR","plaza","u",2026,45.51869,-122.68147,["A painted upright piano was placed at Director Park (815 SW Park Ave.), the kickoff site of Piano. Push. Play.'s 14th season on July 10, 2026. The pianos are out on the street for anyone to play. The 2026 season was listed as July 10–Aug 31, and pianos rotate between sites about every two weeks, so check the program's map first.","Un piano vertical pintado se instaló en Director Park (815 SW Park Ave.), sede de la inauguración de la temporada 14 de Piano. Push. Play. el 10 de julio de 2026. Los pianos están en la calle para que cualquiera los toque. La temporada 2026 se anunció del 10 de julio al 31 de agosto y los pianos rotan de lugar cada dos semanas aproximadamente, así que consulte primero el mapa del programa.","Piano. Push. Play. 14번째 시즌이 2026년 7월 10일에 개막한 Director Park(815 SW Park Ave.)에 색칠된 업라이트 피아노가 놓였습니다. 거리에 놓인 피아노는 누구나 연주할 수 있습니다. 2026년 시즌은 7월 10일~8월 31일로 안내되었고 피아노가 약 2주마다 장소를 옮기므로, 먼저 프로그램 지도를 확인하시기 바랍니다."],null,"","Director Park, Portland, OR","pnw","Jul–Aug"],
 ["A","Schack Art Center","Street Tunes · 2921 Hoyt Ave.","Everett · WA","culture","u",2026,47.97849,-122.20993,["An upright piano is set out at Schack Art Center (2921 Hoyt Ave.) for the City of Everett's Street Tunes. Anyone is welcome to stop and play during daylight hours. It was listed as 'coming soon' when the 2026 season (July 22–Aug 19) launched, so this placement is not confirmed; the program runs about four weeks each summer.","Dentro del programa Street Tunes de la ciudad de Everett se instala un piano vertical en el Schack Art Center (2921 Hoyt Ave.). Cualquiera puede detenerse a tocar durante las horas de luz. Figuraba como 'próximamente' al iniciar la temporada 2026 (22 de julio–19 de agosto), por lo que su instalación no está confirmada; el programa dura unas cuatro semanas cada verano.","Everett 시의 Street Tunes 프로그램으로 Schack Art Center(2921 Hoyt Ave.)에 업라이트 피아노가 놓입니다. 낮 시간 동안 누구나 들러 연주할 수 있습니다. 2026년 시즌(7월 22일~8월 19일) 개막 당시 '설치 예정'으로 안내된 곳이라 실제 설치 여부는 확인되지 않았습니다. 프로그램은 매년 여름 약 4주간 열립니다."],null,"","Schack Art Center, Everett, WA","pnw","late Jul–mid Aug"],

 ["B","81st St Soundbooth","Sing for Hope Pianos · Sat & Sun 2–4 PM","New York · NY","other","u",2026,40.61691,-74.01096,["A Sing for Hope Piano is at the 81st St Soundbooth in New York. It is open year-round, but public play is limited to Saturdays and Sundays, 2–4 PM. Based on the program's 2026 listing, which does not give the exact location, so confirm where it is before visiting.","Hay un Sing for Hope Piano en 81st St Soundbooth, Nueva York. Está abierto todo el año, pero el público solo puede tocar los sábados y domingos de 2 a 4 p. m. Según el listado 2026 del programa, que no indica la ubicación exacta; confírmala antes de ir.","New York의 81st St Soundbooth에 Sing for Hope Piano가 있습니다. 연중 운영되지만 일반인 연주는 토요일과 일요일 오후 2시~4시에만 가능합니다. 2026년 프로그램 목록 기준이며, 정확한 위치가 나와 있지 않으므로 방문 전에 확인하시기 바랍니다."],null,"","81st St Soundbooth, New York, NY","ny",""],
 ["B","81st St Soundbooth","211 Central Park West · Sing for Hope","New York · NY","station","",2026,40.78258,-73.97189,["A Sing for Hope piano at the 81st St Soundbooth, 211 Central Park West. Open public play is limited to Saturdays and Sundays, 2–4 pm, year-round, according to the program's 2026 list of currently open locations. Whether the booth is inside the subway station or in a building is not clear.","Piano de Sing for Hope en el 81st St Soundbooth, 211 Central Park West. El público solo puede tocar los sábados y domingos de 14:00 a 16:00, todo el año, según la lista 2026 de ubicaciones abiertas del programa. No está claro si la cabina está dentro de la estación del metro o en un edificio.","211 Central Park West의 81st St Soundbooth에 있는 Sing for Hope 피아노입니다. 프로그램의 2026년 개방 장소 목록에 따르면 연중 토요일과 일요일 오후 2~4시에만 일반인이 칠 수 있습니다. 부스가 지하철역 안에 있는지 건물 안에 있는지는 분명하지 않습니다."],null,"","81st St Soundbooth, New York, NY","ny",""],
 ["B","Art on the Ave NYC Creative Space","Sing for Hope Pianos · open year-round","New York · NY","culture","u",2026,40.71407,-74.00359,["A Sing for Hope Piano is housed at Art on the Ave NYC Creative Space, 2 Lafayette Street, New York. It is listed as open year-round, but this is an indoor creative space and no public play hours are posted, so check its opening times before you go. Based on the program's 2026 listing.","Hay un Sing for Hope Piano en Art on the Ave NYC Creative Space, 2 Lafayette Street, Nueva York. Figura como abierto todo el año, pero es un espacio creativo interior y no se publican horarios para tocar, así que conviene revisar el horario de apertura antes de ir. Según el listado 2026 del programa.","New York 2 Lafayette Street의 Art on the Ave NYC Creative Space 안에 Sing for Hope Piano가 있습니다. 연중 개방으로 안내되어 있으나 실내 창작 공간이고 일반 연주 가능 시간은 따로 나와 있지 않으므로, 방문 전에 운영 시간을 확인하시기 바랍니다. 2026년 프로그램 목록 기준입니다."],null,"","Art on the Ave NYC Creative Space, New York, NY","ny",""],
 ["B","Bloomberg Plaza Atrium","120 Park Ave · Sing for Hope Pianos","New York · NY","other","",2026,40.75199,-73.97837,["The Sing for Hope piano 'Bach in NYC' is in the office-plaza atrium at 120 Park Ave. Open public play is on Tuesdays and Fridays, 9 am–6 pm, year-round. It is on the program's 2026 list of currently open locations.","El piano 'Bach in NYC' de Sing for Hope está en el atrio del edificio de oficinas de 120 Park Ave. El público puede tocar los martes y viernes de 9:00 a 18:00, todo el año. Figura en la lista 2026 de ubicaciones abiertas del programa.","Sing for Hope 피아노 'Bach in NYC'가 120 Park Ave 오피스 플라자의 아트리움에 있습니다. 일반인은 연중 화요일과 금요일 오전 9시~오후 6시에 칠 수 있습니다. 프로그램의 2026년 개방 장소 목록에 올라 있습니다."],null,"","Bloomberg Plaza Atrium, New York, NY","ny",""],
 ["B","Montauk Library","Steinway · 45-min slots · residents' cards","Montauk · NY","library","g",2023,41.038399,-71.939417,["Montauk Library's Steinway Piano Use Policy (December 2023) lets Montauk residents with a Montauk Library card reserve 45-minute slots online, at the library's discretion. It is not confirmed that this is still the case.","La política de uso del Steinway de la Montauk Library (diciembre de 2023) permite a los residentes de Montauk con tarjeta de la biblioteca reservar turnos de 45 minutos en línea, a criterio de la biblioteca. No se ha confirmado que siga siendo así.","Montauk Library의 Steinway 피아노 사용 규정(2023년 12월)에 따르면 Montauk 도서관 카드가 있는 Montauk 주민은 온라인으로 45분 단위로 예약할 수 있으며, 배정은 도서관 재량입니다. 지금도 그런지는 확인되지 않았습니다."],null,"","Montauk Library, Montauk, NY","ny",""],
 ["B","NYPL for the Performing Arts","Music Division reading room","New York · NY","library","d",2026,40.77341,-73.98473,["A silent piano in the Music Division reading room, used with headphones to audition and rehearse music. It is meant for research-room use, so ask staff. Based on a single 2026 summary, and it is not confirmed that the piano is still there.","Un piano silencioso en la sala de lectura de la Music Division, que se usa con audífonos para probar y ensayar música. Está pensado para el uso dentro de la sala de investigación; pregunte al personal. Se basa en un solo resumen de 2026 y no está confirmado que el piano siga allí.","Music Division 열람실에 헤드폰을 끼고 악보를 쳐 보거나 연습할 수 있는 사일런트 피아노가 있습니다. 연구용 열람실에서 쓰는 용도이므로 직원에게 문의하시기 바랍니다. 2026년 요약 자료 한 건에 근거하며 피아노가 아직 있는지는 확인되지 않았습니다."],null,"","NYPL for the Performing Arts, New York, NY","ny",""],
 ["B","Patchogue-Medford Library","Piano · schedule in advance","Patchogue · NY","library","",2026,40.766667,-73.015833,["Patchogue-Medford Library's piano policy (January 2026) says piano use must be scheduled in advance through a meeting room application to the Library Director. The type of piano is not stated. It is not confirmed that this is still the case.","La política de piano de la Patchogue-Medford Library (enero de 2026) indica que su uso debe programarse con antelación mediante una solicitud de sala dirigida a la dirección de la biblioteca. No se indica el tipo de piano. No se ha confirmado que siga siendo así.","Patchogue-Medford Library 피아노 규정(2026년 1월)에 따르면 회의실 사용 신청서를 도서관장에게 내 미리 일정을 잡아야 칠 수 있습니다. 피아노 종류는 나와 있지 않습니다. 지금도 그런지는 확인되지 않았습니다."],null,"","Patchogue-Medford Library, Patchogue, NY","ny",""],
 ["B","Piano Performance Museum","Catskill Mountain Foundation","Hunter · NY","museum","",2026,42.21309,-74.2186,["A collection of historic pianos at the Catskill Mountain Foundation in Hunter. Visitors can sit at most of the pianos and play their favorite pieces, but the museum opens only by appointment or for group tours of 4 to 25 people. Based on 2026 information; whether there is a fee was not checked.","Una colección de pianos históricos en la Catskill Mountain Foundation, en Hunter. Los visitantes pueden sentarse en la mayoría de los pianos y tocar sus piezas favoritas, pero el museo solo abre con cita o para visitas grupales de 4 a 25 personas. Información de 2026; no se verificó si hay algún costo.","Hunter의 Catskill Mountain Foundation에 있는 역사적 피아노 컬렉션입니다. 방문객은 대부분의 피아노에 앉아 좋아하는 곡을 칠 수 있으나, 박물관은 사전 예약 또는 4~25명 단체 투어로만 문을 엽니다. 2026년 자료 기준이며 요금이 있는지는 확인하지 못했습니다."],null,"","Piano Performance Museum, Hunter, NY","ny",""],
 ["B","Roycroft Inn","Main lobby","East Aurora · NY","hotel","g",2021,42.76695,-78.61755,["A grand piano stands in the main lobby of the historic Roycroft Inn. Ask the front desk before playing: in 2021 a visitor was discouraged from playing because of the early hour. Based on a single forum report from 2021, so current status is unknown.","Hay un piano de cola en el vestíbulo principal del histórico Roycroft Inn. Pregunte en la recepción antes de tocar: en 2021 a un visitante le pidieron que no tocara porque era muy temprano. Se basa en un solo comentario de un foro de 2021, así que se desconoce la situación actual.","유서 깊은 Roycroft Inn의 메인 로비에 그랜드 피아노가 있습니다. 치기 전에 프런트에 먼저 물어보시기 바랍니다. 2021년에 한 방문객은 이른 시간이라는 이유로 프런트에서 연주를 만류당했습니다. 2021년 게시판 글 한 건에 근거한 정보여서 현재 상태는 알 수 없습니다."],null,"","Roycroft Inn, East Aurora, NY","ny",""],
 ["B","Westfield World Trade Center","Oculus · Sing for Hope Pianos","New York · NY","mall","",2026,40.71142,-74.01149,["The Sing for Hope piano 'Evolve' is in the Oculus mall at 185 Greenwich St. Open public play is on Mondays and Thursdays only, 9 am–7 pm, year-round. It is on the program's 2026 list of currently open locations.","El piano 'Evolve' de Sing for Hope está en el centro comercial Oculus, 185 Greenwich St. El público solo puede tocar los lunes y jueves de 9:00 a 19:00, todo el año. Figura en la lista 2026 de ubicaciones abiertas del programa.","Sing for Hope 피아노 'Evolve'가 185 Greenwich St의 Oculus 쇼핑몰에 있습니다. 일반인은 연중 월요일과 목요일 오전 9시~오후 7시에만 칠 수 있습니다. 프로그램의 2026년 개방 장소 목록에 올라 있습니다."],null,"","Westfield World Trade Center, New York, NY","ny",""],
 ["B","Boston Public Library, Copley Square","Teen Central · Keys of Inspiration","Boston · MA","library","d",2026,42.34924,-71.07868,["One ONE Smart Piano, a digital 'Keys of Inspiration' station from the Lang Lang Foundation, is in Teen Central at the Central Library. It is first come, first served with no library card and no reservations; check in at the front desk and use headphones. Reported in October 2026. Because it sits in a teen space, adult access may be restricted.","Hay un ONE Smart Piano, una estación digital 'Keys of Inspiration' de la Lang Lang Foundation, en Teen Central de la Central Library. Se usa por orden de llegada, sin credencial de la biblioteca y sin reservas; regístrese en el mostrador y use audífonos. Informado en octubre de 2026. Como está en un espacio para adolescentes, el acceso de adultos puede estar restringido.","Central Library의 Teen Central에 Lang Lang Foundation의 'Keys of Inspiration' 디지털 피아노인 ONE Smart Piano 1대가 있습니다. 선착순이며 도서관 카드가 필요 없고 예약은 할 수 없습니다. 안내 데스크에서 체크인하고 헤드폰을 사용해야 합니다. 2026년 10월 보도 기준이며, 청소년 공간에 있어 성인 이용은 제한될 수 있습니다."],null,"","Boston Public Library, Copley Square, Boston, MA","ne",""],
 ["B","Boston Public Library, Grove Hall","Children's room · Keys of Inspiration","Boston · MA","library","d",2026,42.30794,-71.08121,["Two ONE Smart Pianos, digital 'Keys of Inspiration' stations from the Lang Lang Foundation, are in the children's room at the Grove Hall Branch. They are first come, first served with no library card and no reservations; check in at the front desk and use headphones. Reported in October 2026. Because they sit in a children's space, adult access may be restricted.","Hay dos ONE Smart Piano, estaciones digitales 'Keys of Inspiration' de la Lang Lang Foundation, en la sala infantil de la Grove Hall Branch. Se usan por orden de llegada, sin credencial de la biblioteca y sin reservas; regístrese en el mostrador y use audífonos. Informado en octubre de 2026. Como están en un espacio infantil, el acceso de adultos puede estar restringido.","Grove Hall Branch 어린이실에 Lang Lang Foundation의 'Keys of Inspiration' 디지털 피아노인 ONE Smart Piano 2대가 있습니다. 선착순이며 도서관 카드가 필요 없고 예약은 할 수 없습니다. 안내 데스크에서 체크인하고 헤드폰을 사용해야 합니다. 2026년 10월 보도 기준이며, 어린이 공간에 있어 성인 이용은 제한될 수 있습니다."],null,"","Boston Public Library, Grove Hall, Boston, MA","ne",""],

 ["B","Busboys and Poets","Anacostia location","Washington · DC","cafe","",2024,38.91793,-77.03166,["The piano is inside the Busboys and Poets restaurant and bookstore in Anacostia. It is free to use seven days a week as long as no event is going on in the space; ask staff first. Based on a January 2024 article, so check that it is still there. The type of piano is not stated.","El piano está dentro del restaurante y librería Busboys and Poets de Anacostia. Se puede usar gratis los siete días de la semana siempre que no haya un evento en el espacio; pregunte antes al personal. La información proviene de un artículo de enero de 2024, así que confirme que siga allí. No se indica el tipo de piano.","Anacostia에 있는 레스토랑 겸 서점 Busboys and Poets 안에 피아노가 있습니다. 공간에서 행사가 열리지 않는 한 주 7일 무료로 이용할 수 있으며, 먼저 직원에게 문의하시기 바랍니다. 2024년 1월 기사에 근거한 정보이므로 지금도 있는지 확인이 필요합니다. 피아노 종류는 나와 있지 않습니다."],null,"","Busboys and Poets, Washington, DC","ne",""],
 ["B","Charles Center Metro SubwayLink Station","Music in Transit · MDOT MTA / Maryland State Arts Council","Baltimore · MD","station","u",2019,39.289452,-76.616275,["A piano was installed at Charles Center Metro SubwayLink Station in Baltimore in January 2019 under Music in Transit, a program of MDOT MTA and the Maryland State Arts Council. Transit riders can play it for free during station hours; its sign reads 'Play us a song. I'm the piano, man!' It was the first of five planned subway pianos and still the only one as of July 2019, when the Baltimore Sun reported on it. No report from 2024–2026 has been found, so it is not confirmed as still in place.","En enero de 2019 se instaló un piano en la estación Charles Center del Metro SubwayLink de Baltimore, dentro de Music in Transit, un programa de MDOT MTA y el Maryland State Arts Council. Los usuarios del transporte pueden tocarlo gratis en el horario de la estación; su letrero dice 'Play us a song. I'm the piano, man!'. Fue el primero de cinco pianos previstos para el metro y en julio de 2019, cuando el Baltimore Sun informó sobre él, seguía siendo el único. No se ha encontrado ninguna noticia de 2024–2026, por lo que no se ha confirmado que siga en su lugar.","2019년 1월 MDOT MTA와 Maryland State Arts Council의 Music in Transit 프로그램으로 Baltimore의 Charles Center Metro SubwayLink 역에 피아노가 놓였습니다. 대중교통 이용객은 역 운영 시간에 무료로 칠 수 있으며, 피아노에는 'Play us a song. I'm the piano, man!'이라고 적혀 있습니다. 지하철역 다섯 곳에 둘 계획의 첫 피아노였고, Baltimore Sun이 보도한 2019년 7월까지도 이것 한 대뿐이었습니다. 2024~2026년 기사는 찾지 못해 지금도 있는지는 확인되지 않았습니다."],null,"","Charles Center Metro SubwayLink Station, Baltimore, MD","ne",""],
 ["B","Free Library of Philadelphia, Parkway Central","Music Department · practice piano","Philadelphia · PA","library","",2026,39.959591,-75.17102,["A search-result snippet of the Music Department page at the Free Library of Philadelphia's Parkway Central Library (2026) says the department offers a practice piano for patrons, who are asked not to play other instruments except the theremin or the practice piano. The full page could not be opened, so booking, hours and library-card rules are not known, and it is not confirmed that the piano is still offered. Ask at the Music Department.","Un fragmento de resultado de búsqueda de la página del Music Department de la Parkway Central Library de la Free Library of Philadelphia (2026) indica que el departamento ofrece un piano de práctica a los usuarios, a quienes se pide no tocar otros instrumentos salvo el theremín o el piano de práctica. No se pudo abrir la página completa, así que no se conocen las reservas, el horario ni las normas sobre el carné, y no se ha confirmado que el piano se siga ofreciendo. Pregunte en el Music Department.","Free Library of Philadelphia Parkway Central Library의 Music Department 페이지 검색 결과 요약(2026년)에는 이용자용 연습 피아노가 있고, 테레민과 연습 피아노 말고 다른 악기는 연주하지 말아 달라는 안내가 있습니다. 전체 페이지는 열리지 않아 예약·시간·도서관 카드 규칙은 알 수 없고, 지금도 이용할 수 있는지는 확인되지 않았습니다. Music Department에 물어보세요."],null,"","Free Library of Philadelphia, Parkway Central, Philadelphia, PA","ne",""],
 ["B","Grafton Public Library","1921 Steinway baby grand · by approved reservation","Grafton · MA","library","g",2022,42.205979,-71.684419,["Grafton Public Library acquired a refurbished 1921 Steinway baby grand in September 2022. Its page says Grafton library cardholders who complete a Piano Use Proficiency Application may reserve it for individual practice when the Community Room is free. It is not confirmed that this is still the case.","La Biblioteca Pública de Grafton adquirió en septiembre de 2022 un piano de media cola Steinway de 1921 restaurado. Su página indica que los titulares de tarjeta de Grafton que completen una solicitud de competencia (Piano Use Proficiency Application) pueden reservarlo para practicar cuando la Community Room está libre. No se ha confirmado que siga siendo así.","Grafton 공공도서관은 2022년 9월 복원된 1921년산 Steinway 베이비 그랜드를 들였습니다. 도서관 안내에 따르면 Grafton 도서관 카드 소지자가 피아노 사용 능력 신청서(Piano Use Proficiency Application)를 내 승인받으면 Community Room이 비어 있을 때 개인 연습용으로 예약할 수 있습니다. 지금도 그런지는 확인되지 않았습니다."],null,"","Grafton Public Library, Grafton, MA","ne",""],
 ["B","Historical Piano Study Center","Frederick Collection","Ashburnham · MA","museum","",2026,42.63603,-71.90841,["A collection of historical pianos (the Frederick Collection) in Ashburnham. A visitor review says you are allowed to play the pianos if you know how to play. Visiting hours, whether an appointment is needed and any fee were not checked, so contact the center first. Based on a single review, 2026.","Una colección de pianos históricos (la Frederick Collection) en Ashburnham. Una reseña de un visitante dice que se permite tocar los pianos si uno sabe tocar. No se verificaron los horarios de visita, si se necesita cita ni si hay algún costo; comuníquese primero con el centro. Se basa en una sola reseña, 2026.","Ashburnham에 있는 역사적 피아노 컬렉션(Frederick Collection)입니다. 방문 후기에 따르면 피아노를 칠 줄 아는 사람은 전시된 피아노를 칠 수 있습니다. 관람 시간, 예약 필요 여부, 요금은 확인하지 못했으니 먼저 센터에 문의하시기 바랍니다. 2026년 후기 한 건에 근거한 정보입니다."],null,"","Historical Piano Study Center, Ashburnham, MA","ne",""],
 ["B","Maywood Public Library","Open Piano Sessions · Thursdays","Maywood · NJ","library","",2025,40.900837,-74.063222,["Maywood Public Library (459 Maywood Avenue) runs Open Piano Sessions in its Hackbarth Auditorium on Thursdays from 3 to 5 pm, listed on the library calendar for November 2025. Players sign up for 20-minute slots on a first-come, first-served basis, and children 16 and under need an adult with them. Listeners are welcome in the auditorium.","La Biblioteca Pública de Maywood (459 Maywood Avenue) ofrece Open Piano Sessions en su Hackbarth Auditorium los jueves de 15:00 a 17:00, según su calendario de noviembre de 2025. Los participantes se apuntan a turnos de 20 minutos por orden de llegada, y los menores de 16 años deben ir con un adulto. El público puede entrar a escuchar.","Maywood 공공도서관(459 Maywood Avenue)은 매주 목요일 오후 3~5시 Hackbarth Auditorium에서 Open Piano Sessions를 엽니다. 2025년 11월 도서관 일정표에 올라 있습니다. 온 순서대로 20분씩 신청해 치며, 16세 이하는 어른과 함께 와야 합니다. 듣기만 하러 들어가도 됩니다."],null,"","Maywood Public Library, Maywood, NJ","ne",""],
 ["B","Rutland Free Library","","Rutland · VT","library","",2026,43.60724,-72.97526,["The library is listed as offering piano practice space for cardholders; where in the building is not stated. Contact the library to arrange a time. This comes from a third-party directory (2026) and needs confirmation from the library itself.","La biblioteca figura como un lugar que ofrece espacio de práctica de piano para titulares de credencial; no se indica en qué parte del edificio. Comuníquese con la biblioteca para coordinar un horario. El dato viene de un directorio de terceros (2026) y debe confirmarse con la propia biblioteca.","도서관 카드 소지자에게 피아노 연습 공간을 제공하는 곳으로 올라 있으며, 건물 안 위치는 나와 있지 않습니다. 이용하려면 도서관에 연락해 시간을 정해야 합니다. 제3자 목록(2026년)에 근거한 정보여서 도서관에 직접 확인이 필요합니다."],null,"","Rutland Free Library, Rutland, VT","ne",""],
 ["B","Takoma Park Gazebo","Takoma Park Arts · painted piano","Takoma Park · MD","park","u",2019,38.974994,-77.010771,["A donated piano painted by Zahava Frank was placed in the downtown Takoma Park Gazebo (7035 Carroll Ave) in 2019 by Takoma Park Arts. It is free and anyone is welcome to play. The city's page about it could no longer be opened, so the details could not be fully verified. Not confirmed as still in place.","Un piano donado y pintado por Zahava Frank se colocó en 2019 en Takoma Park Gazebo (7035 Carroll Ave), en el centro de Takoma Park, por iniciativa de Takoma Park Arts. Es gratuito y cualquiera puede tocarlo. La página municipal que lo describía ya no pudo abrirse, por lo que los datos no pudieron verificarse por completo. No se ha confirmado que siga en el lugar.","Takoma Park 시내의 Takoma Park Gazebo(7035 Carroll Ave)에 2019년 Takoma Park Arts가 Zahava Frank가 칠한 기증 피아노를 놓았습니다. 무료이며 누구나 칠 수 있습니다. 이를 소개한 시 웹페이지가 더는 열리지 않아 내용을 충분히 검증하지 못했습니다. 지금도 있는지는 확인되지 않았습니다."],null,"","Takoma Park Gazebo, Takoma Park, MD","ne",""],
 ["B","The Saloon","Open Piano DC · U Street NW, 2nd floor","Washington · DC","cafe","",2024,38.9168,-77.0286,["The piano is on the second floor of The Saloon, a bar on U Street NW. On open piano nights any pianist can walk in and play, with no cover charge. A January 2024 article gives Wednesdays, while a 2026 listing shows other weekdays, so confirm the night before you go. The type of piano is not stated.","El piano está en el segundo piso de The Saloon, un bar en U Street NW. En las noches de piano abierto cualquier pianista puede entrar y tocar, sin cargo de entrada. Un artículo de enero de 2024 indica los miércoles, mientras que un listado de 2026 muestra otros días de la semana, así que confirme el día antes de ir. No se indica el tipo de piano.","U Street NW에 있는 바 The Saloon 2층에 피아노가 있습니다. 오픈 피아노 나이트에는 피아니스트 누구나 들어와 연주할 수 있으며 입장료는 없습니다. 2024년 1월 기사에는 매주 수요일로 나와 있지만 2026년 안내에는 다른 요일로 되어 있으므로, 방문 전에 요일을 확인하시기 바랍니다. 피아노 종류는 나와 있지 않습니다."],null,"","The Saloon, Washington, DC","ne",""],
 ["B","Weston Public Library","Community Room Steinway baby grand · by request","Weston · CT","library","g",2026,41.202318,-73.378452,["Weston Public Library's Community Room has a Steinway baby grand that the public may use with prior request, subject to the Library Director's requirements; fees may apply. This is from the library's room reservation page (2026).","La Community Room de la Weston Public Library tiene un piano de media cola Steinway que el público puede usar con solicitud previa, según los requisitos de la dirección; puede haber tarifas. El dato procede de la página de reservas de salas de la biblioteca (2026).","Weston 공공도서관 Community Room에 Steinway 베이비 그랜드가 있으며, 미리 요청하면 도서관장이 정한 조건에 따라 일반인도 쓸 수 있고 요금이 붙을 수 있습니다. 도서관 공간 예약 페이지(2026년)에 나온 내용입니다."],null,"","Weston Public Library, Weston, CT","ne",""],
 ["B","Wilson Branch, New Haven Free Public Library","Music Room open hour · Wednesdays 5–6 pm","New Haven · CT","library","d",2026,41.2990832,-72.9353069,["The Wilson Branch of New Haven Free Public Library opens its Music Room to drop-ins on Wednesdays from 5 to 6 pm, first come, first served, with two digital pianos, two keyboards, a synthesizer and a floor piano. The branch flyer and event calendar list the hour into late 2026.","La sucursal Wilson de la New Haven Free Public Library abre su Music Room sin cita los miércoles de 5 a 6 pm, por orden de llegada, con dos pianos digitales, dos teclados, un sintetizador y un piano de suelo. El folleto y el calendario de la sucursal la anuncian hasta finales de 2026.","New Haven Free Public Library Wilson 분관은 매주 수요일 오후 5~6시 Music Room을 예약 없이 선착순으로 엽니다. 디지털 피아노 2대, 키보드 2대, 신시사이저, 바닥 피아노가 있습니다. 분관 전단과 행사 일정에 2026년 말까지 잡혀 있습니다."],null,"","Wilson Branch, New Haven Free Public Library, New Haven, CT","ne",""],
 ["B","Antenna Works","Sing for Hope Pianos New Orleans · 2022 cohort","New Orleans · LA","other","u",2022,29.965901,-90.037621,["Antenna Works in New Orleans is named on Sing for Hope's 2022 New Orleans page as a participating organization and permanent home for one of eight artist-designed upright pianos, placed after the Mar 29–Apr 13, 2022 public residency. The page does not say which piano went to which site or give an address; access is expected to follow the host's opening hours. Last documented in 2022; not confirmed as still in place.","Antenna Works, en New Orleans, figura en la página de Sing for Hope de New Orleans de 2022 como organización participante y sede permanente de uno de los ocho pianos verticales diseñados por artistas, colocados tras la residencia pública del 29 de marzo al 13 de abril de 2022. La página no indica qué piano fue a cada lugar ni da la dirección; se espera que el acceso siga el horario de apertura del lugar. Documentado por última vez en 2022; no se ha confirmado que siga en su lugar.","New Orleans의 Antenna Works에는, Sing for Hope의 2022년 New Orleans 페이지 기준으로, 아티스트가 디자인한 업라이트 피아노 8대 중 1대가 공개 전시(2022년 3월 29일~4월 13일) 뒤 상설 보금자리로 배정된 것으로 나와 있습니다. 페이지에는 어느 피아노가 어느 곳으로 갔는지와 주소가 나와 있지 않으며, 이용은 해당 기관 운영 시간에 가능할 것으로 보입니다. 마지막 기록은 2022년이며, 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","Antenna Works, New Orleans, LA","se",""],
 ["B","Buggy Company Building","Sanford street pianos · courtyard","Sanford · NC","street","u",2021,35.481559,-79.176615,["A street piano painted by Reggie Carde was placed in the courtyard of the Buggy Company Building in Sanford under the City of Sanford Public Art Program. It is free; it is displayed in the courtyard on weekdays in good weather, and passersby are invited to play. Dedicated in November 2021, with no later confirmation found. Not confirmed as still in place.","Un piano callejero pintado por Reggie Carde se colocó en el patio de Buggy Company Building, en Sanford, dentro del programa de arte público de la ciudad. Es gratuito; se exhibe en el patio los días laborables con buen tiempo y se invita a quienes pasan a tocarlo. Se inauguró en noviembre de 2021 y no se halló confirmación posterior. No se ha confirmado que siga en el lugar.","Sanford의 Buggy Company Building 안뜰에 Reggie Carde가 칠한 거리 피아노가 City of Sanford Public Art Program의 하나로 놓였습니다. 무료이며, 날씨가 좋은 평일에 안뜰에 내놓아 지나가는 누구나 칠 수 있습니다. 2021년 11월에 공개되었고 이후 확인된 자료는 없습니다. 지금도 있는지는 확인되지 않았습니다."],null,"","Buggy Company Building, Sanford, NC","se",""],
 ["B","Crosstown Concourse","West Atrium · grand piano","Memphis · TN","other","g",2021,35.152151,-90.014064,["A grand piano is described in the West Atrium of Crosstown Concourse, a mixed-use building in Memphis. It was referred to as a public piano used for ad hoc performances; play rules are not stated. It is mentioned in passing in a March 2021 article about earlier years, and the building's own atrium-music page does not mention it. Not confirmed as still in place.","Se menciona un piano de cola en el West Atrium de Crosstown Concourse, un edificio de uso mixto en Memphis. Se lo describía como un piano público usado para actuaciones espontáneas; no se indican normas de uso. Aparece de pasada en un artículo de marzo de 2021 referido a años anteriores, y la página del propio edificio sobre música en el atrio no lo menciona. No se ha confirmado que siga en el lugar.","Memphis의 복합용도 건물 Crosstown Concourse West Atrium에 그랜드 피아노가 있다고 언급되었습니다. 즉석 공연에 쓰이는 공공 피아노로 소개되었으나, 이용 규칙은 명시되어 있지 않습니다. 2021년 3월 기사에서 이전 시기의 일로 잠깐 언급되었을 뿐이고, 건물 측의 아트리움 음악 안내 페이지에는 나오지 않습니다. 지금도 있는지는 확인되지 않았습니다."],null,"","Crosstown Concourse, Memphis, TN","se",""],
 ["B","Duke Children's Hospital","Sing for Hope Pianos","Durham · NC","hospital","u",2019,36.007021,-78.937348,["A Sing for Hope piano was dedicated to the families of Duke Children's Hospital in Durham; its exact spot inside the hospital is not stated. It is meant for patients, families, visitors and staff, and Sing for Hope says its pianos are for everyone with no time limit. Dedicated in August 2019. Not confirmed as still in place.","Un piano de Sing for Hope se dedicó a las familias de Duke Children's Hospital, en Durham; no se indica en qué parte del hospital está. Está pensado para pacientes, familias, visitantes y personal, y Sing for Hope señala que sus pianos son para todos y sin límite de tiempo. Se inauguró en agosto de 2019. No se ha confirmado que siga en el lugar.","Durham의 Duke Children's Hospital에 병원 가족들에게 헌정된 Sing for Hope 피아노가 있습니다. 병원 안 어느 자리인지는 나와 있지 않습니다. 환자·가족·방문객·직원이 칠 수 있으며, Sing for Hope는 자신들의 피아노가 모두를 위한 것이고 시간 제한이 없다고 안내합니다. 2019년 8월에 헌정되었으며, 지금도 있는지는 확인되지 않았습니다."],null,"","Duke Children's Hospital, Durham, NC","se",""],
 ["B","FIU School of Music","Sing for Hope Pianos · piano by Alexis Mendoza","Miami · FL","university","u",2020,40.756923,-73.99061,["A Sing for Hope Piano by artist Alexis Mendoza was given a permanent home at the Florida International University School of Music in Miami, after standing near a Miami-Dade early voting site in October–November 2020. Sing for Hope pianos are meant for anyone to play, but this one sits inside the university's music school and the building is not specified, so public access is unclear. Last documented in 2020; not confirmed as still in place.","Un Sing for Hope Piano del artista Alexis Mendoza recibió como sede permanente la Florida International University School of Music, en Miami, tras estar cerca de un centro de votación anticipada de Miami-Dade en octubre y noviembre de 2020. Los pianos de Sing for Hope están pensados para que cualquiera los toque, pero este se encuentra dentro de la escuela de música de la universidad y no se especifica el edificio, por lo que el acceso del público no está claro. Documentado por última vez en 2020; no se ha confirmado que siga en su lugar.","Miami의 Florida International University School of Music에 아티스트 Alexis Mendoza가 작업한 Sing for Hope Piano가 상설 보금자리를 얻었습니다. 2020년 10~11월 Miami-Dade 사전투표소 근처에 놓였다가 옮겨진 피아노입니다. Sing for Hope 피아노는 누구나 치도록 만든 것이지만 이 피아노는 대학 음악대학 안에 있고 건물도 나와 있지 않아, 일반인이 칠 수 있는지는 분명하지 않습니다. 마지막 기록은 2020년이며, 지금도 그 자리에 있는지는 확인되지 않았습니다."],null,"","FIU School of Music, Miami, FL","se",""],

 ["B","Kanawha County Public Library, Dunbar","1936 Chickering grand · by reservation","Dunbar · WV","library","g",2026,38.359279,-81.740032,["The Dunbar Branch of Kanawha County Public Library (301 12th Street, Dunbar) has a 1936 Chickering grand piano that can be reserved on Mondays from 4 to 6 pm in 30-minute slots, booked from one week to six months ahead, according to the library's room-reservation page (checked November 2026). Players are asked to play complete pieces they know well rather than practice, the piano is unavailable when tutors are present, and staff may restrict use. Whether a library card is needed is not stated.","La sucursal Dunbar de la Kanawha County Public Library (301 12th Street, Dunbar) tiene un piano de cola Chickering de 1936 que se puede reservar los lunes de 16:00 a 18:00 en turnos de 30 minutos, con una antelación de una semana a seis meses, según la página de reservas de la biblioteca (consultada en noviembre de 2026). Se pide tocar piezas completas que uno domine, no practicar; el piano no está disponible cuando hay tutores, y el personal puede limitar su uso. No se indica si hace falta carné de biblioteca.","Kanawha County 공공도서관 Dunbar 분관(301 12th Street, Dunbar)에는 1936년산 Chickering 그랜드 피아노가 있고, 월요일 오후 4~6시에 30분 단위로 1주~6개월 전에 예약해 칠 수 있습니다(도서관 방 예약 페이지, 2026년 11월 확인). 연습이 아니라 잘 아는 곡을 끝까지 연주해 달라는 규칙이 있고, 튜터가 있을 때는 쓸 수 없으며 직원이 사용을 제한할 수 있습니다. 도서관 카드가 필요한지는 나와 있지 않습니다."],null,"","Kanawha County Public Library, Dunbar, Dunbar, WV","se",""],
 ["B","Lynchburg Regional Airport","Hill City Keys · Academy Center of the Arts","Lynchburg · VA","airport","g",2018,37.330084,-79.193999,["In May 2018 WDBJ7 reported that Hill City Keys, the Academy Center of the Arts' public piano program, had placed the city's 11th public piano, a grand, at Lynchburg Regional Airport, and that it would stay there year-round. Unlike the program's summer street pianos, this one was described as permanent. No report after 2019 confirming the piano at the airport has been found, so it is not known whether it is still there.","En mayo de 2018, WDBJ7 informó que Hill City Keys, el programa de pianos públicos del Academy Center of the Arts, había colocado el piano público número 11 de la ciudad, un piano de cola, en el Lynchburg Regional Airport, y que permanecería allí todo el año. A diferencia de los pianos callejeros de verano del programa, este se describió como permanente. No se ha encontrado ninguna noticia posterior a 2019 que confirme el piano del aeropuerto, por lo que no se sabe si sigue allí.","2018년 5월 WDBJ7은 Academy Center of the Arts의 공공 피아노 프로그램 Hill City Keys가 시의 11번째 공공 피아노인 그랜드 피아노를 Lynchburg Regional Airport에 두었고, 1년 내내 공항에 둔다고 보도했습니다. 여름에만 거리에 나오는 다른 피아노와 달리 상설로 소개되었습니다. 2019년 이후 공항 피아노를 확인한 기사는 찾지 못해 지금도 있는지는 확인되지 않았습니다."],null,"","Lynchburg Regional Airport, Lynchburg, VA","se",""],

 ["B","Temple Theatre","Sanford street pianos · sunflower piano","Sanford · NC","street","u",2021,35.481214,-79.178496,["A street piano known as the sunflower piano, painted by Shauna McNeil, was placed at the Temple Theatre in Sanford under the City of Sanford Public Art Program. It is free, and passersby are invited to play. Dedicated in November 2021 and said to stay at the theatre through the end of that season, so it may have moved since. Not confirmed as still in place.","Un piano callejero conocido como el piano de los girasoles, pintado por Shauna McNeil, se colocó en Temple Theatre, en Sanford, dentro del programa de arte público de la ciudad. Es gratuito y se invita a quienes pasan a tocarlo. Se inauguró en noviembre de 2021 y se indicó que estaría en el teatro hasta el final de esa temporada, por lo que puede haberse trasladado. No se ha confirmado que siga en el lugar.","Sanford의 Temple Theatre에 Shauna McNeil이 칠한 거리 피아노(해바라기 피아노)가 City of Sanford Public Art Program의 하나로 놓였습니다. 무료이며 지나가는 누구나 칠 수 있습니다. 2021년 11월에 공개되었고 그 시즌이 끝날 때까지 극장에 둔다고 했으므로 이후 다른 곳으로 옮겨졌을 수 있습니다. 지금도 있는지는 확인되지 않았습니다."],null,"","Temple Theatre, Sanford, NC","se",""],
