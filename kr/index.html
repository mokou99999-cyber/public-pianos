<body>
<style>
:root{
  --paper:#ECEBE6; --paper-2:#E2E0D9; --ink:#1A1918; --ink-2:#4F4C47; --ink-3:#6B675F;
  --line:#CFCCC4; --felt:#B23A2E; --brass:#9A742A;
  --gS:#B23A2E; --gA:#2E6B3E; --gB:#9A742A; --gC:#5A6470; --gU:#8C877F;
  --gS-bg:#F3DAD6; --gA-bg:#DCEBDF; --gB-bg:#F0E6CC; --gC-bg:#E1E4E8; --gU-bg:#E6E4DF;
}
body{background:var(--paper);color-scheme:light;color:var(--ink);font-family:"IBM Plex Sans KR","IBM Plex Sans Thai","Noto Sans SC","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:900px;margin:0 auto;padding-block:28px 64px;padding-inline:20px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow .by{font-family:Fraunces,serif;font-style:italic;font-weight:600;text-transform:none;letter-spacing:0;font-size:14px;color:var(--felt);margin-left:6px;text-decoration:none;border-bottom:1px solid transparent}
.eyebrow .by:hover{border-color:var(--felt)}
.lang{display:flex;gap:4px}
.lang button{font:inherit;font-size:13px;letter-spacing:.06em;padding:8px 13px;min-height:36px;border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer;border-radius:3px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lang button.main{font-size:16px;font-weight:600;padding:8px 18px;border-width:2px;border-color:var(--ink)}
.lang{flex-wrap:wrap}
.lang button:focus-visible,.chip:focus-visible{outline:2px solid var(--felt);outline-offset:2px}
header{display:grid;gap:10px;border-bottom:1px solid var(--line);padding-bottom:22px}
h1{font-family:Fraunces,"IBM Plex Sans KR","IBM Plex Sans Thai",Georgia,serif;font-weight:300;font-size:clamp(32px,6vw,54px);line-height:1.08;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:italic;font-weight:600;color:var(--felt)}
:root[lang="th"] h1{font-style:normal;font-weight:400;line-height:1.3}
:root[lang="th"] h1 em{font-style:normal}
:root[lang="zh"] h1,:root[lang="ja"] h1{font-weight:500;line-height:1.3}
:root[lang="zh"] h1 em,:root[lang="ja"] h1 em{font-style:normal}
:root[lang="ko"] h1{font-weight:400;line-height:1.18}
:root[lang="ko"] h1 em{font-style:normal}
:root[lang="ko"] h1,:root[lang="ko"] .lede,:root[lang="ko"] .legend,:root[lang="ko"] .verdict,:root[lang="ko"] .meta,:root[lang="ko"] footer{word-break:keep-all;overflow-wrap:anywhere}
.lede{max-width:62ch;color:var(--ink-2);margin:0}
.lede.call{color:var(--ink);font-weight:500;border-left:3px solid var(--felt);padding-left:12px;cursor:pointer}
.lede.call:hover{color:var(--felt)}
.counts{display:flex;flex-wrap:wrap;gap:8px 18px;font-variant-numeric:tabular-nums;font-size:14px;margin-top:6px}
.counts b{font-family:Fraunces,serif;font-weight:600;font-size:22px;margin-right:4px}
.counts button{font:inherit;background:none;border:0;padding:4px 0;color:var(--ink);cursor:pointer;border-bottom:1px solid transparent}
.counts button:hover{border-color:var(--ink)}
.counts button:focus-visible{outline:2px solid var(--felt);outline-offset:2px}
.legend{display:grid;gap:6px;margin:22px 0 0;padding:0;list-style:none;font-size:14px;color:var(--ink-2)}
.legend li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:baseline}
.tag{display:inline-block;font-family:Fraunces,serif;font-weight:600;font-size:13px;line-height:1;padding:5px 0;width:30px;text-align:center;border-radius:3px;border:1px solid currentColor}
.tag.S{color:var(--gS);background:var(--gS-bg);font-weight:700}.tag.A{color:var(--gA);background:var(--gA-bg)}.tag.B{color:var(--gB);background:var(--gB-bg)}
.tag.C{color:var(--gC);background:var(--gC-bg)}.tag.U{color:var(--gU);background:var(--gU-bg);border-style:dashed}
.chip.zreset{border-color:var(--ink);color:var(--ink);font-weight:500}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:26px 0 8px}
.zone{font:inherit;text-align:left;display:grid;gap:8px;padding:14px 14px 12px;border:1px solid var(--line);background:var(--paper-2);border-radius:4px;color:var(--ink);cursor:pointer;min-width:0}
.zone:hover{border-color:var(--ink-3)}
.zone[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.zone:focus-visible{outline:2px solid var(--felt);outline-offset:2px}
.zone .zn{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);line-height:1.3}
.zone .zc{font-family:Fraunces,serif;font-weight:600;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.zone .zk{display:block;width:100%;height:auto;margin-top:4px}
.zone .zk .w{fill:#F7F5EF;stroke:var(--line);stroke-width:.6}
.zone .zk .w.S{fill:var(--gS)}.zone .zk .w.A{fill:var(--gA)}.zone .zk .w.B{fill:var(--gB)}.zone .zk .w.C{fill:var(--gC)}
.zone .zk .w.U{fill:#F7F5EF;stroke:var(--gU);stroke-dasharray:1.5 1.2;stroke-width:1}
.zone .zk .b{fill:var(--ink)}
@media (max-width:640px){.zones{grid-template-columns:repeat(2,1fr);gap:8px}.zone{padding:12px 12px 10px}.zone .zc{font-size:24px}}
.plot .dot{stroke:var(--paper-2);stroke-width:1.5}
.plot .dS{fill:var(--gS)}.plot .dA{fill:var(--gA)}.plot .dB{fill:var(--gB)}.plot .dC{fill:var(--gC)}.plot .dU{fill:var(--gU)}
.plotnote{font-size:12px;color:var(--ink-3);margin:0 0 18px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:10px 0 10px;margin:14px 0 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.bar .srow{display:flex;gap:8px;align-items:center}
.bar input{flex:1;min-width:0;font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#F7F5EF;color:var(--ink)}
.bar input:focus{outline:2px solid var(--felt);outline-offset:1px}
.bar .rcount{font-size:13px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.empty{padding:28px 0;color:var(--ink-3);text-align:center}
.gw{font-weight:600}.gw.S{color:var(--gS)}.gw.A{color:var(--gA)}.gw.B{color:var(--gB)}.gw.C{color:var(--gC)}.gw.U{color:var(--gU)}
.card .map-m{display:none}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;font:inherit;font-size:14px;font-weight:600;padding:12px 18px;border-radius:999px;background:var(--felt);color:#fff;border:0;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer}
.fab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.chip{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sep{font-size:12px;color:var(--ink-3);align-self:center;padding:0 4px}
.list{display:grid;border-top:1px solid var(--line)}
.card{display:grid;grid-template-columns:38px 1fr auto;gap:6px 14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.card .side{display:grid;gap:8px;justify-items:start}
.card .ph{display:block;width:150px;aspect-ratio:4/3;overflow:hidden;border-radius:4px;border:1px solid var(--line);background:var(--paper-2);padding:0;cursor:zoom-in}
.card .ph:focus-visible{outline:2px solid var(--felt);outline-offset:2px}
.lb{position:fixed;inset:0;background:rgba(20,19,18,.92);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px;z-index:10;cursor:zoom-out}
.lb img{max-width:100%;max-height:85vh;object-fit:contain;border-radius:4px}
.lb .cap{color:#EDE9E1;font-size:13px}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .credit{font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.card .contrib{margin:6px 0 0;font-size:13px;color:var(--felt);font-weight:500}
.card .contrib a,.contribs li a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor}
.contribs{margin-top:28px;padding:16px 18px;border:1px solid var(--line);border-radius:4px;background:var(--paper-2)}
.contribs h2{font-family:Fraunces,serif;font-weight:600;font-size:18px;margin:0 0 6px}
.contribs p{margin:0;color:var(--ink-2)}
.contribs ul{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.contribs li{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-weight:500}
.card .name{font-weight:600;font-size:16px;line-height:1.3;margin:0}
.card .th{color:var(--ink-3);font-size:13px;font-weight:400;margin-left:6px}
.card .meta{font-size:13px;color:var(--ink-3);margin:2px 0 0}
.card .verdict{margin:6px 0 0;color:var(--ink-2);max-width:62ch}
.card a{color:var(--ink);font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap;line-height:1;align-self:start}
.card a:hover{border-color:var(--felt);color:var(--felt)}
.card.hide{display:none}
footer a{color:var(--ink);font-weight:500;text-decoration:none;border-bottom:1px solid var(--line)}footer a:hover{color:var(--felt);border-color:var(--felt)}
footer .line{display:flex;gap:14px;align-items:center;margin-top:8px}
footer .line img{width:120px;height:120px;border:1px solid var(--line);border-radius:4px;background:#fff;flex:none}
footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3);display:grid;gap:6px;max-width:70ch}
@media (max-width:520px){
  .card{grid-template-columns:34px 1fr}
  .card .side{grid-column:2;width:100%;margin-top:2px}
  .card .ph{width:100%;height:220px;aspect-ratio:auto}
  .card .map-d{display:none}
  .card .map-m{display:inline-block;margin:6px 0 2px}
  .counts b{font-size:19px}
}
.vrow{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{font:inherit;font-size:13px;padding:6px 16px;min-height:32px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible{outline:2px solid var(--felt);outline-offset:-2px}
.chip.near[aria-pressed="true"]{background:var(--felt);border-color:var(--felt);color:#fff}
.locmsg{font-size:12px;color:var(--ink-3)}
#map{position:relative;z-index:0;height:62vh;min-height:340px;max-height:640px;margin-top:12px;border:1px solid var(--line);border-radius:4px;background:var(--paper-2)}
#map .leaflet-tile-pane{filter:sepia(.25) saturate(.7) brightness(1.02)}
#map.leaflet-container{font:inherit}
.leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.45}
.pp b{font-size:14px}.pp .pm{color:var(--ink-3);font-size:12px;margin:2px 0 6px}.pp p{margin:0 0 8px}
.pp img{display:block;width:100%;height:120px;object-fit:cover;border-radius:3px;margin:0 0 6px}
.pp .pa{display:flex;gap:6px;flex-wrap:wrap}
.pp .pa a,.pp .pa button{font:inherit;font-size:12px;line-height:1;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);text-decoration:none;cursor:pointer}
.card .dist{color:var(--felt);font-weight:600}
.card.flash{animation:flash 1.8s ease-out}
@keyframes flash{from{background:var(--gB-bg)}to{background:transparent}}
.counts .vis{display:inline-flex;align-items:baseline;padding:4px 0 4px 16px;border-left:2px solid var(--felt);color:var(--felt);font-weight:500}
.counts .vis b{color:var(--felt)}
.news{margin:10px 0 2px;padding:8px 12px;border:1px solid #e3dccf;border-radius:10px;background:#fbf8f2;font-size:.92rem}
.news summary{cursor:pointer;font-weight:600}
.news p{margin:6px 0 0;line-height:1.5}
.news .newsnote{color:#6b6257;font-size:.86rem}
.card .new{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;background:#c8102e;color:#fff;font-size:.68rem;font-weight:700;letter-spacing:.04em;vertical-align:middle}
.chip[data-v="new"]{border-color:#c8102e;color:#c8102e}
.chip[data-v="new"][aria-pressed="true"]{background:#c8102e;color:#fff}
.ctry{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:-8px 0 14px}.ctry a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line)}.ctry a:hover{color:var(--felt);border-color:var(--felt)}
.seas{font-weight:600;color:var(--brass)}
</style>

<script>

 ["A","서울로 7017","목련쉼터·장미무대 · 거리피아노","서울 · 중구","street","u",2023,37.55669,126.97139,["서울로 7017 고가 보행로의 목련쉼터와 장미무대 쪽에 피아노가 있습니다. 누구나 칠 수 있고, 비가 오면 덮개를 씌워 사용을 멈추며 겨울에는 덮어 둘 수 있습니다. 2023년 10월에는 장미쉼터 쪽 피아노가 페달 고장으로 쓸 수 없고 목련쉼터 쪽만 정상이라는 기록이 있었습니다. 2026년 11월 기준 서울문화재단 공식 지도에 실려 있으나, 같은 달 방문 글은 지금 이용할 수 있는지 현장에서 확인하라고 적고 있습니다.","Pianos stand on the Seoullo 7017 elevated walkway, at the Magnolia rest area and the Rose stage. Anyone can play; they are covered and out of use in rain, and may be kept covered in winter. An October 2023 note said the Rose-side piano was unusable because of a broken sustain pedal while the Magnolia-side one worked. As of November 2026 they are listed on the Seoul Foundation for Arts and Culture's official map, though a visitor post from the same month advises checking on site whether they can currently be used."],null,"","서울로 7017 서울 중구","seoul_n",""],
 ["A","신당역","공공 피아노 · 역 안 자리 미확인","서울 · 중구","station","",2026,37.56535,127.01622,["신당역에 공공 피아노가 있다고 하며, 역 안 정확한 자리는 확인되지 않았습니다. 2026년 5월 신문 인터뷰에서 외진 자리라 혼자 조용히 치기 좋은 곳으로 소개됐습니다. 운영 주체와 이용 시간은 확인되지 않았습니다.","Sindang Station is reported to have a public piano; its exact location in the station has not been confirmed. A May 2026 newspaper interview described it as a secluded spot, good for playing quietly on your own. Who runs it and what the hours are have not been confirmed."],null,"","신당역 서울 중구","seoul_n",""],
 ["A","신촌 홍익문고 앞","신촌역 3번 출구 약 40m · 길거리 피아노","서울 · 서대문구","street","u",2023,37.55578,126.93701,["2호선 신촌역 3번 출구에서 약 40m, 홍익문고 앞 연세로에 길거리 피아노가 있습니다. 3~12월 주말에 열어 누구나 칠 수 있고 비가 오면 닫는다고 알려져 있습니다. 2014년 5월쯤 설치됐으며, 비를 맞는 자리라 상태가 좋지 않다는 2026년 5월 신문 인터뷰가 있습니다. 2026년 11월 기준 서울문화재단 공식 지도에 실려 있습니다.","A street piano stands on Yonsei-ro in front of Hongik Bookstore, about 40 m from Exit 3 of Sinchon Station (Line 2). It is reported to open on weekends from March to December for anyone to play, and to be closed when it rains. Installed around May 2014, it sits exposed to rain and was described as in poor condition in a May 2026 newspaper interview. As of November 2026 it is listed on the Seoul Foundation for Arts and Culture's official map."],null,"","홍익문고 서울 서대문구","seoul_n",""],
 ["A","역촌 미트몽거스 앞","가게 앞 야외 · 거리피아노","서울 · 은평구","street","",2026,37.6028919,126.9110605,["은평구 역촌동 연서로3길 부근, 미트몽거스 가게 앞 야외에 거리피아노가 있습니다. 누구나 칠 수 있는 것으로 보이나 운영 시간은 확인되지 않았습니다. 2026년 11월 기준 서울문화재단 공식 지도에 이름과 위치만 실려 있으며, 도로명은 지도 좌표로 찾은 값입니다.","A street piano stands outdoors in front of the Meatmongers shop, near Yeonseo-ro 3-gil in Yeokchon-dong, Eunpyeong-gu. It appears to be open to anyone, but the hours are not confirmed. As of November 2026 the Seoul Foundation for Arts and Culture's official map lists it by name and location only; the street name here was derived from the map coordinates."],null,"","역촌 미트몽거스 앞 서울 은평구","seoul_n",""],
 ["A","인왕산 더숲 초소책방","2층 실내 한가운데 · 인왕산로 172","서울 · 종로구","cafe","g",2026,37.5859,126.96423,["인왕산로 172 더숲 초소책방 2층 실내 한가운데에 그랜드 피아노 한 대가 있습니다. 누구나 칠 수 있다고 하지만 북카페이니 음료를 주문하고 조용한 곡을 치는 편이 좋습니다. 2026년 11월에 본 온라인 목록이 근거이고 현장 확인은 아직입니다.","A grand piano sits in the middle of the 2nd floor at Chosochaekbang, the book cafe at 172 Inwangsan-ro. It is said to be open to anyone, but as it is a book cafe, order a drink and keep to quiet pieces. The evidence is an online list viewed in November 2026; it has not been checked on site."],null,"","더숲 초소책방 서울 종로구","seoul_n",""],
 ["A","홍대 피아노 카페","손님 무료 연주 · 그랜드 피아노","서울 · 마포구","other","g",2025,37.553949,126.924479,["서울 마포구 와우산로23길 18-5의 피아노 카페에는 그랜드 피아노와 기타가 있어, 음료를 주문한 손님은 무료로 연주할 수 있다고 관광 안내 글에 소개돼 있습니다. 2025년 1월 방문 후기에도 언급됩니다. 영업시간은 12:00~21:00 또는 11:00~21:00로 안내가 엇갈리고 일요일 휴무 여부도 안내마다 달라, 가기 전에 확인하는 편이 좋습니다.","Piano Cafe at 18-5 Wausan-ro 23-gil, Mapo-gu, Seoul, has a grand piano and a guitar, and a tourism guide says customers who order a drink can play for free. It is also mentioned in a January 2025 visitor review. Opening hours are listed as either 12:00-21:00 or 11:00-21:00, and sources differ on whether it closes on Sundays, so it is best to check before going."],null,"","18-5, 와우산로23길, 홍대거리, 동교동, 서교동, 마포구, 서울특별시, 04055, 대한민국 서울 마포구","seoul_n",""],
 ["A","롯데월드타워 서울스카이","전망대 · 그랜드 피아노","서울 · 송파구","other","g",2026,37.5127892,127.1024594,["【유료】 롯데월드타워(올림픽로 300) 서울스카이 전망대 안에 그랜드 피아노가 있어, 전망대 입장권을 사야 칠 수 있습니다. 121층에 있다고 알려져 있으며 입장객 누구나 자유롭게 연주할 수 있습니다. 2026년 11월 기준 서울문화재단 공식 지도에 '거리피아노(롯데월드타워)'로 실려 있는데, 이것이 전망대 피아노라는 점은 2024년 방문 후기와 연주 영상에 맞춰 본 추정입니다. 롯데월드몰 3층 아트 피아노와는 다른 자리입니다.","【PAID】 A grand piano is inside the Seoul Sky observatory at Lotte World Tower (300 Olympic-ro), so you need an observatory ticket to reach it. It is said to be on the 121st floor, and any visitor may play freely. As of November 2026 the Seoul Foundation for Arts and Culture's official map lists a 'street piano (Lotte World Tower)'; that this refers to the observatory piano is an assumption based on 2024 visitor posts and a performance video. It is a different spot from the art piano on the 3rd floor of Lotte World Mall."],null,"","롯데월드타워 서울스카이 서울 송파구","seoul_s",""],
 ["A","선유도공원","선유도이야기관 입구 · 잔디마당 옆","서울 · 영등포구","park","u",2024,37.54317,126.90097,["선유도공원 선유도이야기 전시관 입구, 잔디마당 옆 야외에 업라이트 피아노가 있습니다. 누구나 칠 수 있고 유의사항 안내판이 붙어 있습니다. 2026년 10월 방문 글에 나오며, 2026년 11월 기준 서울문화재단 공식 지도에도 실려 있습니다.","An upright piano stands outdoors at the entrance of the Seonyudo Story exhibition hall in Seonyudo Park, beside the lawn. Anyone can play, and a sign lists rules for use. It appears in an October 2026 visitor post, and as of November 2026 it is listed on the Seoul Foundation for Arts and Culture's official map."],["../img/kr-seonyudo-t.jpg","../img/kr-seonyudo.jpg","<a href=\"https://commons.wikimedia.org/wiki/File:Colourful_street_piano_2013.jpg\" target=\"_blank\" rel=\"noopener\">Lifetime Travelmates</a> · <a href=\"https://creativecommons.org/licenses/by-sa/2.0/\" target=\"_blank\" rel=\"noopener\">CC BY-SA 2.0</a> · Wikimedia Commons, 2013"],"","선유도공원 이야기관 서울 영등포구","seoul_s",""],
 ["A","신월음악도서관","신월4동 주민센터 복합건물 4층 음악자료실","서울 · 양천구","library","d",2024,37.52467,126.84008,["신월4동 주민센터 복합건물 4층 음악자료실에 디지털 피아노가 있어 직접 칠 수 있습니다. 도서관 운영 시간 안에 이용하며, 헤드폰을 쓰는 방식으로 보입니다. 2024년 2월 글 기준입니다.","A digital piano in the music room on the 4th floor of the Sinwol 4-dong community center complex (Sinwol Music Library) is available to play. Use it during library hours, apparently with headphones. Information as of February 2024."],null,"","신월음악도서관 서울 양천구","seoul_s",""],
 ["A","양재천 수변문화쉼터","양재천변 · 거리피아노","서울 · 서초구","park","",2026,37.4827,127.0491399,["양재천 수변문화쉼터에 거리피아노가 있습니다. 지도 좌표로는 영동2교에서 개포4동 쪽 양재천변이며, 서초구와 강남구의 경계 부근입니다. 누구나 칠 수 있는 것으로 보이나 운영 시간은 확인되지 않았습니다. 2026년 11월 기준 서울문화재단 공식 지도에 이름과 위치만 실려 있습니다.","A street piano is at the Yangjaecheon Waterside Culture Shelter. By the map coordinates it sits on the stream bank between Yeongdong 2-gyo bridge and Gaepo 4-dong, near the Seocho-gu / Gangnam-gu boundary. It appears to be open to anyone, but the hours are not confirmed. As of November 2026 the Seoul Foundation for Arts and Culture's official map lists it by name and location only."],null,"","양재천 수변문화쉼터 서울 서초구","seoul_s",""],
 ["A","원앤온리 카페","둔촌동 카페 · 거리피아노","서울 · 강동구","other","",2026,37.5346041,127.1485596,["강동구 둔촌동 천호대로200길 54 원앤온리 카페에 놓인 피아노입니다. 카페라서 손님만 칠 수 있을 수 있으며, 주문이 필요한지와 운영 시간은 확인되지 않았습니다. 2026년 11월 기준 서울문화재단 공식 지도에 이름과 위치만 실려 있습니다.","A piano kept at the One and Only cafe, 54 Cheonho-daero 200-gil, Dunchon-dong, Gangdong-gu. Because it is a cafe, playing may be limited to customers; whether an order is required and what the hours are have not been confirmed. As of November 2026 the Seoul Foundation for Arts and Culture's official map lists it by name and location only."],null,"","원앤온리 카페 서울 강동구","seoul_s",""],
 ["A","KT&G 상상마당 춘천아트센터","1층 로비 · 그랜드 피아노","강원 · 춘천시","culture","g",2026,37.85578,127.68863,["춘천시 스포츠타운길399번길 25, KT&G 상상마당 춘천아트센터 1층 로비에 그랜드 피아노가 있습니다. 2026년 2월 기사에 로비 피아노는 누구에게나 열려 있다고 소개됐습니다. 다만 2025년 11월 방문 글에 주말에는 치지 말라는 안내가 있었다고 적혀 있어 평일에 가는 편이 좋아 보이며, 운영 시간은 확인되지 않았습니다.","A grand piano stands in the 1st-floor lobby of KT&G Sangsang Madang Chuncheon Art Center (25 Sportstown-gil 399beon-gil, Chuncheon). A February 2026 article says the lobby piano is open to everyone. However, a November 2025 visitor's post mentions a notice asking people not to play on weekends, so weekdays seem the safer choice; the hours are not confirmed."],null,"","송암스포츠타운, 스포츠타운길, 송암동, 강남동, 춘천시, 강원특별자치도, 24239, 대한민국 강원 춘천시","gg",""],
 ["A","경기광주휴게소(광주 방향)","열린 피아노존","경기 · 광주시","other","",2025,37.378758,127.436372,["광주원주고속도로(제2영동) 경기광주휴게소 광주 방향에 '열린 피아노존'이 마련됐습니다. 휴게소 이용객 누구나 자유롭게 칠 수 있다고 안내됐습니다. 2025년 7월 운영사 보도자료가 근거이며, 지금도 있는지는 확인되지 않았습니다.","An 'open piano zone' was set up at the Gyeonggi Gwangju Service Area, Gwangju-bound side, on the Gwangju–Wonju (Second Yeongdong) Expressway. It was announced as free for any service-area visitor to play. This rests on the operator's July 2025 press release; whether the piano is still there has not been confirmed."],null,"","경기광주휴게소(원주방향), 광주원주고속도로, 곤지암읍, 광주시, 경기도, 12727, 대한민국 경기 광주시","gg",""],

 ["A","오산 소리울도서관","악기도서관 · 지하 1층 악기 체험·대여","경기 · 오산시","library","",null,37.13264,127.07496,["전국 첫 악기도서관인 오산 소리울도서관에서는 찾아온 시민이 직접 피아노를 칠 수 있다고 합니다. 지하 1층에서는 악기 체험과 대여도 합니다. 근거 기사의 날짜가 확인되지 않아 피아노 자리와 이용 방법은 가기 전에 확인이 필요합니다.","At Osan Soriul Library, Korea's first musical instrument library, visitors can reportedly play the piano themselves. The basement floor offers instrument try-outs and rentals. The source article is undated, so check the piano's location and how to use it before you go."],null,"","소리울도서관 경기 오산시","gg",""],

  q("#ch").textContent=t.ch; q("#cp").textContent=t.cp; q("#cl").innerHTML=[...new Set(P.map(p=>p[11]).filter(Boolean))].map(n=>`<li>${linkify(n)}</li>`).join(""); q("#plotnote").textContent=t.plotnote;
  { const nu=NEWS.ui[state.lang]||NEWS.ui.en; const show=P.some(isNew); q("#news").hidden=!show; q("#newsh").textContent=nu.h; q("#newsb").textContent=nu.b; q("#newsn").textContent=nu.n; q("#newss").textContent=nu.s||""; }
  q("#f1").textContent=t.f1; q("#f2").textContent=t.f2; q("#f3").innerHTML=t.f3; q("#f4").textContent=t.f4;
  q("#legend").innerHTML=["S","A","B","C","U"].map(g=>`<li><span class="tag ${g}">${GL[g]}</span><span>${t.legend[g]}</span></li>`).join("");
  const c={S:0,A:0,B:0,C:0,U:0}; P.forEach(p=>c[p[0]]++);
  q("#counts").innerHTML=["S","A","B","C","U"].map(g=>`<button type="button" data-g="${g}"><b>${c[g]}</b>${g==="U"?t.U:t.grade(g)}</button>`).join("");
  q("#q").placeholder=t.search; q("#empty").textContent=t.none; q("#fab").textContent=t.report;
  const v=U2(); q("#seg").children[0].textContent=v.list; q("#seg").children[1].textContent=v.mapv; q("#near").textContent=v.near;
  if(state.visits) q("#counts").insertAdjacentHTML("beforeend",`<span class="vis"><b>${state.visits}</b>${v.visits}</span>`);
  document.querySelectorAll("#lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.l===state.lang));
}

function renderFilters(){
  const t=u(), f=q("#filters");
  const mk=(k,v,label)=>`<button class="chip" type="button" data-k="${k}" data-v="${v}" aria-pressed="${state[k]===v}">${label}</button>`;
  f.innerHTML = mk("grade","all",t.all)+mk("grade","S","S")+mk("grade","A","A")+mk("grade","B","B")+mk("grade","C","C")+mk("grade","U",t.U)+(P.some(p=>p[14])?mk("grade","yr",t.yr):"")
    +`<button class="chip zreset" type="button" data-k="zone" data-v="all" ${state.zone==="all"?"hidden":""}>← ${t.allR}</button>`;
}

function renderList(){
  const t=u(), i=li();
  q("#list").innerHTML = (state.me?[...P].sort((a,b)=>dist(a)-dist(b)):P).map(p=>`
  <article class="card" id="c${P.indexOf(p)}" data-g="${p[0]}" data-new="0" data-seas="${p[14]?1:0}" data-z="${zoneOf(p)}" data-s="${[p[1],p[2],p[3],ZONES.find(z=>z[0]===zoneOf(p))[1].join(" "),T[p[4]].join(" "),p[9].join(" ")].join(" ").toLowerCase().replace(/"/g,"")}">
    <span class="tag ${p[0]}">${GL[p[0]]}</span>
    <div>
      <h2 class="name">${p[1]}${isNew(p)?'<span class="new">NEW</span>':""}${p[2]?`<span class="th">${p[2]}</span>`:""}</h2>
      <p class="meta">${state.me?`<span class="dist">${km(p)}</span> · `:""}<span class="gw ${p[0]}">${t.gword[p[0]]}</span> · ${p[3]} · ${T[p[4]][i]}${p[5]?" · "+K[p[5]][i]:""} · ${p[6]?t.seen+p[6]:t.noyear}${p[14]?` · <b class="seas">${t.season}${p[14]}</b>`:""}</p>
      <a class="map-m" href="${gmaps(p)}" target="_blank" rel="noopener">${t.map}</a>
      <p class="verdict">${p[9][i]}</p>
      ${p[11]?`<p class="contrib">${t.contrib} ${linkify(p[11])}</p>`:""}
    </div>
    <div class="side">${p[10]?`<button class="ph" type="button" data-full="${p[10][1]}" data-cap="${p[1]}"><img src="${p[10][0]}" alt="${p[1]}" loading="lazy"></button><span class="credit">${t.photo} ${p[10][2]}</span>`:""}<a class="map-d" href="${gmaps(p)}" target="_blank" rel="noopener">${t.map}</a></div>
  </article>`).join("");
}

function applyFilter(){
  const needle=state.q.trim().toLowerCase();
  const ok=el=>(state.grade==="all"||(state.grade==="yr"?el.dataset.seas==="0":el.dataset.g===state.grade))&&(state.zone==="all"||el.dataset.z===state.zone)&&(!needle||el.dataset.s.includes(needle));
  let shown=0; document.querySelectorAll(".card").forEach(el=>{ const v=ok(el); el.classList.toggle("hide",!v); if(v) shown++; });
  q("#empty").hidden = shown>0; q("#rcount").textContent=u().results(shown);
  const zr=q(".zreset"); if(zr){ zr.hidden = state.zone==="all"; }
  renderMarkers();
  document.querySelectorAll(".zone").forEach(el=>{
    el.setAttribute("aria-pressed", state.zone===el.dataset.z);
    el.querySelectorAll(".zk .w[data-g]").forEach(d=>d.style.opacity=(state.grade==="all"||state.grade==="yr"||d.dataset.g===state.grade)?1:.25);
  });
}

function renderZones(){
  const i=li(), order={S:0,A:1,B:2,C:3,U:4};
  const KW=10, H=40;
  const blackAfter=[0,1,3,4,5];               // 옥타브 안에서 검은건반이 붙는 흰건반 자리 (C D F G A)
  q("#zones").innerHTML = ZONES.map(z=>{
    const pts=P.filter(p=>zoneOf(p)===z[0]).sort((a,b)=>order[a[0]]-order[b[0]]);
    const WHITES=Math.max(14, Math.ceil(pts.length/7)*7);   // 기본 2옥타브, 장소가 넘치면 옥타브 단위로 늘림
    let k="";
    for(let w=0; w<WHITES; w++){
      const p=pts[w];
      k+=`<rect class="w ${p?p[0]:""}" ${p?`data-g="${p[0]}"`:""} x="${w*KW}" y="0" width="${KW}" height="${H}" rx="1.2">${p?`<title>${p[1]}</title>`:""}</rect>`;
    }
    for(let w=0; w<WHITES-1; w++){ if(blackAfter.includes(w%7)) k+=`<rect class="b" x="${(w+1)*KW-3}" y="0" width="6" height="${H*0.6}" rx="1"/>`; }
    return `<button class="zone" type="button" data-z="${z[0]}" aria-pressed="${state.zone===z[0]}">
      <span class="zn">${z[1][i]}</span>
      <span class="zc">${pts.length}</span>
      <svg class="zk" viewBox="0 0 ${WHITES*KW} ${H}" aria-hidden="true">${k}</svg>
    </button>`; }).join("");
}

// ── 지도 탭·내 주변 (GitHub 사이트에서만. claude.ai 미리보기는 바깥 지도·위치를 막는다)
const LIVE = /github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname);
const UI2 = {
 ko:{"list":"목록","mapv":"지도","near":"📍 내 주변","locating":"위치 확인 중…","locErr":"위치를 가져오지 못했습니다. 브라우저에서 위치 권한을 허용해 주세요.","more":"목록에서 보기","visits":"누적 방문"},
 en:{"list":"List","mapv":"Map","near":"📍 Near me","locating":"Finding you…","locErr":"Could not get your location. Please allow location access in your browser.","more":"Show in list","visits":"visits"}
};
const U2 = () => UI2[state.lang];
const dist = p => { if(!state.me) return 0; const r=x=>x*Math.PI/180, dLa=r(p[7]-state.me.lat), dLo=r(p[8]-state.me.lng);
  const a=Math.sin(dLa/2)**2+Math.cos(r(state.me.lat))*Math.cos(r(p[7]))*Math.sin(dLo/2)**2; return 12742*Math.asin(Math.sqrt(a)); };
const km = p => { const d=dist(p); return d<1 ? Math.round(d*100)*10+" m" : (d<10 ? d.toFixed(1) : Math.round(d))+" km"; };
const visible = () => [...document.querySelectorAll(".card:not(.hide)")].map(el=>P[+el.id.slice(1)]);
const GCOL = {S:"#B23A2E",A:"#2E6B3E",B:"#9A742A",C:"#5A6470",U:"#8C877F"};
let map=null, layer=null;
const loadLeaflet = () => window.L ? Promise.resolve() : new Promise((ok,ng)=>{
  const c=document.createElement("link"); c.rel="stylesheet"; c.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(c);
  const j=document.createElement("script"); j.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"; j.onload=ok; j.onerror=ng; document.head.appendChild(j); });
function popupHtml(p){
  const t=u(), i=li(), v=p[9][i];
  return `<div class="pp"><b>${p[1]}</b><div class="pm"><span class="gw ${p[0]}">${t.gword[p[0]]}</span> · ${T[p[4]][i]}${state.me?" · "+km(p):""}</div>`
    +`${p[10]?`<img src="${p[10][0]}" alt="">`:""}<p>${v.length>140?v.slice(0,140)+"…":v}</p>`
    +`<div class="pa"><a href="${gmaps(p)}" target="_blank" rel="noopener">${t.map}</a><button type="button" data-goto="${P.indexOf(p)}">${U2().more}</button></div></div>`;
}
function renderMarkers(){
  if(!map) return; layer.clearLayers();
  const rank={U:0,C:1,B:2,A:3,S:4};                     // 나중에 그린 핀이 위로 — S가 맨 위
  visible().sort((a,b)=>rank[a[0]]-rank[b[0]]).forEach(p=>L.circleMarker([p[7],p[8]],{
    radius:p[0]==="S"?10:p[0]==="U"?6:8, color:"#fff", weight:2, fillColor:GCOL[p[0]], fillOpacity:p[0]==="U"?.6:.95
  }).bindPopup(()=>popupHtml(p),{maxWidth:260}).addTo(layer));
  if(state.me) L.circleMarker([state.me.lat,state.me.lng],{radius:7,color:"#fff",weight:3,fillColor:"#2B6CB0",fillOpacity:1}).addTo(layer);
}
function fitView(){
  if(!map) return; const vis=visible();
  if(state.me){ const near=[...vis].sort((a,b)=>dist(a)-dist(b)).slice(0,5);
    map.fitBounds(L.latLngBounds([[state.me.lat,state.me.lng],...near.map(p=>[p[7],p[8]])]),{padding:[30,30],maxZoom:15}); return; }
  let pts=vis; 
  if(pts.length) map.fitBounds(L.latLngBounds(pts.map(p=>[p[7],p[8]])),{padding:[30,30],maxZoom:15});
}
async function setView(v){
  state.view=v; q("#list").hidden=v==="map"; q("#map").hidden=v!=="map";
  [...q("#seg").children].forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===v));
  if(v!=="map") return;
  try{ await loadLeaflet(); }catch(e){ setView("list"); return; }
  if(!map){ map=L.map("map",{scrollWheelZoom:false});
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,                // 키 없는 OSM 기본 타일 (CARTO는 키 필요해짐)
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
    layer=L.layerGroup().addTo(map); }
  map.invalidateSize(); renderMarkers(); fitView();
}
function locate(){
  const m=q("#locmsg");
  if(state.me){ state.me=null; m.textContent=""; q("#near").setAttribute("aria-pressed",false); renderList(); applyFilter(); fitView(); return; }
  if(!navigator.geolocation){ m.textContent=U2().locErr; return; }
  m.textContent=U2().locating;
  navigator.geolocation.getCurrentPosition(pos=>{
    state.me={lat:pos.coords.latitude,lng:pos.coords.longitude}; m.textContent=""; q("#near").setAttribute("aria-pressed",true);
    renderList(); applyFilter(); fitView(); q("#bar").scrollIntoView({behavior:"smooth",block:"start"});
  }, ()=>{ m.textContent=U2().locErr; }, {timeout:10000, maximumAge:300000});
}
if(LIVE){
  q("#vrow").hidden=false;
  q("#seg").onclick=e=>{ const b=e.target.closest("button"); if(b) setView(b.dataset.v); };
  q("#near").onclick=locate;
  q("#map").addEventListener("click",e=>{ const b=e.target.closest("[data-goto]"); if(!b) return;
    setView("list"); const c=q("#c"+b.dataset.goto); c.scrollIntoView({behavior:"smooth",block:"center"}); c.classList.remove("flash"); void c.offsetWidth; c.classList.add("flash"); });
}

// ── 누적 방문 (GoatCounter). 코드를 넣으면 켜지고, GC_MIN 이상일 때만 보인다
const GC_CODE = "", GC_MIN = 300;
const GC_BASE = 1340;   // GoatCounter 시작 전 Cloudflare 누적 방문 — 시작일 기준 숫자로 맞출 것
if(GC_CODE && location.hostname.endsWith("github.io")){
  const g=document.createElement("script"); g.async=true; g.src="https://gc.zgo.at/count.js"; g.dataset.goatcounter=`https://${GC_CODE}.goatcounter.com/count`; document.body.appendChild(g);
  fetch(`https://${GC_CODE}.goatcounter.com/counter/TOTAL.json`).then(r=>r.ok?r.json():null).then(j=>{
    const n=j ? GC_BASE + +String(j.count).replace(/\D/g,"") : 0;
    if(n<GC_MIN) return; const t0=performance.now();
    const step=now=>{ const k=Math.min(1,(now-t0)/900); state.visits=Math.round(n*(1-(1-k)**3)).toLocaleString("en-US"); renderText(); if(k<1) requestAnimationFrame(step); };
    requestAnimationFrame(step); }).catch(()=>{});
}

function renderAll(){ renderText(); renderFilters(); renderZones(); renderList(); applyFilter(); }
q("#lang").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; state.lang=b.dataset.l; renderAll(); };
q("#filters").onclick=e=>{ const b=e.target.closest(".chip"); if(!b) return; state[b.dataset.k]=b.dataset.v; if(b.dataset.k==="grade"&&b.dataset.v==="all") state.zone="all"; renderFilters(); applyFilter(); };
q("#q").oninput=e=>{ state.q=e.target.value; applyFilter(); };
q("#counts").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; state.grade=b.dataset.g; renderFilters(); applyFilter(); q("#bar").scrollIntoView({behavior:"smooth",block:"start"}); };
const toContact=()=>q("#contribs").scrollIntoView({behavior:"smooth",block:"start"});
q("#fab").onclick=toContact; q("#call").onclick=toContact;
q("#zones").onclick=e=>{ const b=e.target.closest(".zone"); if(!b) return; state.zone = state.zone===b.dataset.z ? "all" : b.dataset.z; applyFilter(); fitView(); };
q("#list").onclick=e=>{ const b=e.target.closest(".ph"); if(!b) return; q("#lbimg").src=b.dataset.full; q("#lbimg").alt=b.dataset.cap; q("#lbcap").textContent=b.dataset.cap; q("#lb").hidden=false; };
q("#lb").onclick=()=>{ q("#lb").hidden=true; q("#lbimg").src=""; };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ q("#lb").hidden=true; } });
renderAll();
</script>
